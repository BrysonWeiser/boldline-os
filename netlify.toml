[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # These keys hold NON-SECRET values that legitimately appear in committed files, so
  # the secret scanner must skip them (their presence in code is intentional, not a leak):
  #   • DOCUSIGN_BASE_PATH   — public DocuSign API hostname, a code default in docusign-send.mjs
  #   • OWNER_EMAIL          — Bryson's email, printed on the service agreement (makeContractHTML)
  #   • REPORTS_FROM_EMAIL   — the from-address shown in owner-facing report/email content
  # Every genuinely-secret key (Stripe, Twilio auth, Supabase service role, Google Ads,
  # Resend, etc.) stays fully scanned — none of their values are ever committed.
  SECRETS_SCAN_OMIT_KEYS = "DOCUSIGN_BASE_PATH,OWNER_EMAIL,REPORTS_FROM_EMAIL"

# WEEKLY (Mon 15:00 UTC): a weekly internal briefing to Bryson on EVERY active
# client (even monthly-tier ones, so he stays current) + the client-facing
# weekly report for weekly-tier clients.
[functions."weekly-report"]
  schedule = "0 15 * * 1"

# Fires daily but is gated per-client to a 30-day gap anchored to each contract
# date (at-least-once monthly delivery). Sends monthly-tier clients their
# client-facing report + an exact copy to Bryson. Most daily runs are no-ops.
[functions."monthly-report"]
  schedule = "0 15 * * *"

# ARIA's OS health + improvement-suggestions report — MONTHLY (1st, 16:00 UTC).
# This is Bryson's monthly email: ONLY ARIA, about the OS itself.
[functions."os-report"]
  schedule = "0 16 1 * *"

[functions."lead-followup"]
  schedule = "0 13 * * *"

# Daily billing enforcement: syncs overdue invoices from Stripe, accrues the
# Agreement's 1.5%/mo late interest after day 10 (as a pending invoice item on
# the client's next bill), and emails the owner on late/interest/recovered
# transitions. Management-fee side only — never ad spend.
# Runs daily at 14:30 UTC (07:30 America/Phoenix). The temporary every-20-min
# test schedule was reverted 2026-07-18 after the late-payment test verified.
[functions."billing-watch"]
  schedule = "30 14 * * *"

# Daily major-issue watch: SMS + email the moment a client's health crashes,
# a live campaign produces zero leads, or CPL blows past target. De-duped per
# client (no daily spam); matching in-app alerts are derived in getAlerts().
[functions."alerts-watch"]
  schedule = "0 17 * * *"

# Daily client-nurture: the onboarding + retention email touches that aren't
# Stripe-triggered — Ad-Account Access ~1 day after Welcome, an onboarding nudge
# on day 2 + 5 while intake is incomplete, and a celebratory Lead-Milestone email
# at 10/25/50/100+ leads. Idempotent per client; most runs are cheap no-ops.
[functions."client-nurture"]
  schedule = "0 16 * * *"

# Every 15 min: publishes scheduled drafts at their exact time + keeps >=1
# scheduled post in the review pipeline. Nearly every run is a cheap no-op.
[functions."blog-autopublish"]
  schedule = "*/15 * * * *"

# Hourly: keeps one companion newsletter email drafted per blog post (awaiting
# review) and sends any that are due. Sending stays dormant until
# NEWSLETTER_SENDING_ENABLED=1 (after the domain is verified in Resend).
[functions."newsletter-autopublish"]
  schedule = "0 * * * *"

# PWA: the service worker must never be cached by the browser/CDN, or code updates
# won't roll to installed apps. Force revalidation on every load. (The SW itself is
# network-first, so the app shell also always refreshes online — see service-worker.js.)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA: serve the manifest with the correct MIME type so install prompts fire reliably.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/portal"
  to = "/.netlify/functions/portal"
  status = 200

[[redirects]]
  from = "/lead"
  to = "/.netlify/functions/lead-intake"
  status = 200

[[redirects]]
  from = "/lp/:slug"
  to = "/.netlify/functions/landing?slug=:slug"
  status = 200

# Internal knowledge base lives in the repo (for cross-session persistence) but must
# never be served publicly by the OS site. Force a 404 on it before the SPA catch-all.
[[redirects]]
  from = "/knowledge/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
