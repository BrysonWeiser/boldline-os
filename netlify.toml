[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # These keys hold NON-SECRET values that legitimately appear in committed files, so
  # the secret scanner must skip them (their presence in code is intentional, not a leak):
  #   • DOCUSIGN_BASE_PATH   — public DocuSign API hostname, a code default in docusign-send.mjs
  #   • OWNER_EMAIL          — Bryson's email, printed on the service agreement (makeContractHTML)
  #   • REPORTS_FROM_EMAIL   — the from-address shown in owner-facing report/email content
  #   • META_APP_ID          — a PUBLIC identifier, not a credential. Meta embeds the app
  #     id in every client-side SDK snippet and in the app dashboard URL; it identifies
  #     the app, it does not authenticate anything (that is META_SYSTEM_USER_TOKEN, which
  #     stays fully scanned). It appears in committed KB/deploy notes because the Meta
  #     account map is impossible to document without naming which id is which, and every
  #     Meta debugging session so far has turned on exactly that distinction. Added
  #     2026-08-14 after it failed 7 consecutive production builds.
  # Every genuinely-secret key (Stripe, Twilio auth, Supabase service role, Google Ads,
  # Resend, Meta system-user token, etc.) stays fully scanned — none of their values are
  # ever committed.
  SECRETS_SCAN_OMIT_KEYS = "DOCUSIGN_BASE_PATH,OWNER_EMAIL,REPORTS_FROM_EMAIL,META_APP_ID"

# WEEKLY (Mon 15:00 UTC): a weekly internal briefing to Bryson on EVERY active
# client (even monthly-tier ones, so he stays current) + the client-facing
# weekly report for weekly-tier clients.
[functions."weekly-report"]
  schedule = "0 15 * * 1"

# Fires daily but is gated per-client to a 30-day gap anchored to each contract
# date (at-least-once monthly delivery). Sends monthly-tier clients their
# client-facing report + an exact copy to Bryson. Most daily runs are no-ops.
[functions."monthly-report"]
  schedule = "0 15 * * *"

# ARIA's OS health + improvement-suggestions report — MONTHLY (1st, 16:00 UTC).
# This is Bryson's monthly email: ONLY ARIA, about the OS itself.
[functions."os-report"]
  schedule = "0 16 1 * *"

[functions."lead-followup"]
  schedule = "0 13 * * *"

# Daily billing enforcement: syncs overdue invoices from Stripe, accrues the
# Agreement's 1.5%/mo late interest after day 10 (as a pending invoice item on
# the client's next bill), and emails the owner on late/interest/recovered
# transitions. Management-fee side only — never ad spend.
# Runs daily at 14:30 UTC (07:30 America/Phoenix). The temporary every-20-min
# test schedule was reverted 2026-07-18 after the late-payment test verified.
[functions."billing-watch"]
  schedule = "30 14 * * *"

# Daily major-issue watch: SMS + email the moment a client's health crashes,
# a live campaign produces zero leads, or CPL blows past target. De-duped per
# client (no daily spam); matching in-app alerts are derived in getAlerts().
[functions."alerts-watch"]
  schedule = "0 17 * * *"

# A booked call is a LEAD, not just a calendar entry. Every 15 minutes, because the
# whole point is that Bryson sees a prospect while they are still thinking about him.
# Deduped on the Calendly event id, so re-scanning the same window is harmless.
# (This comment belongs to calendly-leads. It used to sit above the ads-sync comment,
# which made both look like they described the wrong job.)
[functions."calendly-leads"]
  schedule = "*/15 * * * *"

# Closes the loop on e-signatures. Every 15 minutes it asks DocuSign where each outstanding
# envelope got to, flips a client to active the moment they sign, and alerts Bryson. Polling
# rather than DocuSign Connect: Connect is not on the eSignature Standard plan, and polling
# reuses the JWT auth already proven in production with nothing to configure at DocuSign's
# end. A quarter-hour delay on "your client signed" costs nothing; a webhook that silently
# stops firing costs a contract sitting in limbo.
[functions."docusign-watch"]
  schedule = "*/15 * * * *"

# HOURLY: pulls LIVE campaign spend from Google Ads + Meta for every client with a
# linked ad account (the My Ads house account included), stores it on the client
# record, and alerts the owner the first time an account paces over its monthly budget
# or a linked account stops reading at all. Read-only — it never changes a campaign.
#
# Was every 6 hours until 2026-08-24, when Bryson asked for "every hour or two instead
# of 6". Hourly is comfortably inside both platforms' rate limits at this volume: two
# reads per linked account per run, so 48 calls a day for one account, against limits
# measured in thousands. It also HELPS the Meta Marketing API tier request, which was
# rejected for "not a sufficient number of Ads API calls in the last 15 days" — see KB
# meta-marketing-api. Four times the traffic is four times the evidence.
#
# 🔴 THE PLATFORMS DO NOT UPDATE MINUTE BY MINUTE THEMSELVES. Meta's insights lag real
# delivery by up to a few hours and Google's can too, so polling faster than this buys
# nothing but API calls. Hourly is the point where the OS stops being the slow part.
[functions."ads-sync"]
  schedule = "0 * * * *"

# Every 15 minutes: mirrors BoldLine's OWN inbound leads (the website form, the quiz
# and Calendly bookings, all of which land in website_leads) onto the My Ads house
# account, so its lead count, cost-per-lead, health score, pipeline and ROI funnel are
# built from real leads instead of a zero that could never move. Read-only against
# website_leads; deduped on the lead's row id, so re-scanning is harmless.
[functions."house-leads"]
  schedule = "*/15 * * * *"

# Every 2 hours: the ONLY job allowed to change a live ad account, and only ever
# in the direction of spending LESS — pauses a campaign that is pacing over budget
# or burning money with zero conversions, and (opt-in per client) shifts budget
# between campaigns without raising the account total. Never creates a campaign,
# never enables one, never raises a budget. Runs on Netlify's servers, so it works
# with nothing open anywhere. Global kill switch: set ADS_AUTOPILOT=off in Netlify.
# Two-hourly rather than daily because an overspend caught 20 hours late has
# already cost the money. See KB ads-autopilot.
[functions."ads-autopilot"]
  schedule = "15 */2 * * *"

# Daily client-nurture: the onboarding + retention email touches that aren't
# Stripe-triggered — Ad-Account Access ~1 day after Welcome, an onboarding nudge
# on day 2 + 5 while intake is incomplete, and a celebratory Lead-Milestone email
# at 10/25/50/100+ leads. Idempotent per client; most runs are cheap no-ops.
[functions."client-nurture"]
  schedule = "0 16 * * *"

# Every 15 min: publishes scheduled drafts at their exact time + keeps >=1
# scheduled post in the review pipeline. Nearly every run is a cheap no-op.
[functions."blog-autopublish"]
  schedule = "*/15 * * * *"

# Hourly: keeps one companion newsletter email drafted per blog post (awaiting
# review) and sends any that are due. Sending stays dormant until
# NEWSLETTER_SENDING_ENABLED=1 (after the domain is verified in Resend).
[functions."newsletter-autopublish"]
  schedule = "0 * * * *"

# Daily 14:00 UTC = 7:00 AM America/Phoenix (AZ has no DST): the morning agenda
# digest — emails + pushes everything on today's calendar (meetings, invoices,
# contract dates, content). Only sends when there's >=1 item that day.
[functions."calendar-digest"]
  schedule = "0 14 * * *"

# PWA: the service worker must never be cached by the browser/CDN, or code updates
# won't roll to installed apps. Force revalidation on every load. (The SW itself is
# network-first, so the app shell also always refreshes online — see service-worker.js.)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA: serve the manifest with the correct MIME type so install prompts fire reliably.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/portal"
  to = "/.netlify/functions/portal"
  status = 200

[[redirects]]
  from = "/lead"
  to = "/.netlify/functions/lead-intake"
  status = 200

[[redirects]]
  from = "/lp/:slug"
  to = "/.netlify/functions/landing?slug=:slug"
  status = 200

# Internal knowledge base lives in the repo (for cross-session persistence) but must
# never be served publicly by the OS site. Force a 404 on it before the SPA catch-all.
[[redirects]]
  from = "/knowledge/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
