const AD_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';

// Shrink until the longest line fits the available width — a hand-typed headline
// must never render clipped.
function adFitSize(ctx,lines,maxW,start,weight){
  let size=start;
  while(size>18){
    ctx.font=`${weight} ${size}px ${AD_FONT}`;
    if(lines.every(l=>ctx.measureText(l).width<=maxW)) break;
    size-=2;
  }
  return size;
}
function adWrap(ctx,text,maxW){
  const words=String(text||"").split(/\s+/).filter(Boolean), out=[];
  let line="";
  words.forEach(word=>{
    const next=line?line+" "+word:word;
    if(ctx.measureText(next).width>maxW&&line){ out.push(line); line=word; }
    else line=next;
  });
  if(line) out.push(line);
  return out;
}

// The renderer. `photo` (optional HTMLImageElement) is drawn cover-fit under a
// scrim — that's the path a CLIENT's creative takes, using their own photography.
function drawAdCreative(cv,o){
  const w=o.w,h=o.h,ctx=cv.getContext("2d");
  cv.width=w; cv.height=h;
  const wide=w>h, story=h/w>1.6;
  const k=wide?0.8:(story?1.12:(h>w?1.04:1));
  const padX=Math.round(wide?76:96);
  const padY=Math.round(story?300:(wide?58:96));
  const innerW=w-padX*2;
  const GOLD_C=C.gold, DIM_C="#9AA0BE";

  ctx.fillStyle="#070810"; ctx.fillRect(0,0,w,h);

  if(o.photo){
    const ir=o.photo.width/o.photo.height, cr=w/h;
    let dw,dh;
    if(ir>cr){ dh=h; dw=h*ir; } else { dw=w; dh=w/ir; }
    ctx.drawImage(o.photo,(w-dw)/2,(h-dh)/2,dw,dh);
    const scrim=ctx.createLinearGradient(0,0,w*0.95,h);
    scrim.addColorStop(0,"rgba(7,8,16,0.95)");
    scrim.addColorStop(0.55,"rgba(7,8,16,0.82)");
    scrim.addColorStop(1,"rgba(7,8,16,0.55)");
    ctx.fillStyle=scrim; ctx.fillRect(0,0,w,h);
  } else {
    const bloom=ctx.createRadialGradient(w*0.95,h*0.02,0,w*0.95,h*0.02,w*0.95);
    bloom.addColorStop(0,"rgba(200,168,75,0.20)");
    bloom.addColorStop(0.45,"rgba(200,168,75,0.06)");
    bloom.addColorStop(1,"rgba(200,168,75,0)");
    ctx.fillStyle=bloom; ctx.fillRect(0,0,w,h);
    const bloom2=ctx.createRadialGradient(w*0.04,h*0.99,0,w*0.04,h*0.99,w*0.75);
    bloom2.addColorStop(0,"rgba(139,92,246,0.13)");
    bloom2.addColorStop(1,"rgba(139,92,246,0)");
    ctx.fillStyle=bloom2; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="rgba(255,255,255,0.028)"; ctx.lineWidth=1;
    const step=Math.round(72*k);
    for(let x=step;x<w;x+=step){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); ctx.stroke(); }
    for(let y=step;y<h;y+=step){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); ctx.stroke(); }
  }

  const rule=ctx.createLinearGradient(0,0,w,0);
  rule.addColorStop(0,GOLD_C); rule.addColorStop(0.55,"#8B6914"); rule.addColorStop(1,"rgba(200,168,75,0)");
  ctx.fillStyle=rule; ctx.fillRect(0,0,w,Math.round(9*k));

  // ── top lockup ──
  const logoS=Math.round(78*k);
  let tx=padX;
  if(o.logo){ ctx.drawImage(o.logo,padX,padY,logoS,logoS); tx=padX+logoS+Math.round(20*k); }
  ctx.textBaseline="alphabetic";
  const brandS=Math.round(31*k);
  ctx.font=`900 ${brandS}px ${AD_FONT}`;
  const brandY=padY+Math.round(logoS*0.46);
  ctx.fillStyle="#F4F5FB"; ctx.fillText("BoldLine ",tx,brandY);
  const bw=ctx.measureText("BoldLine ").width;
  ctx.fillStyle=GOLD_C; ctx.fillText("Media",tx+bw,brandY);
  const kickS=Math.round(19*k);
  ctx.font=`800 ${kickS}px ${AD_FONT}`;
  ctx.fillStyle=GOLD_C;
  const kick=String(o.kicker||"").toUpperCase();
  // letter-spacing has no canvas equivalent in older engines — draw per glyph.
  let kx=tx;
  for(const ch of kick){ ctx.fillText(ch,kx,brandY+Math.round(30*k)); kx+=ctx.measureText(ch).width+kickS*0.16; }

  // ── footer (hairline + text; NO button shape, ever) ──
  const urlS=Math.round(27*k), offerS=Math.round(24*k);
  const footBase=h-padY;
  const hair=ctx.createLinearGradient(padX,0,w-padX,0);
  hair.addColorStop(0,"rgba(200,168,75,0.55)"); hair.addColorStop(1,"rgba(200,168,75,0.06)");
  const hairY=footBase-Math.round(urlS+22*k);
  ctx.fillStyle=hair; ctx.fillRect(padX,hairY,innerW,Math.max(1,Math.round(2*k)));
  ctx.font=`900 ${urlS}px ${AD_FONT}`; ctx.fillStyle=GOLD_C;
  const domain=o.domain||"boldlinemedia.com";
  ctx.fillText(domain,padX,footBase);
  const dw2=ctx.measureText(domain).width;
  if(o.offer){
    ctx.font=`600 ${offerS}px ${AD_FONT}`; ctx.fillStyle=DIM_C;
    ctx.fillText("·  "+o.offer,padX+dw2+Math.round(14*k),footBase);
  }

  // ── middle: headline + sub, centred between lockup and footer ──
  const headLines=(o.head||[]).filter(l=>String(l).trim());
  const headS=adFitSize(ctx,headLines,innerW,Math.round((wide?82:92)*k),900);
  const headLH=headS*1.06;
  ctx.font=`500 ${Math.round(31*k)}px ${AD_FONT}`;
  const subLines=o.sub?adWrap(ctx,o.sub,innerW*(wide?0.88:0.94)):[];
  const subS=Math.round(31*k), subLH=subS*1.5;
  const gap=Math.round(30*k);
  const blockH=headLines.length*headLH+(subLines.length?gap+subLines.length*subLH:0);
  const zoneTop=padY+logoS+Math.round(40*k);
  const zoneBot=hairY-Math.round(34*k);
  let y=zoneTop+Math.max(0,((zoneBot-zoneTop)-blockH)/2)+headS*0.82;

  ctx.font=`900 ${headS}px ${AD_FONT}`;
  headLines.forEach((line,i)=>{
    ctx.fillStyle=(i===o.accent)?GOLD_C:"#F4F5FB";
    ctx.fillText(line,padX,y);
    y+=headLH;
  });
  if(subLines.length){
    y+=gap-headLH+subS*0.9;
    ctx.font=`500 ${subS}px ${AD_FONT}`; ctx.fillStyle=DIM_C;
    subLines.forEach(line=>{ ctx.fillText(line,padX,y); y+=subLH; });
  }
  return cv;
}

const adLoadImage=(src)=>new Promise((res,rej)=>{
  const im=new Image();
  im.crossOrigin="anonymous"; // media-library URLs are public Supabase storage
  im.onload=()=>res(im);
  im.onerror=()=>rej(new Error("Couldn't load that image."));
  im.src=src;
});

function AdCreativeStudio({client,onUpdate}){
  const [angleId,setAngleId]=useState(AD_ANGLES[0].id);
  const [niche,setNiche]=useState("");
  const [city,setCity]=useState("");
  // AI angles replace the five fixed templates when generated. They carry the same
  // shape ({id,label,kicker,head[],accent,sub}) so the picker and the canvas
  // renderer need no special case.
  const [aiAngles,setAiAngles]=useState([]);
  const [angleState,setAngleState]=useState("idle"); // idle | working | error
  const [angleMsg,setAngleMsg]=useState("");
  const angleList = aiAngles.length ? aiAngles : AD_ANGLES;
  const generateAngles = async () => {
    setAngleState("working"); setAngleMsg("");
    try{
      const d = await adGenCall({ action:"creatives", agency: !!client.internal,
        name: client.internal ? "BoldLine Media" : client.name,
        niche: niche || (client.internal ? "any business owner" : (client.niche||"")),
        locations: city, offer: client.internal ? "Google and Meta ad management plus the landing pages behind them" : ((client.campaignSetup&&client.campaignSetup.mainOffer)||""),
        differentiator: (client.brandVoice&&client.brandVoice.differentiator)||"" });
      setAiAngles(d.angles||[]);
      if((d.angles||[]).length){
        const a=d.angles[0];
        setAngleId(a.id);
        setF(prev=>({...prev,kicker:a.kicker,head:a.head.join("\n"),accent:a.accent,sub:a.sub}));
      }
      setAngleState("idle"); setAngleMsg(`${(d.angles||[]).length} angles written for ${niche||"this business"}`);
    }catch(e){ setAngleState("error"); setAngleMsg(e.message||"Generation failed."); }
  };
  const [f,setF]=useState(()=>{ const a=AD_ANGLES[0].build("",""); return {kicker:a.kicker,head:a.head.join("\n"),accent:a.accent,sub:a.sub,offer:"Free 30-minute strategy call"}; });
  const [sizes,setSizes]=useState(()=>AD_SIZES.filter(s=>s.on).map(s=>s.id));
  const [photoPath,setPhotoPath]=useState("");
  const [shots,setShots]=useState([]);      // {id,label,dim,url,blob,w,h}
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const [saved,setSaved]=useState(0);

  const photos=(client.mediaLibrary||[]).filter(m=>m.url&&m.category!=="video");

  // Re-seed the editable fields from the chosen angle + niche/city.
  const reseed=(id,n,c)=>{
    const a=angleList.find(x=>x.id===id)||angleList[0];
    // AI angles are already built for this niche; template angles still need the
    // niche/city substituted in.
    if(a && !a.build){ setAngleId(id); setF(prev=>({...prev,kicker:a.kicker,head:a.head.join("\n"),accent:a.accent,sub:a.sub})); return; }
    const built=a.build(String(n||"").trim(),String(c||"").trim());
    setF(prev=>({...prev,kicker:built.kicker,head:built.head.join("\n"),accent:built.accent,sub:built.sub}));
  };

  const generate=async()=>{
    setBusy("render"); setErr(""); setSaved(0);
    try{
      let photo=null;
      if(photoPath){
        const m=photos.find(p=>p.path===photoPath);
        if(m) photo=await adLoadImage(m.url);
      }
      let logo=null;
      try{ logo=await adLoadImage(LOGO); }catch(e){ /* lockup still renders without it */ }
      const head=String(f.head||"").split("\n").map(s=>s.trim()).filter(Boolean);
      if(!head.length){ setErr("Add at least one headline line."); setBusy(""); return; }
      const out=[];
      for(const s of AD_SIZES.filter(x=>sizes.indexOf(x.id)>=0)){
        const cv=document.createElement("canvas");
        drawAdCreative(cv,{w:s.w,h:s.h,kicker:f.kicker,head,accent:Number(f.accent),sub:f.sub,offer:f.offer,logo,photo});
        const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
        out.push({id:s.id,label:s.label,dim:s.dim,w:s.w,h:s.h,blob,url:URL.createObjectURL(blob)});
      }
      setShots(out);
    }catch(e){ setErr(e.message||"Couldn't render the creative."); }
    setBusy("");
  };

  // Push into the media library through the SAME sign -> PUT -> confirm flow the
  // client portal uses, so the launch card's existing auto-pick finds them.
  const saveAll=async()=>{
    if(!client.portalToken){ setErr("This account has no media token — reopen it from My Ads and try again."); return; }
    setBusy("save"); setErr(""); let n=0, lib=client.mediaLibrary||[];
    try{
      const stamp=Date.now();
      for(const s of shots){
        const name=`ad-${(angleId||"creative")}-${s.w}x${s.h}-${stamp}.jpg`;
        const sign=await fetch(`/.netlify/functions/media?action=sign&token=${encodeURIComponent(client.portalToken)}`,
          {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:name,category:"ad-creative"})});
        const sd=await sign.json().catch(()=>({}));
        if(!sign.ok||!sd.ok) throw new Error(sd.error||"Couldn't get an upload URL.");
        const put=await fetch(sd.signedUrl,{method:"PUT",headers:{"Content-Type":"image/jpeg"},body:s.blob});
        if(!put.ok) throw new Error("Upload failed.");
        const conf=await fetch(`/.netlify/functions/media?action=confirm&token=${encodeURIComponent(client.portalToken)}`,
          {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:sd.path,category:"ad-creative",label:name})});
        const cd=await conf.json().catch(()=>({}));
        if(!conf.ok||!cd.ok) throw new Error(cd.error||"Couldn't save to the media library.");
        if(cd.mediaLibrary) lib=cd.mediaLibrary;
        n++;
      }
      onUpdate({...client,mediaLibrary:lib});
      setSaved(n);
    }catch(e){ setErr(`${e.message||"Save failed."} ${n>0?`(${n} of ${shots.length} saved before it stopped.)`:""}`); }
    setBusy("");
  };

  const inp={width:"100%",padding:"9px 11px",fontSize:12.5,borderRadius:9,border:`1px solid ${C.border}`,
    backgroundColor:C.bg2,color:C.text,fontFamily:"inherit",outline:"none"};
  const lbl={fontSize:9.5,fontWeight:800,letterSpacing:".06em",textTransform:"uppercase",color:C.textMuted,marginBottom:5,display:"block"};
  const head4=String(f.head||"").split("\n").filter(l=>l.trim());

  return (
    <Card style={{borderColor:`${C.gold}2a`,marginBottom:12}}>
      <Label>Ad Creative Studio</Label>
      <div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.65,marginBottom:13}}>
        Generates the ad image so you never have to make one. Pick an angle, tweak the words, hit Generate,
        then Save — it lands in this account's media library and the <b style={{color:C.gold}}>Launch Meta Campaign</b> card
        below picks it up automatically.
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:11}}>
        <div>
          <span style={lbl}>Who is it aimed at</span>
          <input value={niche} onChange={e=>{setNiche(e.target.value);reseed(angleId,e.target.value,city);}}
            placeholder="e.g. Roofers" style={inp}/>
        </div>
        <div>
          <span style={lbl}>City (optional)</span>
          <input value={city} onChange={e=>{setCity(e.target.value);reseed(angleId,niche,e.target.value);}}
            placeholder="e.g. Gilbert" style={inp}/>
        </div>
      </div>

      <div style={{marginBottom:11}}>
        <span style={lbl}>Angle</span>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {angleList.map(a=>(
            <button key={a.id} onClick={()=>{setAngleId(a.id);reseed(a.id,niche,city);}}
              style={{padding:"6px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,cursor:"pointer",
                border:`1px solid ${angleId===a.id?C.gold:C.border}`,
                backgroundColor:angleId===a.id?"rgba(200,168,75,0.12)":"transparent",
                color:angleId===a.id?C.gold:C.textDim}}>{a.label||a.name}</button>
          ))}
        </div>
        <div style={{marginTop:9}}>
          <button onClick={generateAngles} disabled={angleState==="working"} style={{width:"100%",padding:"8px 12px",fontSize:11.5,fontWeight:800,borderRadius:9,border:`1px solid ${C.gold}55`,backgroundColor:angleState==="working"?"transparent":C.goldDim,color:angleState==="working"?C.textMuted:C.gold,cursor:angleState==="working"?"default":"pointer"}}>
            {angleState==="working"?"Writing angles…":aiAngles.length?"↻ Rewrite angles for this niche":"✨ Write angles for this niche"}
          </button>
          <div style={{fontSize:9.5,lineHeight:1.5,marginTop:4,color:angleState==="error"?C.red:C.textMuted}}>
            {angleMsg || "The five above are fixed templates. This writes angles from the actual niche and city, so two different businesses stop getting the same ad."}
          </div>
          {aiAngles.length>0&&(()=>{ const cur=aiAngles.find(x=>x.id===angleId); return cur&&cur.why?(
            <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:5}}><b style={{color:C.textDim}}>Why this one: </b>{cur.why}</div>
          ):null; })()}
        </div>
      </div>

      <div style={{marginBottom:11}}>
        <span style={lbl}>Headline — one line per row</span>
        <textarea value={f.head} onChange={e=>setF({...f,head:e.target.value})} rows={4}
          style={{...inp,resize:"vertical",lineHeight:1.5}}/>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:7,alignItems:"center"}}>
          <span style={{fontSize:10.5,color:C.textMuted}}>Gold line:</span>
          {head4.map((l,i)=>(
            <button key={i} onClick={()=>setF({...f,accent:i})}
              style={{padding:"3px 9px",fontSize:10.5,fontWeight:700,borderRadius:7,cursor:"pointer",maxWidth:150,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                border:`1px solid ${Number(f.accent)===i?C.gold:C.border}`,
                backgroundColor:Number(f.accent)===i?"rgba(200,168,75,0.12)":"transparent",
                color:Number(f.accent)===i?C.gold:C.textDim}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:11}}>
        <span style={lbl}>Supporting line</span>
        <textarea value={f.sub} onChange={e=>setF({...f,sub:e.target.value})} rows={2} style={{...inp,resize:"vertical",lineHeight:1.5}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:11}}>
        <div>
          <span style={lbl}>Kicker (small gold line)</span>
          <input value={f.kicker} onChange={e=>setF({...f,kicker:e.target.value})} style={inp}/>
        </div>
        <div>
          <span style={lbl}>Footer offer</span>
          <input value={f.offer} onChange={e=>setF({...f,offer:e.target.value})} style={inp}/>
        </div>
      </div>

      {photos.length>0&&(
        <div style={{marginBottom:11}}>
          <span style={lbl}>Background photo (optional)</span>
          <select value={photoPath} onChange={e=>setPhotoPath(e.target.value)} style={{...inp,cursor:"pointer"}}>
            <option value="">None — brand background</option>
            {photos.map(p=><option key={p.path} value={p.path}>{p.label}</option>)}
          </select>
          <div style={{fontSize:10,color:C.textMuted,marginTop:5,lineHeight:1.55}}>Drawn full-bleed under a dark scrim so the headline stays readable.</div>
        </div>
      )}

      <div style={{marginBottom:13}}>
        <span style={lbl}>Sizes</span>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {AD_SIZES.map(s=>{
            const on=sizes.indexOf(s.id)>=0;
            return (
              <button key={s.id} onClick={()=>setSizes(on?sizes.filter(x=>x!==s.id):sizes.concat(s.id))}
                style={{padding:"6px 12px",fontSize:11,fontWeight:700,borderRadius:9,cursor:"pointer",textAlign:"left",
                  border:`1px solid ${on?C.gold:C.border}`,backgroundColor:on?"rgba(200,168,75,0.12)":"transparent",
                  color:on?C.gold:C.textDim}}>
                {on?"✓ ":""}{s.label} <span style={{opacity:.65,fontWeight:600}}>{s.dim}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={generate} disabled={!!busy||!sizes.length}
          style={{padding:"9px 17px",fontSize:12,fontWeight:800,borderRadius:9,border:"none",
            cursor:busy||!sizes.length?"default":"pointer",backgroundColor:C.gold,color:"#120E02",opacity:busy||!sizes.length?.6:1}}>
          {busy==="render"?"Drawing…":"Generate"}
        </button>
        {shots.length>0&&(
          <button onClick={saveAll} disabled={!!busy}
            style={{padding:"9px 17px",fontSize:12,fontWeight:800,borderRadius:9,cursor:busy?"default":"pointer",
              border:`1px solid ${C.green}55`,backgroundColor:"transparent",color:C.green,opacity:busy?.6:1}}>
            {busy==="save"?"Saving…":`Save ${shots.length} to media library`}
          </button>
        )}
        {saved>0&&<span style={{fontSize:11.5,color:C.green,fontWeight:700}}>✓ Saved {saved} — the Meta launch card will use the newest one.</span>}
      </div>

      {err&&<div style={{fontSize:11.5,color:C.red,marginTop:10,lineHeight:1.6}}>{err}</div>}

      {shots.length>0&&(
        <div style={{display:"flex",gap:11,flexWrap:"wrap",marginTop:14}}>
          {shots.map(s=>(
            <div key={s.id} style={{width:150}}>
              <img src={s.url} alt={s.label} style={{width:"100%",borderRadius:9,border:`1px solid ${C.border}`,display:"block"}}/>
              <div style={{fontSize:9.5,color:C.textMuted,marginTop:4,display:"flex",gap:6,alignItems:"baseline",flexWrap:"wrap"}}>
                <span style={{fontWeight:700,color:C.textDim}}>{s.label}</span>
                <span>{s.dim}</span>
                <a href={s.url} download={`boldline-ad-${s.w}x${s.h}.jpg`} style={{color:C.gold,fontWeight:700,textDecoration:"none",marginLeft:"auto"}}>Download</a>
              </div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// ─── CAMPAIGN MANAGER ─────────────────────────────────────────────────────────
// One screen listing EVERY campaign across EVERY linked ad account — the My Ads
// house account and all clients — with Start / Pause / Delete on each. Built
// 2026-08-12 (Bryson, after four stray test campaigns appeared the moment he
// linked the ad account: "I need a way to access them and to be able to delete
// them if I want… a clean spot where I can see all the paused and active
// campaigns"). LiveCampaignsCard stays as the per-client view inside a client;
// this is the cross-account one.
// Add keywords to an existing ad group without leaving the campaign view. Match
// type is chosen per add, because pasting ten terms that should all be EXACT and
// getting PHRASE is the kind of thing you only notice on the invoice.
function AddKeywordRow({onAdd,busy}){
  const [text,setText]=useState("");
  const [mt,setMt]=useState("PHRASE");
  const list=text.split(/[\n,]/).map(x=>x.trim()).filter(Boolean).map(t=>({text:t,matchType:mt}));
  return (
    <div style={{display:"flex",gap:6,marginTop:7,alignItems:"center",flexWrap:"wrap"}}>
      <input value={text} onChange={e=>setText(e.target.value)} placeholder="add keywords, comma separated"
        style={{flex:"1 1 180px",minWidth:0,padding:"5px 8px",fontSize:10.5,borderRadius:7,border:`1px solid ${C.border}`,background:C.bg2,color:C.text}}/>
      <select value={mt} onChange={e=>setMt(e.target.value)} style={{padding:"5px 7px",fontSize:10,borderRadius:7,border:`1px solid ${C.border}`,background:C.bg2,color:C.textDim}}>
        {["PHRASE","EXACT","BROAD"].map(o=><option key={o} value={o} style={{background:C.bg2}}>{o[0]+o.slice(1).toLowerCase()}</option>)}
      </select>
      <button disabled={!list.length||busy} onClick={()=>{ onAdd(list); setText(""); }}
        style={{padding:"5px 10px",fontSize:10,fontWeight:800,borderRadius:7,border:"none",cursor:list.length&&!busy?"pointer":"default",backgroundColor:list.length&&!busy?C.goldDim:"transparent",color:list.length&&!busy?C.gold:C.textMuted}}>
        {busy?"…":`Add${list.length?` ${list.length}`:""}`}
      </button>
    </div>
  );
}

function CampaignManagerScreen({clients,onBack,isDesktop,onSelectClient}){
  const linked=(clients||[]).filter(c=>c.googleAdsCustomerId||c.metaAdAccountId);
  const [rows,setRows]=useState([]);
  const [errors,setErrors]=useState([]);
  const [state,setState]=useState("loading");   // loading | ready
  const [busy,setBusy]=useState(null);
  const [actionErr,setActionErr]=useState("");
  const [fStatus,setFStatus]=useState("all");   // all | live | paused
  const [fPlatform,setFPlatform]=useState("all");
  const [fClient,setFClient]=useState("all");
  // Expanded campaign detail: ad groups -> their ads and keywords, loaded on demand
  // because it costs 6 GAQL queries per campaign and most rows are never opened.
  const [openKey,setOpenKey]=useState(null);
  const [detail,setDetail]=useState({});      // key -> {state, adGroups, error}
  const [pieceBusy,setPieceBusy]=useState(null);

  const loadDetail=async(r,{force}={})=>{
    const k=keyOf(r);
    if(r.platform!=="google"){ setDetail(d=>({...d,[k]:{state:"unsupported"}})); return; }
    if(!force && detail[k] && detail[k].state==="ready") return;
    setDetail(d=>({...d,[k]:{state:"loading"}}));
    try{
      const res=await gadsCall({action:"campaignDetail",customerId:r.client.googleAdsCustomerId,campaignId:r.c.id});
      setDetail(d=>({...d,[k]:{state:"ready",adGroups:res.adGroups||[]}}));
    }catch(e){ setDetail(d=>({...d,[k]:{state:"error",error:e.message||"Could not load"}})); }
  };
  const toggleOpen=(r)=>{ const k=keyOf(r); if(openKey===k){ setOpenKey(null); return; } setOpenKey(k); loadDetail(r); };

  // Every piece-level write re-reads the campaign afterwards, so the screen always
  // shows what Google actually has rather than what we hoped it did.
  const pieceAction=async(r,id,fn,confirmMsg)=>{
    if(confirmMsg&&!window.confirm(confirmMsg)) return;
    setPieceBusy(id); setActionErr("");
    try{ await fn(); await loadDetail(r,{force:true}); }
    catch(e){ setActionErr(e.message||"That did not work."); }
    finally{ setPieceBusy(null); }
  };

  const load=async()=>{
    setState("loading"); setActionErr("");
    const out=[], errs=[];
    await Promise.all(linked.map(async(cl)=>{
      if(cl.googleAdsCustomerId){
        try{
          const d=await gadsCall({action:"campaigns",customerId:cl.googleAdsCustomerId});
          (d.campaigns||[]).forEach(c=>out.push({platform:"google",client:cl,c}));
        }catch(e){ errs.push({name:cl.name||"Unnamed",platform:"Google Ads",msg:e.message||"Couldn't load campaigns."}); }
      }
      if(cl.metaAdAccountId){
        try{
          const d=await metaCall({action:"campaigns",adAccountId:cl.metaAdAccountId});
          (d.campaigns||[]).forEach(c=>out.push({platform:"meta",client:cl,c}));
        }catch(e){ errs.push({name:cl.name||"Unnamed",platform:"Meta Ads",msg:e.message||"Couldn't load campaigns."}); }
      }
    }));
    setRows(out); setErrors(errs); setState("ready");
  };
  useEffect(()=>{ load(); },[linked.length]);

  const isOn=(r)=>r.platform==="google"
    ? String(r.c.status||"").toUpperCase()==="ENABLED"
    : String(r.c.status||"").toUpperCase()==="ACTIVE";
  // Meta only: the campaign switch says ACTIVE but delivery is blocked further
  // down (ad set paused, no active ads). Worth surfacing — it looks "Live" but
  // spends nothing, which is exactly the sort of thing you find out too late.
  const notDelivering=(r)=>r.platform==="meta"&&isOn(r)
    &&!!r.c.effectiveStatus&&String(r.c.effectiveStatus).toUpperCase()!=="ACTIVE";
  const keyOf=(r)=>r.platform==="google"?r.c.campaignResourceName:r.c.id;
  const spendOf=(r)=>Number((r.platform==="google"?r.c.cost:r.c.spend)||0);

  const toggle=async(r)=>{
    const on=isOn(r);
    if(!on&&!window.confirm(`Start "${r.c.name}"?\n\nThis turns the ads ON and begins REAL ad spend on ${r.client.internal?"BoldLine's own":(r.client.name||"the client")+"'s"} ${r.platform==="google"?"Google":"Meta"} account. You can pause it again any time.`)) return;
    setBusy(keyOf(r)); setActionErr("");
    try{
      if(r.platform==="google") await gadsCall({action:"setStatus",customerId:r.client.googleAdsCustomerId,campaignResourceName:r.c.campaignResourceName,status:on?"PAUSED":"ENABLED"});
      else await metaCall({action:"setStatus",campaignId:r.c.id,status:on?"PAUSED":"ACTIVE"});
      await load();
    }catch(e){ setActionErr(e.message||"Couldn't update the campaign."); }
    setBusy(null);
  };

  const remove=async(r)=>{
    const on=isOn(r);
    const whose=r.client.internal?"BoldLine's own":(r.client.name||"the client")+"'s";
    const plat=r.platform==="google"?"Google Ads":"Meta";
    let msg=`Delete "${r.c.name}"?\n\nThis permanently removes the campaign from ${whose} ${plat} account. It can NOT be undone — rebuilding it from scratch is the only way back.`;
    if(r.platform==="google") msg+=`\n\nGoogle marks it REMOVED, which is permanent — a removed campaign can never be re-enabled.`;
    msg+=`\n\nAlready-spent money stays on the ad account's billing record either way.`;
    if(on) msg+=`\n\n⚠ This campaign is LIVE right now. It will be paused, then deleted.`;
    if(!window.confirm(msg)) return;
    if(on&&!window.confirm(`Last check — "${r.c.name}" is actively spending.\n\nDelete it for good?`)) return;
    setBusy(keyOf(r)); setActionErr("");
    try{
      if(r.platform==="google") await gadsCall({action:"removeCampaign",customerId:r.client.googleAdsCustomerId,campaignResourceName:r.c.campaignResourceName,wasLive:on});
      else await metaCall({action:"deleteCampaign",campaignId:r.c.id,wasLive:on});
      await load();
    }catch(e){ setActionErr(e.message||"Couldn't delete the campaign."); }
    setBusy(null);
  };

  const visible=rows.filter(r=>{
    if(fStatus==="live"&&!isOn(r)) return false;
    if(fStatus==="paused"&&isOn(r)) return false;
    if(fPlatform!=="all"&&r.platform!==fPlatform) return false;
    if(fClient!=="all"&&String(r.client.id)!==String(fClient)) return false;
    return true;
  });
  const liveCount=rows.filter(isOn).length;
  const liveDaily=rows.filter(isOn).reduce((s,r)=>s+Number(r.c.dailyBudget||0),0);
  const spend30=rows.reduce((s,r)=>s+spendOf(r),0);

  // Group the visible rows by client so it reads as "whose ads are these".
  const groups=[];
  visible.forEach(r=>{
    let g=groups.find(x=>String(x.client.id)===String(r.client.id));
    if(!g){ g={client:r.client,items:[]}; groups.push(g); }
    g.items.push(r);
  });
  groups.sort((a,b)=>(b.client.internal?1:0)-(a.client.internal?1:0)||String(a.client.name||"").localeCompare(String(b.client.name||"")));

  const chipBtn=(active)=>({padding:"6px 13px",fontSize:11.5,fontWeight:700,borderRadius:9,cursor:"pointer",
    border:`1px solid ${active?C.gold:C.border}`,backgroundColor:active?"rgba(200,168,75,0.12)":"transparent",color:active?C.gold:C.textDim});
  const back=!isDesktop&&(
    <button onClick={onBack} style={{width:32,height:32,borderRadius:9,border:"none",background:"rgba(255,255,255,0.05)",color:C.textDim,cursor:"pointer",fontSize:17,flexShrink:0}}>‹</button>
  );
  const Tile=({label,value,tint})=>(
    <div style={{flex:"1 1 130px",minWidth:130,backgroundColor:C.bg2,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 13px"}}>
      <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,marginBottom:5}}>{label}</div>
      <div style={{fontSize:20,fontWeight:800,color:tint||C.text,lineHeight:1}}>{value}</div>
    </div>
  );

  const row=(r)=>{
    const on=isOn(r), k=keyOf(r), working=busy===k, stalled=notDelivering(r);
    return (
      <div key={k} style={{padding:"11px 0",borderBottom:`1px solid ${C.border2}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,flexWrap:"wrap"}}>
          <span style={{fontSize:9,fontWeight:800,padding:"1px 6px",borderRadius:5,backgroundColor:r.platform==="google"?"rgba(66,133,244,.14)":"rgba(24,119,242,.14)",color:r.platform==="google"?"#7CA9FF":"#5B9BFF",flexShrink:0}}>{r.platform==="google"?"Google":"Meta"}</span>
          <span style={{fontSize:12.5,fontWeight:700,color:C.text,flex:"1 1 160px",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.c.name}</span>
          <Chip label={on?"Live":"Paused"} color={on?C.green:C.textMuted} small/>
          {stalled&&<Chip label="Not delivering" color={C.amber} small/>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:C.textMuted}}>
            {Number(r.c.impressions||0).toLocaleString()} impr · {Number(r.c.clicks||0).toLocaleString()} clicks · ${spendOf(r).toLocaleString()} · {Number(r.c.conversions||r.c.leads||0)} conv <span style={{opacity:.6}}>(30d)</span>
            {Number(r.c.dailyBudget||0)>0?<span style={{opacity:.75}}> · ${Number(r.c.dailyBudget).toLocaleString()}/day</span>:null}
          </span>
          <span style={{marginLeft:"auto",display:"flex",gap:7,flexShrink:0}}>
            <button onClick={()=>toggle(r)} disabled={working} style={{padding:"5px 13px",fontSize:11,fontWeight:800,borderRadius:8,border:"none",cursor:working?"default":"pointer",backgroundColor:on?"rgba(255,255,255,.06)":"#059669",color:on?C.textDim:"#fff",opacity:working?.6:1}}>{working?"…":on?"⏸ Pause":"▶ Start Ads"}</button>
            {r.platform==="google"&&(
              <button onClick={()=>toggleOpen(r)} style={{padding:"5px 11px",fontSize:11,fontWeight:800,borderRadius:8,border:`1px solid ${C.border}`,cursor:"pointer",backgroundColor:"transparent",color:openKey===k?C.gold:C.textDim}}>{openKey===k?"▾ Hide":"▸ Inside"}</button>
            )}
            <button onClick={()=>remove(r)} disabled={working} title="Delete this campaign permanently" style={{padding:"5px 11px",fontSize:11,fontWeight:800,borderRadius:8,border:`1px solid ${C.red}44`,cursor:working?"default":"pointer",backgroundColor:"transparent",color:C.red,opacity:working?.6:1}}>Delete</button>
          </span>
        </div>
        {openKey===k&&(()=>{
          const d=detail[k]||{};
          if(d.state==="loading") return <div style={{fontSize:11,color:C.textMuted,padding:"10px 0 4px"}}>Reading the ad groups…</div>;
          if(d.state==="error")   return <div style={{fontSize:11,color:C.red,padding:"10px 0 4px",lineHeight:1.5}}>{d.error}</div>;
          if(d.state!=="ready")   return null;
          if(!(d.adGroups||[]).length) return <div style={{fontSize:11,color:C.textMuted,padding:"10px 0 4px"}}>No ad groups on this campaign.</div>;
          return (
            <div style={{marginTop:9,paddingLeft:isDesktop?12:0,borderLeft:isDesktop?`2px solid ${C.border2}`:"none"}}>
              {d.adGroups.map(g=>{
                const gLive=String(g.status||"").toUpperCase()==="ENABLED";
                return (
                  <div key={g.id} style={{padding:"9px 0",borderTop:`1px solid ${C.border2}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:11.5,fontWeight:800,color:C.textDim,flex:"1 1 140px",minWidth:0}}>{g.name}</span>
                      <Chip label={gLive?"Live":String(g.status||"").toLowerCase()} color={gLive?C.green:C.textMuted} small/>
                      <span style={{fontSize:9.5,color:C.textMuted,fontFamily:"monospace"}}>{Number(g.impressions).toLocaleString()} impr · {g.clicks} clicks · ${g.cost.toLocaleString()} · {g.conversions} conv</span>
                      <span style={{display:"flex",gap:6,marginLeft:"auto"}}>
                        <button disabled={pieceBusy===g.id} onClick={()=>pieceAction(r,g.id,()=>gadsCall({action:"setAdGroupStatus",customerId:r.client.googleAdsCustomerId,adGroupResourceName:g.resourceName,status:gLive?"PAUSED":"ENABLED"}),
                          gLive?null:`Start the ad group "${g.name}"?\n\nIts ads become eligible to spend the campaign's budget.`)}
                          style={{padding:"3px 9px",fontSize:10,fontWeight:800,borderRadius:7,border:"none",cursor:"pointer",backgroundColor:gLive?"rgba(255,255,255,.06)":"#059669",color:gLive?C.textDim:"#fff",opacity:pieceBusy===g.id?.6:1}}>{pieceBusy===g.id?"…":gLive?"Pause":"Start"}</button>
                        <button disabled={pieceBusy===g.id} onClick={()=>pieceAction(r,g.id,()=>gadsCall({action:"setAdGroupStatus",customerId:r.client.googleAdsCustomerId,adGroupResourceName:g.resourceName,status:"REMOVED"}),
                          `Delete the ad group "${g.name}"?\n\nIts ads and ${(g.keywords||[]).length} keyword(s) go with it. In Google Ads a removal is PERMANENT — it cannot be undone.`)}
                          style={{padding:"3px 9px",fontSize:10,fontWeight:800,borderRadius:7,border:`1px solid ${C.red}44`,cursor:"pointer",backgroundColor:"transparent",color:C.red,opacity:pieceBusy===g.id?.6:1}}>Delete</button>
                      </span>
                    </div>
                    {(g.ads||[]).length>1&&<div style={{fontSize:9.5,color:C.gold,marginTop:4}}>Split test running: {(g.ads||[]).length} ads sharing this budget.</div>}
                    {(g.ads||[]).map(a=>{
                      const aLive=String(a.status||"").toUpperCase()==="ENABLED";
                      return (
                        <div key={a.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 0 5px 10px",marginTop:4,borderLeft:`2px solid ${aLive?C.green+"55":C.border2}`}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:10.5,color:C.textDim,lineHeight:1.45}}>{(a.headlines||[]).slice(0,3).join(" · ")||"(no headlines)"}</div>
                            <div style={{fontSize:9.5,color:C.textMuted,marginTop:2}}>{aLive?"Live":"Paused"} · {a.impressions.toLocaleString()} impr · {a.clicks} clicks · {a.conversions} conv · {(a.headlines||[]).length}h/{(a.descriptions||[]).length}d</div>
                          </div>
                          <button disabled={pieceBusy===a.id} onClick={()=>pieceAction(r,a.id,()=>gadsCall({action:"setAdStatus",customerId:r.client.googleAdsCustomerId,adResourceName:a.resourceName,status:aLive?"PAUSED":"ENABLED"}))}
                            style={{flexShrink:0,padding:"3px 8px",fontSize:10,fontWeight:700,borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.textDim,cursor:"pointer",opacity:pieceBusy===a.id?.6:1}}>{pieceBusy===a.id?"…":aLive?"Pause ad":"Start ad"}</button>
                          <button disabled={pieceBusy===a.id} onClick={()=>pieceAction(r,a.id,()=>gadsCall({action:"setAdStatus",customerId:r.client.googleAdsCustomerId,adResourceName:a.resourceName,status:"REMOVED"}),`Delete this ad permanently? Google removals cannot be undone.`)}
                            style={{flexShrink:0,padding:"3px 7px",fontSize:10,fontWeight:700,borderRadius:6,border:`1px solid ${C.red}33`,background:"transparent",color:C.red,cursor:"pointer",opacity:pieceBusy===a.id?.6:1}}>✕</button>
                        </div>
                      );
                    })}
                    {(g.keywords||[]).length>0&&(
                      <div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:5}}>
                        {g.keywords.map(kw=>(
                          <span key={kw.id} title={`${kw.impressions} impr · ${kw.clicks} clicks · $${kw.cost} · ${kw.conversions} conv`}
                            style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:9.5,padding:"2px 6px",borderRadius:6,border:`1px solid ${C.border}`,color:C.textMuted}}>
                            {kw.matchType==="EXACT"?`[${kw.text}]`:kw.matchType==="PHRASE"?`"${kw.text}"`:kw.text}
                            <button disabled={pieceBusy===kw.id} onClick={()=>pieceAction(r,kw.id,()=>gadsCall({action:"removeKeywords",customerId:r.client.googleAdsCustomerId,resourceNames:[kw.resourceName]}),`Remove the keyword ${kw.text}? This is permanent in Google Ads.`)}
                              style={{background:"none",border:"none",color:C.red,cursor:"pointer",padding:0,fontSize:10,lineHeight:1,opacity:pieceBusy===kw.id?.4:1}}>✕</button>
                          </span>
                        ))}
                      </div>
                    )}
                    <AddKeywordRow onAdd={(list)=>pieceAction(r,`add-${g.id}`,()=>gadsCall({action:"addKeywords",customerId:r.client.googleAdsCustomerId,adGroupResourceName:g.resourceName,keywords:list}))} busy={pieceBusy===`add-${g.id}`}/>
                  </div>
                );
              })}
            </div>
          );
        })()}
        {stalled&&<div style={{fontSize:10,color:C.amber,marginTop:5,lineHeight:1.5}}>Meta says this campaign is on, but it isn't serving ({String(r.c.effectiveStatus).toLowerCase().replace(/_/g," ")}) — usually the ad set or the ad underneath is paused. Fix it in Meta Ads Manager.</div>}
      </div>
    );
  };

  return (
    <div style={{flex:1,overflowY:"auto",padding:isDesktop?"26px 32px 60px":"16px 14px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        {back}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:isDesktop?24:19,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>Campaigns</div>
          <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>Every campaign on every linked ad account — yours and your clients'.</div>
        </div>
        <button onClick={load} disabled={state==="loading"} style={{fontSize:11.5,fontWeight:700,color:C.gold,background:"none",border:"none",cursor:state==="loading"?"default":"pointer",opacity:state==="loading"?.5:1,flexShrink:0}}>↻ Refresh</button>
      </div>

      <div style={{maxWidth:1180}}>
        {linked.length===0&&(
          <Card><div style={{fontSize:12,color:C.textMuted,lineHeight:1.7}}>No ad accounts are linked yet, so there's nothing to show. Open <b style={{color:C.gold}}>My Ads</b> (or any client) → <b>Campaigns → Step 2</b> and paste the ad-account ID. Campaigns you build will all appear here.</div></Card>
        )}

        {linked.length>0&&<>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
            <Tile label="Campaigns" value={rows.length}/>
            <Tile label="Live now" value={liveCount} tint={liveCount>0?C.green:C.text}/>
            <Tile label="Live daily budget" value={"$"+liveDaily.toLocaleString()}/>
            <Tile label="Spend (30d)" value={"$"+Math.round(spend30).toLocaleString()}/>
          </div>

          <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
            {[["all","All"],["live","Live"],["paused","Paused"]].map(([k,l])=>(
              <button key={k} onClick={()=>setFStatus(k)} style={chipBtn(fStatus===k)}>{l}</button>
            ))}
            <span style={{width:1,background:C.border,margin:"2px 3px"}}/>
            {[["all","Both"],["google","Google"],["meta","Meta"]].map(([k,l])=>(
              <button key={k} onClick={()=>setFPlatform(k)} style={chipBtn(fPlatform===k)}>{l}</button>
            ))}
            {linked.length>1&&(
              <select value={fClient} onChange={e=>setFClient(e.target.value)} style={{padding:"6px 10px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,backgroundColor:C.bg2,color:C.textDim,cursor:"pointer"}}>
                <option value="all">All accounts</option>
                {linked.map(c=><option key={c.id} value={c.id}>{c.internal?"My Ads (BoldLine)":(c.name||"Unnamed")}</option>)}
              </select>
            )}
          </div>

          {errors.length>0&&(
            <Card style={{borderColor:`${C.red}44`,marginBottom:12}}>
              <Label>Couldn't load {errors.length===1?"one account":`${errors.length} accounts`}</Label>
              {errors.map((e,i)=>(

function LiveCampaignsCard({client}) {
  const hasG=!!client.googleAdsCustomerId, hasM=!!client.metaAdAccountId;
  const [state,setState]=useState("loading"); // loading | ready | error | none
  const [g,setG]=useState([]); const [m,setM]=useState([]);
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(null);
  const load=async()=>{
    if(!hasG&&!hasM){ setState("none"); return; }
    setState("loading"); setErr("");
    try{
      if(hasG){ const d=await gadsCall({action:"campaigns",customerId:client.googleAdsCustomerId}); setG(d.campaigns||[]); }
      if(hasM){ const d=await metaCall({action:"campaigns",adAccountId:client.metaAdAccountId}); setM(d.campaigns||[]); }
      setState("ready");
    }catch(e){ setErr(e.message||"Couldn't load campaigns."); setState("error"); }
  };
  useEffect(()=>{ load(); },[client.googleAdsCustomerId,client.metaAdAccountId]);

  const toggle=async(platform,c)=>{
    const on = platform==="google" ? String(c.status).toUpperCase()==="ENABLED" : String(c.status).toUpperCase()==="ACTIVE";
    if(!on && !window.confirm(`Start "${c.name}"?\n\nThis turns the ads ON and begins REAL ad spend on your ${platform==="google"?"Google":"Meta"} account. You can pause it again any time.`)) return;
    const key = platform==="google"?c.campaignResourceName:c.id;
    setBusy(key); setErr("");
    try{
      if(platform==="google") await gadsCall({action:"setStatus",customerId:client.googleAdsCustomerId,campaignResourceName:c.campaignResourceName,status:on?"PAUSED":"ENABLED"});
      else await metaCall({action:"setStatus",campaignId:c.id,status:on?"PAUSED":"ACTIVE"});
      await load();
    }catch(e){ setErr(e.message||"Couldn't update the campaign."); }
    setBusy(null);
  };

  const row=(platform,c)=>{
    const on = platform==="google" ? String(c.status).toUpperCase()==="ENABLED" : String(c.status).toUpperCase()==="ACTIVE";
    const key = platform==="google"?c.campaignResourceName:c.id;
    const working = busy===key;

      <div key={key} style={{padding:"10px 0",borderBottom:`1px solid ${C.border2}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
          <span style={{fontSize:9,fontWeight:800,padding:"1px 6px",borderRadius:5,backgroundColor:platform==="google"?"rgba(66,133,244,.14)":"rgba(24,119,242,.14)",color:platform==="google"?"#7CA9FF":"#5B9BFF",flexShrink:0}}>{platform==="google"?"Google":"Meta"}</span>
          <span style={{fontSize:12.5,fontWeight:700,color:C.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
          <Chip label={on?"Live":"Paused"} color={on?C.green:C.textMuted} small/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:C.textMuted}}>{Number(c.impressions||0).toLocaleString()} impr · {Number(c.clicks||0).toLocaleString()} clicks · ${Number(c.cost||c.spend||0).toLocaleString()} · {Number(c.conversions||0)} conv <span style={{opacity:.6}}>(30d)</span></span>
          <button onClick={()=>toggle(platform,c)} disabled={working} style={{marginLeft:"auto",padding:"5px 13px",fontSize:11,fontWeight:800,borderRadius:8,border:"none",cursor:working?"default":"pointer",backgroundColor:on?"rgba(255,255,255,.06)":"#059669",color:on?C.textDim:"#fff",opacity:working?.6:1}}>{working?"…":on?"⏸ Pause":"▶ Start Ads"}</button>
        </div>
      </div>
    );
  };

  const total=g.length+m.length;
  return (
    <Card style={{borderColor:`${C.gold}2a`}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <Label>Your Live Campaigns</Label>
        <button onClick={load} disabled={state==="loading"} style={{marginLeft:"auto",fontSize:11,fontWeight:700,color:C.gold,background:"none",border:"none",cursor:state==="loading"?"default":"pointer",opacity:state==="loading"?.5:1}}>↻ Refresh</button>
      </div>
      {state==="none"&&<div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.6}}>Link your Google or Meta ad account first (<b style={{color:C.gold}}>Overview → Edit</b>), then build a campaign below — it'll show up here with a <b>Start Ads</b> button.</div>}
      {state==="loading"&&<div style={{fontSize:12,color:C.textMuted,padding:"6px 0"}}>Loading your campaigns…</div>}
      {state==="error"&&<div style={{fontSize:11.5,color:C.red,lineHeight:1.6}}>{err} <button onClick={load} style={{background:"none",border:"none",color:C.gold,cursor:"pointer",fontWeight:700}}>Retry</button></div>}
      {state==="ready"&&total===0&&<div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.6}}>No campaigns yet — build one below, then come back here and hit <b style={{color:C.green}}>▶ Start Ads</b> to take it live.</div>}
      {state==="ready"&&total>0&&<>
        {g.map(c=>row("google",c))}
        {m.map(c=>row("meta",c))}
        {err&&<div style={{fontSize:11,color:C.red,marginTop:8}}>{err}</div>}
        <div style={{fontSize:10,color:C.textMuted,marginTop:9,lineHeight:1.6}}>Campaigns build <b>Paused</b> so nothing spends by accident. <b style={{color:C.green}}>Start Ads</b> takes one live; <b>Pause</b> stops spend instantly. Changes apply straight to your ad account.</div>
      </>}
    </Card>
  );
}
