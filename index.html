// LandingPreview — renders the owner's in-app preview through the SAME live function
// (POST /landing) so the preview can never drift from the real /lp/<slug> page.
function LandingPreview({client}){
  const [html,setHtml]=useState("");
  const [state,setState]=useState("loading"); // loading | ok | err
  const key=JSON.stringify(client.landingPage||{})+"|"+(client.callTrackingNumber||"")+"|"+(client.bookingUrl||"")+"|"+JSON.stringify(client.campaignSetup||{})+"|"+JSON.stringify(client.brandVoice||{})+"|"+JSON.stringify((client.mediaLibrary||[]).map(m=>m.url));
  useEffect(()=>{
    let dead=false; setState("loading");
    (async()=>{
      try{
        const { data:{ session } }=await supabaseClient.auth.getSession();
        const token=session&&session.access_token;
        const r=await fetch("/.netlify/functions/landing",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(token||"")},body:JSON.stringify({client})});
        const t=await r.text();
        if(dead)return;
        if(!r.ok){setState("err");return;}
        setHtml(t);setState("ok");
      }catch(e){ if(!dead) setState("err"); }
    })();
    return ()=>{dead=true;};
  },[key]);
  if(state==="err") return <div style={{fontSize:11,color:C.textMuted,padding:12,lineHeight:1.6}}>Preview unavailable right now — once published, the live page at <code>/lp/{client.landingSlug}</code> is what clients see.</div>;
  return <iframe srcDoc={html} title="Landing Page Preview" sandbox="allow-scripts allow-same-origin" style={{width:"100%",height:520,border:"none",display:"block",background:"#fff",opacity:state==="ok"?1:.45,transition:"opacity .2s"}}/>;
}
// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
// ─── DEAL PREP (pre-call research + package recommendation) ───────────────────
// Bryson types a prospect's details; a Netlify BACKGROUND function web-researches
// the company + recommends a package (netlify/functions/deal-research*.mjs). We
// kick it off (fire-and-forget 202), then poll deal-research(get) until it lands.
const briefMdToNodes = (md) => {
  const lines = String(md||"").replace(/\r\n/g,"\n").split("\n");
  const out=[]; let bullets=null; let k=0;
  const inline=(t)=>String(t).split(/(\*\*[^*]+\*\*)/g).map((p,i)=>
    p.startsWith("**")&&p.endsWith("**") ? <strong key={i} style={{color:C.text}}>{p.slice(2,-2)}</strong> : <React.Fragment key={i}>{p}</React.Fragment>);
  const flush=()=>{ if(bullets){ out.push(<ul key={"u"+(k++)} style={{margin:"0 0 12px",paddingLeft:18}}>{bullets.map((b,i)=><li key={i} style={{fontSize:13,color:C.textDim,lineHeight:1.55,marginBottom:5}}>{inline(b)}</li>)}</ul>); bullets=null; } };
  for(const raw of lines){ const line=raw.trim();
    if(!line){ flush(); continue; }
    const h=line.match(/^\*\*(.+?)\*\*:?$/);
    if(h){ flush(); out.push(<div key={"h"+(k++)} style={{fontSize:11,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.gold,margin:"18px 0 8px",paddingBottom:5,borderBottom:`1px solid ${C.gold}22`}}>{h[1]}</div>); continue; }
    const b=line.match(/^[-*]\s+(.*)$/);
    if(b){ (bullets=bullets||[]).push(b[1]); continue; }
    flush(); out.push(<p key={"p"+(k++)} style={{fontSize:13,color:C.textDim,lineHeight:1.6,margin:"0 0 12px"}}>{inline(line)}</p>);
  }
  flush(); return out;
};

// ─── CREATIVE STRATEGY: TEST vs MULTI-ANGLE ─────────────────────────────────
// Bryson, 2026-08-19, after Brez Scales: "if your running multiple ads with different
// images/angles/keywords that one might have high or whatever but itll be ok because
// thats what builds awareness and then the second ads builds it even more and then the
// third ad that they see will land them as a lead."
//
// He is right, and it exposes a real flaw in test mode: both platforms credit the LAST
// ad clicked, so an ad that warms someone up looks like a failure and gets paused, and
// the winner can get worse afterwards because the loser was feeding it.
//
// This is the switch. Per client, changeable any time, and it takes effect on the next
// autopilot run — there is nothing to rebuild and no campaign is touched by flipping it.
function CreativeStrategyCard({client, onUpdate}) {
  const ap = client.autopilot || {};
  const mode = ap.creativeMode === "multi" ? "multi" : "test";
  const target = Math.min(5, Math.max(2, Math.round(Number(ap.multiTarget)) || 3));
  const set = (patch) => onUpdate && onUpdate({...client, autopilot:{...ap, ...patch}});

  const opt = (id, title, blurb, when) => {
    const on = mode === id;
    return (
      <button key={id} onClick={()=>set({creativeMode:id})} style={{width:"100%",textAlign:"left",
        padding:"11px 13px",borderRadius:11,marginBottom:7,cursor:"pointer",
        border:`2px solid ${on?"#C8A84B":C.border}`,
        backgroundColor:on?"rgba(200,168,75,0.07)":"rgba(255,255,255,0.02)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:15,height:15,borderRadius:"50%",flexShrink:0,
            border:`2px solid ${on?"#C8A84B":C.textMuted}`,
            backgroundColor:on?"#C8A84B":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {on&&<span style={{width:5,height:5,borderRadius:"50%",backgroundColor:"#0a0800"}}/>}
          </span>
          <span style={{fontSize:13,fontWeight:700,color:on?C.text:C.textDim}}>{title}</span>
        </div>
        <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:5}}>{blurb}</div>
        <div style={{fontSize:10.5,color:on?C.gold:C.textMuted,lineHeight:1.55,marginTop:5}}>{when}</div>
      </button>
    );
  };

  return (
    <Card>
      <Label>Ad Testing Strategy</Label>
      <div style={{fontSize:11,color:C.textMuted,lineHeight:1.65,margin:"0 0 11px"}}>
        How the bot decides what to do with your ads. Change it whenever you like, it takes effect on the next run and never touches a live campaign by itself.
      </div>

      {opt("test","Test to a winner",
        "Runs two ads against each other and pauses the weaker one once there is enough data to be sure.",
        "Best when you are still finding out which message works, and on a smaller budget where three ads would each get too little to learn from.")}

      {opt("multi","Multi-angle",
        `Keeps ${target} different ads running at once on purpose. It never pauses one just for performing worse.`,
        "Best once you are spending enough that people see you several times. The first ad makes them aware, the second makes it familiar, the third is the one they act on.")}

      {mode==="multi"&&(
        <div style={{marginTop:4,padding:"11px 13px",borderRadius:11,backgroundColor:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,fontWeight:700,color:C.textDim,marginBottom:7}}>How many angles to keep running</div>
          <div style={{display:"flex",gap:6}}>
            {[2,3,4,5].map(n=>(
              <button key={n} onClick={()=>set({multiTarget:n})} style={{flex:1,padding:"8px 0",fontSize:13,fontWeight:800,borderRadius:9,cursor:"pointer",
                border:`1px solid ${target===n?"#C8A84B":C.border}`,
                backgroundColor:target===n?"rgba(200,168,75,0.12)":"rgba(255,255,255,0.02)",
                color:target===n?C.gold:C.textMuted}}>{n}</button>
            ))}
          </div>
          {/* The one thing that still gets killed, said plainly, so "never pauses" is not
              mistaken for "never touches anything". */}
          <div style={{fontSize:10.5,color:C.textMuted,lineHeight:1.6,marginTop:9}}>
            An ad is only ever paused here if it spends real money and gets <strong style={{color:C.textDim}}>zero</strong> clicks. A losing ad might be the one warming people up. An ad nobody clicks is not warming anyone.
          </div>
        </div>
      )}

      {/* Honest about where it helps, because it is not free on a small budget. */}
      {mode==="multi"&&!client.internal&&(
        <div style={{marginTop:9,padding:"10px 12px",borderRadius:10,backgroundColor:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.22)",fontSize:10.5,color:C.textDim,lineHeight:1.6}}>
          Worth checking their budget can feed {target} ads. Split too thin, none of them get enough data and all of them stay mediocre.
        </div>
      )}
      <div style={{fontSize:10,color:C.textMuted,lineHeight:1.6,marginTop:9}}>
        Applies to Google and Meta together. Most useful on Meta, where people need to see you a few times. Google search is people already looking for you, so it matters less there.
      </div>
    </Card>
  );
}

// ─── HAND-OFF DELIVERY CARD ──────────────────────────────────────────────────
// Bryson, 2026-08-18: "how will I build it and give it to them and then track if they
// come back as a recurring client within 6 months?"
//
// One card answering all three. It only renders for a Launch & Hand Off client, and it
// is the only place in the OS that tracks a relationship with a defined END. Everything
// else here assumes a client who stays.
function HandOffCard({client,pkg,onUpdate,isDesktop}){
  const [busy,setBusy]=useState("");
  const [msg,setMsg]=useState("");
  const [showPack,setShowPack]=useState(false);
  const [showExport,setShowExport]=useState(false);
  const [exp,setExp]=useState({phone:client.publicPhone||"",conversionId:"",conversionLabel:"",domain:""});
  const [expOut,setExpOut]=useState(null);
  const h=handoffDates(client);
  const pack=client.handoverPack;
  if(!isOneTime(pkg)) return null;

  const generate=async()=>{
    setBusy("gen"); setMsg("");
    try{
      const { data:{ session } }=await supabaseClient.auth.getSession();
      const token=session&&session.access_token;
      if(!token) throw new Error("Your session expired — refresh the page and try again.");
      const r=await fetch("/.netlify/functions/handover-pack",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify({clientId:client.id})}).then(x=>x.json());
      if(!r||!r.ok) throw new Error((r&&r.error)||"Could not write the pack.");
      onUpdate&&onUpdate({...client,handoverPack:r.pack});
      setShowPack(true);
    }catch(e){ setMsg(e.message); }
    setBusy("");
  };
  // ── Exporting the landing page ─────────────────────────────────────────
  // The live page is rendered on request from BoldLine's database on BoldLine's domain.
  // It is not a file and cannot be "given" to anyone — it disappears the day the function
  // stops running. So the hand-off produces a standalone copy with their own number,
  // their own conversion tag, and a form that posts to a host THEY control.
  const runExport=async()=>{
    setBusy("export"); setMsg(""); setExpOut(null);
    try{
      const { data:{ session } }=await supabaseClient.auth.getSession();
      const token=session&&session.access_token;
      if(!token) throw new Error("Your session expired — refresh the page and try again.");
      const r=await fetch("/.netlify/functions/handover-export",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify({clientId:client.id,...exp})}).then(x=>x.json());
      if(!r||!r.ok) throw new Error((r&&r.error)||"Could not build the export.");
      setExpOut(r);
      onUpdate&&onUpdate({...client,publicPhone:exp.phone,handoffExportedAt:new Date().toISOString()});
    }catch(e){ setMsg(e.message); }
    setBusy("");
  };
  // Two separate files rather than a zip: there is no zip library in the browser here,
  // and "save both into one folder" is an instruction a business owner can follow.
  const download=(text,filename,type)=>{
    const url=URL.createObjectURL(new Blob([text],{type}));
    const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  const markSent=()=>{
    const now=new Date().toISOString();
    onUpdate&&onUpdate({...client,handoffPackSent:now,
      commLog:[{date:fmt(now),note:"Handover pack sent and training call booked. BoldLine's work on this build is complete.",cat:"handoff",ts:Date.now()},...(client.commLog||[])]});
    setMsg("");
  };
  // Starting the clock by hand exists because the webhook stamps it on payment, and a
  // client paid outside the normal flow (bank transfer, an invoice sent by hand) would
  // otherwise never get a settle-in window or a conversion deadline at all.
  const startClock=()=>{
    if(!window.confirm("Start the hand-off clock from today? This sets the 30-day settle-in and the 6-month setup-fee waiver.")) return;
    onUpdate&&onUpdate({...client,handoffPaidAt:new Date().toISOString()});
  };

  const step=(n,title,body,done,active)=>(
    <div style={{display:"flex",gap:11,padding:"10px 0",borderTop:n===1?"none":`1px solid rgba(255,255,255,0.05)`}}>
      <span style={{flexShrink:0,width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:10,fontWeight:800,backgroundColor:done?C.green:(active?C.gold:"rgba(255,255,255,0.06)"),
        color:(done||active)?"#0a0800":C.textMuted}}>{done?"✓":n}</span>
      <div style={{minWidth:0,flex:1}}>
        <div style={{fontSize:12.5,fontWeight:700,color:done?C.textDim:C.text}}>{title}</div>
        <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:2}}>{body}</div>
      </div>
    </div>
  );

  return (
    <Card style={{borderColor:C.borderAccent}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:4}}>
        <Label>Launch &amp; Hand Off</Label>
        <span style={{fontSize:9,fontWeight:800,letterSpacing:".07em",padding:"2px 7px",borderRadius:20,backgroundColor:"rgba(200,168,75,.14)",border:"1px solid rgba(200,168,75,.3)",color:C.gold}}>ONE-TIME BUILD</span>
      </div>

      {!h ? (
        <>
          <div style={{fontSize:11.5,color:C.textDim,lineHeight:1.7,marginBottom:10}}>
            The clock starts the moment they pay, and it starts itself. If they paid some other way, start it by hand.
          </div>
          <button onClick={startClock} style={{width:"100%",padding:"10px",fontSize:12,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>Start the hand-off clock</button>
        </>
      ) : (
        <>
          {/* Where they are, in one line, because the whole product is a timeline. */}
          <div style={{padding:"10px 12px",borderRadius:10,marginBottom:10,
            backgroundColor:h.inSettleIn?"rgba(200,168,75,0.07)":(h.creditLive?"rgba(79,142,247,0.07)":"rgba(255,255,255,0.03)"),
            border:`1px solid ${h.inSettleIn?"rgba(200,168,75,0.24)":(h.creditLive?"rgba(79,142,247,0.22)":C.border)}`}}>
            <div style={{fontSize:12,fontWeight:700,color:h.inSettleIn?C.gold:(h.creditLive?C.blue:C.textDim)}}>
              {h.inSettleIn?`Settle-in — ${h.daysLeftInSettleIn} day${h.daysLeftInSettleIn!==1?"s":""} left`
               :(h.creditLive?`Handed over — waiver live for ${h.daysLeftOnCredit} more days`:"Handed over — waiver expired")}
            </div>
            <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:3}}>
              {h.inSettleIn
                ? "You are still working on this one. Two optimization passes, then the handover."
                : (h.creditLive
                  ? "Nothing recurring runs for them any more. If they come back onto a managed plan before the waiver runs out, their setup is free."
                  : "The setup-fee waiver has run out. A managed plan now costs them the full setup fee.")}
            </div>
          </div>

          <div style={{marginBottom:4}}>
            {step(1,"Build it",`Same build as a managed client: campaign, custom landing page, call tracking, conversion tracking. It all lives in ${client.name}'s own account, never yours.`,true,false)}
            {step(2,"Two optimization passes",`Within the first ${HANDOFF_SETTLE_IN_DAYS} days. This is the part they paid for that a freelancer would not do, and it is what makes the campaign worth handing over.`,!h.inSettleIn,h.inSettleIn)}
            {step(3,"Send the handover pack",pack?"Written and ready. Read it below, then send it and book the training call.":"A playbook written for their campaign: the weekly routine, what to leave alone, and the warning signs. Write it below.",!!client.handoffPackSent,h.inSettleIn&&!client.handoffPackSent)}
            {step(4,"Hand over the landing page",client.handoffExportedAt?`Exported ${new Date(client.handoffExportedAt).toLocaleDateString()}. They host it from here.`:"The live page runs on our server and vanishes when we stop hosting it. Export a standalone copy with their own number and their own form.",!!client.handoffExportedAt,h.inSettleIn&&!client.handoffExportedAt)}
            {step(5,"Remove your access","Drop your manager access to their ad account, and release the call tracking number so you stop paying for it.",!!client.handoffPackSent,!h.inSettleIn&&!client.handoffPackSent)}
            {step(6,"Call them before the waiver runs out",h.creditLive?`${h.daysLeftOnCredit} days left. They have run it themselves for a while by now, which is the best possible moment to ask how it is going.`:"The window has closed. Still worth a call, it just costs them a setup fee now.",!h.creditLive,h.creditLive&&!h.inSettleIn)}
          </div>

          <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
            <button onClick={generate} disabled={!!busy} style={{flex:"1 1 150px",padding:"10px",fontSize:12,fontWeight:700,borderRadius:9,border:"none",background:busy==="gen"?"rgba(255,255,255,.06)":C.gradB,color:busy==="gen"?C.textMuted:"#1a1400",cursor:busy?"default":"pointer"}}>
              {busy==="gen"?"Writing…":(pack?"Rewrite the pack":"Write the handover pack")}</button>
            {pack&&<button onClick={()=>setShowPack(v=>!v)} style={{flex:"1 1 110px",padding:"10px",fontSize:12,fontWeight:600,borderRadius:9,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>{showPack?"Hide":"Read it"}</button>}
          </div>
          {pack&&!client.handoffPackSent&&(
            <button onClick={markSent} style={{width:"100%",marginTop:7,padding:"10px",fontSize:12,fontWeight:700,borderRadius:9,border:"none",backgroundColor:C.green,color:"#04110b",cursor:"pointer"}}>Mark handed over</button>
          )}
          {client.handoffPackSent&&(
            <div style={{marginTop:8,fontSize:11,color:C.green,lineHeight:1.6}}>✓ Handed over {new Date(client.handoffPackSent).toLocaleDateString()}. Your work on this build is finished.</div>
          )}
          <button onClick={()=>setShowExport(v=>!v)} style={{width:"100%",marginTop:7,padding:"10px",fontSize:12,fontWeight:700,borderRadius:9,border:`1px solid ${showExport?C.borderAccent:C.border}`,backgroundColor:showExport?"rgba(200,168,75,0.06)":"rgba(255,255,255,.04)",color:showExport?C.gold:C.textDim,cursor:"pointer"}}>
            {showExport?"Hide the page export":"Export their landing page"}</button>
          {showExport&&(
            <div style={{marginTop:9,padding:"13px",borderRadius:11,backgroundColor:"rgba(255,255,255,0.02)",border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11.5,color:C.textDim,lineHeight:1.7,marginBottom:10}}>
                The live page runs on our server, so it is not a file you can send. This builds a standalone copy: <strong style={{color:C.text}}>their</strong> phone number, a form that posts to their own host, and their conversion tag.
              </div>
              <div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Their real phone number *</div>
              <input value={exp.phone} onChange={e=>setExp(v=>({...v,phone:e.target.value}))} placeholder="(602) 555-0199" style={inp}/>
              <div style={{fontSize:10,color:C.amber,lineHeight:1.55,margin:"5px 0 10px"}}>Not the tracking number. That one stops working when you release it, and their page would quietly stop taking calls.</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:"1 1 150px",minWidth:0}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Conversion ID</div>
                  <input value={exp.conversionId} onChange={e=>setExp(v=>({...v,conversionId:e.target.value}))} placeholder="AW-123456789" style={inp}/>
                </div>
                <div style={{flex:"1 1 150px",minWidth:0}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Conversion label</div>
                  <input value={exp.conversionLabel} onChange={e=>setExp(v=>({...v,conversionLabel:e.target.value}))} placeholder="abcDEF123" style={inp}/>
                </div>
              </div>
              <div style={{fontSize:10,color:C.textMuted,lineHeight:1.55,margin:"5px 0 10px"}}>From their Google Ads account, under Goals. Leave blank if you have not got them yet, but their campaign will stop learning without it.</div>
              <div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Their domain <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div>
              <input value={exp.domain} onChange={e=>setExp(v=>({...v,domain:e.target.value}))} placeholder="offers.theircompany.com" style={inp}/>
              <button onClick={runExport} disabled={!!busy} style={{width:"100%",marginTop:11,padding:"10px",fontSize:12,fontWeight:800,borderRadius:9,border:"none",background:busy==="export"?"rgba(255,255,255,.06)":C.gradB,color:busy==="export"?C.textMuted:"#1a1400",cursor:busy?"default":"pointer"}}>
                {busy==="export"?"Building…":"Build the export"}</button>

              {expOut&&(
                <div style={{marginTop:11}}>
                  {(expOut.warnings||[]).map((w,i)=>(
                    <div key={i} style={{fontSize:11,color:C.amber,lineHeight:1.6,marginBottom:6,padding:"8px 10px",borderRadius:8,backgroundColor:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.22)"}}>{w}</div>
                  ))}
                  <div style={{fontSize:11.5,color:C.green,lineHeight:1.6,marginBottom:8}}>✓ Built. Save both into one folder, then send them that folder.</div>
                  <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                    <button onClick={()=>download(expOut.html,"index.html","text/html")} style={{flex:"1 1 130px",padding:"9px",fontSize:11.5,fontWeight:700,borderRadius:8,border:"none",backgroundColor:C.green,color:"#04110b",cursor:"pointer"}}>Save index.html</button>
                    <button onClick={()=>download(expOut.guide,"HOW-TO-PUT-THIS-ONLINE.txt","text/plain")} style={{flex:"1 1 130px",padding:"9px",fontSize:11.5,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>Save the guide</button>
                  </div>
                  <details style={{marginTop:9}}>
                    <summary style={{fontSize:11,color:C.gold,cursor:"pointer"}}>Read the guide they will get</summary>
                    <pre style={{marginTop:8,padding:"11px",borderRadius:9,backgroundColor:"rgba(0,0,0,.28)",border:`1px solid ${C.border}`,fontSize:10.5,color:C.textDim,lineHeight:1.6,whiteSpace:"pre-wrap",maxHeight:280,overflowY:"auto"}}>{expOut.guide}</pre>
                  </details>
                </div>
              )}
            </div>
          )}

          {msg&&<div style={{fontSize:11.5,color:C.red,marginTop:8,lineHeight:1.6}}>{msg}</div>}

          {showPack&&pack&&<HandoverPackView pack={pack} client={client}/>}
        </>
      )}
    </Card>
  );
}

// The pack itself. Rendered in the OS so Bryson reads exactly what the client will read
// before he sends it — a generated document nobody proofreads is a liability.
function HandoverPackView({pack,client}){
  const sec=(title,children)=>(
    <div style={{marginTop:12}}>
      <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.gold,marginBottom:6}}>{title}</div>
      {children}
    </div>
  );
  const bullets=(arr)=>(arr||[]).map((x,i)=>(
    <div key={i} style={{display:"flex",gap:7,fontSize:11.5,color:C.textDim,lineHeight:1.65,marginTop:i?4:0}}>
      <span style={{color:C.textMuted,flexShrink:0}}>•</span><span>{x}</span></div>
  ));
  const copyAll=()=>{
    const L=[`Your campaign, handed over — ${client.name||""}`,"",pack.intro,"","WHAT YOU NOW OWN",
      ...(pack.whatYouOwn||[]).map(x=>"- "+x),"","EVERY WEEK (under 30 minutes)",
      ...(pack.weekly||[]).map(w=>`- ${w.task} (${w.howLong}): ${w.why}`),"","ONCE A MONTH",
      ...(pack.monthly||[]).map(x=>"- "+x),"","LEAVE THESE ALONE",
      ...(pack.leaveAlone||[]).map(x=>`- ${x.thing}: ${x.why}`),"","WARNING SIGNS",
      ...(pack.warningSigns||[]).map(x=>"- "+x),"","CALL US IF",
      ...(pack.callUsIf||[]).map(x=>"- "+x)].join("\n");
    try{ navigator.clipboard.writeText(L); }catch{}
  };
  return (
    <div style={{marginTop:12,padding:"14px",borderRadius:12,backgroundColor:"rgba(255,255,255,0.02)",border:`1px solid ${C.border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:8}}>
        <div style={{fontSize:12,fontWeight:800,color:C.text}}>What they will read</div>
        <button onClick={copyAll} style={{fontSize:10,color:C.gold,background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",flexShrink:0}}>copy as text</button>
      </div>
      <div style={{fontSize:12,color:C.textDim,lineHeight:1.7}}>{pack.intro}</div>
      {sec("What you now own",bullets(pack.whatYouOwn))}
      {sec("Every week",(pack.weekly||[]).map((w,i)=>(
        <div key={i} style={{padding:"7px 0",borderTop:i?`1px solid rgba(255,255,255,0.04)`:"none"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <span style={{fontSize:11.5,fontWeight:700,color:C.text}}>{w.task}</span>
            <span style={{fontSize:10.5,color:C.textMuted,flexShrink:0}}>{w.howLong}</span>
          </div>
          <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:2}}>{w.why}</div>
        </div>
      )))}
      {sec("Once a month",bullets(pack.monthly))}
      {/* The section that earns the document. */}
      {sec("Leave these alone",(pack.leaveAlone||[]).map((x,i)=>(
        <div key={i} style={{padding:"7px 9px",borderRadius:8,marginTop:i?5:0,backgroundColor:"rgba(239,68,68,0.05)",border:"1px solid rgba(239,68,68,0.18)"}}>
          <div style={{fontSize:11.5,fontWeight:700,color:C.text}}>{x.thing}</div>
          <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:2}}>{x.why}</div>
        </div>
      )))}
      {sec("Warning signs",bullets(pack.warningSigns))}
      {sec("Call us if",bullets(pack.callUsIf))}
    </div>
  );
}

// ─── PER-LEAD FEE FINDER ─────────────────────────────────────────────────────
// Bryson, 2026-08-18: "I want to build something where I can put in the niche and or
// details about a specific company and I quickly get a per lead fee generated."
//
// Under the greater-of pricing model the per-lead fee is the ONLY number that varies by
// client, so it is the one number that has to be right and the one he has to defend out
// loud. This shows the chain rather than a bare figure: what a customer is worth, how
// many they close, what a lead is therefore worth, and the fee as a share of that.
//
// Rendered in two places with the same component: on Deal Prep (before a call) and on a
// client's Billing card (to set or sanity-check a live rate), where `onUse` writes the
// number straight onto the client so it can never be mistyped in transit.
function LeadFeeFinder({defaults,onUse,isDesktop}){
  const [form,setForm]=useState({
    niche:(defaults&&defaults.niche)||"", company:(defaults&&defaults.company)||"",
    location:(defaults&&defaults.location)||"", adBudget:(defaults&&defaults.adBudget)||"",
    notes:"",
  });
  const [state,setState]=useState("form");   // form | working | done | error
  const [msg,setMsg]=useState("");
  const [res,setRes]=useState(null);
  const set=(k)=>(e)=>{ const v=e.target.value; setForm(f=>({...f,[k]:v})); };

  // Re-seed when the caller's context changes (opening the finder on a different client
  // must not show the last one's niche).
  useEffect(()=>{
    if(!defaults) return;
    setForm(f=>({...f,niche:defaults.niche||f.niche,company:defaults.company||f.company,
      location:defaults.location||f.location,adBudget:defaults.adBudget||f.adBudget}));
  },[defaults&&defaults.niche,defaults&&defaults.company,defaults&&defaults.adBudget]);

  const run=async()=>{
    if(!form.niche.trim()&&!form.company.trim()){ setMsg("Type a niche or a company name first."); setState("error"); return; }
    setState("working"); setMsg(""); setRes(null);
    try{
      const { data:{ session } }=await supabaseClient.auth.getSession();
      const token=session&&session.access_token;
      if(!token){ setState("error"); setMsg("Your session expired — refresh the page and try again."); return; }
      const r=await fetch("/.netlify/functions/lead-fee",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify({...form,packageId:(defaults&&defaults.packageId)||undefined})}).then(x=>x.json());
      if(!r||!r.ok){ setState("error"); setMsg((r&&r.error)||"Could not work out a fee. Try again."); return; }
      setRes(r); setState("done");
    }catch{ setState("error"); setMsg("Could not reach the fee finder. Check your connection and try again."); }
  };

  const lbl={fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"};
  const CONF={high:{t:"Confident",c:C.green},medium:{t:"Reasonable estimate",c:C.gold},low:{t:"Rough — verify on the call",c:C.amber}};

  return (
    <div style={S.col12}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 200px",minWidth:0}}><div style={lbl}>Niche or trade</div>
          <input value={form.niche} onChange={set("niche")} placeholder="e.g. Roofing, Med Spa, Personal Injury Law" style={inp}/></div>
        <div style={{flex:"1 1 200px",minWidth:0}}><div style={lbl}>Company <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div>
          <input value={form.company} onChange={set("company")} placeholder="Summit Roofing" style={inp}/></div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 200px",minWidth:0}}><div style={lbl}>Market <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div>
          <input value={form.location} onChange={set("location")} placeholder="Phoenix, AZ" style={inp}/></div>
        <div style={{flex:"1 1 200px",minWidth:0}}><div style={lbl}>Their monthly ad budget <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div>
          <input value={form.adBudget} onChange={set("adBudget")} placeholder="$3,000" style={inp}/></div>
      </div>
      <div><div style={lbl}>Anything that changes the maths <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div>
        <textarea value={form.notes} onChange={set("notes")} rows={2} placeholder="Only does commercial re-roofs. Average job about $80,000." style={{...inp,resize:"vertical",fontFamily:"inherit"}}/></div>
      <button onClick={run} disabled={state==="working"} style={{width:"100%",padding:"11px",fontSize:13.5,fontWeight:800,borderRadius:11,border:"none",background:state==="working"?"rgba(255,255,255,.06)":C.gradB,color:state==="working"?C.textMuted:"#1a1400",cursor:state==="working"?"default":"pointer"}}>
        {state==="working"?"Working it out…":(res?"Work it out again":"Find the per-lead fee")}</button>
      {msg&&<div style={{fontSize:12,color:state==="error"?C.red:C.textDim,lineHeight:1.5,textAlign:"center"}}>{msg}</div>}

      {state==="done"&&res&&(<>
        {/* The number, and the range around it, because a call needs room to move */}
        <div style={{padding:isDesktop?"16px 18px":"14px",borderRadius:13,background:"linear-gradient(135deg,rgba(200,168,75,0.12),rgba(200,168,75,0.03))",border:`1px solid ${C.borderAccent}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
            <div style={S.f1min}>
              <div style={{fontSize:9.5,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:C.gold,opacity:.75}}>Charge per qualified lead</div>
              <div style={{fontSize:isDesktop?34:29,fontWeight:900,color:C.gold,letterSpacing:"-0.02em",lineHeight:1.15}}>${res.fee}</div>
              <div style={{fontSize:11,color:C.textMuted,marginTop:1}}>Room to move: ${res.feeLow} to ${res.feeHigh}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:10,fontWeight:700,color:(CONF[res.confidence]||CONF.medium).c}}>{(CONF[res.confidence]||CONF.medium).t}</div>
              <div style={{fontSize:9.5,color:C.textMuted,marginTop:2}}>Table said ${res.anchor}{res.anchorIsDefault?" (generic)":""}</div>
            </div>
          </div>
          {onUse&&<button onClick={()=>onUse(res.fee)} style={{marginTop:12,width:"100%",padding:"9px",fontSize:12,fontWeight:800,borderRadius:9,border:"none",backgroundColor:C.green,color:"#04110b",cursor:"pointer"}}>Use ${res.fee}/lead for this client</button>}
        </div>

        {/* The chain, so he can say it out loud without doing sums live */}
        <div style={{padding:"12px 14px",borderRadius:11,backgroundColor:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,marginBottom:8}}>How that number was reached</div>
          {[
            ["One customer is worth", `$${Number(res.jobValue).toLocaleString()}`, res.jobValueBasis],
            ["They close about", `${res.closeRate}% of leads`, "Be conservative here. If they are slow to call back it is lower."],
            ["So one lead is worth", `$${Number(res.leadValue).toLocaleString()}`, "That is expected revenue per qualified lead, not profit."],
            ["Your fee is", res.sharePct!=null?`${res.sharePct}% of that`:"—", "A small slice of what the lead is worth to them."],
            ["They pay Google about", `$${Number(res.cpl).toLocaleString()}/lead`, res.vsCpl!=null?`Your fee is ${res.vsCpl}% on top of that.`:""],
          ].map(([k,v,note],i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,padding:"5px 0",borderTop:i?`1px solid rgba(255,255,255,0.04)`:"none"}}>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:11.5,color:C.textDim}}>{k}</div>
                {note&&<div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.45,marginTop:1}}>{note}</div>}
              </div>
              <div style={{fontSize:13,fontWeight:800,color:C.text,whiteSpace:"nowrap",flexShrink:0}}>{v}</div>
            </div>
          ))}
        </div>

        {/* What it means for the invoice. A fee that never clears the minimum makes the
            performance pitch fiction, and that is worth knowing BEFORE the call. */}
        {res.month&&(
          <div style={{padding:"12px 14px",borderRadius:11,backgroundColor:res.month.atFloor?"rgba(245,158,11,0.07)":"rgba(34,211,160,0.06)",border:`1px solid ${res.month.atFloor?"rgba(245,158,11,0.28)":"rgba(34,211,160,0.22)"}`}}>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:res.month.atFloor?C.amber:C.green,marginBottom:6}}>What a month looks like</div>
            <div style={{fontSize:12,color:C.textDim,lineHeight:1.65}}>
              On {res.month.packageName} at ${Number(res.month.adBudget).toLocaleString()}/mo of ad budget, expect about <strong style={{color:C.text}}>{res.month.leads} qualified leads</strong>, worth <strong style={{color:C.text}}>${Number(res.month.earned).toLocaleString()}</strong> in lead fees against a <strong style={{color:C.text}}>${Number(res.month.floor).toLocaleString()}</strong> minimum.
              {res.month.atFloor
                ? <> That is <strong style={{color:C.amber}}>under the minimum</strong>, so they would pay the minimum and your pricing is effectively flat for them. Either their budget needs to be bigger or the fee does.</>
                : <> They pay <strong style={{color:C.green}}>${Number(res.month.billed).toLocaleString()}</strong>, which is <strong style={{color:C.green}}>{res.month.pctOfSpend}%</strong> of what they spend on ads.</>}
            </div>
          </div>
        )}

        {res.rationale&&(
          <div style={{padding:"12px 14px",borderRadius:11,backgroundColor:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`}}>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,marginBottom:6}}>Say this on the call</div>
            <div style={{fontSize:12.5,color:C.textDim,lineHeight:1.7}}>{res.rationale}</div>
          </div>
        )}
        {res.cautions&&res.cautions.length>0&&(
          <div style={{padding:"11px 13px",borderRadius:11,backgroundColor:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.22)"}}>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.amber,marginBottom:5}}>Check before you quote it</div>
            {res.cautions.map((c,i)=>(<div key={i} style={{fontSize:11.5,color:C.textDim,lineHeight:1.6,marginTop:i?4:0}}>• {c}</div>))}
          </div>
        )}
      </>)}
    </div>
  );
}

function DealPrepScreen({onBack,isDesktop,seed,onSeedUsed}){
  const [form,setForm]=useState({companyName:"",niche:"",website:"",location:"",notes:""});
  const [state,setState]=useState("form"); // form | working | done | error
  const [msg,setMsg]=useState("");
  const [result,setResult]=useState(null);
  const [recent,setRecent]=useState(null); // null = hidden; [] = loaded
  const [nicheFilter,setNicheFilter]=useState("all");
  const [showFee,setShowFee]=useState(false);   // per-lead fee finder, collapsed by default
  const pollRef=useRef(null);
  useEffect(()=>()=>{ if(pollRef.current) clearInterval(pollRef.current); },[]);
  // Lead Scout hands a prospect straight over: prefill the form with everything it
  // already researched so the briefing builds on that instead of starting cold.
  useEffect(()=>{
    if(!seed) return;
    setForm({companyName:seed.companyName||"",niche:seed.niche||"",website:seed.website||"",location:seed.location||"",notes:seed.notes||""});
    setState("form"); setResult(null); setMsg("Prefilled from Lead Scout — add anything you know, then run it.");
    if(onSeedUsed) onSeedUsed();
  },[seed]);
  const authToken=async()=>{ const { data:{ session } }=await supabaseClient.auth.getSession(); return session&&session.access_token; };
  const set=(key)=>(e)=>{ const v=e.target.value; setForm(f=>({...f,[key]:v})); };

  const run=async()=>{
    if(!form.companyName.trim()||!form.niche.trim()){ setMsg("Company name and niche are required."); return; }
    setState("working"); setMsg("Researching the company and building your briefing — this takes about 30–60 seconds."); setResult(null);
    const id="brief-"+uid()+Date.now().toString(36);
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token){ setState("error"); setMsg("Your session expired — refresh the page and try again."); return; }
    fetch("/.netlify/functions/deal-research-background",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({id,...form})}).catch(()=>{});
    const started=Date.now();
    pollRef.current=setInterval(async()=>{
      if(Date.now()-started>240000){ clearInterval(pollRef.current); setState("error"); setMsg("This is taking longer than expected — it may still finish. Try again in a moment."); return; }
      try{
        const r=await fetch("/.netlify/functions/deal-research?action=get&id="+encodeURIComponent(id),{headers:{"Authorization":"Bearer "+token}}).then(x=>x.json());
        if(r&&r.status==="done"&&r.result){ clearInterval(pollRef.current); setResult({...r.result,_prospect:form.companyName}); setState("done"); }
        else if(r&&r.status==="error"){ clearInterval(pollRef.current); setState("error"); setMsg(r.error||"The research run hit an error. Try again."); }
        else if(r&&r.ok===false&&r.error){ clearInterval(pollRef.current); setState("error"); setMsg(/deal_briefs|relation|does not exist|schema cache|could not find/i.test(r.error) ? "Setup needed: the deal_briefs table isn't in Supabase yet. Run the setup SQL (see the deal_briefs table step), then try again." : ("Server error: "+r.error)); }
      }catch{}
    },3000);
  };

  const toggleRecent=async()=>{
    if(recent){ setRecent(null); return; }
    const token=await authToken(); if(!token) return;
    try{ const r=await fetch("/.netlify/functions/deal-research?action=recent",{headers:{"Authorization":"Bearer "+token}}).then(x=>x.json()); setRecent((r&&r.briefs)||[]); }
    catch{ setRecent([]); }
  };
  const openBrief=async(b)=>{
    if(b.status!=="done"){ setState("error"); setMsg(b.status==="error"?"That brief errored out — run it again.":"That brief is still running — give it a moment."); return; }
    const token=await authToken(); if(!token) return;
    try{ const r=await fetch("/.netlify/functions/deal-research?action=get&id="+encodeURIComponent(b.id),{headers:{"Authorization":"Bearer "+token}}).then(x=>x.json());
      if(r&&r.status==="done"&&r.result){ setResult({...r.result,_prospect:(b.input&&b.input.companyName)||"Prospect"}); setState("done"); setRecent(null); } }
    catch{}
  };
  const deleteBrief=async(b)=>{
    if(!window.confirm(`Delete the brief for ${(b.input&&b.input.companyName)||"this prospect"}? This can't be undone.`)) return;
    const token=await authToken(); if(!token) return;
    try{ await fetch("/.netlify/functions/deal-research?action=delete&id="+encodeURIComponent(b.id),{method:"POST",headers:{"Authorization":"Bearer "+token}});
      setRecent(rs=>(rs||[]).filter(x=>x.id!==b.id)); }
    catch{}
  };
  const recentNiches = recent ? [...new Set(recent.map(b=>(b.input&&b.input.niche)||"").filter(Boolean))].sort((a,z)=>a.localeCompare(z)) : [];
  const shownRecent = recent ? recent.filter(b=>nicheFilter==="all"||((b.input&&b.input.niche)||"")===nicheFilter) : [];

  const leadFee=result&&result.nicheLeadFee;
  const recId=result&&result.recommendedPackageId;
  const back = !isDesktop && (
    <button onClick={onBack} style={{width:32,height:32,borderRadius:9,border:"none",background:"rgba(255,255,255,0.05)",color:C.textDim,cursor:"pointer",fontSize:17,flexShrink:0}}>‹</button>
  );

  return (
    <div style={{flex:1,overflowY:"auto",padding:isDesktop?"26px 32px 60px":"16px 14px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
        {back}
        <div>
          <div style={{fontSize:isDesktop?24:19,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>Deal Prep</div>
          <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>Research a prospect and get your pitch before the call.</div>
        </div>
      </div>

      {/* Quick per-lead fee, without waiting on a full brief. The full brief also
          returns a fee, but it takes about a minute and this answers in seconds — which
          is the difference between having a number on a live call and not. */}
      <div style={{maxWidth:640,marginTop:14}}>
        <button onClick={()=>setShowFee(v=>!v)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:12,border:`1px solid ${showFee?C.borderAccent:C.border}`,backgroundColor:showFee?"rgba(200,168,75,0.06)":"rgba(255,255,255,0.03)",cursor:"pointer",textAlign:"left"}}>
          <div style={S.f1min}>
            <div style={{fontSize:13,fontWeight:800,color:C.text}}>What should I charge per lead?</div>
            <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>Type a niche, get a defensible number in seconds</div>
          </div>
          <span style={{fontSize:15,color:C.gold,flexShrink:0,transform:showFee?"rotate(90deg)":"none",transition:"transform .15s"}}>›</span>
        </button>
        {showFee&&(
          <div style={{...card,marginTop:10}}>
            <LeadFeeFinder isDesktop={isDesktop} defaults={{niche:form.niche,company:form.companyName,location:form.location}}/>
          </div>
        )}
      </div>

      {(state==="form"||state==="working"||state==="error")&&(
        <div style={{...card,maxWidth:640,marginTop:14}}>
          <div style={S.col12}>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:"1 1 240px",minWidth:0}}><div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Company name *</div><input value={form.companyName} onChange={set("companyName")} placeholder="e.g. Summit Roofing" style={inp}/></div>
              <div style={{flex:"1 1 240px",minWidth:0}}><div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Industry / niche *</div><input value={form.niche} onChange={set("niche")} placeholder="e.g. Roofing, Med Spa, Personal Injury Law" style={inp}/></div>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:"1 1 240px",minWidth:0}}><div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Website <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div><input value={form.website} onChange={set("website")} placeholder="theircompany.com" style={inp}/></div>
              <div style={{flex:"1 1 240px",minWidth:0}}><div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Location <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div><input value={form.location} onChange={set("location")} placeholder="Phoenix, AZ" style={inp}/></div>
            </div>
            <div><div style={{fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Anything you already know <span style={{color:C.textMuted,fontWeight:500}}>(optional)</span></div><textarea value={form.notes} onChange={set("notes")} placeholder="Owner's name, how you got the lead, budget hints, what they said…" rows={3} style={{...inp,resize:"vertical",fontFamily:"inherit"}}/></div>
            <button onClick={run} disabled={state==="working"} style={{width:"100%",padding:"12px",fontSize:14,fontWeight:800,borderRadius:11,border:"none",background:state==="working"?"rgba(255,255,255,.06)":C.gradB,color:state==="working"?C.textMuted:"#1a1400",cursor:state==="working"?"default":"pointer"}}>{state==="working"?"Researching…":"🎯 Research & Build My Pitch"}</button>
            {msg&&<div style={{fontSize:12,color:state==="error"?C.red:C.textDim,lineHeight:1.5,textAlign:"center"}}>{msg}</div>}
          </div>
        </div>
      )}

      {(state==="form"||state==="error")&&(
        <div style={{maxWidth:640,marginTop:10}}>
          <button onClick={toggleRecent} style={{background:"none",border:"none",color:C.textDim,fontSize:11.5,fontWeight:600,cursor:"pointer",padding:"4px 2px"}}>{recent?"Hide recent briefs":"↺ Pull up a recent brief"}</button>
          {recent&&(recent.length?(<>
            {recentNiches.length>1&&(
              <div style={{display:"flex",alignItems:"center",gap:8,margin:"8px 0 2px"}}>
                <span style={{fontSize:10.5,color:C.textMuted,fontWeight:600,flexShrink:0}}>Filter</span>
                <select value={nicheFilter} onChange={e=>setNicheFilter(e.target.value)} style={{flex:1,minWidth:0,padding:"7px 9px",fontSize:12,borderRadius:8,border:`1px solid ${C.border}`,background:C.bg3,color:C.text,cursor:"pointer"}}>
                  <option value="all">All categories ({recent.length})</option>
                  {recentNiches.map(n=>(<option key={n} value={n}>{n} ({recent.filter(b=>((b.input&&b.input.niche)||"")===n).length})</option>))}
                </select>
              </div>
            )}
            {shownRecent.map(b=>(
              <div key={b.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 11px",borderRadius:9,marginTop:5,border:`1px solid ${C.border}`,background:C.bg3}}>
                <div onClick={()=>openBrief(b)} style={{flex:1,minWidth:0,cursor:"pointer"}}>
                  <div style={{...S.t13b,...S.ovh}}>{(b.input&&b.input.companyName)||"—"}</div>
                  <div style={{fontSize:10.5,color:C.textMuted}}>{(b.input&&b.input.niche)||""}</div>
                </div>
                <span onClick={()=>openBrief(b)} style={{fontSize:11,fontWeight:700,color:b.status==="done"?C.green:b.status==="error"?C.red:C.amber,flexShrink:0,cursor:"pointer"}}>{b.status==="done"?"View ›":b.status}</span>
                <button onClick={()=>deleteBrief(b)} title="Delete brief" style={{flexShrink:0,width:24,height:24,borderRadius:6,border:"none",background:"rgba(255,255,255,.05)",color:C.textMuted,cursor:"pointer",fontSize:12,lineHeight:1}}>✕</button>
              </div>
            ))}
            {!shownRecent.length&&<div style={{fontSize:11,color:C.textMuted,marginTop:6,paddingLeft:2}}>No briefs in this category.</div>}
          </>):<div style={{fontSize:11,color:C.textMuted,marginTop:6,paddingLeft:2}}>No briefs yet.</div>)}
        </div>
      )}

      {state==="done"&&result&&(
        <div style={{maxWidth:720,marginTop:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{fontSize:13,color:C.textDim}}>Briefing for <span style={{color:C.text,fontWeight:700}}>{result._prospect}</span></div>
            <button onClick={()=>{setState("form");setResult(null);setMsg("");}} style={{marginLeft:"auto",padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>+ New prospect</button>
          </div>
          <div style={{...card}}>{briefMdToNodes(result.brief)}</div>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.gold,margin:"22px 0 10px"}}>Packages {leadFee?`· $${leadFee}/lead for this niche`:""}</div>
          {[["Google Ads","google"],["Meta Ads","meta"],["Google + Meta","combined"],["E-commerce","ecom"]].map(([label,key])=>(
            <div key={key} style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,color:C.textMuted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>{label}</div>
              {(PACKAGES_DB[key]||[]).map(pkg=>{ const rec=pkg.id===recId; return (
                <div key={pkg.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 11px",borderRadius:9,marginBottom:5,border:`1px solid ${rec?C.gold+"66":C.border}`,background:rec?"rgba(200,168,75,0.08)":C.bg3}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                      <span style={{fontSize:12.5,fontWeight:700,color:C.text}}>{pkg.name}</span>
                      {rec&&<span style={{fontSize:8.5,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:"#1a1400",background:C.gradB,padding:"2px 6px",borderRadius:5}}>★ Recommended</span>}
                    </div>
                    <div style={{fontSize:10.5,color:C.textMuted,marginTop:2}}>ad spend {pkg.adSpend}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:13,fontWeight:800,color:rec?C.gold:C.text}}>${pkg.price}<span style={{fontSize:9,fontWeight:600,color:C.textMuted}}>/mo min</span></div>
                    <div style={{fontSize:9.5,color:C.textMuted}}>${pkg.setup} setup{pkg.leadFee&&leadFee?` · $${leadFee}/lead`:""}</div>
                  </div>
                </div>
              );})}
            </div>
          ))}
          <div style={{fontSize:10.5,color:C.textMuted,lineHeight:1.5,marginTop:4}}>AI research — verify anything you'll quote on the call. Per-lead fees are starter estimates; adjust as you like.</div>
        </div>
      )}
    </div>
  );
}
