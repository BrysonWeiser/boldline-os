        background:"linear-gradient(135deg,rgba(200,168,75,0.14),rgba(79,142,247,0.06))",
        border:"1px solid rgba(200,168,75,0.28)",borderRadius:14,padding:"14px 16px",marginBottom:14}}>
        <span style={{fontSize:22,flexShrink:0}}>🚀</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:800,color:C.text,letterSpacing:"-0.01em"}}>My Ads — BoldLine Media</div>
          <div style={{fontSize:11,color:C.textMuted,marginTop:2,lineHeight:1.5}}>{hasMyAccount?"Run & manage your own campaigns, landing pages, and leads.":"Set up your own house account to run ads for BoldLine."}</div>
        </div>
        <span style={{fontSize:11,fontWeight:700,color:C.gold,whiteSpace:"nowrap",flexShrink:0}}>{hasMyAccount?"Open ›":"Set up ›"}</span>
      </button>

      {/* Urgent alerts — payment/billing failures first: a client not paying is
         the most urgent business alert, so it leads the dashboard (matches the
         red billing alert getAlerts already raises on past_due / ETF owed). */}
      {clients.flatMap(cl=>getAlerts(cl)
        .filter(a=>a.severity==="red"&&(a.type==="billing_late"||a.type==="billing_interest"||a.type==="etf_due"))
        .map(a=>({cl,a})))
        .map(({cl,a})=>(
        <div key={`${cl.id}|${a.type}`} onClick={()=>onSelect(cl)} style={{marginBottom:8,padding:"11px 13px",borderRadius:11,backgroundColor:"rgba(239,68,68,.07)",border:`1px solid ${C.red}33`,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>{a.type==="etf_due"?"⛔":"💳"}</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.text}}>{cl.name}</div><div style={{fontSize:11,color:C.red}}>{a.msg}</div></div>
          <span style={{fontSize:16,color:C.textMuted}}>›</span>
        </div>
      ))}
      {expiring.map(cl=>{
        const d=daysUntil(cl.contractEnd);
        return <div key={cl.id} onClick={()=>onSelect(cl)} style={{marginBottom:8,padding:"11px 13px",borderRadius:11,backgroundColor:d<=7?"rgba(239,68,68,.07)":"rgba(245,158,11,.07)",border:`1px solid ${d<=7?C.red:C.amber}33`,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>{d<=7?"🔴":"🟡"}</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.text}}>{cl.name}</div><div style={{fontSize:11,color:d<=7?C.red:C.amber}}>Contract expires in {d} day{d!==1?"s":""} — {d<=7?"urgent renewal needed":"start renewal conversation"}</div></div>
          <span style={{fontSize:16,color:C.textMuted}}>›</span>
        </div>;
      })}
      {clients.filter(c=>c.upgradeRequest).map(cl=>(
        <div key={cl.id} onClick={()=>onSelect(cl)} style={{marginBottom:8,padding:"11px 13px",borderRadius:11,backgroundColor:`${C.purple}08`,border:`1px solid ${C.purple}33`,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>⬆️</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.text}}>{cl.name}</div><div style={{fontSize:11,color:C.purple}}>Upgrade requested — review and send invoice</div></div>
          <span style={{fontSize:16,color:C.textMuted}}>›</span>
        </div>
      ))}

      {/* Add client */}
      <button onClick={onAdd} style={{width:"100%",padding:"13px",fontSize:13,fontWeight:700,
        borderRadius:12,border:`1px dashed rgba(200,168,75,0.3)`,
        backgroundColor:"rgba(200,168,75,0.04)",color:C.gold,cursor:"pointer",marginBottom:14,
        display:"flex",alignItems:"center",justifyContent:"center",gap:8,letterSpacing:"0.01em"}}>
        <span style={{fontSize:20,lineHeight:1}}>+</span> Add New Client
      </button>

      {/* Demo client — only offered while there are no clients at all, so it stops
          cluttering the screen the moment a real one exists. */}
      {clients.length===0&&onAddDemo&&(
        <button onClick={onAddDemo} style={{width:"100%",padding:"11px",fontSize:12,fontWeight:600,
          borderRadius:12,border:`1px dashed ${C.border}`,backgroundColor:"transparent",
          color:C.textMuted,cursor:"pointer",marginBottom:14,
          display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          Load a demo client to look around
        </button>
      )}

      {/* ── SEARCH BAR ── */}
      <div style={{position:"relative",marginBottom:8}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2" strokeLinecap="round"
          style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          value={search}
          onChange={e=>setSearch(e.target.value)}
          placeholder="Search clients by name, niche, or package…"
          style={{...inp, paddingLeft:32, fontSize:13}}
        />
        {search&&(
          <button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.textMuted,cursor:"pointer",fontSize:16,lineHeight:1}}>✕</button>
        )}
      </div>

      {/* ── FILTER + SORT ROW ── */}
      <div style={{display:"flex",gap:7,marginBottom:12,alignItems:"center"}}>
        <button
          onClick={()=>setShowF(p=>!p)}
          style={{display:"flex",alignItems:"center",gap:5,padding:"6px 11px",fontSize:11,fontWeight:700,
            borderRadius:8,border:`1px solid ${hasActiveFilters?C.gold:C.border}`,
            backgroundColor:hasActiveFilters?C.goldDim:"rgba(255,255,255,0.03)",
            color:hasActiveFilters?C.gold:C.textMuted,cursor:"pointer",flexShrink:0}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
          </svg>
          Filter{hasActiveFilters?" ●":""}
        </button>
        {/* Sort chips */}
        <div style={{display:"flex",gap:5,overflowX:"auto",flex:1}}>
          {[["name","A–Z"],["health","Health"],["leads","Leads"],["expiry","Expiry"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSortBy(k)} style={{
              padding:"5px 10px",fontSize:10,fontWeight:700,borderRadius:20,flexShrink:0,
              border:`1px solid ${sortBy===k?C.gold:C.border}`,
              backgroundColor:sortBy===k?C.goldDim:"transparent",
              color:sortBy===k?C.gold:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"
            }}>{l}</button>
          ))}
        </div>
        {hasActiveFilters&&(
          <button onClick={clearAll} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,0.03)",color:C.textMuted,cursor:"pointer",flexShrink:0}}>Clear</button>
        )}
      </div>

      {/* ── FILTER PANEL (collapsible) ── */}
      {showFilters&&(
        <div style={{backgroundColor:C.bg3,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px",marginBottom:12,display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,marginBottom:7}}>Stage</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {[["all","All Stages"],...STAGES.map(s=>[s.id,s.label])].map(([k,l])=>(
                <button key={k} onClick={()=>setStageF(k)} style={{
                  padding:"4px 10px",fontSize:10,fontWeight:700,borderRadius:20,
                  border:`1px solid ${stageFilter===k?((STAGES.find(s=>s.id===k) && STAGES.find(s=>s.id===k).color)||C.gold):C.border}`,
                  backgroundColor:stageFilter===k?`${(STAGES.find(s=>s.id===k) && STAGES.find(s=>s.id===k).color)||C.gold}18`:"transparent",
                  color:stageFilter===k?((STAGES.find(s=>s.id===k) && STAGES.find(s=>s.id===k).color)||C.gold):C.textMuted,
                  cursor:"pointer",whiteSpace:"nowrap"
                }}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,marginBottom:7}}>Niche</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {[["all","All Niches"],...[...new Set(clients.map(c=>c.niche).filter(Boolean))].sort((a,z)=>String(a).localeCompare(String(z))).map(n=>[n,n])].map(([k,l])=>(
                <button key={k} onClick={()=>setNicheF(k)} style={{
                  padding:"4px 10px",fontSize:10,fontWeight:700,borderRadius:20,
                  border:`1px solid ${nicheFilter===k?C.gold:C.border}`,
                  backgroundColor:nicheFilter===k?C.goldDim:"transparent",
                  color:nicheFilter===k?C.gold:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"
                }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── CLIENT LIST HEADER ── */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".09em",color:C.textMuted,opacity:.7}}>
          {filtered.length===clients.length
            ? `${clients.length} Client${clients.length!==1?"s":""}`
            : `${filtered.length} of ${clients.length} Clients`}
        </div>
        <div style={{width:60,height:1,background:"linear-gradient(90deg,rgba(200,168,75,0.3),transparent)"}}/>
      </div>

      {/* ── EMPTY STATE ── */}
      {filtered.length===0&&(
        <div style={{textAlign:"center",padding:"40px 20px",color:C.textMuted}}>
          <div style={{fontSize:28,marginBottom:10}}>🔍</div>
          <div style={{fontSize:14,fontWeight:700,color:C.textDim,marginBottom:6}}>No clients found</div>
          <div style={{fontSize:12,lineHeight:1.7}}>
            {search?`No results for "${search}".`:"No clients match the selected filters."}
            {" "}<button onClick={clearAll} style={{background:"none",border:"none",color:C.gold,cursor:"pointer",fontSize:12,fontWeight:700}}>Clear filters</button>
          </div>
        </div>
      )}

      {/* ── CLIENT CARDS ── (grid on desktop, single column on mobile) */}
      <div style={isDesktop
        ? {display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:12,alignItems:"start"}
        : {display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(cl=>{
          const pkg=findPkg(cl.packageId);
          const alerts=getAlerts(cl);
          const stage=stageInfo(cl.stage);
          const days=daysUntil(cl.contractEnd);
          const health=calcHealth(cl);
          return (
            <button key={cl.id} onClick={()=>onSelect(cl)} className="os-card" style={{
              width:"100%",height:isDesktop?"100%":undefined,textAlign:"left",cursor:"pointer",
              backgroundColor:C.bg2,
              border:`1px solid ${alerts.some(a=>a.severity==="red")?"rgba(248,113,113,0.2)":C.border}`,
              borderRadius:14,padding:"14px 15px",
            }}>
              {/* Top row: avatar, name, alert badge, chevron */}
              <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:10}}>
                <div style={{width:42,height:42,borderRadius:12,
                  background:`linear-gradient(135deg,${stage.color}33,${stage.color}11)`,
                  border:`1px solid ${stage.color}33`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:16,fontWeight:900,color:stage.color,flexShrink:0}}>
                  {cl.name[0]}
                </div>
                <div style={S.f1min}>
                  <div style={{fontSize:14,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",letterSpacing:"-0.01em"}}>
                    {cl.name}
                    {cl.demo&&<span style={{fontSize:9,fontWeight:800,letterSpacing:".08em",padding:"1px 5px",marginLeft:6,borderRadius:3,border:`1px solid ${C.border}`,color:C.textMuted,verticalAlign:"middle"}}>DEMO</span>}
                  </div>
                  <div style={{fontSize:11,color:C.textMuted,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(pkg && pkg.platform)} · {(pkg && pkg.name)}</div>
                </div>
                <AlertBadge alerts={alerts}/>
                <IconChevron size={14} color={C.textMuted}/>
              </div>
              {/* Bottom meta row */}
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <Chip label={stage.label} color={stage.color} small/>
                <span style={{width:3,height:3,borderRadius:"50%",backgroundColor:C.textMuted,display:"inline-block"}}/>
                <span style={{fontSize:10,fontWeight:600,color:healthColor(health)}}>⬡ {health.toFixed(1)}/10</span>
                {cl.leads>0&&(
                  <>
                    <span style={{width:3,height:3,borderRadius:"50%",backgroundColor:C.textMuted,display:"inline-block"}}/>
                    <span style={{fontSize:10,color:C.textMuted}}>{cl.leads} leads · ${cl.cpl}/CPL</span>
                  </>
                )}
                {days<=30&&days>=0&&(
                  <>
                    <span style={{width:3,height:3,borderRadius:"50%",backgroundColor:C.textMuted,display:"inline-block"}}/>
                    <span style={{fontSize:10,color:days<=7?C.red:C.amber,fontWeight:700}}>{days}d left</span>
                  </>
                )}
                {cl.upgradeRequest&&(
                  <>
                    <span style={{width:3,height:3,borderRadius:"50%",backgroundColor:C.textMuted,display:"inline-block"}}/>
                    <span style={{fontSize:10,color:C.purple,fontWeight:700}}>Upgrade pending</span>
                  </>
                )}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── REVENUE SCREEN ──────────────────────────────────────────────────────────
// Bryson, 2026-08-18: "track how much I am making per month or maybe the previous month
// based on the invoices sent since we now dont have a monthly recurring revenue."
//
// WHY THIS WAS REBUILT. It used to add up package prices and call the total "Monthly
// Recurring Revenue". Under the greater-of pricing model a package price is a FLOOR:
// a good month bills more than it, and no month bills less. So that number was never
// what he earned, and after the pricing change it stopped even being a decent guess.
//
// The real figure lives in Stripe, so it is read from Stripe. Reconstructing it from the
// OS's own records would drift the first time an invoice was voided, refunded, or paid
// late. The floor is still shown, clearly labelled as the floor, because it is the one
// number he CAN count on next month.
function RevenueScreen({clients,onSelect,onBack,isDesktop}) {
  const [data,setData]=useState(null);      // null = loading, [] = loaded empty
  const [err,setErr]=useState("");
  const [openMonth,setOpenMonth]=useState(null);

  const load=useCallback(async()=>{
    setErr("");
    try{ const d=await stripeBilling("revenue",{months:6}); setData((d&&d.months)||[]); }
    catch(e){ setErr(e.message||"Could not load revenue."); setData([]); }
  },[]);
  useEffect(()=>{ load(); },[load]);

  // The floor: what BoldLine bills next month even if not a single lead comes in.
  // Demo and internal accounts are excluded — they are not customers.
  const real = clients.filter(c=>!c.demo&&!c.internal);
  const floorRows = real
    .map(cl=>{ const pkg=findPkg(cl.packageId); return {cl,pkg,floor:(cl.billingMonthly!=null?cl.billingMonthly:((pkg&&pkg.price)||0)),setup:(pkg&&pkg.setup)||0}; })
    .sort((a,b)=>b.floor-a.floor);
  const floorTotal = floorRows.reduce((s,r)=>s+r.floor,0);
  const paying = floorRows.filter(r=>r.floor>0).length;

  const monthLabel=(key)=>{
    const [y,m]=String(key||"").split("-");
    const d=new Date(Date.UTC(Number(y),Number(m)-1,1));
    return d.toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
  };
  const cur  = data&&data[0];
  const prev = data&&data[1];
  // Only compare against a FINISHED month. Comparing a half-finished month to a whole
  // one always reads as a collapse, which is the kind of number that ruins a morning
  // for no reason.
  const done = data ? data.filter(m=>!m.isCurrent) : [];
  const avg  = done.length ? Math.round(done.reduce((s,m)=>s+m.net,0)/done.length) : 0;
  const trend = (prev&&prev.net>0&&done.length>1)
    ? Math.round(((done[0].net-done[1].net)/done[1].net)*100) : null;
  const money0=(n)=>"$"+Math.round(Number(n)||0).toLocaleString();

  const tile=(label,value,sub,color)=>(
    <div style={{flex:"1 1 150px",minWidth:0,padding:"13px 15px",borderRadius:13,backgroundColor:C.bg2,border:`1px solid ${C.border}`}}>
      <div style={{fontSize:9.5,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted}}>{label}</div>
      <div style={{fontSize:isDesktop?23:20,fontWeight:900,color:color||C.text,letterSpacing:"-0.02em",lineHeight:1.2,marginTop:3}}>{value}</div>
      {sub&&<div style={{fontSize:10.5,color:C.textMuted,marginTop:2,lineHeight:1.45}}>{sub}</div>}
    </div>
  );

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{borderBottom:`1px solid ${C.border}`,flexShrink:0,backgroundColor:C.bg2}}>
        <div style={{padding:isDesktop?"18px 32px":"12px 14px",display:"flex",alignItems:"center",gap:10}}>
          {!isDesktop&&<button onClick={onBack} style={{width:32,height:32,borderRadius:9,background:"rgba(255,255,255,0.05)",
            border:`1px solid ${C.border}`,color:C.textDim,fontSize:16,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>‹</button>}
          <div style={S.f1min}>
            <div style={{fontSize:isDesktop?22:15,fontWeight:800,color:C.text,letterSpacing:"-0.01em",lineHeight:1.1}}>Revenue</div>
            <div style={{fontSize:isDesktop?11:10,color:C.textMuted,letterSpacing:"0.05em",textTransform:"uppercase",marginTop:2}}>What you actually invoiced</div>
          </div>
          <button onClick={load} style={{padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",flexShrink:0}}>{data===null?"…":"Refresh"}</button>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:isDesktop?"20px 32px 60px":"14px 14px 100px"}}>
        {/* ── This month, headline ──────────────────────────────────────────── */}
        <div className="os-card" style={{background:"linear-gradient(135deg,rgba(200,168,75,0.12),rgba(200,168,75,0.04))",
          border:"1px solid rgba(200,168,75,0.2)",borderRadius:16,padding:isDesktop?"20px 22px":"17px 18px",marginBottom:12,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,borderRadius:"50%",
            background:"radial-gradient(circle,rgba(200,168,75,0.12),transparent 70%)"}}/>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:C.gold,marginBottom:4,opacity:.8}}>
            {cur?monthLabel(cur.month):"This month"} · so far
          </div>
          <div style={{fontSize:isDesktop?34:29,fontWeight:900,color:C.gold,letterSpacing:"-0.02em",lineHeight:1,marginBottom:5}}>
            {data===null?"…":money0(cur?cur.net:0)}
          </div>
          <div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.55}}>
            {data===null?"Reading your invoices…"
              :cur&&cur.outstanding>0
                ? <>{money0(cur.collected)} collected, {money0(cur.outstanding)} still unpaid across {cur.invoices} invoice{cur.invoices===1?"":"s"}.</>
                : cur&&cur.invoices>0 ? <>All {cur.invoices} invoice{cur.invoices===1?"":"s"} paid.</>
                : <>Nothing invoiced yet this month.</>}
          </div>
        </div>

        {err&&<div style={{fontSize:11.5,color:C.amber,lineHeight:1.6,marginBottom:12,padding:"11px 13px",borderRadius:11,backgroundColor:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.22)"}}>
          Could not read Stripe: {err} The floor below still works, it comes from your own records.
        </div>}

        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
          {tile("Last full month", data===null?"…":money0(done[0]?done[0].net:0),
            done[0]?monthLabel(done[0].month):"No finished month yet",
            trend!=null?(trend>=0?C.green:C.red):C.text)}
          {tile("Average month", data===null?"…":money0(avg),
            done.length?`Across ${done.length} finished month${done.length===1?"":"s"}`:"Needs a finished month",C.text)}
          {/* The one number he can count on, kept visually separate from earned money
              so the two can never be read as the same thing. */}
          {tile("Guaranteed floor", money0(floorTotal),
            `${paying} client${paying===1?"":"s"} on a minimum. Every month bills at least this.`,C.textDim)}
        </div>

        {trend!=null&&(
          <div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.6,marginBottom:14,padding:"11px 13px",borderRadius:11,backgroundColor:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`}}>
            {trend>=0
              ? <>Up <strong style={{color:C.green}}>{trend}%</strong> on the month before. </>
              : <>Down <strong style={{color:C.red}}>{Math.abs(trend)}%</strong> on the month before. </>}
            Only finished months are compared, so a part-way month never looks like a crash.
          </div>
        )}

        {/* ── Month by month, expandable to per-client ──────────────────────── */}
        <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,margin:"0 0 8px 2px"}}>Month by month</div>
        {data===null
          ? <div style={{textAlign:"center",color:C.textMuted,fontSize:12.5,padding:"26px 0"}}>Loading…</div>
          : data.length===0
          ? <div style={{textAlign:"center",color:C.textMuted,fontSize:12.5,padding:"26px 0",lineHeight:1.7}}>No invoices yet. Once a client is set up on billing, every month you invoice shows up here.</div>
          : <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {data.map(m=>{
                const open=openMonth===m.month;
                const peak=Math.max(1,...data.map(x=>x.net));
                return (
                  <div key={m.month} style={{backgroundColor:C.bg2,border:`1px solid ${open?C.borderAccent:C.border}`,borderRadius:12,overflow:"hidden"}}>
                    <button onClick={()=>setOpenMonth(open?null:m.month)} style={{width:"100%",textAlign:"left",padding:"12px 14px",background:"none",border:"none",cursor:"pointer"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={S.f1min}>
                          <div style={{fontSize:13.5,fontWeight:700,color:C.text}}>
                            {monthLabel(m.month)}{m.isCurrent&&<span style={{fontSize:9,fontWeight:800,letterSpacing:".07em",padding:"1px 5px",marginLeft:7,borderRadius:3,border:`1px solid ${C.border}`,color:C.textMuted,verticalAlign:"middle"}}>IN PROGRESS</span>}
                          </div>
                          <div style={{fontSize:10.5,color:C.textMuted,marginTop:2}}>
                            {m.invoices===0?"No invoices":`${m.invoices} invoice${m.invoices===1?"":"s"}`}
                            {m.outstanding>0?` · ${money0(m.outstanding)} unpaid`:""}
                            {m.refunded>0?` · ${money0(m.refunded)} refunded`:""}
                          </div>
                        </div>
                        <div style={{textAlign:"right",flexShrink:0}}>
                          <div style={{fontSize:16,fontWeight:800,color:m.net>0?C.gold:C.textMuted,lineHeight:1}}>{money0(m.net)}</div>
                        </div>
                        <span style={{fontSize:15,color:C.textMuted,flexShrink:0,transform:open?"rotate(90deg)":"none",transition:"transform .15s"}}>›</span>
                      </div>
                      <div style={{height:4,backgroundColor:C.border2,borderRadius:2,overflow:"hidden",marginTop:9}}>
                        <div style={{height:"100%",width:`${Math.round((m.net/peak)*100)}%`,backgroundColor:C.gold,opacity:.55,borderRadius:2}}/>
                      </div>
                    </button>
                    {open&&(
                      <div style={{padding:"0 14px 12px"}}>
                        {m.clients.length===0
                          ? <div style={{fontSize:11.5,color:C.textMuted,paddingTop:4}}>Nothing invoiced this month.</div>
                          : m.clients.map((c,i)=>(
                              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,padding:"7px 0",borderTop:`1px solid rgba(255,255,255,0.04)`}}>
                                <span style={{fontSize:12,color:C.textDim,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                                <span style={{fontSize:12,fontWeight:700,color:C.text,whiteSpace:"nowrap",flexShrink:0}}>
                                  {money0(c.collected)}
                                  {c.outstanding>0&&<span style={{color:C.amber,fontWeight:600}}> +{money0(c.outstanding)} due</span>}
                                </span>
                              </div>
                            ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>}

        {/* ── The floor, per client ─────────────────────────────────────────── */}
        <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textMuted,margin:"0 0 3px 2px"}}>Guaranteed floor by client</div>
        <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,margin:"0 0 9px 2px"}}>
          The minimum each client pays even in a dead month. Lead fees only add to the bill once they pass it, so a good month lands above these numbers, never below.
        </div>
        {floorRows.length===0
          ? <div style={{textAlign:"center",color:C.textMuted,fontSize:13,padding:"30px 0"}}>No clients yet.</div>
          : <div style={isDesktop?{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:10}:{display:"flex",flexDirection:"column",gap:8}}>
            {floorRows.map(({cl,pkg,floor,setup})=>{
              const share = floorTotal>0 ? Math.round((floor/floorTotal)*100) : 0;
              return (
                <button key={cl.id} onClick={()=>onSelect(cl)} className="os-card" style={{textAlign:"left",width:"100%",cursor:"pointer",
                  backgroundColor:C.bg2,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px",display:"block"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cl.name}</div>
                      <div style={{fontSize:11,color:C.textMuted,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        {pkg?`${pkg.name} · ${pkg.platform}`:"No package"}
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:16,fontWeight:800,color:floor>0?C.gold:C.textMuted,lineHeight:1}}>${floor.toLocaleString()}<span style={{fontSize:10,fontWeight:400,color:C.textMuted}}>/mo min</span></div>
                      {setup>0&&<div style={{fontSize:10,color:C.textMuted,marginTop:2}}>${setup.toLocaleString()} setup</div>}
                    </div>
                    <span style={{fontSize:16,color:C.textMuted,flexShrink:0}}>›</span>
                  </div>
                  <div style={{height:4,backgroundColor:C.border2,borderRadius:2,overflow:"hidden",marginTop:9}}>
                    <div style={{height:"100%",width:`${share}%`,backgroundColor:C.gold,opacity:.55,borderRadius:2}}/>
                  </div>
                </button>
              );
            })}
            </div>}
      </div>
    </div>
  );
}

// ─── STAT SEGMENT SCREEN ─────────────────────────────────────────────────────
// Opened by tapping the Alerts / Expiring / Clients tiles on the dashboard.
// One screen, three modes — each lists the clients in that category and taps
// through to the client hub.
function SegmentScreen({mode,clients,onSelect,onBack,isDesktop}) {
  const MODES = {
    alerts:  { title:"Clients with Alerts",  sub:"Active alerts across all clients" },
    expiring:{ title:"Expiring Contracts",   sub:"Contracts ending within 30 days" },
    clients: { title:"All Clients",          sub:"Full roster" },
  };
  const meta = MODES[mode]||MODES.clients;

  let rows;
  if (mode==="alerts") {
    rows = clients.map(cl=>({cl,alerts:getAlerts(cl)})).filter(r=>r.alerts.length>0)
      .sort((a,b)=>{
        const red = (r)=>r.alerts.some(x=>x.severity==="red")?1:0;
        return red(b)-red(a) || b.alerts.length-a.alerts.length;
      });
  } else if (mode==="expiring") {
    rows = clients.map(cl=>({cl,days:daysUntil(cl.contractEnd)})).filter(r=>r.days>=0&&r.days<=30)
      .sort((a,b)=>a.days-b.days);
  } else {
    rows = clients.map(cl=>({cl})).sort((a,b)=>a.cl.name.localeCompare(b.cl.name));
  }

  const EMPTY = {
    alerts:  {icon:"✅", msg:"No active alerts — every client is running clean."},
    expiring:{icon:"🗓️", msg:"No contracts expiring in the next 30 days."},
    clients: {icon:"👥", msg:"No clients yet."},
  }[mode]||{icon:"—",msg:"Nothing here."};

  const sevColor = (s)=>s==="red"?C.red:s==="blue"?C.purple:C.amber;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Header bar */}
      <div style={{borderBottom:`1px solid ${C.border}`,flexShrink:0,backgroundColor:C.bg2}}>
        <div style={{padding:isDesktop?"18px 32px":"12px 14px",display:"flex",alignItems:"center",gap:10}}>
          <button onClick={onBack} style={{width:32,height:32,borderRadius:9,background:"rgba(255,255,255,0.05)",
            border:`1px solid ${C.border}`,color:C.textDim,fontSize:16,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            ‹
          </button>
          <div>
            <div style={{fontSize:isDesktop?22:15,fontWeight:800,color:C.text,letterSpacing:"-0.01em",lineHeight:1.1}}>{meta.title}</div>
            <div style={{fontSize:isDesktop?11:10,color:C.textMuted,letterSpacing:"0.05em",textTransform:"uppercase",marginTop:2}}>{meta.sub} · {rows.length}</div>
          </div>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:isDesktop?"20px 32px 60px":"14px 14px 100px"}}>
        {rows.length===0
          ? <div style={{textAlign:"center",padding:"56px 20px"}}>
              <div style={{fontSize:30,marginBottom:10}}>{EMPTY.icon}</div>
              <div style={{fontSize:13,color:C.textDim,lineHeight:1.6}}>{EMPTY.msg}</div>
            </div>
          : <div style={isDesktop?{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:10,alignItems:"start"}:{display:"flex",flexDirection:"column",gap:8}}>
            {rows.map((r)=>{
              const cl=r.cl, pkg=findPkg(cl.packageId), stage=stageInfo(cl.stage), health=calcHealth(cl);
              return (
                <button key={cl.id} onClick={()=>onSelect(cl)} className="os-card" style={{textAlign:"left",width:"100%",height:isDesktop?"100%":undefined,cursor:"pointer",
                  backgroundColor:C.bg2,border:`1px solid ${mode==="alerts"&&r.alerts.some(a=>a.severity==="red")?"rgba(248,113,113,0.25)":mode==="expiring"&&r.days<=7?"rgba(248,113,113,0.25)":C.border}`,
                  borderRadius:12,padding:"12px 14px",display:"block"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cl.name}</div>
                      <div style={{fontSize:11,color:C.textMuted,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        {pkg?`${pkg.name} · ${pkg.platform}`:"No package"}
                      </div>
                    </div>
                    {mode==="expiring"&&(
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:800,color:r.days<=7?C.red:C.amber,lineHeight:1}}>{r.days}d left</div>
                        <div style={{fontSize:10,color:C.textMuted,marginTop:2}}>ends {cl.contractEnd||"—"}</div>
                      </div>
                    )}
                    {mode==="clients"&&(
                      <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                        <Chip label={stage.label} color={stage.color} small/>
                        <span style={{fontSize:10,fontWeight:600,color:healthColor(health)}}>⬡ {health.toFixed(1)}</span>
                      </div>
                    )}
                    {mode==="alerts"&&(
                      <span style={{flexShrink:0,minWidth:20,height:20,borderRadius:10,backgroundColor:r.alerts.some(a=>a.severity==="red")?C.red:C.amber,
                        color:"#0a0800",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 6px"}}>{r.alerts.length}</span>
                    )}
                    <span style={{fontSize:16,color:C.textMuted,flexShrink:0}}>›</span>
                  </div>
                  {mode==="alerts"&&r.alerts.map((a,i)=>(
                    <div key={i} style={{marginTop:7,padding:"7px 10px",borderRadius:9,
                      backgroundColor:a.severity==="red"?"rgba(248,113,113,.07)":a.severity==="blue"?"rgba(139,92,246,.07)":"rgba(251,191,36,.07)",
                      border:`1px solid ${sevColor(a.severity)}30`,
                      fontSize:11,color:sevColor(a.severity),fontWeight:600,display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:12}}>{a.severity==="red"?"⚠":"ℹ"}</span>{a.msg}
                    </div>
                  ))}
                </button>
              );
            })}
            </div>}
      </div>
    </div>
  );
}

// ─── CLIENT HUB ──────────────────────────────────────────────────────────────
// ─── CLIENT EMAIL CENTER ──────────────────────────────────────────────────────
// The "Emails" tab: send polished, on-brand (dark-theme) lifecycle emails to a
// client with one click — welcome/portal, ad-account access, invoice, receipt,
// past-due, renewal, thank-you. Client specifics auto-fill; every email can be
// previewed (rendered in an iframe), edited (VisualEditor + subject), reset, or
// sent. Templates + sending live server-side (netlify/functions/client-email.mjs
// → client-emails-shared.mjs) so there's one source of truth for the branding.
function EmailCenterTab({client,pkg,onUpdate}) {
  const [types,setTypes]=useState([]);
  const [loadingTypes,setLoadingTypes]=useState(true);
  const [open,setOpen]=useState(null);   // {type, subject, html, mode:"preview"|"edit", dirty}
  const [busy,setBusy]=useState(false);
  const [sentId,setSentId]=useState(null);
  const [msg,setMsg]=useState("");
  const [payUrl,setPayUrl]=useState("");   // real Stripe hosted-invoice URL for the invoice email

  const buildCtx=()=>{
    // Leads to bill this cycle = delivered, not yet billed, not excluded (same set
    // the Billing card totals). Feeds the invoice email's per-lead line.
    const perLeadRate = client.billingPerLead!=null ? client.billingPerLead : (PER_LEAD[client.niche]||0);
    const leadCount = (client.leadsLog||[]).filter(l=>!l.billed && !l.notBillable).length;
    return {
      businessName: client.name||"",
      contactName: client.contactName||"",
      packageName: (pkg&&pkg.name)||"",
      monthly: client.billingMonthly!=null?client.billingMonthly:((pkg&&pkg.price)||0),
      setup: client.billingSetup!=null?client.billingSetup:((pkg&&pkg.setup)||0),
      leadCount, leadRate: perLeadRate, leadTotal: leadCount*perLeadRate,
      portalUrl: client.portalToken?`${window.location.origin}/portal?token=${client.portalToken}`:"",
      payUrl: payUrl || client.billingCheckoutUrl || "",
      date: fmt(new Date()),
    };
  };

  const call=async(action,extra)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh and log in again.");
    const r=await fetch("/.netlify/functions/client-email",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"Request failed.");
    return d;
  };

  useEffect(()=>{ (async()=>{ try{ const d=await call("types"); setTypes(d.types||[]); }catch(e){ setMsg(e.message); } setLoadingTypes(false); })(); },[]);
  // Resolve a real Stripe pay link for the invoice email: hosted invoice URL
  // (pay page + scan-to-pay QR) → else the Checkout link → else the portal (in template).
  useEffect(()=>{ (async()=>{
    try{
      if(client.stripeCustomerId){ const d=await stripeBilling("invoice-link",{customerId:client.stripeCustomerId}); setPayUrl((d&&d.url)||client.billingCheckoutUrl||""); }
      else { setPayUrl(client.billingCheckoutUrl||""); }
    }catch(e){ setPayUrl(client.billingCheckoutUrl||""); }
  })(); },[client.stripeCustomerId,client.billingCheckoutUrl]);

  const preview=async(t)=>{
    setBusy(true); setMsg("");
    try{ const d=await call("render",{type:t.id,ctx:buildCtx()}); setOpen({type:t,subject:d.subject,html:d.html,mode:"preview",dirty:false}); }
    catch(e){ setMsg(e.message); }
    setBusy(false);
  };
  const resetToDefault=async()=>{
    if(!open) return; setBusy(true);
    try{ const d=await call("render",{type:open.type.id,ctx:buildCtx()}); setOpen(o=>({...o,subject:d.subject,html:d.html,dirty:false})); }
    catch(e){ setMsg(e.message); }
    setBusy(false);
  };
  const send=async()=>{
    if(!open) return;
    if(!client.email){ setMsg("Add the client's email on the Overview tab first."); return; }
    setBusy(true); setMsg("");
    try{
      await call("send",{to:client.email,subject:open.subject,html:open.html});
      onUpdate&&onUpdate({...client,commLog:[{date:fmt(new Date()),note:`Sent "${open.type.label}" email to ${client.email}`,cat:"update",ts:Date.now()},...(client.commLog||[])]});
      setSentId(open.type.id); setMsg(`✓ Sent "${open.type.label}" to ${client.email}`); setOpen(null);
      setTimeout(()=>setSentId(null),4000);
    }catch(e){ setMsg("Send failed: "+e.message); }
    setBusy(false);
  };

  return (
    <div>
      <div style={{fontSize:12,color:C.textDim,lineHeight:1.6,marginBottom:14}}>
        Send polished, on-brand emails to <b style={{color:C.text}}>{client.name}</b> — client details fill in automatically. Preview it, tweak the wording if you want, then send with one click.
      </div>
      {!client.email&&(
        <div style={{fontSize:11,color:C.amber,backgroundColor:"rgba(251,191,36,.08)",border:`1px solid rgba(251,191,36,.28)`,borderRadius:9,padding:"8px 10px",marginBottom:12,lineHeight:1.55}}>No email on file for this client — add one on the Overview tab to enable sending. You can still preview.</div>
      )}
      {msg&&<div style={{fontSize:11.5,color:msg[0]==="✓"?C.green:C.textDim,marginBottom:10}}>{msg}</div>}
      {loadingTypes?(
        <div style={{fontSize:11,color:C.textMuted}}>Loading…</div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {types.map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:11,backgroundColor:C.bg3,border:`1px solid ${C.border}`}}>
              <div style={{fontSize:20,flexShrink:0}}>{t.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text}}>{t.label}{sentId===t.id&&<span style={{color:C.green,fontWeight:700,fontSize:11,marginLeft:8}}>✓ sent</span>}</div>
                <div style={{fontSize:11,color:C.textMuted,lineHeight:1.5,marginTop:2}}>{t.desc}</div>
              </div>
              <button onClick={()=>preview(t)} disabled={busy} style={{flexShrink:0,padding:"7px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.borderAccent}`,backgroundColor:"rgba(200,168,75,.1)",color:C.gold,cursor:busy?"default":"pointer",opacity:busy?.6:1}}>Preview</button>
            </div>
          ))}
        </div>
      )}

      {open&&(
        <div onClick={e=>{if(e.target===e.currentTarget&&!busy)setOpen(null);}} style={{position:"fixed",inset:0,zIndex:400,backgroundColor:"rgba(4,6,10,.78)",display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
          <div style={{width:"100%",maxWidth:600,maxHeight:"90vh",backgroundColor:C.bg2,borderRadius:16,border:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:`1px solid ${C.border}`}}>
              <div style={{fontSize:18}}>{open.type.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text}}>{open.type.label}</div>
                <div style={{fontSize:10.5,color:C.textMuted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>To: {client.email||"— no email on file —"}</div>
              </div>
              <div style={{display:"flex",gap:4,backgroundColor:"rgba(255,255,255,.04)",borderRadius:8,padding:2}}>
                {["preview","edit"].map(m=>(
                  <button key={m} onClick={()=>setOpen(o=>({...o,mode:m}))} style={{padding:"5px 12px",fontSize:11,fontWeight:700,borderRadius:6,border:"none",cursor:"pointer",backgroundColor:open.mode===m?"rgba(200,168,75,.16)":"transparent",color:open.mode===m?C.gold:C.textMuted,textTransform:"capitalize"}}>{m}</button>
                ))}
              </div>
            </div>
            <div style={{padding:"12px 16px",overflowY:"auto",flex:1}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",color:C.gold,marginBottom:4}}>Subject</div>
              <input value={open.subject} onChange={e=>setOpen(o=>({...o,subject:e.target.value,dirty:true}))} disabled={open.mode!=="edit"} style={{...inp,marginBottom:12,opacity:open.mode==="edit"?1:.85}}/>
              {open.mode==="preview"?(
                <iframe title="Email preview" srcDoc={open.html} style={{width:"100%",height:"46vh",border:`1px solid ${C.border}`,borderRadius:10,background:"#070810"}}/>
              ):(
                <VisualEditor html={open.html} onChange={v=>setOpen(o=>({...o,html:v,dirty:true}))} itemKey={open.type.id+":"+client.id}/>
              )}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderTop:`1px solid ${C.border}`}}>
              {open.dirty&&<button onClick={resetToDefault} disabled={busy} style={{padding:"8px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"transparent",color:C.textMuted,cursor:"pointer"}}>Reset</button>}
              <div style={{flex:1}}/>
              <button onClick={()=>setOpen(null)} disabled={busy} style={{padding:"8px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>Cancel</button>
              <button onClick={send} disabled={busy||!client.email} style={{padding:"8px 18px",fontSize:12,fontWeight:800,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#0a0800",cursor:(busy||!client.email)?"default":"pointer",opacity:(busy||!client.email)?.5:1}}>{busy?"Sending…":"Send Now"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── CLIENT APPROVALS (owner side) ─────────────────────────────────────────────
// Owner queues anything the client needs to personally approve (landing page, ad
// copy, a plan…). It appears in the client's portal "Review" tab with a red badge;
// the client Approves / Requests Changes there, and their decision flows back to
// getAlerts + the commLog. Creating one auto-emails the client (approval_request).
function ClientApprovalsCard({client,onUpdate}) {
  const [title,setTitle]=useState("");
  const [body,setBody]=useState("");
  const [url,setUrl]=useState("");
  const [kind,setKind]=useState("custom");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const approvals=client.approvals||[];

  const call=async(action,extra)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh and log in again.");
    const r=await fetch("/.netlify/functions/client-email",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"Request failed.");
    return d;
  };

  const create=async()=>{
    if(!title.trim()){ setMsg("Give it a title first."); return; }
    setBusy(true); setMsg("");
    const item={id:"ap-"+Date.now().toString(36),kind,title:title.trim(),body:body.trim(),previewUrl:url.trim(),status:"pending",createdAt:new Date().toISOString()};
    let notified=false, warn="";
    if(client.email){
      try{
        const portalUrl=client.portalToken?`${window.location.origin}/portal?token=${client.portalToken}`:"";
        const d=await call("render",{type:"approval_request",ctx:{businessName:client.name,contactName:client.contactName,approvalTitle:item.title,portalUrl}});
        await call("send",{to:client.email,subject:d.subject,html:d.html});
        notified=true;
      }catch(e){ warn=" (created, but the notification email failed: "+e.message+")"; }
    }
    onUpdate&&onUpdate({...client,approvals:[item,...approvals],commLog:[{date:fmt(new Date()),note:`Requested client approval: "${item.title}"${notified?" — client emailed":""}`,cat:"update",ts:Date.now()},...(client.commLog||[])]});
    setTitle("");setBody("");setUrl("");setKind("custom");
    setMsg(notified?`✓ Sent to ${client.email} for approval.`:(client.email?"Added to their portal."+warn:"✓ Added — it'll show in their portal (no client email on file to notify)."));
    setBusy(false);
  };

  const remove=(id)=>onUpdate&&onUpdate({...client,approvals:approvals.filter(a=>a.id!==id)});
  const pill=(s)=>{ const m=({pending:["Awaiting client",C.gold],approved:["✓ Approved",C.green],changes:["Changes requested",C.amber]})[s]||["",C.textMuted]; return <span style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:".04em",color:m[1],backgroundColor:m[1]+"1a",border:`1px solid ${m[1]}44`,borderRadius:6,padding:"2px 7px",flexShrink:0,whiteSpace:"nowrap"}}>{m[0]}</span>; };

  return (
    <div style={{...card,marginTop:12}}>
      <div style={{fontSize:13,fontWeight:800,color:C.text,marginBottom:4}}>✅ Client Approvals</div>
      <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginBottom:12}}>Send {client.name} anything to approve — landing page, ad copy, a plan. They review it in their portal (Approve / Request Changes) and get an email automatically. Their decision comes back to your Alerts.</div>
      <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="What needs approval? (e.g. Your new landing page)" style={{...inp,marginBottom:8}}/>
      <textarea value={body} onChange={e=>setBody(e.target.value)} rows={2} placeholder="Short description / instructions (optional)" style={{...inp,marginBottom:8,resize:"vertical"}}/>
      <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="Preview link (optional) — e.g. the landing page URL" style={{...inp,marginBottom:8}}/>
      <button onClick={create} disabled={busy} style={{width:"100%",padding:"10px",fontSize:12,fontWeight:700,borderRadius:9,border:"none",backgroundColor:C.gold,color:"#0a0800",cursor:busy?"default":"pointer",opacity:busy?.6:1}}>{busy?"Sending…":"Send for Approval"}</button>
      {msg&&<div style={{fontSize:11,color:msg[0]==="✓"?C.green:C.textDim,marginTop:8,lineHeight:1.5}}>{msg}</div>}
      {approvals.length>0&&(
        <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
          {approvals.map(a=>(
            <div key={a.id} style={{padding:"10px 12px",borderRadius:10,backgroundColor:C.bg3,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,minWidth:0,fontSize:12.5,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                {pill(a.status)}
                <button onClick={()=>remove(a.id)} title="Remove" style={{background:"none",border:"none",color:C.textMuted,cursor:"pointer",fontSize:13,padding:"0 2px",flexShrink:0}}>✕</button>
              </div>
              {a.previewUrl&&<a href={a.previewUrl} target="_blank" rel="noopener noreferrer" style={{display:"block",fontSize:10.5,color:C.gold,textDecoration:"none",marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.previewUrl}</a>}
              {a.status==="changes"&&a.note&&<div style={{fontSize:11,color:C.amber,marginTop:4,lineHeight:1.5}}>Client note: {a.note}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ClientHub({client,onUpdate,onDelete,onBack,isDesktop}) {
  const [tab,setTab]         = useState(client._initialTab||"overview");
  const [openBot,setOpenBot] = useState(null);
  const [showEdit,setShowEdit] = useState(false);
  const [genLanding,setGenLanding] = useState({busy:false,error:null});
  const [callTrack,setCallTrack] = useState({busy:false,error:null,areaCode:""});
  const [mediaBusy,setMediaBusy] = useState(null);
  const [mediaErr,setMediaErr]   = useState(null);
  const pkg    = findPkg(client.packageId);
  const derivedBots = deriveBotStatuses(client);
  const bots   = buildBots(pkg).map(b=>{ const e=effectiveBotStatus(client,b.id,derivedBots); return {...b,status:e.status,why:e.why,auto:!!e.auto,manual:!!e.manual}; });
  const alerts = getAlerts(client);
  const stage  = stageInfo(client.stage);
  const days   = daysUntil(client.contractEnd);
  // Internal "My Ads" account (BoldLine's own): it's not a client, so drop the
  // tabs that need a counterparty (Contract, Emails, and the communication Log).
  // PIPELINE STAYS (Bryson, 2026-08-14: he wants his own campaign's build status
  // in the same stage/bot view a client gets), rename "Package"
  // → "Campaigns" (no service tier — just the launch cards), and rename the
  // "Client View" tab → "Assets" (keeps the landing-page/media/call-tracking
  // tools needed to run ads; the client-portal preview inside it is hidden).
  const TABS   = [["overview","Overview"],["pipeline","Pipeline"],["leads","Leads"],["portal","Client View"],["package","Package"],["contract","Contract"],["emails","Emails"],["reports","Reports"],["log","Log"]]
                   .filter(([k])=>!(client.internal&&(k==="contract"||k==="emails"||k==="log")))
                   .map(([k,label])=> !client.internal ? [k,label] : k==="package" ? [k,"Campaigns"] : k==="portal" ? [k,"Assets"] : [k,label]);
  const onboardingSteps = [
    {key:"contract",label:"Contract Signed",done:!!client.contractSigned,note:client.contractSigned?"Signed and on file.":"Awaiting signature."},
    {key:"billing",label:"Billing Connected",done:false,note:"BoldLine is finishing setup — coming soon."},
    {key:"ads",label:"Ad Accounts Linked",done:false,note:"BoldLine is finishing setup — coming soon."},
    {key:"campaign",label:"Campaign Setup",done:!!(client.campaignSetup&&client.campaignSetup.mainOffer),note:(client.campaignSetup&&client.campaignSetup.mainOffer)?"Offer & targeting on file.":"Waiting on client input."},
    {key:"brand",label:"Brand Voice",done:!!(client.brandVoice&&client.brandVoice.tone),note:(client.brandVoice&&client.brandVoice.tone)?"Tone & competitors on file.":"Waiting on client input."},
    {key:"media",label:"Media Library",done:!!(client.mediaLibrary&&client.mediaLibrary.length>0),note:(client.mediaLibrary&&client.mediaLibrary.length>0)?`${client.mediaLibrary.length} file${client.mediaLibrary.length===1?"":"s"} uploaded.`:"No assets uploaded yet."},
  ];

  const handleUpgradeRequest = (newPkg) => {
    onUpdate({...client, upgradeRequest:`${newPkg.name} (${newPkg.platform}) — from $${newPkg.price}/mo`});
  };
  const handleManualUpgrade = (newPkgId) => {
    const newPkg = findPkg(newPkgId);
    const bots   = buildBots(newPkg);
    const botStatuses = Object.fromEntries(bots.map(b=>[b.id,"waiting"]));
    botStatuses["intake"] = "done"; botStatuses["ceo"] = "done";
    // 🔴 THE HAND-OFF WAIVER, APPLIED AUTOMATICALLY.
    // A client who bought Launch & Hand Off already paid for this exact build. Charging
    // them a second setup fee to start managing it would be indefensible, and it is
    // precisely the kind of thing that gets forgotten in the excitement of a conversion.
    // So the OS applies it rather than trusting anyone to remember, and says so in the
    // alert. Outside the 6-month window the fee stands, which is also stated.
    const h = handoffDates(client);
    const wasHandoff = isOneTime(findPkg(client.packageId));
    const waive = !!h && h.creditLive && wasHandoff && !isOneTime(newPkg);
    const note = waive
      ? `Converted from Launch & Hand Off to ${newPkg.name}. Setup fee WAIVED ($${Number(newPkg.setup||0).toLocaleString()}) — they already paid for this build. Invoice the monthly minimum only.`
      : (wasHandoff && h && !h.creditLive
        ? `Converted from Launch & Hand Off to ${newPkg.name}. The 6-month waiver has expired, so the $${Number(newPkg.setup||0).toLocaleString()} setup fee applies. Send invoice to ${client.email}`
        : `Manually upgraded to ${newPkg.name} — send invoice to ${client.email}`);
    onUpdate({...client, packageId:newPkgId, upgradeRequest:null, botStatuses,
      ...(waive ? { billingSetup: 0, handoffCreditApplied: new Date().toISOString() } : {}),
      alerts:[...client.alerts, {type:"upgrade_done", msg:note, severity:waive?"green":"blue"}]
    });
  };
  const handleGenerateLanding = async () => {
    setGenLanding({busy:true,error:null});
    try {
      const r = await fetch("/.netlify/functions/generate-landing",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:client.name,niche:client.niche,campaignSetup:client.campaignSetup,brandVoice:client.brandVoice,mediaLibrary:client.mediaLibrary,website:client.website})});
      const d = await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"Generation failed");
      onUpdate({...client, landingPage:{...d.landingPage,published:(client.landingPage&&client.landingPage.published)||false,generatedAt:new Date().toISOString()}});
      setGenLanding({busy:false,error:null});
    } catch (err) {
      setGenLanding({busy:false,error:err.message||"Generation failed"});
    }
  };
  const handleTogglePublish = () => {
    const goingLive = !(client.landingPage&&client.landingPage.published);
    const base = {...client, landingPage:{...client.landingPage,published:goingLive}};
    // AUTO-APPROVAL (Bryson 2026-07-30: don't make me manually request it): the
    // moment a landing page goes live it's sent to the client to approve + pings
    // the owner. Dedupe: skip if a landing_page approval is already pending.
    if (goingLive && !client.internal && !hasPendingApproval(client,"landing_page")) {
      const item = makeApproval({kind:"landing_page",title:"Your new landing page",body:"Your ad landing page is ready. Take a look and approve it so we can point your ads at it — or request changes and we'll take another pass.",previewUrl:`${window.location.origin}/lp/${client.landingSlug}`});
      base.approvals=[item,...(client.approvals||[])];
      base.commLog=[{date:fmt(new Date()),note:`Auto-sent landing page to ${client.name} for approval`,cat:"update",ts:Date.now()},...(client.commLog||[])];
      onUpdate(base);
      notifyClientApproval(base,item);
    } else {
      onUpdate(base);
    }
  };
  const handleProvisionNumber = async () => {
    setCallTrack(s=>({...s,busy:true,error:null}));
    try {
      const r = await fetch(`/.netlify/functions/call-tracking?token=${encodeURIComponent(client.portalToken)}&action=provision`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({areaCode:callTrack.areaCode})});
      const d = await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"Provisioning failed");
      onUpdate({...client, callTrackingNumber:d.callTrackingNumber});
      setCallTrack(s=>({...s,busy:false,error:null}));
    } catch (err) {
      setCallTrack(s=>({...s,busy:false,error:err.message||"Provisioning failed"}));
    }
  };
  const handleReleaseNumber = async () => {
    if(!window.confirm("Release this tracking number? This stops the monthly charge and the number can't be recovered.")) return;
    setCallTrack(s=>({...s,busy:true,error:null}));
    try {
      const r = await fetch(`/.netlify/functions/call-tracking?token=${encodeURIComponent(client.portalToken)}&action=release`,{method:"POST"});
      const d = await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"Release failed");
      onUpdate({...client, callTrackingNumber:"", callTrackingNumberSid:""});
      setCallTrack(s=>({...s,busy:false,error:null}));
    } catch (err) {
      setCallTrack(s=>({...s,busy:false,error:err.message||"Release failed"}));
    }
  };
  const handleDeleteMedia = async (m) => {
    if(!window.confirm(`Delete "${m.label}" from ${client.name}'s media library? The file is removed for good — the client loses it too.`)) return;
    setMediaBusy(m.path); setMediaErr(null);
    try {
      const r = await fetch(`/.netlify/functions/media?action=delete&token=${encodeURIComponent(client.portalToken)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:m.path})});
      const d = await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||"Delete failed");
      onUpdate({...client, mediaLibrary:d.mediaLibrary||[]});
      setMediaBusy(null);
    } catch (err) {
      setMediaBusy(null); setMediaErr(err.message||"Delete failed");
    }
  };

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{borderBottom:`1px solid ${C.border}`,flexShrink:0,backgroundColor:C.bg2}}>
        {/* Client header bar */}
        <div style={{padding:"12px 14px 10px",display:"flex",alignItems:"center",gap:10}}>
          <button onClick={onBack} style={{width:32,height:32,borderRadius:9,background:"rgba(255,255,255,0.05)",
            border:`1px solid ${C.border}`,color:C.textDim,fontSize:16,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            ‹
          </button>
          <div style={{width:36,height:36,borderRadius:10,
            background:`linear-gradient(135deg,${stage.color}44,${stage.color}15)`,
            border:`1px solid ${stage.color}33`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:14,fontWeight:900,color:stage.color,flexShrink:0}}>
            {client.name[0]}
          </div>
          <div style={S.f1min}>
            <div style={{fontSize:14,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",letterSpacing:"-0.01em"}}>{client.name}{client.internal&&<span style={{marginLeft:6,fontSize:9,fontWeight:800,letterSpacing:".04em",textTransform:"uppercase",color:C.gold,backgroundColor:C.goldDim,border:`1px solid ${C.borderAccent}`,borderRadius:6,padding:"1px 6px",verticalAlign:"middle"}}>My Ads</span>}</div>
            <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginTop:1}}>
              <>{client.internal&&<Chip label="House account" color={C.textMuted} small/>}<Chip label={stage.label} color={stage.color} small/></>
              {!client.internal&&<span style={{fontSize:10,fontWeight:600,color:healthColor(calcHealth(client))}}>⬡ {calcHealth(client).toFixed(1)}/10</span>}
              {!client.internal&&days<=30&&days>=0&&<span style={{fontSize:10,color:days<=7?C.red:C.amber,fontWeight:700}}>{days}d left</span>}
            </div>
          </div>
          <AlertBadge alerts={alerts}/>
          <button
            onClick={()=>setShowEdit(true)}
            style={{
              padding:"5px 11px",fontSize:11,fontWeight:700,borderRadius:8,
              border:`1px solid ${C.borderAccent}`,
              backgroundColor:C.goldDim,color:C.gold,cursor:"pointer",flexShrink:0
            }}>
            Edit
          </button>
        </div>
        {alerts.slice(0,1).map((a,i)=>(
          <div key={i} style={{margin:"0 14px 8px",padding:"7px 10px",borderRadius:9,
            backgroundColor:a.severity==="red"?"rgba(248,113,113,.07)":a.severity==="blue"?"rgba(139,92,246,.07)":"rgba(251,191,36,.07)",
            border:`1px solid ${a.severity==="red"?C.red:a.severity==="blue"?C.purple:C.amber}30`,
            fontSize:11,color:a.severity==="red"?C.red:a.severity==="blue"?C.purple:C.amber,fontWeight:600,
            display:"flex",alignItems:"center",gap:7}}>

        <div style={{display:"flex",overflowX:"auto",gap:0,scrollbarWidth:"none"}}>

              borderBottom:`2px solid ${tab===k?C.gold:"transparent"}`,
              backgroundColor:"transparent",
              color:tab===k?C.gold:C.textMuted,
              cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,
              letterSpacing:"0.01em",transition:"color 0.15s"
            }}>
              {l}
            </button>

        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:isDesktop?"22px 28px 60px":"13px 13px 60px",width:"100%",maxWidth:isDesktop?1000:"none",margin:isDesktop?"0 auto":undefined}}>
        {tab==="overview"&&(
          <div style={S.col11}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {(client.internal
                ? [{l:"Platform",v:(pkg && pkg.platform)||"—"},{l:"Ad Budget",v:client.adBudget||"—"},{l:"Niche",v:client.niche||"—"},{l:"Leads",v:client.leads||0},{l:"Avg CPL",v:client.cpl?`$${client.cpl}`:"—"},{l:"Landing Page",v:(client.landingPage&&client.landingPage.published)?"Published":"Not built"}]
                : [{l:"Package",v:(pkg && pkg.name)||"—"},{l:"Platform",v:(pkg && pkg.platform)||"—"},{l:"Ad Budget",v:client.adBudget||"—"},{l:"Niche",v:client.niche||"—"},{l:"Leads",v:client.leads||0},{l:"Avg CPL",v:client.cpl?`$${client.cpl}`:"—"},{l:"Health Score",v:`${calcHealth(client).toFixed(1)}/10`},{l:"Contract End",v:client.contractEnd||"—"},{l:"Monthly minimum",v:pkg?`$${pkg.price}/mo`:"—"}]
              ).map(({l,v})=>(
                <Card key={l}><Label>{l}</Label><div style={{fontSize:12,fontWeight:600,color:C.text}}>{v}</div></Card>

              <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>${pkg.setup.toLocaleString()} setup {client.niche&&PER_LEAD[client.niche]?`· $${PER_LEAD[client.niche]}/lead`:""}</div>
            </Card>}
            {/* Live health score breakdown */}
            {client.internal&&(()=>{
              // Same card, house factors. Each row carries the REASON it scored

              const factors = houseHealthFactors(client);
              return (

                {l:"CPL on target",          ok:client.cpl>0&&client.cpl<=(PER_LEAD[client.niche]||50), pts:"0.5"},
                {l:"Contract active",        ok:client.contractStatus==="active", pts:"1.0"},

              return (
                <Card style={{borderColor:`${healthColor(h)}33`,backgroundColor:`${healthColor(h)}06`}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                    <Label>Health Score</Label>
                    <div style={{fontSize:24,fontWeight:900,color:healthColor(h),lineHeight:1}}>{h.toFixed(1)}<span style={{fontSize:12,fontWeight:400,color:C.textMuted}}>/10</span></div>
                  </div>
                  <div style={{height:5,backgroundColor:C.border2,borderRadius:3,overflow:"hidden",marginBottom:12}}>
                    <div style={{height:"100%",width:`${h*10}%`,backgroundColor:healthColor(h),borderRadius:3,transition:"width .4s"}}/>
                  </div>
                  {factors.map(({l,ok,pts})=>(
                    <div key={l} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:`1px solid ${C.border2}`}}>
                      <span style={{width:16,height:16,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,backgroundColor:ok?"rgba(34,211,160,0.12)":"rgba(255,255,255,0.03)",border:`1px solid ${ok?"rgba(34,211,160,0.25)":"rgba(255,255,255,0.06)"}`}}>
                        {ok?<IconCheck size={9} color={C.green}/>:<span style={{width:3,height:3,borderRadius:"50%",backgroundColor:C.textMuted,display:"inline-block"}}/>}
                      </span>
                      <span style={{fontSize:11,color:ok?C.textDim:C.textMuted,flex:1}}>{l}</span>
                      <span style={{fontSize:9,color:C.textMuted,flexShrink:0}}>+{pts}</span>
                    </div>
                  ))}
                  <div style={{marginTop:8,fontSize:10,color:C.textMuted,lineHeight:1.6}}>
                    Score updates automatically as campaign data, stage, and contract status change.
                  </div>
                </Card>
              );
            })()}
            <HandOffCard client={client} pkg={pkg} onUpdate={onUpdate} isDesktop={isDesktop}/>

              <Label>Contract Timeline</Label>
              <div style={{height:4,backgroundColor:C.border2,borderRadius:2,overflow:"hidden",marginBottom:6}}>
                <div style={{height:"100%",backgroundColor:days<=7?C.red:days<=30?C.amber:C.green,width:`${Math.min(100,Math.max(0,100-days/90*100))}%`,borderRadius:2,transition:"width .3s"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.textMuted}}>
                <span>Start: {client.contractStart}</span>
                <span style={{color:days<=7?C.red:days<=30?C.amber:C.textMuted,fontWeight:days<=30?700:400}}>End: {client.contractEnd}</span>

            </Card>}
