  const [data,setData]=React.useState(null);
  const loc=String(locations||"").trim();

  React.useEffect(()=>{
    if(!loc){ setData(null); setState("idle"); return; }
    let cancelled=false;
    (async()=>{
      setState("working");
      try{
        const { data:{ session } }=await supabaseClient.auth.getSession();
        const token=session&&session.access_token;
        if(!token){ if(!cancelled) setState("error"); return; }
        const r=await fetch("/.netlify/functions/area-conditions",{method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
          body:JSON.stringify({locations:loc})}).then(x=>x.json());
        if(cancelled) return;
        if(!r||!r.ok){ setState("error"); return; }
        setData(r); setState("done");
      }catch{ if(!cancelled) setState("error"); }
    })();
    return ()=>{ cancelled=true; };
  },[loc]);

  // A weather lookup failing must never look like the campaign is broken, so a failure is
  // silent. The ad does not depend on this.
  if(state!=="done"||!data) return null;
  const now=(data.now||[]).filter(a=>a.inArea);
  const past=(data.recent||[]).filter(a=>a.inArea&&a.days>=3);
  if(!now.length&&!past.length) return null;

  const row=(txt,key)=>(
    <div key={key} style={{fontSize:10.5,color:C.textDim,lineHeight:1.55,marginTop:3}}>• {txt}</div>
  );
  return (
    <div style={{marginBottom:12,padding:"11px 12px",borderRadius:10,border:`1px solid ${C.borderAccent}`,backgroundColor:C.goldDim}}>
      <div style={{fontSize:10.5,fontWeight:800,color:C.gold,textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>What's going on in their area</div>
      {now.length>0&&(<>
        <div style={{fontSize:10,color:C.textMuted,fontWeight:700,marginTop:5}}>Right now</div>
        {now.slice(0,4).map((a,i)=>row(`${a.event}${a.where&&a.where.length?` — ${a.where.join(", ")}`:""}`,"n"+i))}
      </>)}
      {past.length>0&&(<>
        <div style={{fontSize:10,color:C.textMuted,fontWeight:700,marginTop:8}}>Last {past[0].window} days</div>
        {past.slice(0,4).map((a,i)=>row(`${a.event} on ${a.days} of the last ${a.window} days`,"p"+i))}
      </>)}
      <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.55,marginTop:8,paddingTop:7,borderTop:`1px solid ${C.border2}`}}>
        Live from the National Weather Service. The AI writer sees this too. <b style={{color:C.textDim}}>What already happened is usually the stronger angle</b> for roofing, restoration, tree work and glass — people call after they see the damage, not during the storm. Only use it if it genuinely fits this business.
      </div>
    </div>
  );
}

function GoogleLaunchCard({client, onUpdate, platformCount}) {
  const linked = !!client.googleAdsCustomerId;
  // House account's ads point at the real ad landing page; clients point at their own /lp page.
  const landingDefault = client.internal ? "https://boldlinemedia.com/get-started"
    : (client.landingSlug ? `${window.location.origin}/lp/${client.landingSlug}` : "");
  const niche = client.niche || "";
  const cs = client.campaignSetup || {};
  const bv = client.brandVoice || {};
  const lp = client.landingPage || {};
  const offer = cs.mainOffer || "";
  const area = cs.serviceArea || cs.targetLocations || "";
  const diff = bv.differentiator || "";
  // Trim back to a whole word, never mid-word. A plain slice put "ringi" on a real
  // creative; a field that is simply shorter always beats one that looks broken.
  // If not even the first word fits, drop it so no fragment ever ships.
  const clWords = (s,max) => { const t=String(s||"").trim().replace(/\s{2,}/g," "); if(t.length<=max) return t;
    const sp=t.slice(0,max+1).lastIndexOf(" "); return sp<=0?"":t.slice(0,sp).replace(/[\s,;:.\-]+$/,""); };
  // A whole word is not a whole THOUGHT. A long niche made "Commercial Roofing And
  // Restoration Experts" land as "Commercial Roofing And", which is broken English even
  // though nothing was cut mid-word. So after trimming, walk back off any word that
  // cannot end a sentence. Only applies when something was actually cut. Same list and
  // same reasoning as fitPhrase on the server (netlify/lib/ad-gen-shared.mjs).
  const CL_DANGLING = new Set("a an the this these those your our their its my his her every each more most less and or but nor so because if when while although though unless until that which whose than of to in on at by for with from into onto about after before between through during without within across against near per via is are was were be been being am do does did has have had will would can could should may might must not just very really quite".split(" "));
  const clPhrase = (s,max) => {
    const full=String(s||"").trim().replace(/\s{2,}/g," ");
    if(full.length<=max) return full;
    const t=clWords(full,max); if(!t) return "";
    const w=t.split(" ").filter(Boolean);
    while(w.length && CL_DANGLING.has(w[w.length-1].toLowerCase().replace(/[^a-z']/gi,""))) w.pop();
    return w.length<2 ? "" : w.join(" ").replace(/[\s,;:.\-]+$/,"");
  };
  const cl30 = (s) => clPhrase(s,30);
  const cl90 = (s) => clPhrase(s,90);
  const headlineSeed = [...new Set([client.name, offer, diff, niche?`${niche} Experts`:"", "Get Your Free Quote Today", area?`Serving ${area}`:"", "Fast, Friendly Service"].map(cl30).filter(Boolean))].slice(0,8);
  const descSeed = [...new Set([lp.subheadline, offer?`${offer}. Get your free quote today.`:"", niche?`Professional ${niche} you can trust. Fast, friendly, and local.`:"", "Contact us today for a fast, no-obligation quote."].map(cl90).filter(Boolean))].slice(0,4);
  const kwSeed = [...new Set([niche, niche&&area?`${niche} ${area}`:"", niche?`${niche} near me`:"", niche?`best ${niche}`:""].map(s=>String(s||"").trim()).filter(Boolean))].slice(0,8);

  // House account: BoldLine advertises to WIN a given kind of business as a client.
  // Blank / "any business owner" => a general agency campaign; a niche => niche-targeted.
  const agencySeed = (audience) => {
    const raw = String(audience||"").trim();
    const general = !raw || /\b(any|general|all|business owner|small business|owner|owners)\b/i.test(raw);
    const A = raw ? raw.charAt(0).toUpperCase()+raw.slice(1) : "";
    const name = `BoldLine Media — ${general ? "General" : A}`;
    const headlines = (general
      ? ["More Customers On Autopilot","Google & Meta Ads For You","Get More Leads This Month","We Run Your Ads For You","Free Marketing Strategy Call","Stop Guessing With Ad Spend","Managed Ads That Grow You","Done-For-You Ad Management"]
      : [`More ${A} Customers`,`${A} Marketing Experts`,`Get More ${A} Leads`,`We Run ${A} Ads For You`,`Free Strategy Call`,`Google & Meta Ads Managed`,`Fill Your ${A} Schedule`,`Stop Wasting Ad Spend`]).map(cl30).filter(Boolean);
    const descriptions = (general
      ? ["We plan, build, and run your Google and Meta ads so you get more customers.","Done-for-you ad management and landing pages. Book a free strategy call today.","You own your ad account, we manage it. Real reporting, no long contracts."]
      : [`We run Google and Meta ads for ${raw} so you get a steady flow of new customers.`,`Done-for-you ads and landing pages built for ${raw}. Book a free strategy call.`,`You own your ad account, we manage it. Real reporting, no guesswork.`]).map(cl90).filter(Boolean);
    const keywords = general
      ? ["marketing agency","google ads management","facebook ads agency","get more customers online","small business advertising","lead generation agency","done for you marketing"]
      : [`marketing agency for ${raw}`,`${raw} advertising`,`google ads for ${raw}`,`${raw} lead generation`,`${raw} marketing`,`get more ${raw} customers`];
    return { name, headlines, descriptions, keywords };
  };
  // PARITY WITH THE HOUSE ACCOUNT (Bryson, 2026-08-20: "make sure everything we are doing
  // for my own ads is updated and added for clients ads for the stuff that is applicable").
  //
  // The house account could always type a NICHE and rebuild, so BoldLine can run one
  // campaign per kind of business it chases. A client had no equivalent, and needs the
  // same thing for a different reason: a roofer wanting "roof repair" and "roof
  // replacement" needs two campaigns, because one ad group holding both can never match
  // either search well. So the same box now serves both, asking the question that fits.
  const clientSeed = (service) => {
    const svc = String(service||"").trim();
    const S = svc ? svc.charAt(0).toUpperCase()+svc.slice(1) : "";
    const subject = svc || niche;
    return {
      name: `${client.name} — ${S || "Search"}`,
      headlines: [...new Set([client.name, svc?S:offer, diff, subject?`${subject} Experts`:"",
        svc?`${S} Done Right`:"", "Get Your Free Quote Today", area?`Serving ${area}`:"", "Fast, Friendly Service"]
        .map(cl30).filter(Boolean))].slice(0,8),
      descriptions: [...new Set([lp.subheadline,
        subject?`Need ${subject}? Get your free quote today.`:"",
        subject?`Professional ${subject} you can trust. Fast, friendly, and reliable.`:"",
        "Contact us today for a fast, no-obligation quote."].map(cl90).filter(Boolean))].slice(0,4),
      keywords: [...new Set([subject, subject&&area?`${subject} ${area}`:"", subject?`${subject} near me`:"",
        subject?`best ${subject}`:"", subject?`${subject} cost`:""].map(x=>String(x||"").trim()).filter(Boolean))].slice(0,8),
    };
  };
  const seed0 = client.internal ? agencySeed("") : { name:`${client.name} — Search`, headlines:headlineSeed, descriptions:descSeed, keywords:kwSeed };

  // Google targets EVERY country if a campaign is created with no location criteria,
  // so these are required, not optional. House account = the metro Bryson actually
  // cold calls; a client = whatever service area their intake captured.
  const locationDefault = client.internal
    ? "Gilbert, Arizona\nChandler, Arizona\nMesa, Arizona\nTempe, Arizona\nPhoenix, Arizona\nScottsdale, Arizona"
    : String(cs.serviceArea || cs.targetLocations || "").split(/[,;\n]/).map(s=>s.trim()).filter(Boolean).join("\n");
  // The searchers who can never buy. Cheap to exclude, expensive to leave in on a
  // small daily budget — these are the classic budget-eaters on agency terms.
  const negativeDefault = [
    "free","cheap","jobs","job","salary","hiring","career","careers","intern","internship",
    "course","courses","training","tutorial","how to","diy","udemy","certification",
    "software","tool","tools","template","reddit","wikipedia","meaning","definition",
    "resume","entry level",
  ].join("\n");

  const [audience,setAudience] = useState("");
  const monthlyBudget = monthlyBudgetNum(client);
  // Split the monthly budget across the platforms actually being run — otherwise
  // Google and Meta each take the full figure and the month burns twice as fast.
  const platShare = Math.max(1, Number(platformCount) || 1);
  const autoDaily = dailyFromMonthly(monthlyBudget, platShare);
  const [budgetTouched,setBudgetTouched] = useState(false);
  const [f,setF] = useState({
    name: seed0.name,
    dailyBudgetDollars: autoDaily > 0 ? autoDaily : 20,
    landingUrl: landingDefault,
    matchType: "PHRASE",
    headlinesText: seed0.headlines.join("\n"),

    locationsText: locationDefault,

  // Generated structure. When present, the campaign is built from THESE ad groups

  const [gen,setGen] = useState(null);         // {adGroups, negativeKeywords, notes, totals}
  const [genState,setGenState] = useState("idle"); // idle | working | error
  const [genMsg,setGenMsg] = useState("");
  const generate = async () => {
    setGenState("working"); setGenMsg("Writing the campaign. This takes a minute or two.");
    try{
      // Fire-and-poll. A synchronous call 504'd here: Netlify gives a sync function
      // ~10 seconds and this writes 3-5 full ads. The background function answers
      // immediately and stores its result on the client record.
      const d = await adGenBackground({ action:"google", clientId: client.id, agency: !!client.internal,
        name: client.internal ? "BoldLine Media" : client.name,
        // A client's chosen service narrows the brief the same way a niche narrows the
        // house account's. Without this the AI writes for the whole trade while the
        // campaign name and seeds say one service, and the two disagree.
        niche: client.internal ? (audience || "any business owner") : (audience || client.niche || ""),
        offer: client.internal ? "Google and Meta ad management plus the landing pages behind them" : (audience || cs.mainOffer || ""),
        locations: f.locationsText.split("\n").map(x=>x.trim()).filter(Boolean).join(", "),
        avgTicket: cs.avgTicket||"", differentiator: (client.brandVoice&&client.brandVoice.differentiator)||"",
        landingUrl: f.landingUrl, avoid: cs.excludedKeywords||"" });
      setGen(d);
      // Fold the generated negatives into the box so they are visible and editable.
      const negs = [...new Set([...f.negativeKeywordsText.split("\n").map(x=>x.trim()).filter(Boolean), ...(d.negativeKeywords||[])])];
      setF(prev=>({...prev, negativeKeywordsText: negs.join("\n")}));
      setGenState("idle");
      setGenMsg(`${d.totals.adGroups} ad groups · ${d.totals.keywords} keywords · ${d.totals.headlines} headlines · ${d.totals.negatives} negatives`);
    }catch(e){ setGenState("error"); setGenMsg(e.message||"Generation failed."); }
  };
  // Editing the monthly budget (Campaigns tab, or Edit -> Campaign) flows straight
  // through to here. Stops the moment he types his own number, so an override sticks.
  useEffect(()=>{
    if(budgetTouched || autoDaily <= 0) return;

  },[autoDaily,budgetTouched]);
  const fillFromAudience = () => {
    const s = client.internal ? agencySeed(audience) : clientSeed(audience);

    setState("idle"); setMsg("");
  };
  const [state,setState] = useState("idle"); // idle | creating | done | error
  const [msg,setMsg] = useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const box={width:"100%",padding:"8px 10px",fontSize:12,borderRadius:8,border:`1px solid ${C.border}`,background:C.bg2,color:C.text,boxSizing:"border-box"};
  const lbl={fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",color:C.textMuted,margin:"0 0 4px",display:"block"};
  const launch=async()=>{
    const headlines=f.headlinesText.split("\n").map(humanizeAdCopy).filter(Boolean);
    const descriptions=f.descriptionsText.split("\n").map(humanizeAdCopy).filter(Boolean);
    const keywords=f.keywordsText.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!(Number(f.dailyBudgetDollars)>0)){ setState("error"); setMsg("Daily budget must be greater than 0."); return; }
    if(!f.landingUrl){ setState("error"); setMsg("A landing page URL is required."); return; }
    if(headlines.length<3){ setState("error"); setMsg("Add at least 3 headlines (each ≤30 characters), one per line."); return; }
    if(descriptions.length<2){ setState("error"); setMsg("Add at least 2 descriptions (each ≤90 characters), one per line."); return; }

    const locations=f.locationsText.split("\n").map(s=>s.trim()).filter(Boolean);

    if(!locations.length){ setState("error"); setMsg("Add at least 1 target location, one per line — without one Google shows your ads in every country on earth."); return; }
    setState("creating"); setMsg("");
    try{
      const d=await gadsCall({action:"createCampaign",

        ...(gen && gen.adGroups && gen.adGroups.length

      const gcid=String(d.campaignResourceName||"").split("/").pop();

           exec:{platform:"google", campaignId:gcid, campaignName:f.name, kind:"enable_campaign"}},

  if(!linked) return (

  return (
    <Card>

      <div style={{fontSize:10,color:C.textMuted,lineHeight:1.6,marginBottom:10}}>{client.internal?<>Builds a full Search campaign on <strong>your</strong> Google Ads account, pointing at your ad landing page. Created <strong style={{color:C.gold}}>PAUSED</strong> — start it from <strong style={{color:C.textDim}}>Your Live Campaigns</strong> above. Build one per niche to run several at once.</>:<>Builds a full Search campaign (budget → ad group → responsive search ad → keywords) on <strong>{client.name}</strong>'s Google Ads account. Created <strong style={{color:C.gold}}>PAUSED</strong> — nothing spends until you enable it. They own the account + pay their own spend.</>}</div>
      <div style={{marginBottom:12,padding:"11px 12px",borderRadius:10,backgroundColor:C.goldDim,border:`1px solid ${C.borderAccent}`}}>
        <label style={lbl}>{client.internal?"Who should this ad target?":"Which service is this campaign for?"}</label>
        <div style={{display:"flex",gap:6}}>
          <input value={audience} onChange={e=>setAudience(e.target.value)} placeholder={client.internal?"e.g. Roofers, Med spas — or blank for any business owner":`e.g. roof repair, water heater install — or blank for ${niche||"everything"}`} style={{...box,flex:1}}/>
          <button onClick={fillFromAudience} style={{flexShrink:0,padding:"8px 13px",fontSize:11,fontWeight:800,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer"}}>✨ Fill copy</button>
        </div>
        <div style={{fontSize:10,color:C.textMuted,marginTop:7,lineHeight:1.55}}>{client.internal
          ? <>Type a niche and tap <b style={{color:C.textDim}}>Fill copy</b> to auto-write the campaign for it, then Build. Change the niche and build again — each is its own campaign. Leave blank for a general "any business owner" ad.</>
          : <>Name <b style={{color:C.textDim}}>one service</b> and tap <b style={{color:C.textDim}}>Fill copy</b>, then Build. Change it and build again — each service gets its own campaign, which is how the ad ends up matching what was actually searched for. Leave blank to cover everything they do.</>}</div>
      </div>
      <div style={{marginBottom:12,padding:"11px 12px",borderRadius:10,border:`1px solid ${gen?C.green+"55":C.border}`,backgroundColor:gen?"rgba(34,211,160,0.06)":"transparent"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:gen?9:6}}>
          <button onClick={generate} disabled={genState==="working"} style={{flex:1,padding:"9px 12px",fontSize:12,fontWeight:800,borderRadius:9,border:"none",backgroundColor:genState==="working"?C.border:C.gold,color:genState==="working"?C.textMuted:"#15110A",cursor:genState==="working"?"default":"pointer"}}>

        )}

        {gen&&gen.adGroups&&(
          <div style={{marginTop:9}}>
            {gen.adGroups.map((g,i)=>(
              <div key={i} style={{padding:"7px 0",borderTop:`1px solid ${C.border2}`}}>

            {gen.notes&&<div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.55,marginTop:8,paddingTop:8,borderTop:`1px solid ${C.border2}`}}><b style={{color:C.textDim}}>What to watch: </b>{gen.notes}</div>}
            <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:7}}>Build Campaign will use these ad groups. The single-group fields below are the manual fallback and are ignored while this is here. <button onClick={()=>{setGen(null);setGenMsg("");}} style={{background:"none",border:"none",color:C.gold,fontWeight:700,cursor:"pointer",padding:0,fontSize:9.5}}>discard</button></div>
          </div>

      </div>
      {[
        {k:"name",l:"Campaign name",t:"text"},

      ].map(({k,l,t})=>(
        <div key={k} style={{marginBottom:9}}>
          <label style={lbl}>{l}</label>
          <input type={t} value={f[k]} onChange={e=>{ if(k==="dailyBudgetDollars") setBudgetTouched(true); set(k,e.target.value); }} style={box}/>
          {k==="dailyBudgetDollars"&&(
            <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:3}}>
              {"\u2248 $"+monthlyFromDaily(f.dailyBudgetDollars).toLocaleString()+"/mo on Google"}
              {monthlyBudget>0&&!budgetTouched&&<span> &middot; auto-filled &mdash; {platShare>1?<>half of your ${monthlyBudget.toLocaleString()}/mo, <b style={{color:C.textDim}}>split evenly with Meta</b></>:<>your full ${monthlyBudget.toLocaleString()}/mo budget</>}</span>}
              {monthlyBudget>0&&budgetTouched&&(
                <span> &middot; overriding {platShare>1?"your half of ":""}${monthlyBudget.toLocaleString()}/mo <button onClick={()=>{setBudgetTouched(false);set("dailyBudgetDollars",autoDaily);}} style={{background:"none",border:"none",color:C.gold,fontWeight:700,cursor:"pointer",padding:0,fontSize:9.5}}>reset</button></span>
              )}
              {monthlyBudget<=0&&<span> &middot; set a monthly budget above and this fills itself</span>}
            </div>
          )}
        </div>
      ))}
      <div style={{marginBottom:9}}>
        <label style={lbl}>Headlines — one per line, ≤30 chars each (3+ required)</label>
        <textarea value={f.headlinesText} onChange={e=>set("headlinesText",e.target.value)} rows={5} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
      <div style={{marginBottom:9}}>
        <label style={lbl}>Descriptions — one per line, ≤90 chars each (2+ required)</label>
        <textarea value={f.descriptionsText} onChange={e=>set("descriptionsText",e.target.value)} rows={3} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
      <div style={{marginBottom:9}}>
        <label style={lbl}>Keywords — one per line</label>
        <textarea value={f.keywordsText} onChange={e=>set("keywordsText",e.target.value)} rows={4} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
      <div style={{marginBottom:10}}>
        <label style={lbl}>Keyword match type</label>
        <select value={f.matchType} onChange={e=>set("matchType",e.target.value)} style={box}>
          {["PHRASE","BROAD","EXACT"].map(o=><option key={o} value={o} style={{background:C.bg2}}>{o[0]+o.slice(1).toLowerCase()}</option>)}
        </select>
      </div>
      <div style={{marginBottom:9}}>
        <label style={lbl}>Target locations — one per line (required)</label>
        <textarea value={f.locationsText} onChange={e=>set("locationsText",e.target.value)} rows={4} placeholder={"Gilbert, Arizona\nLondon, United Kingdom\nCanada"} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
        <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:3}}>Anywhere in the world, one per line. <b style={{color:C.textDim}}>City, State</b> at home (Gilbert, Arizona), <b style={{color:C.textDim}}>City, Country</b> abroad (London, United Kingdom), or a country on its own (Canada). You do not have to be based there. Ads show only to people <b style={{color:C.textDim}}>physically in</b> these areas, not people merely interested in them. Leave this empty and nothing gets built.</div>
      </div>
      <div style={{marginBottom:10}}>
        <label style={lbl}>Negative keywords — one per line</label>
        <textarea value={f.negativeKeywordsText} onChange={e=>set("negativeKeywordsText",e.target.value)} rows={4} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
        <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:3}}>Searches that will never buy — job hunters, students, freebie seekers. Blocking them is the cheapest money you'll save on a small budget.</div>
      </div>
      <button onClick={launch} disabled={state==="creating"} style={{width:"100%",padding:"10px",fontSize:12.5,fontWeight:700,borderRadius:9,border:"none",backgroundColor:state==="done"?"#059669":C.gold,color:state==="done"?"#fff":"#15110A",cursor:state==="creating"?"default":"pointer",opacity:state==="creating"?.7:1}}>{state==="creating"?"Building campaign…":state==="done"?"✓ Created (Paused)":"Build Campaign (Paused)"}</button>
      {msg&&<div style={{fontSize:11,marginTop:9,lineHeight:1.6,color:state==="error"?C.red:"#34D399",wordBreak:"break-word"}}>{msg}</div>}
    </Card>
  );
}

function MetaLaunchCard({client, onUpdate, platformCount}) {
  const linked = client.metaAdAccountId && client.metaPageId;
  const landingDefault = client.internal ? "https://boldlinemedia.com/get-started"
    : (client.landingSlug ? `${window.location.origin}/lp/${client.landingSlug}` : "");
  // Newest image wins, and ad creatives beat stock photos: the Creative Studio saves
  // with category "ad-creative" and its own hint promises the launch card uses the
  // newest one. Sorted by savedAt/ts when present, otherwise the library is
  // append-newest-first already.
  const usableImgs = (client.mediaLibrary||[]).filter(m=>m.url && m.category!=="video");
  const creativeImgs = usableImgs.filter(m=>String(m.category||"")==="ad-creative");
  const firstImg = (creativeImgs.length?creativeImgs:usableImgs)[0];
  // House account: BoldLine advertising to WIN a given kind of business as a client.
  const metaAgencySeed = (aud) => {
    const raw = String(aud||"").trim();
    const general = !raw || /\b(any|general|all|business owner|small business|owner|owners)\b/i.test(raw);
    const A = raw ? raw.charAt(0).toUpperCase()+raw.slice(1) : "";
    return {
      name: `BoldLine Media — ${general ? "General" : A}`,
      headline: general ? "More Customers, On Autopilot" : `More ${A} Customers`,
      primaryText: general
        ? "Struggling to get new customers? BoldLine plans, builds, and runs your Google and Meta ads for you, plus the landing pages and instant lead follow-up behind them. You own your ad account, we manage it. Book a free strategy call and we'll map out a plan for your business."
        : `${A}: tired of slow months? BoldLine runs your Google and Meta ads for you, plus the landing pages and lead follow-up behind them, so you get a steady flow of new customers. You own your ad account, we manage it. Book a free strategy call.`,
      description: "Done-for-you ad management. Book a free call.",
    };
  };
  // Same parity point as the Google card: the house account could always aim a campaign at
  // one niche, and a client needs to aim one at a single SERVICE for the same reason.
  const metaClientSeed = (service) => {
    const svc = String(service||"").trim();
    const S = svc ? svc.charAt(0).toUpperCase()+svc.slice(1) : "";
    const lp0 = client.landingPage || {};
    const nch = client.niche || "";
    return {
      name: `${client.name} — ${S || "Leads"}`,
      headline: svc ? `${S} You Can Count On` : (lp0.headline || client.name),
      primaryText: svc
        ? `Need ${svc}? ${client.name} handles it start to finish. Tell us what's going on and we'll get you a quote.`
        : (lp0.subheadline || ""),
      description: svc ? `Fast ${svc} quotes` : (nch ? `Trusted ${nch}` : ""),
    };
  };
  const mseed0 = client.internal ? metaAgencySeed("") : metaClientSeed("");
  const [audience,setAudience] = useState("");
  const monthlyBudget = monthlyBudgetNum(client);
  // Split the monthly budget across the platforms actually being run — otherwise
  // Google and Meta each take the full figure and the month burns twice as fast.
  const platShare = Math.max(1, Number(platformCount) || 1);
  const autoDaily = dailyFromMonthly(monthlyBudget, platShare);
  const [budgetTouched,setBudgetTouched] = useState(false);
  const [f,setF] = useState({
    name: mseed0.name,
    dailyBudgetDollars: autoDaily > 0 ? autoDaily : 20,
    landingUrl: landingDefault,
    headline: mseed0.headline,
    primaryText: mseed0.primaryText,
    description: mseed0.description,
    ctaType: "LEARN_MORE",
    ageMin: 18, ageMax: 65,
    country: "US",
    // Meta targets by resolved geo KEY, not by name, so these are looked up server-side.
    // Empty means the build is refused rather than silently buying the whole country.
    locationsText: toLocationLines(metaLocations),
    imageUrl: (firstImg && firstImg.url) || "",
  });
  // Editing the monthly budget (Campaigns tab, or Edit -> Campaign) flows straight
  // through to here. Stops the moment he types his own number, so an override sticks.
  useEffect(()=>{
    if(budgetTouched || autoDaily <= 0) return;
    setF(p => (Number(p.dailyBudgetDollars) === autoDaily ? p : {...p, dailyBudgetDollars: autoDaily}));
  },[autoDaily,budgetTouched]);
  // Saving from the Ad Creative Studio updates client.mediaLibrary AFTER this card
  // mounted. `imageUrl` was a useState initial value, so it stayed empty forever and
  // Build failed with "an ad image is required" even though images had just been
  // saved. Follow the library instead, and stop the moment a URL is typed by hand.
  // ── AI variants ────────────────────────────────────────────────────────────
  // The `meta` action has existed in the generator since it shipped but nothing
  // called it, so this card still used its template seed. It writes one complete
  // variant per AWARENESS STAGE, because the words that land on someone who has
  // never considered the problem are not the words for someone already comparing
  // providers. Picking a variant fills the three copy fields; the image, budget,
  // audience and landing URL are untouched.
  const [gen,setGen] = useState(null);          // [{awareness, angle, headline, primaryText, description}]
  const [genPick,setGenPick] = useState(0);
  const [genState,setGenState] = useState("idle"); // idle | working | error
  const [genMsg,setGenMsg] = useState("");
  // The service area, for the weather lookup on the server and the card below. The Meta
  // card targets by country and age rather than by city, so unlike the Google card there is
  // no locations box here to read it from. The house account falls back to the metro Bryson
  // actually works, which is what its Google twin defaults to as well.
  const metaLocations = (() => {
    const cs = client.campaignSetup || {};
    const own = String(cs.targetLocations || cs.serviceArea || client.location || "").trim();
    if (own) return own;
    return client.internal ? "Gilbert, Arizona, Chandler, Arizona, Mesa, Arizona, Tempe, Arizona, Phoenix, Arizona, Scottsdale, Arizona" : "";
  })();
  const generateMeta = async () => {
    setGenState("working"); setGenMsg("Writing variants. This takes a minute.");
    try{
      // Same fire-and-poll path as the Google card: this is a background job because
      // a synchronous Netlify function gets ~10 seconds and this writes several full ads.
      const d = await adGenBackground({ action:"meta", clientId: client.id, agency: !!client.internal,
        name: client.internal ? "BoldLine Media" : client.name,
        niche: client.internal ? (audience || "any business owner") : (audience || client.niche || ""),
        offer: client.internal ? "Google and Meta ad management plus the landing pages behind them"
                               : (audience || (client.campaignSetup&&client.campaignSetup.mainOffer) || ""),
        // 🔴 WITHOUT THIS, META ADS GOT NO LOCAL CONDITIONS AT ALL. The server looks up the
        // weather from `locations`, and this call simply never sent it, so every Meta variant
        // since the conditions feature shipped was written with season-only context while the
        // Google ones got live data. Found 2026-08-20. The Meta card has no locations field of
        // its own (it targets by country and age), so the service area comes off the client.
        locations: metaLocations,
        avgTicket: (client.campaignSetup&&client.campaignSetup.avgTicket)||"",
        differentiator: (client.brandVoice&&client.brandVoice.differentiator)||"",
        landingUrl: f.landingUrl,
        avoid: (client.campaignSetup&&client.campaignSetup.excludedKeywords)||"" });
      const vs = (d && d.variants) || [];
      if(!vs.length) throw new Error("The model returned no usable variants. Try again.");
      setGen(vs); setGenPick(0); applyVariant(vs[0]);
      setGenState("idle"); setGenMsg(`${vs.length} variant${vs.length===1?"":"s"} written. Pick one below.`);
    }catch(e){ setGenState("error"); setGenMsg(e.message||"Generation failed."); }
  };
  const applyVariant = (v) => {
    if(!v) return;
    setF(p=>({...p, headline: humanizeAdCopy(v.headline), primaryText: humanizeAdCopy(v.primaryText),
      description: humanizeAdCopy(v.description||"")}));
  };

  const [imgTouched,setImgTouched] = useState(false);
  const autoImg = (firstImg && firstImg.url) || "";
  useEffect(()=>{
    if(imgTouched || !autoImg) return;
    setF(p => (p.imageUrl === autoImg ? p : {...p, imageUrl: autoImg}));
  },[autoImg,imgTouched]);
  const fillFromAudience = () => {
    const s = client.internal ? metaAgencySeed(audience) : metaClientSeed(audience);
    setF(p=>({...p, name:s.name, headline:s.headline, primaryText:s.primaryText, description:s.description}));
    setState("idle"); setMsg("");
  };
  const [state,setState] = useState("idle"); // idle | creating | done | error
  const [msg,setMsg] = useState("");
  const [pgState,setPgState] = useState("idle"); // idle | reading | ok | error
  const [pgMsg,setPgMsg] = useState("");
  const readPage=async()=>{
    setPgState("reading"); setPgMsg("");
    try{
      const d=await metaCall({action:"page",pageId:client.metaPageId});
      const p=d.page;
      setPgState("ok");
      setPgMsg(p
        ? `✓ ${p.name} — ${p.followers.toLocaleString()} followers, ${p.fanCount.toLocaleString()} likes, ${p.engagement.toLocaleString()} recent engagement. (${(d.pages||[]).length} managed Page${(d.pages||[]).length===1?"":"s"} visible.)`
        : `✓ ${(d.pages||[]).length} managed Page${(d.pages||[]).length===1?"":"s"} visible.`);
    }catch(e){ setPgState("error"); setPgMsg(e.message||"Page read failed."); }
  };
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const box={width:"100%",padding:"8px 10px",fontSize:12,borderRadius:8,border:`1px solid ${C.border}`,background:C.bg2,color:C.text,boxSizing:"border-box"};
  const lbl={fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",color:C.textMuted,margin:"0 0 4px",display:"block"};
  const launch=async()=>{
    if(!(Number(f.dailyBudgetDollars)>0)){ setState("error"); setMsg("Daily budget must be greater than 0."); return; }
    if(!f.landingUrl){ setState("error"); setMsg("A landing page URL is required."); return; }
    setState("creating"); setMsg("");
    try{
      const d=await metaCall({action:"createCampaign",
        adAccountId:client.metaAdAccountId, pageId:client.metaPageId,
        landingUrl:f.landingUrl, name:f.name, dailyBudgetDollars:Number(f.dailyBudgetDollars),
        locations:f.locationsText, country:f.country||"US",
        ageMin:Number(f.ageMin)||18, ageMax:Number(f.ageMax)||65,
        headline:humanizeAdCopy(f.headline), primaryText:humanizeAdCopy(f.primaryText), description:humanizeAdCopy(f.description),
        ctaType:f.ctaType, ...(f.imageUrl?{imageUrl:f.imageUrl}:{}), clientName:client.name,
      });
      setState("done"); setMsg(`✓ Campaign created PAUSED (campaign ${d.campaignId}). It's in your Alerts now — approve it there (or use "Your Live Campaigns" above) to go live. Nothing spends until you do.`);
      if(d.campaignId&&onUpdate){
        const upd={...client, pendingActions:[
          {id:`launch-m-${d.campaignId}`, title:`Launch Meta campaign "${f.name}"`, detail:`Created PAUSED on ${client.internal?"your":client.name+"'s"} Meta account. Approve to set it live and start spend.`, cat:"launch", ts:Date.now(),
           exec:{platform:"meta", campaignId:String(d.campaignId), campaignName:f.name, kind:"enable_campaign"}},
          ...(client.pendingActions||[])]};
        // Auto-send the client their campaign + BUDGET to approve before it goes live.
        let campItem=null;
        if(!client.internal){
          const dly=Number(f.dailyBudgetDollars)||0, mo=Math.round(dly*30.4);
          campItem=makeApproval({kind:"campaign",title:"Your Meta ad campaign is ready to launch",body:`Your Facebook/Instagram campaign "${f.name}" is built and ready to go live. Ad budget: $${dly}/day (about $${mo.toLocaleString()}/month), which you pay Meta directly — we never touch it. Approve to launch, or request changes and we'll adjust before anything spends.`,previewUrl:f.landingUrl});
          upd.approvals=[campItem,...(client.approvals||[])];
          upd.commLog=[{date:fmt(new Date()),note:`Auto-sent Meta campaign + budget to ${client.name} for approval`,cat:"update",ts:Date.now()},...(client.commLog||[])];
        }
        onUpdate(upd);
        if(campItem) notifyClientApproval(upd,campItem);
      }
    }catch(e){ setState("error"); setMsg(e.message||"Launch failed — nothing was created."); }
  };
  if(!linked) return (
    <Card>
      <Label>📘 Launch Meta Campaign</Label>
      <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6}}>{client.internal?<>Link your <strong style={{color:C.textDim}}>Meta Ad Account ID</strong> and <strong style={{color:C.textDim}}>Facebook Page ID</strong> first — in <em>Edit → Campaign → Ad Account Linking</em>. Then build and launch your Meta ads right here. (Meta ads also need App Review approved first.)</>:<>Link this client's <strong style={{color:C.textDim}}>Meta Ad Account ID</strong> and <strong style={{color:C.textDim}}>Facebook Page ID</strong> first — in <em>Edit → Campaign → Ad Account Linking</em>. Then you can build and launch their Meta ads right here. (Client accounts also require Meta App Review to be approved.)</>}</div>
    </Card>
  );
  return (
    <Card>
      <Label>📘 Launch Meta Campaign</Label>
      <AreaConditionsCard locations={metaLocations}/>
      <div style={{fontSize:10,color:C.textMuted,lineHeight:1.6,marginBottom:10}}>{client.internal?<>Builds a full lead-gen campaign on <strong>your</strong> Meta ad account, driving to your ad landing page. Created <strong style={{color:C.gold}}>PAUSED</strong> — start it from <strong style={{color:C.textDim}}>Your Live Campaigns</strong> above. Build one per niche to run several at once.</>:<>Builds a full lead-gen campaign on <strong>{client.name}</strong>'s ad account, driving to their landing page. Created <strong style={{color:C.gold}}>PAUSED</strong> — nothing spends until you activate it. They own the account + pay their own spend.</>}</div>
      <div style={{marginBottom:12,padding:"11px 12px",borderRadius:10,backgroundColor:C.goldDim,border:`1px solid ${C.borderAccent}`}}>
        <label style={lbl}>{client.internal?"Who should this ad target?":"Which service is this campaign for?"}</label>
        <div style={{display:"flex",gap:6}}>
          <input value={audience} onChange={e=>setAudience(e.target.value)} placeholder={client.internal?"e.g. Roofers, Med spas — or blank for any business owner":`e.g. roof repair, water heater install — or blank for ${client.niche||"everything"}`} style={{...box,flex:1}}/>
          <button onClick={fillFromAudience} style={{flexShrink:0,padding:"8px 13px",fontSize:11,fontWeight:800,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer"}}>✨ Fill copy</button>
        </div>
        <div style={{fontSize:10,color:C.textMuted,marginTop:7,lineHeight:1.55}}>{client.internal
          ? <>Type a niche and tap <b style={{color:C.textDim}}>Fill copy</b> to auto-write the ad for it, then Build. Change the niche and build again — each is its own campaign. Leave blank for a general "any business owner" ad.</>
          : <>Name <b style={{color:C.textDim}}>one service</b> and tap <b style={{color:C.textDim}}>Fill copy</b>, then Build. Change it and build again — each service gets its own campaign, so the picture and the words can match that one job. Leave blank to cover everything they do.</>}</div>
      </div>
      <div style={{marginBottom:12,padding:"11px 12px",borderRadius:10,border:`1px solid ${gen?C.green+"55":C.border}`,backgroundColor:gen?"rgba(34,211,160,0.06)":"transparent"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:gen?9:6}}>
          <button onClick={generateMeta} disabled={genState==="working"} style={{flex:1,padding:"9px 12px",fontSize:12,fontWeight:800,borderRadius:9,border:"none",backgroundColor:genState==="working"?C.border:C.gold,color:genState==="working"?C.textMuted:"#15110A",cursor:genState==="working"?"default":"pointer"}}>
            {genState==="working"?"Writing variants…":gen?"↻ Regenerate variants":"✨ Write the ad with AI"}
          </button>
        </div>
        {!gen&&genState!=="error"&&(
          <div style={{fontSize:10,color:C.textMuted,lineHeight:1.55}}>Writes one complete ad per <b style={{color:C.textDim}}>awareness stage</b>, because the words that work on someone who has never thought about the problem are not the words for someone already comparing providers. Pick one and it fills the copy fields below.</div>
        )}
        {genMsg&&<div style={{fontSize:10.5,lineHeight:1.55,color:genState==="error"?C.red:C.green,wordBreak:"break-word"}}>{genMsg}</div>}
        {gen&&(
          <div style={{marginTop:9}}>
            {gen.map((v,i)=>(
              <button key={i} onClick={()=>{ setGenPick(i); applyVariant(v); }} style={{display:"block",width:"100%",textAlign:"left",padding:"8px 9px",marginBottom:6,borderRadius:8,cursor:"pointer",
                border:`1px solid ${genPick===i?C.green+"88":C.border}`,backgroundColor:genPick===i?"rgba(34,211,160,0.08)":C.bg2}}>
                <div style={{display:"flex",alignItems:"baseline",gap:6,marginBottom:3}}>
                  <span style={{fontSize:8.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".06em",padding:"1px 5px",borderRadius:3,border:`1px solid ${C.border}`,color:C.textMuted}}>{v.awareness||`variant ${i+1}`}</span>
                  {genPick===i&&<span style={{fontSize:9,fontWeight:800,color:C.green}}>IN USE</span>}
                </div>
                <div style={{fontSize:11.5,fontWeight:800,color:C.textDim,lineHeight:1.4}}>{v.headline}</div>
                <div style={{fontSize:10,color:C.textMuted,lineHeight:1.5,marginTop:2}}>{String(v.primaryText||"").slice(0,120)}{String(v.primaryText||"").length>120?"…":""}</div>
                {v.angle&&<div style={{fontSize:9.5,color:C.textMuted,marginTop:3,fontStyle:"italic"}}>{v.angle}</div>}
              </button>
            ))}
            <button onClick={()=>{ setGen(null); setGenMsg(""); }} style={{fontSize:10,color:C.textMuted,background:"none",border:"none",cursor:"pointer",padding:"2px 0",textDecoration:"underline"}}>Discard these and go back to the manual copy</button>
          </div>
        )}
      </div>
      <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",marginBottom:11}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={readPage} disabled={pgState==="reading"} style={{padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:8,border:"none",backgroundColor:pgState==="ok"?"#059669":"#1D4ED8",color:"#fff",cursor:pgState==="reading"?"default":"pointer",opacity:pgState==="reading"?.7:1,whiteSpace:"nowrap"}}>{pgState==="reading"?"Reading…":pgState==="ok"?"✓ Page read":"📄 Read Page"}</button>
          <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5}}>Reads the Page these ads publish to — confirms manage access + pulls its follower/engagement stats.</div>
        </div>
        {pgMsg&&<div style={{fontSize:11,marginTop:8,lineHeight:1.6,color:pgState==="error"?C.red:"#34D399",wordBreak:"break-word"}}>{pgMsg}</div>}
      </div>
      {[
        {k:"name",l:"Campaign name",t:"text"},
        {k:"dailyBudgetDollars",l:"Daily budget ($/day)",t:"number"},
        {k:"landingUrl",l:"Landing page URL",t:"text"},
        {k:"headline",l:"Headline",t:"text"},
        {k:"primaryText",l:"Primary text (the post body)",t:"text"},
        {k:"description",l:"Description (optional)",t:"text"},
        {k:"imageUrl",l:"Ad image URL (optional — defaults to a client photo)",t:"text"},
      ].map(({k,l,t})=>(
        <div key={k} style={{marginBottom:9}}>
          <label style={lbl}>{l}</label>
          <input type={t} value={f[k]} onChange={e=>{ if(k==="dailyBudgetDollars") setBudgetTouched(true); if(k==="imageUrl") setImgTouched(true); set(k,e.target.value); }} style={box}/>
          {k==="imageUrl"&&(
            <div style={{fontSize:9.5,lineHeight:1.5,marginTop:3,color:f.imageUrl?C.textMuted:C.red}}>
              {f.imageUrl
                ? (imgTouched
                    ? <>Using the URL you typed. <button onClick={()=>{setImgTouched(false);set("imageUrl",autoImg);}} style={{background:"none",border:"none",color:C.gold,fontWeight:700,cursor:"pointer",padding:0,fontSize:9.5}}>use the newest saved creative</button></>
                    : <>Auto-filled from your newest saved creative{firstImg&&firstImg.category==="ad-creative"?" (Ad Creative Studio)":""}. Save a new one above and this follows it.</>)
                : <>Meta link ads must have an image, so Build will fail without one. Generate one in the Ad Creative Studio above and press <b style={{color:C.textDim}}>Save to media library</b>, and it lands here automatically.</>}
            </div>
          )}
          {k==="dailyBudgetDollars"&&(
            <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:3}}>
              {"\u2248 $"+monthlyFromDaily(f.dailyBudgetDollars).toLocaleString()+"/mo on Meta"}
              {monthlyBudget>0&&!budgetTouched&&<span> &middot; auto-filled &mdash; {platShare>1?<>half of your ${monthlyBudget.toLocaleString()}/mo, <b style={{color:C.textDim}}>split evenly with Google</b></>:<>your full ${monthlyBudget.toLocaleString()}/mo budget</>}</span>}
              {monthlyBudget>0&&budgetTouched&&(
                <span> &middot; overriding {platShare>1?"your half of ":""}${monthlyBudget.toLocaleString()}/mo <button onClick={()=>{setBudgetTouched(false);set("dailyBudgetDollars",autoDaily);}} style={{background:"none",border:"none",color:C.gold,fontWeight:700,cursor:"pointer",padding:0,fontSize:9.5}}>reset</button></span>
              )}
              {monthlyBudget<=0&&<span> &middot; set a monthly budget above and this fills itself</span>}
            </div>
          )}
        </div>
      ))}
      <div style={{marginBottom:9}}>
        <label style={lbl}>Target locations — one per line (required)</label>
        <textarea value={f.locationsText} onChange={e=>set("locationsText",e.target.value)} rows={4} placeholder={"Gilbert, Arizona\nLondon, United Kingdom\nCanada"} style={{...box,resize:"vertical",fontFamily:"inherit"}}/>
        <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:3}}>Anywhere in the world, one per line. <b style={{color:C.textDim}}>City, State</b> at home (Gilbert, Arizona), <b style={{color:C.textDim}}>City, Country</b> abroad (London, United Kingdom), or a country on its own (Canada). You do not have to be based there. Cities get a 25 mile radius. <b style={{color:C.textDim}}>Leave this empty and the build is refused</b> &mdash; without it Meta shows your ad across a whole country and the budget is gone before it reaches anyone nearby.</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:9}}>
        <div style={{flex:1}}><label style={lbl}>CTA button</label>
          <select value={f.ctaType} onChange={e=>set("ctaType",e.target.value)} style={box}>
            {["LEARN_MORE","SIGN_UP","GET_QUOTE","CONTACT_US","BOOK_NOW","GET_OFFER","SUBSCRIBE"].map(o=><option key={o} value={o} style={{background:C.bg2}}>{o.replace(/_/g," ")}</option>)}
          </select>
        </div>
        <div style={{width:70}}><label style={lbl}>Age min</label><input type="number" value={f.ageMin} onChange={e=>set("ageMin",e.target.value)} style={box}/></div>
        <div style={{width:70}}><label style={lbl}>Age max</label><input type="number" value={f.ageMax} onChange={e=>set("ageMax",e.target.value)} style={box}/></div>
        <div style={{width:96}}><label style={lbl}>If unclear</label><input type="text" value={f.country} onChange={e=>set("country",e.target.value.toUpperCase().slice(0,2))} style={box}/></div>
      </div>
      <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.5,marginTop:-3,marginBottom:9}}><b style={{color:C.textDim}}>If unclear</b> is only a fallback. Each location above carries its own country, so this is used when a line names none of its own (just &ldquo;Paris&rdquo;).</div>
      <button onClick={launch} disabled={state==="creating"} style={{width:"100%",padding:"10px",fontSize:12.5,fontWeight:700,borderRadius:9,border:"none",backgroundColor:state==="done"?"#059669":C.gold,color:state==="done"?"#fff":"#15110A",cursor:state==="creating"?"default":"pointer",opacity:state==="creating"?.7:1}}>{state==="creating"?"Building campaign…":state==="done"?"✓ Created (Paused)":"Build Campaign (Paused)"}</button>
      {msg&&<div style={{fontSize:11,marginTop:9,lineHeight:1.6,color:state==="error"?C.red:"#34D399",wordBreak:"break-word"}}>{msg}</div>}
    </Card>
  );
}

// ─── LIVE CAMPAIGNS — START / PAUSE ───────────────────────────────────────────
// Lists the linked account's real campaigns (Google + Meta) with 30-day metrics
// and a direct Start (enable) / Pause toggle. This is how you actually turn ads
// ON from inside the OS — the launch cards only BUILD campaigns (paused). Enabling
// starts real spend, so it's confirmed first. Reads via gadsCall/metaCall
// "campaigns" and writes via "setStatus" (same functions ARIA's approval queue uses).
// ─── BUDGET LINKING ───────────────────────────────────────────────────────────
// One monthly figure drives every daily field. Parsed the same way as
// MyAdsInsights / ads-sync / ads-autopilot so no two screens can disagree, and
// rounded the same way MyAdsSetupCards already displays it ($200/mo -> $7/day).
// The monthly budget is the TOTAL across every platform being run, so a daily
// figure has to be divided by how many platforms will each spend it. Two launch
// cards both taking the full monthly figure spend the month's budget in half a
// month — caught by Bryson 2026-08-14: "$7/day for both ads would burn through
// the monthly ad spend twice as quick."
// ─── AD COPY: DON'T SOUND AI-WRITTEN ──────────────────────────────────────────
// Standing rule (Bryson, 2026-08-14): no ad may read as AI-generated, and the
// em dash is the tell he named. Seed copy is written without them, but copy also
// gets hand-typed and will later be model-written, so this runs on every field
// at submit time as the backstop. A dash joining two clauses becomes two plain
// sentences, which is how a person would have written it in the first place.
// Applied to headlines/descriptions/primary text only — never to keywords (a
// dash there is a real search term) and never to campaign names (internal only).
const humanizeAdCopy = (s) => String(s == null ? "" : s)
  .replace(/\s*[—–]\s*$/, "")                  // trailing dash: drop it
  .replace(/^\s*[—–]\s*/, "")                  // leading dash: drop it
  .replace(/\s*[—–]\s*/g, ". ")                // joining dash: two sentences
  .replace(/\s*\.\s*\.\s*/g, ". ")             // never ".."
  .replace(/([.!?])\s+([a-z])/g, (m, p, c) => p + " " + c.toUpperCase())
  .replace(/\s{2,}/g, " ")
  .trim();

const monthlyBudgetNum = (cl) => Number(String((cl && cl.adBudget) || "").replace(/[^0-9.]/g, "")) || 0;
const dailyFromMonthly = (m, platforms) => {
  const share = Math.max(1, Number(platforms) || 1);
  return m > 0 ? Math.round(m / 30.4 / share) : 0;
};
const monthlyFromDaily = (d) => Math.round((Number(d) || 0) * 30.4);
// Mirrors the runsGoogle/runsMeta detection the Campaigns tab uses to decide
// which launch cards to render, so the split can never disagree with the number
// of cards on screen.
const adPlatformsOf = (cl, pkg) => {
  const plats = (cl && cl.platforms) || [];
  const pkgPlat = (pkg && pkg.platform) || "";
  const google = (cl && cl.internal) ? plats.some((p) => /google/i.test(p)) : /google/i.test(pkgPlat);
  const meta   = (cl && cl.internal) ? plats.some((p) => /meta|facebook|instagram/i.test(p)) : /meta|facebook|instagram/i.test(pkgPlat);
  return { google, meta, count: (google ? 1 : 0) + (meta ? 1 : 0) };
};

// ─── CONTENT STUDIO ───────────────────────────────────────────────────────────
// Video ideas + shootable scripts for BoldLine's own channels — short-form
// (Reels/TikTok/Shorts) and long-form (YouTube/podcast), for the business AND
// Bryson's personal brand. Built 2026-08-13.
//
// Saved ideas live on the My Ads house-account record (`contentIdeas`), which
// rides the existing clients-table save path — no new Supabase table, no
// migration to run, and it syncs across his phone and desktop for free.
const CONTENT_PILLARS = [
  { id:"build",      label:"Building in public" },
  { id:"teach",      label:"Teaching ads" },
  { id:"teardown",   label:"Teardowns" },
  { id:"contrarian", label:"Contrarian takes" },
  { id:"personal",   label:"Personal brand" },
  { id:"sales",      label:"Sales + cold calling" },
];

async function contentCall(payload){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  const token = session && session.access_token;
  if(!token) throw new Error("Session expired — refresh the page and log in again.");
  const r = await fetch("/.netlify/functions/content-studio",{
    method:"POST",
    headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},
    body:JSON.stringify(payload),
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok||!d.ok) throw new Error(d.error||"Content Studio request failed");
  return d;
}

function ContentStudioScreen({onBack,isDesktop,account,onSaveAccount}){
  const [tab,setTab]=useState("new");            // new | saved
  const [mode,setMode]=useState("short");        // short | long
  const [pillar,setPillar]=useState("");
  const [topic,setTopic]=useState("");
  const [minutes,setMinutes]=useState(8);
  const [ideas,setIdeas]=useState([]);
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const [open,setOpen]=useState(null);           // index of the expanded idea
  const [scripts,setScripts]=useState({});       // key -> script

  const saved=(account&&account.contentIdeas)||[];
  const keyOf=(idea)=>String(idea&&idea.title||"").slice(0,90);

  const generate=async()=>{
    setBusy("ideas"); setErr(""); setOpen(null);
    try{
      // Everything already on screen or saved goes in the avoid list, so a second
      // press gives genuinely new ideas instead of rewording the first batch.
      const avoid=ideas.map(i=>i.title).concat(saved.map(s=>s.idea&&s.idea.title)).filter(Boolean);
      const d=await contentCall({action:"ideas",mode,pillar:pillar||undefined,topic:topic.trim()||undefined,avoid});
      setIdeas(d.ideas||[]);
    }catch(e){ setErr(e.message||"Couldn't generate ideas."); }
    setBusy("");
  };

  const writeScript=async(idea,i)=>{
    const k=keyOf(idea);
    setBusy("script:"+i); setErr("");
    try{
      const d=await contentCall({action:"script",mode,idea,minutes:mode==="long"?minutes:undefined});
      setScripts(prev=>({...prev,[k]:d.script}));
      setOpen(i);
    }catch(e){ setErr(e.message||"Couldn't write the script."); }
    setBusy("");
  };

  const save=(idea)=>{
    if(!account||!onSaveAccount) return;
    const k=keyOf(idea);
    const entry={id:(typeof crypto!=="undefined"&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()),
      savedAt:new Date().toISOString(),mode,idea,script:scripts[k]||null};
    onSaveAccount({...account,contentIdeas:[entry].concat(saved)});
  };
  const unsave=(id)=>{
    if(!account||!onSaveAccount) return;
    if(!window.confirm("Remove this from your saved list?")) return;
    onSaveAccount({...account,contentIdeas:saved.filter(s=>s.id!==id)});
  };

  const copy=(text)=>{ try{ navigator.clipboard.writeText(text); }catch(e){} };
  const scriptText=(s)=>[
    s.title,"",
    "HOOK: "+s.hook,"",
    ...(s.blocks||[]).map(b=>`[${b.timing}] ${b.label}\n${b.say}\n(${b.direction})`),
    "","CTA: "+s.cta,
    "","CAPTION:\n"+s.caption,
    "","HASHTAGS: "+((s.hashtags||[]).join(" ")),
    "","ON SCREEN: "+((s.onScreenText||[]).join(" | ")),
    "","SHOOT NOTES: "+s.shotNotes,
  ].join("\n");

  const chip=(active)=>({padding:"6px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,cursor:"pointer",
    border:`1px solid ${active?C.gold:C.border}`,backgroundColor:active?"rgba(200,168,75,0.12)":"transparent",
    color:active?C.gold:C.textDim});
  const inp={width:"100%",padding:"9px 11px",fontSize:12.5,borderRadius:9,border:`1px solid ${C.border}`,
    backgroundColor:C.bg2,color:C.text,fontFamily:"inherit",outline:"none"};
  const back=!isDesktop&&(
    <button onClick={onBack} style={{width:32,height:32,borderRadius:9,border:"none",background:"rgba(255,255,255,0.05)",color:C.textDim,cursor:"pointer",fontSize:17,flexShrink:0}}>‹</button>
  );

  const ScriptView=({s})=>(
    <div style={{marginTop:11,paddingTop:11,borderTop:`1px solid ${C.border2}`}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9,flexWrap:"wrap"}}>
        <Label>Script</Label>
        <button onClick={()=>copy(scriptText(s))} style={{marginLeft:"auto",fontSize:11,fontWeight:700,color:C.gold,background:"none",border:"none",cursor:"pointer"}}>Copy all</button>
      </div>
      <div style={{fontSize:12.5,fontWeight:800,color:C.gold,lineHeight:1.5,marginBottom:9}}>“{s.hook}”</div>
      {(s.blocks||[]).map((b,i)=>(
        <div key={i} style={{marginBottom:11,paddingLeft:11,borderLeft:`2px solid ${C.border}`}}>
          <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.textMuted,marginBottom:3}}>
            {b.label} <span style={{opacity:.7,fontWeight:600}}>· {b.timing}</span>
          </div>
          <div style={{fontSize:12.5,color:C.text,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{b.say}</div>
          {b.direction&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.55,marginTop:4,fontStyle:"italic"}}>{b.direction}</div>}
        </div>
      ))}
      <div style={{fontSize:12,color:C.text,lineHeight:1.6,marginTop:9}}><b style={{color:C.textMuted,fontSize:10.5}}>CTA — </b>{s.cta}</div>
      {s.caption&&<div style={{marginTop:10}}>
        <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.textMuted,marginBottom:4}}>Caption</div>
        <div style={{fontSize:12,color:C.textDim,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{s.caption}</div>
      </div>}
      {(s.hashtags||[]).length>0&&<div style={{fontSize:11,color:C.blue,marginTop:7,lineHeight:1.6}}>{s.hashtags.join("  ")}</div>}
      {(s.onScreenText||[]).length>0&&<div style={{marginTop:10}}>
        <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.textMuted,marginBottom:4}}>Burn on screen</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{s.onScreenText.map((t,i)=><span key={i} style={{fontSize:11,padding:"3px 8px",borderRadius:6,backgroundColor:"rgba(255,255,255,.05)",color:C.textDim}}>{t}</span>)}</div>
      </div>}
      {(s.titleOptions||[]).length>0&&<div style={{marginTop:10}}>
        <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",color:C.textMuted,marginBottom:4}}>Other titles</div>
        {s.titleOptions.map((t,i)=><div key={i} style={{fontSize:11.5,color:C.textDim,lineHeight:1.7}}>· {t}</div>)}
      </div>}
      {s.shotNotes&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:10,paddingTop:9,borderTop:`1px solid ${C.border2}`}}><b>Before you record: </b>{s.shotNotes}</div>}
    </div>
  );

  const IdeaCard=({idea,i,savedEntry})=>{
    const k=keyOf(idea);
    const s=(savedEntry&&savedEntry.script)||scripts[k];
    const isOpen=open===(savedEntry?"s"+savedEntry.id:i);
    const working=busy===("script:"+i);
    const already=saved.some(x=>x.idea&&x.idea.title===idea.title);
    return (
      <Card style={{marginBottom:11}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:9,marginBottom:7,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 200px",minWidth:0}}>
            <div style={{fontSize:14,fontWeight:800,color:C.text,lineHeight:1.35}}>{idea.title}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6,alignItems:"center"}}>
              <Chip label={idea.audience==="business"?"Business":idea.audience==="personal"?"Personal":"Both"} color={idea.audience==="personal"?C.purple:idea.audience==="both"?C.blue:C.gold} small/>
              <Chip label={idea.effort==="easy"?"Easy shoot":idea.effort==="involved"?"Involved":"Medium"} color={idea.effort==="easy"?C.green:idea.effort==="involved"?C.amber:C.textMuted} small/>
              <span style={{fontSize:10,color:C.textMuted}}>{idea.lengthHint} · {(idea.platforms||[]).join(", ")}</span>
            </div>
          </div>
          {savedEntry
            ? <button onClick={()=>unsave(savedEntry.id)} style={{fontSize:11,fontWeight:700,color:C.textMuted,background:"none",border:"none",cursor:"pointer",flexShrink:0}}>Remove</button>
            : <button onClick={()=>save(idea)} disabled={already} style={{fontSize:11,fontWeight:700,color:already?C.green:C.gold,background:"none",border:"none",cursor:already?"default":"pointer",flexShrink:0}}>{already?"✓ Saved":"Save"}</button>}
        </div>

        <div style={{fontSize:12.5,fontWeight:700,color:C.gold,lineHeight:1.55,marginBottom:8}}>“{idea.hook}”</div>
        {(idea.beats||[]).map((b,bi)=><div key={bi} style={{fontSize:12,color:C.textDim,lineHeight:1.7}}>· {b}</div>)}
        <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginTop:8}}>{idea.why}</div>

        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          {s
            ? <button onClick={()=>setOpen(isOpen?null:(savedEntry?"s"+savedEntry.id:i))} style={{padding:"6px 13px",fontSize:11.5,fontWeight:800,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"transparent",color:C.textDim,cursor:"pointer"}}>{isOpen?"Hide script":"Show script"}</button>
            : <button onClick={()=>writeScript(idea,i)} disabled={!!busy} style={{padding:"6px 13px",fontSize:11.5,fontWeight:800,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#120E02",cursor:busy?"default":"pointer",opacity:busy?.6:1}}>{working?"Writing…":"Write the script"}</button>}
          <button onClick={()=>copy(`${idea.title}\n\nHook: ${idea.hook}\n\n${(idea.beats||[]).map(b=>"- "+b).join("\n")}`)} style={{padding:"6px 13px",fontSize:11.5,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"transparent",color:C.textMuted,cursor:"pointer"}}>Copy idea</button>
        </div>
        {isOpen&&s&&<ScriptView s={s}/>}
      </Card>
    );
  };

  return (
    <div style={{flex:1,overflowY:"auto",padding:isDesktop?"26px 32px 60px":"16px 14px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        {back}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:isDesktop?24:19,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>Content Studio</div>
          <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>Video ideas and scripts for the agency and your personal brand.</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>setTab("new")} style={chip(tab==="new")}>New ideas</button>
        <button onClick={()=>setTab("saved")} style={chip(tab==="saved")}>Saved{saved.length?` (${saved.length})`:""}</button>
      </div>

      <div style={{maxWidth:820}}>
        {tab==="new"&&<>
          <Card style={{marginBottom:14}}>
            <Label>What are we making</Label>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:11}}>
              <button onClick={()=>setMode("short")} style={chip(mode==="short")}>Short-form <span style={{opacity:.7,fontWeight:600}}>Reels · TikTok · Shorts</span></button>
              <button onClick={()=>setMode("long")} style={chip(mode==="long")}>Long-form <span style={{opacity:.7,fontWeight:600}}>YouTube · Podcast</span></button>
            </div>

            <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".06em",textTransform:"uppercase",color:C.textMuted,marginBottom:6}}>Angle (optional)</div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:11}}>
              <button onClick={()=>setPillar("")} style={chip(!pillar)}>Mix it up</button>
              {CONTENT_PILLARS.map(p=><button key={p.id} onClick={()=>setPillar(p.id)} style={chip(pillar===p.id)}>{p.label}</button>)}
            </div>

            <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".06em",textTransform:"uppercase",color:C.textMuted,marginBottom:6}}>Anything specific? (optional)</div>
            <input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="e.g. why roofers waste money on shared leads" style={inp}/>

            {mode==="long"&&(
              <div style={{marginTop:11}}>
                <div style={{fontSize:9.5,fontWeight:800,letterSpacing:".06em",textTransform:"uppercase",color:C.textMuted,marginBottom:6}}>Target length: {minutes} min</div>
                <input type="range" min={4} max={20} value={minutes} onChange={e=>setMinutes(Number(e.target.value))} style={{width:"100%",accentColor:C.gold}}/>
              </div>
            )}

            <button onClick={generate} disabled={!!busy} style={{marginTop:13,padding:"10px 18px",fontSize:12.5,fontWeight:800,borderRadius:9,border:"none",backgroundColor:C.gold,color:"#120E02",cursor:busy?"default":"pointer",opacity:busy?.6:1}}>
              {busy==="ideas"?"Thinking…":ideas.length?"Give me 6 more":"Generate 6 ideas"}
            </button>
            {ideas.length>0&&<span style={{fontSize:11,color:C.textMuted,marginLeft:10}}>New batch skips everything you've already got.</span>}
          </Card>

          {err&&<Card style={{borderColor:`${C.red}44`,marginBottom:12}}><div style={{fontSize:12,color:C.red,lineHeight:1.6}}>{err}</div></Card>}

          {busy==="ideas"&&<Card><div style={{fontSize:12,color:C.textMuted}}>Writing 6 ideas — about 10 seconds.</div></Card>}

          {!busy&&!ideas.length&&!err&&(
            <Card><div style={{fontSize:12,color:C.textMuted,lineHeight:1.7}}>
              Pick short or long, optionally choose an angle, and hit Generate. Every idea comes with the exact opening line and the beats it moves through — then you can have the full script written for the ones you like.
              <br/><br/><b style={{color:C.textDim}}>It will never invent client results or testimonials</b> — you don't have clients yet, and the ideas are built around that honestly rather than pretending otherwise.
            </div></Card>
          )}

          {ideas.map((idea,i)=><IdeaCard key={i} idea={idea} i={i}/>)}
        </>}

        {tab==="saved"&&<>
          {!account&&<Card><div style={{fontSize:12,color:C.textMuted,lineHeight:1.7}}>Saved ideas live on your <b style={{color:C.gold}}>My Ads</b> account. Open My Ads once from the dashboard to create it, then saving will work here.</div></Card>}
          {account&&!saved.length&&<Card><div style={{fontSize:12,color:C.textMuted,lineHeight:1.7}}>Nothing saved yet. Generate some ideas and hit <b style={{color:C.gold}}>Save</b> on the ones worth shooting — they'll wait here with their scripts.</div></Card>}
          {saved.map(entry=>(
            <div key={entry.id}>
              <div style={{fontSize:10,color:C.textMuted,marginBottom:4,marginLeft:2}}>
                {entry.mode==="long"?"Long-form":"Short-form"} · saved {new Date(entry.savedAt).toLocaleDateString()}
              </div>
              <IdeaCard idea={entry.idea} i={entry.id} savedEntry={entry}/>
            </div>
          ))}
        </>}
      </div>
    </div>
  );
}

// ─── AD CREATIVE STUDIO ───────────────────────────────────────────────────────
// Draws finished ad images in the browser on a <canvas>, then pushes them into
// the client's media library — which the Meta launch card ALREADY auto-reads to
// pick `imageUrl`. So generating a creative here makes Build Campaign produce
// artwork as well as copy, with nothing uploaded by hand.
//
// Built 2026-08-12 (Bryson: "wont the ai make the images and everything for the
// ad?"). He was right that it was a gap: copy was already auto-written and the
// image was already auto-SELECTED, but nothing ever CREATED one, so an empty
// media library meant there was nothing to select.
//
// Canvas, not a headless browser on the server: no new dependency, no Chromium
// in a Lambda, and it runs today. The trade-off is that it only renders while
// the OS is open — a bot building a campaign unattended needs this moved
// server-side later (see KB ad-creative-studio).
//
// Same two hard rules as the offline generator (KB ad-creatives): NO drawn
// buttons (a painted-on button can't be tapped and Meta prohibits non-functional
// buttons), and no claims about results BoldLine hasn't produced.

const AD_SIZES = [

];

// Angle templates. `niche` is who the ad is aimed at ("Roofers"), `city` is
// optional. Each returns the full editable starting point — every field can be
// rewritten before rendering.
const AD_ANGLES = [
