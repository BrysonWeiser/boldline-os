  skip:      {label:"Skip",         color:"#F87171"},
};
const scoutTier = (score)=>{ const s=Math.max(0,Math.min(100,Number(score)||0));
  return s>=80?SCOUT_TIER_META.call_first:s>=62?SCOUT_TIER_META.strong:s>=42?SCOUT_TIER_META.maybe:s>=22?SCOUT_TIER_META.low:SCOUT_TIER_META.skip; };
const SCOUT_STATUSES = [
  {id:"new",       label:"New",           color:C.blue},
  {id:"contacted", label:"Contacted",     color:C.amber},
  {id:"meeting",   label:"Meeting booked",color:C.green},
  {id:"client",    label:"Won",           color:"#059669"},
  {id:"dead",      label:"Not a fit",     color:C.textMuted},
];

function LeadScoutScreen({onBack,isDesktop,onDealPrep}){
  const [tab,setTab]=useState("search"); // search | list
  const [nicheKey,setNicheKey]=useState("");
  const [customNiche,setCustomNiche]=useState("");
  const [areas,setAreas]=useState([]);
  const [areaInput,setAreaInput]=useState("");
  const [count,setCount]=useState(12);
  const [filters,setFilters]=useState({websiteState:"any",adsState:"any",minEmployees:0});
  const [notes,setNotes]=useState("");
  const [showAdv,setShowAdv]=useState(false);
  const [runState,setRunState]=useState("idle"); // idle | running | done | error
  const [progress,setProgress]=useState(null);
  const [runResult,setRunResult]=useState(null);
  const [msg,setMsg]=useState("");
  const [list,setList]=useState([]);
  const [facets,setFacets]=useState(null);
  const [listLoading,setListLoading]=useState(false);
  const [lf,setLf]=useState({niche:"",area:"",status:"",minScore:0,q:""});
  const [openId,setOpenId]=useState(null);
  const [providers,setProviders]=useState(null);
  const [elapsed,setElapsed]=useState(0);
  const [recheck,setRecheck]=useState("");
  const pollRef=useRef(null);
  const tickRef=useRef(null);
  useEffect(()=>()=>{ if(pollRef.current) clearInterval(pollRef.current); if(tickRef.current) clearInterval(tickRef.current); },[]);

  const selected = (()=>{ if(nicheKey==="custom") return {label:customNiche.trim(),group:"Custom",kind:"service"};
    const [gi,ii]=String(nicheKey).split("."); const g=SCOUT_NICHES[Number(gi)];
    if(!g) return null; const label=g.n[Number(ii)]; if(!label) return null; return {label,group:g.g,kind:g.k}; })();
  const isEcom = !!(selected&&selected.kind==="ecom");

  const authToken=async()=>{ const { data:{ session } }=await supabaseClient.auth.getSession(); return session&&session.access_token; };
  const api=async(qs,opts)=>{ const token=await authToken(); if(!token) throw new Error("Session expired — refresh the page.");
    const r=await fetch("/.netlify/functions/lead-scout?"+qs,{...(opts||{}),headers:{"Authorization":"Bearer "+token,...((opts&&opts.headers)||{})}});
    const d=await r.json().catch(()=>({})); if(!r.ok||d.ok===false) throw new Error(d.error||"Request failed"); return d; };
  // A missing Supabase table is the one failure with a specific fix, so it gets a
  // specific message instead of a raw Postgres error.
  const setupMsg=(text)=>/scout_runs|scout_prospects|relation|does not exist|schema cache|could not find/i.test(String(text||""))
    ? "Setup needed — the Lead Scout tables aren't in Supabase yet. Open Supabase → SQL Editor → New query, paste docs/sql/lead-scout-schema.sql, click Run, then try again."
    : "";

  const loadList=async()=>{
    setListLoading(true);
    try{
      const qs=new URLSearchParams({action:"prospects"});
      if(lf.niche) qs.set("niche",lf.niche); if(lf.area) qs.set("area",lf.area);
      if(lf.status) qs.set("status",lf.status); if(lf.minScore>0) qs.set("minScore",String(lf.minScore));
      if(lf.q.trim()) qs.set("q",lf.q.trim());
      const [p,f]=await Promise.all([api(qs.toString()),api("action=facets")]);
      setList(p.prospects||[]); setFacets(f);
    }catch(e){ setMsg(String(e.message||e)); }
    setListLoading(false);
  };
  useEffect(()=>{ if(tab==="list") loadList(); },[tab,lf.niche,lf.area,lf.status,lf.minScore]);
  useEffect(()=>{ api("action=providers").then(r=>setProviders(r.providers)).catch(()=>setProviders({places:false,apollo:false})); },[]);

  const addArea=()=>{ const v=areaInput.trim().replace(/,+$/,""); if(!v) return;
    if(!areas.some(a=>a.toLowerCase()===v.toLowerCase())) setAreas(a=>[...a,v]); setAreaInput(""); };
  // Enter is the ONLY commit key. Comma used to commit too, which made "Gilbert, AZ"
  // impossible to type — it fired on the comma and left you adding " AZ" separately.
  const areaKey=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); addArea(); }
    else if(e.key==="Backspace"&&!areaInput&&areas.length){ setAreas(a=>a.slice(0,-1)); } };

  const run=async()=>{
    if(!selected||!selected.label){ setMsg("Pick a niche first."); return; }
    if(!isEcom&&!areas.length){ setMsg("Add at least one area to search — the scout stays strictly inside the areas you list."); return; }
    setRunState("running"); setRunResult(null); setProgress({stage:"starting",message:"Starting the search…"});
    setMsg(""); setTab("search");
    const id="scout-"+uid()+Date.now().toString(36);
    const token=await authToken();
    if(!token){ setRunState("error"); setMsg("Your session expired — refresh the page and try again."); return; }
    // Preflight: prove the tables exist BEFORE kicking off a run. Without this a
    // missing migration burns several minutes of API spend on work that can never
    // be saved.
    try{ await api("action=facets"); }
    catch(e){ const m=setupMsg((e&&e.message)||e);
      setRunState("error"); setMsg(m||("Couldn't reach the server: "+((e&&e.message)||e))); return; }
    fetch("/.netlify/functions/lead-scout-background",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({id,niche:selected.label,nicheGroup:selected.group,nicheKind:selected.kind,areas,count,filters,notes})}).catch(()=>{});
    const started=Date.now();
    setElapsed(0);
    if(tickRef.current) clearInterval(tickRef.current);
    tickRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-started)/1000)),1000);
    let fails=0, sawRow=false;
    const stop=(text)=>{ clearInterval(pollRef.current); clearInterval(tickRef.current); setRunState("error"); setMsg(text); };
    pollRef.current=setInterval(async()=>{
      if(Date.now()-started>780000){ stop("This run is taking unusually long — it may still finish. Check your call list in a minute."); return; }
      try{
        const r=await api("action=run&id="+encodeURIComponent(id));
        fails=0;
        if(r.progress) setProgress(r.progress);
        if(r.status==="done"){ clearInterval(pollRef.current); clearInterval(tickRef.current); setRunResult(r.result||null); setRunState("done"); loadList(); return; }
        if(r.status==="error"){ stop(setupMsg(r.error)||r.error||"The run hit an error. Try again."); return; }
        if(r.status==="unknown"){
          // The background function never wrote its row. After ~40s that is a real
          // failure, not a slow start — don't leave him staring at a spinner.
          if(Date.now()-started>40000&&!sawRow) stop("The search never started. That usually means the Supabase tables aren't set up yet (run docs/sql/lead-scout-schema.sql), or the site needs a redeploy.");
          return;
        }
        sawRow=true;
      }catch(e){
        // A persistent failure here used to be swallowed forever, so a missing table
        // looked identical to a slow run. Three strikes and we say what happened.
        fails++;
        const text=String((e&&e.message)||e);
        if(setupMsg(text)){ stop(setupMsg(text)); return; }
        if(fails>=3) stop("Lost contact with the server while the search was running: "+text+" — your results may still land in My call list.");
      }
    },4000);
  };

  const setStatus=async(p,status)=>{
    setList(l=>l.map(x=>x.id===p.id?{...x,status}:x));
    try{ await api("action=status&id="+encodeURIComponent(p.id),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})}); }
    catch(e){ setMsg(String(e.message||e)); }
  };
  const removeProspect=async(p)=>{
    if(!window.confirm(`Remove ${p.name} from your list? It can be found again by a future search.`)) return;
    setList(l=>l.filter(x=>x.id!==p.id));
    try{ await api("action=delete&id="+encodeURIComponent(p.id),{method:"POST"}); }catch(e){ setMsg(String(e.message||e)); }
  };
  const toDealPrep=(d,fallbackNiche)=>{
    if(!onDealPrep) return;
    const known=[d.ownerName?`Owner: ${d.ownerName}${d.ownerTitle?` (${d.ownerTitle})`:""}`:"",
      d.phone?`Phone: ${d.phone}`:"", d.employees?`Employees: ${d.employees}`:"",
      d.yearsInBusiness?`In business: ${d.yearsInBusiness}`:"",
      d.rating?`Rating: ${d.rating}★${d.reviewCount?` (${d.reviewCount} reviews)`:""}`:"",
      `Ads: Google ${d.googleAds||"unknown"}, Meta ${d.metaAds||"unknown"}`,
      (d.gaps&&d.gaps.length)?`Gaps found: ${d.gaps.join("; ")}`:"" ].filter(Boolean).join("\n");
    onDealPrep({companyName:d.name,niche:d.niche||fallbackNiche||"",website:d.websiteRaw||d.website||"",
      location:[d.city,d.state].filter(Boolean).join(", "),notes:known});
  };

  // Free backfill: re-reads saved prospects' websites for ad tags. No AI involved.
  const recheckAds=async()=>{
    setRecheck("working"); setMsg("");
    try{ const r=await api("action=recheck-ads",{method:"POST"});
      setMsg(`Ad check done — ${r.checked} sites read, ${r.found} showing advertising tags.`);
      await loadList(); }
    catch(e){ setMsg("Ad re-check failed: "+((e&&e.message)||e)); }
    setRecheck("");
  };

  const exportCSV=()=>{
    // Derived columns so the CSV carries every number found, not just the primaries —
    // this is the file that gets loaded into a dialer.
    const cols=[
      ["Company",p=>p.name],["Owner",p=>p.ownerName],["Owner title",p=>p.ownerTitle],
      ["Business phone",p=>p.phone],["Owner phone",p=>p.ownerPhone],
      ["All phones",p=>(p.phones||[]).map(x=>`${x.number} (${x.whose}/${x.kind})`).join(" | ")],
      ["Business email",p=>p.email],["Owner email",p=>p.ownerEmail],
      ["Website",p=>p.websiteRaw],["Address",p=>p.address],["City",p=>p.city],["State",p=>p.state],
      ["Employees",p=>p.employees],["Years",p=>p.yearsInBusiness],["Revenue est",p=>p.revenueEstimate],
      ["Budget capacity/mo",p=>p.affordability&&p.affordability.known?Math.round(p.affordability.monthlyCapacity):""],
      ["Affordability",p=>p.affordability?(p.affordability.band||"unknown"):""],
      ["Rating",p=>p.rating],["Reviews",p=>p.reviewCount],
      ["Google ads",p=>p.googleAds],["Meta ads",p=>p.metaAds],
      ["Score",p=>p.score],["Score reasons",p=>(p.scoreFactors||[]).map(f=>`${f.label} ${f.points}${f.max?"/"+f.max:""}: ${f.why}`).join(" | ")],
      ["Capped",p=>p.capReason||""],
      ["Recommended package",p=>p.recommendedPackageId],
      ["Verdict",p=>p.verdict],["Best opener",p=>p.bestHook],["Verified by",p=>(p.verifiedBy||[]).join(" + ")],
    ];
    const esc=(v)=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const rows=[cols.map(c=>esc(c[0])).concat([esc("Status")]).join(",")].concat(
      list.map(p=>{ const d=p.data||{}; return cols.map(c=>esc(c[1](d))).concat([esc(p.status)]).join(","); }));
    const blob=new Blob([rows.join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`boldline-prospects-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
  };

  // ── small presentational helpers ───────────────────────────────────────────
  const lbl={fontSize:10.5,fontWeight:700,color:C.textDim,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"};
  const chipBtn=(on)=>({padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:999,cursor:"pointer",
    border:`1px solid ${on?C.gold+"66":C.border}`,background:on?"rgba(200,168,75,0.12)":"rgba(255,255,255,.03)",color:on?C.gold:C.textDim});
  const Fact=({k,v,href})=>(
    <div style={{minWidth:0}}>
      <div style={{fontSize:9.5,fontWeight:700,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em",marginBottom:2}}>{k}</div>
      {v?(href?<a href={href} style={{fontSize:12,color:C.gold,fontWeight:600,textDecoration:"none",wordBreak:"break-word"}}>{v}</a>
         :<div style={{fontSize:12,color:C.text,fontWeight:600,wordBreak:"break-word"}}>{v}</div>)
       :<div style={{fontSize:12,color:C.textMuted,fontStyle:"italic"}}>not found</div>}
    </div>
  );
  // "likely" = a tracking tag for that platform was found on their own website. It
  // proves they're set up to advertise, not that a campaign is live today — so it
  // reads differently from a confirmed sighting.
  const adsPill=(state,label)=>{
    const c=state==="yes"?C.green:state==="likely"?C.gold:state==="no"?C.textMuted:C.textDim;
    const t=state==="yes"?"running":state==="likely"?"likely (tag found)":state==="no"?"not running":"unconfirmed";
    return <span style={{fontSize:10,fontWeight:700,color:c,border:`1px solid ${c}44`,background:c+"14",borderRadius:7,padding:"3px 7px",whiteSpace:"nowrap"}}>{label}: {t}</span>;
  };
  const ScoreBadge=({score})=>{ const t=scoutTier(score); return (
    <div style={{flexShrink:0,textAlign:"center",minWidth:52}}>
      <div style={{width:44,height:44,borderRadius:"50%",border:`2px solid ${t.color}`,background:t.color+"18",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900,color:t.color,margin:"0 auto"}}>{score}</div>
      <div style={{fontSize:8.5,fontWeight:800,color:t.color,textTransform:"uppercase",letterSpacing:".04em",marginTop:3}}>{t.label}</div>
    </div>
  );};

  const ProspectCard=({p})=>{
    const d=(p&&p.data)||{}; const open=openId===p.id;
    const st=SCOUT_STATUSES.find(s=>s.id===p.status)||SCOUT_STATUSES[0];
    return (
      <div style={{...card,padding:"13px 14px",marginBottom:10}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
          <ScoreBadge score={p.score}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,fontWeight:800,color:C.text,lineHeight:1.25}}>{d.name||p.name}</div>
            <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>
              {[[d.city,d.state].filter(Boolean).join(", "),p.niche].filter(Boolean).join(" · ")}
              {d.rating?<span style={{color:C.amber}}>{"  ★ "+d.rating}{d.reviewCount?` (${d.reviewCount})`:""}</span>:null}
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:7}}>
              {adsPill(d.googleAds,"Google")}{adsPill(d.metaAds,"Meta")}
              {d.adLibraryUrl&&(
                <a href={d.adLibraryUrl} target="_blank" rel="noopener noreferrer"
                  title="Opens Meta's Ad Library filtered to this business — the definitive answer on whether their Facebook/Instagram ads are live"
                  style={{fontSize:10,fontWeight:700,color:C.blue,border:`1px solid ${C.blue}44`,background:C.blue+"14",borderRadius:7,padding:"3px 7px",textDecoration:"none",whiteSpace:"nowrap"}}>Check Meta ads ↗</a>)}
              {d.websiteQuality&&d.websiteQuality!=="unknown"&&(
                <span style={{fontSize:10,fontWeight:700,color:C.textDim,border:`1px solid ${C.border}`,borderRadius:7,padding:"3px 7px"}}>site: {d.websiteQuality}</span>)}
              {typeof d.completeness==="number"&&(
                <span style={{fontSize:10,fontWeight:700,color:d.completeness>=70?C.green:d.completeness>=40?C.amber:C.textMuted,border:`1px solid ${C.border}`,borderRadius:7,padding:"3px 7px"}}>{d.completeness}% verified</span>)}
            </div>
          </div>
        </div>

        {d.verdict&&<div style={{fontSize:12.5,color:C.textDim,lineHeight:1.55,marginTop:10}}>{d.verdict}</div>}

        {/* CONTACT — every number and address found, each labelled with whose it is
            and where it came from. Tap any of them to dial straight from the phone. */}
        <div style={{marginTop:12,padding:"11px 12px",borderRadius:11,background:C.bg3,border:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
            <span style={{fontSize:9.5,fontWeight:800,color:C.gold,textTransform:"uppercase",letterSpacing:".05em"}}>Contact</span>
            {!!(d.verifiedBy&&d.verifiedBy.length)&&(
              <span style={{fontSize:9.5,fontWeight:700,color:C.green,border:`1px solid ${C.green}44`,background:C.green+"14",borderRadius:6,padding:"2px 6px"}}>verified by {d.verifiedBy.join(" + ")}</span>)}
          </div>
          {(d.phones&&d.phones.length)||(d.emails&&d.emails.length)?(
            <div style={{display:"grid",gridTemplateColumns:isDesktop?"repeat(2,minmax(0,1fr))":"1fr",gap:8}}>
              {(d.phones||[]).map((ph,i)=>(
                <a key={"p"+i} href={"tel:"+String(ph.number).replace(/[^\d+]/g,"")}
                  style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:9,textDecoration:"none",
                    border:`1px solid ${ph.whose==="owner"?C.gold+"44":C.border}`,background:ph.whose==="owner"?"rgba(200,168,75,0.07)":"rgba(255,255,255,.02)"}}>
                  <span style={{fontSize:13,flexShrink:0}}>{ph.whose==="owner"?"👤":"🏢"}</span>
                  <span style={{flex:1,minWidth:0}}>
                    <span style={{display:"block",fontSize:13,fontWeight:800,color:ph.whose==="owner"?C.gold:C.text}}>{ph.number}</span>
                    <span style={{display:"block",fontSize:9.5,color:C.textMuted,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {[ph.whose==="owner"?"owner":"business",ph.kind!=="unknown"?ph.kind.replace("_"," "):"",ph.label].filter(Boolean).join(" · ")} — {ph.source}
                    </span>
                  </span>
                </a>))}
              {(d.emails||[]).map((em,i)=>(
                <a key={"e"+i} href={"mailto:"+em.address}
                  style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:9,textDecoration:"none",
                    border:`1px solid ${C.border}`,background:"rgba(255,255,255,.02)"}}>
                  <span style={{fontSize:13,flexShrink:0}}>✉️</span>
                  <span style={{flex:1,minWidth:0}}>
                    <span style={{display:"block",fontSize:12,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis"}}>{em.address}</span>
                    <span style={{display:"block",fontSize:9.5,color:C.textMuted,marginTop:1}}>{em.whose==="owner"?"owner":"business"} — {em.source}</span>
                  </span>
                </a>))}
            </div>
          ):<div style={{fontSize:11.5,color:C.textMuted,fontStyle:"italic"}}>No phone or email found — this one has to be reached in person or skipped.</div>}
        </div>

        <div style={{display:"grid",gridTemplateColumns:isDesktop?"repeat(4,minmax(0,1fr))":"repeat(2,minmax(0,1fr))",gap:10,marginTop:12}}>
          <Fact k="Owner" v={d.ownerName?d.ownerName+(d.ownerTitle?` · ${d.ownerTitle}`:""):""} href={d.ownerLinkedin||null}/>
          <Fact k="Employees" v={d.employees}/>
          <Fact k="Website" v={d.website||d.websiteRaw} href={d.website?"https://"+d.website:null}/>
          <Fact k="In business" v={d.yearsInBusiness}/>
          <Fact k="Revenue est." v={d.revenueEstimate}/>
          <Fact k="Budget capacity" v={d.affordability&&d.affordability.known?`~$${Math.round(d.affordability.monthlyCapacity).toLocaleString()}/mo`:""}/>
          <Fact k="Address" v={d.address}/>
          <Fact k="Best package" v={(function(){ const pk=ALL_PKGS.find(x=>x.id===d.recommendedPackageId); return pk?`${pk.name} · from $${pk.price}/mo`:""; })()}/>
        </div>

        {d.capReason&&(
          <div style={{marginTop:10,padding:"9px 11px",borderRadius:9,background:"rgba(248,113,113,0.08)",border:`1px solid ${C.red}33`,fontSize:11.5,color:C.red,lineHeight:1.5}}>
            {d.capReason}
          </div>)}

        {open&&(
          <div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`,display:"flex",flexDirection:"column",gap:12}}>
            {/* WHY IT SCORED THAT — the score is the sum of these, so the number and
                the reasoning can never disagree. */}
            {!!(d.scoreFactors&&d.scoreFactors.length)&&(
              <div>
                <div style={{fontSize:9.5,fontWeight:800,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}>
                  Why it scored {p.score}{d.scoreCappedFrom?` (capped down from ${d.scoreCappedFrom})`:""}
                </div>
                {d.scoreFactors.map((f,i)=>{
                  const neg=f.points<0, pct=f.max?Math.max(0,Math.min(100,(f.points/f.max)*100)):0;
                  const col=neg?C.red:pct>=70?C.green:pct>=40?C.gold:C.textMuted;
                  return (
                    <div key={i} style={{marginBottom:9}}>
                      <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                        <span style={{fontSize:11.5,fontWeight:700,color:C.text,flex:1,minWidth:0}}>{f.label}</span>
                        <span style={{fontSize:11.5,fontWeight:800,color:col,flexShrink:0}}>{neg?f.points:`${f.points}/${f.max}`}</span>
                      </div>
                      {!neg&&f.max>0&&(
                        <div style={{height:4,borderRadius:99,background:"rgba(255,255,255,.06)",margin:"4px 0 4px",overflow:"hidden"}}>
                          <div style={{height:"100%",width:pct+"%",borderRadius:99,background:col}}/>
                        </div>)}
                      {f.why&&<div style={{fontSize:11,color:C.textDim,lineHeight:1.5}}>{f.why}</div>}
                    </div>);
                })}
              </div>)}

            {/* THE MONEY — computed from headcount/revenue, not guessed. */}
            {d.affordability&&(
              <div style={{padding:"11px 12px",borderRadius:10,background:C.bg3,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:9.5,fontWeight:800,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em",marginBottom:7}}>Can they afford you — the math</div>
                {(d.affordability.lines||[]).map((l,i)=>(
                  <div key={i} style={{fontSize:11.5,color:C.textDim,lineHeight:1.6,display:"flex",gap:7}}>
                    <span style={{color:C.textMuted,flexShrink:0}}>{i===(d.affordability.lines.length-1)?"=":"·"}</span><span>{l}</span>
                  </div>))}
                {d.affordability.verdict&&(
                  <div style={{fontSize:11.5,fontWeight:700,marginTop:7,color:d.affordability.band==="comfortable"?C.green:d.affordability.band==="workable"?C.gold:C.red}}>
                    {d.affordability.verdict}
                  </div>)}
                {!d.affordability.known&&<div style={{fontSize:11.5,color:C.amber,lineHeight:1.55,marginTop:2}}>{d.affordability.note}</div>}
                {d.packageDowngradedFrom&&(
                  <div style={{fontSize:11,color:C.amber,lineHeight:1.5,marginTop:6}}>
                    Recommendation stepped down from {(function(){const x=ALL_PKGS.find(y=>y.id===d.packageDowngradedFrom);return x?x.name:d.packageDowngradedFrom;})()} — don't pitch above their budget.
                  </div>)}
              </div>)}

            {d.bestHook&&(
              <div style={{padding:"10px 12px",borderRadius:10,background:"rgba(200,168,75,0.08)",border:`1px solid ${C.gold}33`}}>
                <div style={{fontSize:9.5,fontWeight:800,color:C.gold,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Your opener</div>
                <div style={{fontSize:12.5,color:C.text,lineHeight:1.55,fontStyle:"italic"}}>“{d.bestHook}”</div>
              </div>)}
            <div style={{display:"grid",gridTemplateColumns:isDesktop?"1fr 1fr":"1fr",gap:12}}>
              {!!(d.whyContact&&d.whyContact.length)&&(
                <div><div style={{fontSize:9.5,fontWeight:800,color:C.green,textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Why call them</div>
                  <ul style={{margin:0,paddingLeft:16}}>{d.whyContact.map((x,i)=><li key={i} style={{fontSize:12,color:C.textDim,lineHeight:1.5,marginBottom:4}}>{x}</li>)}</ul></div>)}
              {!!(d.whyNot&&d.whyNot.length)&&(
                <div><div style={{fontSize:9.5,fontWeight:800,color:C.red,textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>What could kill it</div>
                  <ul style={{margin:0,paddingLeft:16}}>{d.whyNot.map((x,i)=><li key={i} style={{fontSize:12,color:C.textDim,lineHeight:1.5,marginBottom:4}}>{x}</li>)}</ul></div>)}
            </div>
            {!!(d.gaps&&d.gaps.length)&&(
              <div><div style={{fontSize:9.5,fontWeight:800,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Gaps BoldLine fixes</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{d.gaps.map((x,i)=>
                  <span key={i} style={{fontSize:11,color:C.textDim,border:`1px solid ${C.border}`,background:C.bg3,borderRadius:7,padding:"4px 8px"}}>{x}</span>)}</div></div>)}
            {d.adsEvidence&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.5}}><b style={{color:C.textDim}}>Ad evidence:</b> {d.adsEvidence}</div>}
            {d.adTechNote&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.5}}><b style={{color:C.textDim}}>Ad-tag check:</b> {d.adTechNote}</div>}
            {d.seoNote&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.5}}><b style={{color:C.textDim}}>Search presence:</b> {d.seoNote}</div>}
            {d.ownerSource&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.5}}><b style={{color:C.textDim}}>Owner info from:</b> {d.ownerSource}</div>}
            {d.dataNotes&&<div style={{fontSize:11,color:C.amber,lineHeight:1.5}}><b>Verify before quoting:</b> {d.dataNotes}</div>}
            {!!(d.sources&&d.sources.length)&&(
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{d.sources.map((s,i)=>
                <a key={i} href={s} target="_blank" rel="noopener noreferrer" style={{fontSize:10.5,color:C.blue,textDecoration:"none",wordBreak:"break-all"}}>source {i+1} ↗</a>)}</div>)}
          </div>
        )}

        {/* Status + delete lead the row so that when it wraps at ~390px you get two
            tidy lines (state controls, then the two actions) instead of a stray ✕. */}
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:12,justifyContent:"flex-end"}}>
          <select value={p.status} onChange={e=>setStatus(p,e.target.value)}
            style={{padding:"7px 9px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${st.color}44`,background:st.color+"14",color:st.color,cursor:"pointer"}}>
            {SCOUT_STATUSES.map(s=><option key={s.id} value={s.id} style={{background:C.bg3,color:C.text}}>{s.label}</option>)}
          </select>
          <button onClick={()=>removeProspect(p)} title="Remove from list" style={{marginRight:"auto",width:28,height:28,borderRadius:8,border:"none",background:"rgba(255,255,255,.05)",color:C.textMuted,cursor:"pointer",fontSize:12}}>✕</button>
          <button onClick={()=>setOpenId(open?null:p.id)} style={{padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>{open?"Less":"Full detail"}</button>
          <button onClick={()=>toDealPrep(d,p.niche)} style={{padding:"7px 13px",fontSize:11.5,fontWeight:800,borderRadius:9,border:"none",background:C.gradB,color:"#1a1400",cursor:"pointer"}}>Deal Prep →</button>
        </div>
      </div>
    );
  };

  const back = !isDesktop && (
    <button onClick={onBack} style={{width:32,height:32,borderRadius:9,border:"none",background:"rgba(255,255,255,0.05)",color:C.textDim,cursor:"pointer",fontSize:17,flexShrink:0}}>‹</button>
  );
  const newProspects=(runResult&&runResult.prospects)||[];
  const stats=(runResult&&runResult.stats)||null;

  return (
    <div style={{flex:1,overflowY:"auto",padding:isDesktop?"26px 32px 60px":"16px 14px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        {back}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:isDesktop?24:19,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>Lead Scout</div>
          <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>Find businesses worth calling, ranked worst-to-best-use-of-your-time.</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>setTab("search")} style={chipBtn(tab==="search")}>New search</button>
        <button onClick={()=>setTab("list")} style={chipBtn(tab==="list")}>My call list{facets&&facets.total?` (${facets.total})`:""}</button>
      </div>

      {tab==="search"&&(
        <div style={{maxWidth:760}}>
          {/* Which real-data sources are live. AI research always runs; the two
              providers upgrade it from "researched" to "verified". */}
          {providers&&(
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
              <span style={{fontSize:10,fontWeight:800,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em"}}>Data sources</span>
              {[["AI web research",true,"always on"],
                ["Google Places",providers.places,"verified phone + address"],
                ["Apollo",providers.apollo,"owner name + direct contact"]].map(([label,on,hint])=>(
                <span key={label} title={hint} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:10.5,fontWeight:700,padding:"4px 9px",borderRadius:999,
                  border:`1px solid ${on?C.green+"44":C.border}`,background:on?C.green+"12":"rgba(255,255,255,.03)",color:on?C.green:C.textMuted}}>
                  {on?"✓":"○"} {label}
                </span>))}
              {(!providers.places||!providers.apollo)&&(
                <span style={{fontSize:10.5,color:C.textMuted}}>— add the missing API keys in Netlify for verified data</span>)}
            </div>)}
          <div style={{...card}}>
            <div style={S.col12}>
              <div>
                <div style={lbl}>Industry / niche *</div>
                <select value={nicheKey} onChange={e=>setNicheKey(e.target.value)}
                  style={{...inp,cursor:"pointer",appearance:"none"}}>
                  <option value="">Choose a niche…</option>
                  {SCOUT_NICHES.map((g,gi)=>(
                    <optgroup key={gi} label={g.g}>
                      {g.n.map((n,ii)=><option key={ii} value={`${gi}.${ii}`}>{n}</option>)}
                    </optgroup>
                  ))}
                  <optgroup label="Other"><option value="custom">Custom niche…</option></optgroup>
                </select>
                {nicheKey==="custom"&&(
                  <input value={customNiche} onChange={e=>setCustomNiche(e.target.value)} placeholder="Type the niche, e.g. Mobile IV Hydration"
                    style={{...inp,marginTop:8}}/>)}
                {isEcom&&(
                  <div style={{fontSize:11,color:C.textDim,marginTop:7,lineHeight:1.5}}>
                    E-commerce brands sell online, so the area filter is optional — leave it empty to search nationwide, or add areas to find brands based near you.
                  </div>)}
              </div>

              <div>
                <div style={lbl}>{isEcom?"Areas (optional for online brands)":"Areas to search *"}</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:areas.length?8:0}}>
                  {areas.map(a=>(
                    <span key={a} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 8px 5px 11px",borderRadius:999,
                      border:`1px solid ${C.gold}44`,background:"rgba(200,168,75,0.10)",fontSize:11.5,fontWeight:700,color:C.gold}}>
                      {a}
                      <button onClick={()=>setAreas(x=>x.filter(v=>v!==a))} style={{border:"none",background:"none",color:C.gold,cursor:"pointer",fontSize:12,lineHeight:1,padding:0}}>✕</button>
                    </span>))}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <input value={areaInput} onChange={e=>setAreaInput(e.target.value)} onKeyDown={areaKey}
                    placeholder="e.g. Phoenix, AZ — press Enter to add" style={{...inp,flex:1,minWidth:0}}/>
                  <button onClick={addArea} style={{padding:"0 16px",fontSize:12.5,fontWeight:800,borderRadius:10,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.05)",color:C.textDim,cursor:"pointer",flexShrink:0}}>Add</button>
                </div>
                <div style={{fontSize:10.5,color:C.textMuted,marginTop:6,lineHeight:1.5}}>
                  Add as many as you want — a city, a ZIP, or a region like “East Valley, AZ”. Results are verified against these areas and anything outside them is thrown out.
                </div>
              </div>

              <div>
                <div style={lbl}>How many to find</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {[6,12,20,30].map(n=><button key={n} onClick={()=>setCount(n)} style={chipBtn(count===n)}>{n}</button>)}
                </div>
              </div>

              <button onClick={()=>setShowAdv(v=>!v)} style={{background:"none",border:"none",color:C.textDim,fontSize:11.5,fontWeight:700,cursor:"pointer",padding:"2px 0",textAlign:"left"}}>

              </button>
              {showAdv&&(
                <div style={{display:"flex",flexDirection:"column",gap:12,padding:"12px 13px",borderRadius:11,background:C.bg3,border:`1px solid ${C.border}`}}>

                    <div style={lbl}>Website</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {[["any","Doesn't matter"],["none","No / weak site (easy sell)"],["has","Has a real site"]].map(([v,t])=>
                        <button key={v} onClick={()=>setFilters(f=>({...f,websiteState:v}))} style={chipBtn(filters.websiteState===v)}>{t}</button>)}
                    </div>
                  </div>
                  <div>
                    <div style={lbl}>Currently advertising</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {[["any","Doesn't matter"],["not","Not advertising (untapped)"],["running","Already advertising (has budget)"]].map(([v,t])=>
                        <button key={v} onClick={()=>setFilters(f=>({...f,adsState:v}))} style={chipBtn(filters.adsState===v)}>{t}</button>)}
                    </div>
                  </div>
                  <div>
                    <div style={lbl}>Minimum size</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {[[0,"Any size"],[3,"3+ employees"],[10,"10+ employees"],[25,"25+ employees"]].map(([v,t])=>

                  </div>
                  <div>
                    <div style={lbl}>Anything else the scout should know <span style={{color:C.textMuted,fontWeight:500,textTransform:"none"}}>(optional)</span></div>

                      placeholder="e.g. skip anyone I've already called, focus on family-owned shops…" style={{...inp,resize:"vertical",fontFamily:"inherit"}}/>
                  </div>
                </div>)}

              <button onClick={run} disabled={runState==="running"}

                {runState==="running"?"Scouting…":"🔎 Find prospects"}
              </button>
              <div style={{fontSize:10.5,color:C.textMuted,lineHeight:1.5,textAlign:"center"}}>
                A run does live web research on every business it finds — expect 2–6 minutes and a few cents to about a dollar of API usage depending on how many you ask for.
              </div>
              {msg&&<div style={{fontSize:12,color:runState==="error"?C.red:C.textDim,lineHeight:1.5,textAlign:"center"}}>{msg}</div>}
            </div>
          </div>

          {runState==="running"&&progress&&(
            <div style={{...card,marginTop:12}}>
              <div style={{display:"flex",alignItems:"baseline",gap:10}}>
                <div style={{fontSize:12.5,color:C.text,fontWeight:700,flex:1,minWidth:0}}>{progress.message||"Working…"}</div>
                {/* A visible clock so a slow run reads as "working" rather than "frozen". */}
                <div style={{fontSize:11,color:C.textMuted,fontVariantNumeric:"tabular-nums",flexShrink:0}}>
                  {Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,"0")}
                </div>
              </div>
              <div style={{height:6,borderRadius:99,background:"rgba(255,255,255,.06)",marginTop:10,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:99,background:C.gradB,transition:"width .4s",
                  width:progress.total?`${Math.max(6,Math.round((progress.enriched/progress.total)*100))}%`:"18%"}}/>
              </div>
              <div style={{fontSize:10.5,color:C.textMuted,marginTop:7,lineHeight:1.5}}>
                Deep research takes 30–60 seconds per business, several at a time — a full run is usually 2–6 minutes.
                Prospects are saved to your call list as each batch finishes, so you can close this and come back.
              </div>
            </div>)}

          {runState==="done"&&runResult&&(
            <div style={{marginTop:16}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12}}>
                <div style={{fontSize:13,color:C.text,fontWeight:700}}>{runResult.message}</div>
                {stats&&(
                  <div style={{fontSize:10.5,color:C.textMuted,marginLeft:"auto"}}>
                    {stats.found} found · {stats.duplicates||0} already on your list · {stats.outOfArea||0} outside your areas
                  </div>)}
              </div>
              {runResult.coverageNote&&<div style={{fontSize:11,color:C.textMuted,lineHeight:1.5,marginBottom:12}}>{runResult.coverageNote}</div>}
              {/* Surface research failures. These used to be collected and silently
                  dropped, so a broken research step looked like "found nothing new". */}
              {!!(runResult.errors&&runResult.errors.length)&&(
                <div style={{...card,marginBottom:12,border:`1px solid ${C.red}44`,background:"rgba(248,113,113,0.06)"}}>
                  <div style={{fontSize:11,fontWeight:800,color:C.red,textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>Research errors</div>
                  {runResult.errors.map((e,i)=><div key={i} style={{fontSize:11.5,color:C.textDim,lineHeight:1.55,marginBottom:4,wordBreak:"break-word"}}>{e}</div>)}
                  <div style={{fontSize:10.5,color:C.textMuted,marginTop:6}}>Send this text to Claude — it names the exact cause.</div>
                </div>)}
              {!!(runResult.providerNotes&&runResult.providerNotes.length)&&(
                <div style={{...card,marginBottom:12,border:`1px solid ${C.border}`}}>
                  <div style={{fontSize:10,fontWeight:800,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>Data providers</div>
                  {runResult.providerNotes.map((n,i)=><div key={i} style={{fontSize:11.5,color:/fail|threw|credit|paid plan/i.test(n)?C.amber:C.textDim,lineHeight:1.55,marginBottom:3}}>{n}</div>)}
                </div>)}
              {runResult.engine&&<div style={{fontSize:10.5,color:C.textMuted,marginBottom:10}}>Research engine: {runResult.engine}</div>}
              {newProspects.map((d,i)=>(
                <ProspectCard key={d.name+i} p={{id:"new-"+i,name:d.name,niche:d.niche||(selected&&selected.label),score:d.score,status:"new",data:d}}/>
              ))}
              {!newProspects.length&&(
                <div style={{...card,fontSize:12.5,color:C.textDim,lineHeight:1.6}}>
                  Nothing new this time. Try adding more areas, widening the niche, or raising the count — and remember the scout deliberately skips anything already on your list.
                </div>)}
            </div>)}
        </div>
      )}

      {tab==="list"&&(
        <div style={{maxWidth:900}}>
          <div style={{...card,marginBottom:14}}>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{flex:"1 1 200px",minWidth:0}}>
                <div style={lbl}>Search</div>
                <input value={lf.q} onChange={e=>setLf(f=>({...f,q:e.target.value}))} onKeyDown={e=>{ if(e.key==="Enter") loadList(); }}
                  placeholder="Company name…" style={inp}/>
              </div>
              <div style={{flex:"1 1 160px",minWidth:0}}>
                <div style={lbl}>Niche</div>
                <select value={lf.niche} onChange={e=>setLf(f=>({...f,niche:e.target.value}))} style={{...inp,cursor:"pointer"}}>
                  <option value="">All niches</option>
                  {facets&&facets.niches.map(n=><option key={n.value} value={n.value}>{n.value} ({n.count})</option>)}
                </select>
              </div>
              <div style={{flex:"1 1 160px",minWidth:0}}>
                <div style={lbl}>Area</div>
                <select value={lf.area} onChange={e=>setLf(f=>({...f,area:e.target.value}))} style={{...inp,cursor:"pointer"}}>
                  <option value="">All areas</option>
                  {facets&&facets.areas.map(n=><option key={n.value} value={n.value}>{n.value} ({n.count})</option>)}
                </select>
              </div>
              <div style={{flex:"1 1 140px",minWidth:0}}>
                <div style={lbl}>Status</div>
                <select value={lf.status} onChange={e=>setLf(f=>({...f,status:e.target.value}))} style={{...inp,cursor:"pointer"}}>
                  <option value="">All</option>
                  {SCOUT_STATUSES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginTop:12}}>
              <span style={{fontSize:10.5,fontWeight:700,color:C.textMuted,textTransform:"uppercase",letterSpacing:".05em"}}>Min score</span>
              {[0,42,62,80].map(v=><button key={v} onClick={()=>setLf(f=>({...f,minScore:v}))} style={chipBtn(lf.minScore===v)}>{v===0?"Any":v+"+"}</button>)}
              <div style={{marginLeft:"auto",display:"flex",gap:8}}>
                <button onClick={recheckAds} disabled={recheck==="working"} title="Re-reads every saved prospect's website for Google/Meta ad tracking tags. Free — no AI, no credits."
                  style={{padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.04)",color:recheck==="working"?C.textMuted:C.textDim,cursor:recheck==="working"?"default":"pointer"}}>{recheck==="working"?"Checking…":"Re-check ads"}</button>
                <button onClick={loadList} style={{padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer"}}>Refresh</button>
                <button onClick={exportCSV} disabled={!list.length} style={{padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:9,border:`1px solid ${C.border}`,background:"rgba(255,255,255,.04)",color:list.length?C.textDim:C.textMuted,cursor:list.length?"pointer":"default"}}>Export CSV</button>
              </div>
            </div>
          </div>

          {listLoading?<div style={{fontSize:12,color:C.textMuted,padding:"20px 2px"}}>Loading your list…</div>
           :list.length?list.map(p=><ProspectCard key={p.id} p={p}/>)
           :<div style={{...card,fontSize:12.5,color:C.textDim,lineHeight:1.6}}>
              No prospects yet{facets&&facets.total?" for these filters":""}. Run a search and they'll collect here — the same business never gets added twice.
            </div>}
        </div>
      )}
    </div>
  );
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────
// A month view + agenda that aggregates every dated thing across the OS:
// meetings (Calendly), invoice auto-charges + "review leads" reminders,
// contract renewals/expiries, and scheduled newsletter + blog content. Pure
// data aggregation — no AI — so it works regardless of API-credit balance.
function buildCalendarEvents({ clients, newsletter, blog, meetings }) {
  const out = [];
  const toYMD = (v) => { const d = new Date(v); if (isNaN(d)) return null; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const shift = (v, n) => { const d = new Date(v); if (isNaN(d)) return null; d.setDate(d.getDate()+n); return d; };
  (clients||[]).forEach(c => {
    if (c.internal) return; // skip the internal house account
    if (c.billingStatus==="active" && c.billingNextCharge) {
      const yb = toYMD(c.billingNextCharge);
      if (yb) out.push({ ymd:yb, kind:"invoice", title:`Invoice — ${c.name}`, sub:"Auto-charges the card on file", clientId:c.id });
      const r = shift(c.billingNextCharge, -7); const ry = r && toYMD(r);
      if (ry) out.push({ ymd:ry, kind:"review", title:`Review leads — ${c.name}`, sub:"Approve/exclude before the invoice", clientId:c.id });
    }
    if (c.contractEnd) {
      const yc = toYMD(c.contractEnd);
      if (yc) out.push({ ymd:yc, kind:"contract", title:`Contract ends — ${c.name}`, sub:"Renew or offboard", clientId:c.id });
      const r = shift(c.contractEnd, -30); const ry = r && toYMD(r);
      if (ry) out.push({ ymd:ry, kind:"renewal", title:`Renewal window — ${c.name}`, sub:"~30 days to contract end", clientId:c.id });
    }
  });
  (newsletter||[]).forEach(e => { const when = e.status==="sent"?e.sent_at:e.scheduled_for; const yn = when&&toYMD(when); if (yn) out.push({ ymd:yn, kind:"newsletter", title:`Newsletter: ${e.subject||"Companion email"}`, sub: e.status==="sent"?"Sent":"Scheduled to send" }); });
  (blog||[]).forEach(p => { const yp = p.published_at&&toYMD(p.published_at); if (yp) out.push({ ymd:yp, kind:"blog", title:`Blog: ${p.title||"Post"}`, sub: p.status==="draft"?"Publishes":"Published" }); });
  (meetings||[]).forEach(m => { const ym = m.start&&toYMD(m.start); if (!ym) return; const t = new Date(m.start); const time = isNaN(t)?"":t.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); out.push({ ymd:ym, kind:"meeting", title: m.inviteeName?`Meeting: ${m.inviteeName}`:(m.name||"Meeting"), sub:[time,m.name].filter(Boolean).join(" · "), joinUrl:m.joinUrl||null }); });
  return out;
}

    catch{ setDigestState("error"); }

  })(); return ()=>{ alive=false; }; },[]);
  const addEvent=async()=>{ if(!addForm.title.trim()||!addForm.date) return; setSaving(true);

    setSaving(false);
    if(r&&r.ok===false){ window.alert(/relation|does not exist|schema cache|could not find/i.test(r.error||"")?"One-time setup: run docs/sql/calendar-schema.sql in Supabase, then try again.":("Couldn't save: "+(r.error||"error"))); return; }
    await loadManual(); setSel(addForm.date); setShowAdd(false); setAddForm({title:"",date:"",time:"",kind:"meeting",note:""}); };
  const deleteManual=async(id)=>{ if(!window.confirm("Delete this event?")) return; await cal({action:"delete",id}); setManual(m=>(m||[]).filter(x=>x.id!==id)); };

  const manualEvents=(manual||[]).map(m=>({ymd:m.event_date,kind:m.kind||"other",title:m.title,sub:[m.event_time,m.note].filter(Boolean).join(" · "),manual:true,id:m.id}));
  const events=[...buildCalendarEvents({clients,newsletter:nl,blog:bl,meetings:mt}),...manualEvents];
  const byDay={}; events.forEach(e=>{ (byDay[e.ymd]=byDay[e.ymd]||[]).push(e); });

            {cells.map((d,i)=>{ const ymd=ymdOf(d); const inMonth=d.getMonth()===mo; const isToday=ymd===todayYMD; const isSel=ymd===sel; const evs=byDay[ymd]||[]; const kinds=[...new Set(evs.map(e=>e.kind))].slice(0,4);
              return (

function HomeScreen({clients,onSelect,onAdd,onAddDemo,onLogout,onRevenue,onSegment,onOpenMyAds,onDealPrep,onLeadScout,hasMyAccount,isDesktop}) {
  const [search,setSearch]     = useState("");
  const [stageFilter,setStageF]= useState("all");
  const [nicheFilter,setNicheF]= useState("all");
  const [sortBy,setSortBy]     = useState("name"); // name | health | leads | expiry
  const [showFilters,setShowF] = useState(false);

  // The GUARANTEED FLOOR, not revenue: under the greater-of model this is the least
  // every client can bill in a month, and a good month bills more. Actual invoiced
  // revenue lives on the Revenue screen, which reads it from Stripe.
  const MRR       = clients.reduce((s,c)=>s+((findPkg(c.packageId) && findPkg(c.packageId).price)||0),0);
  const active    = clients.filter(c=>c.stage==="active").length;
  const allAlerts = clients.flatMap(c=>getAlerts(c));
  const expiring  = clients.filter(c=>{ const d=daysUntil(c.contractEnd); return d>=0&&d<=30; });

  // ── Filter + sort pipeline ─────────────────────────────────────────────────
  const q = search.toLowerCase().trim();
  const filtered = clients
    .filter(cl=>{
      if (q) {
        const pkg = findPkg(cl.packageId);
        const haystack = [cl.name,cl.contactName,cl.niche,cl.email,(pkg && pkg.name),(pkg && pkg.platform)].join(" ").toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      if (stageFilter!=="all" && cl.stage!==stageFilter) return false;
      if (nicheFilter!=="all" && cl.niche!==nicheFilter)  return false;
      return true;
    })
    .sort((a,b)=>{
      if (sortBy==="health")  return calcHealth(b)-calcHealth(a);
      if (sortBy==="leads")   return (b.leads||0)-(a.leads||0);
      if (sortBy==="expiry")  return daysUntil(a.contractEnd)-daysUntil(b.contractEnd);
      return a.name.localeCompare(b.name); // default: alphabetical
    });

  const hasActiveFilters = stageFilter!=="all" || nicheFilter!=="all" || sortBy!=="name";
