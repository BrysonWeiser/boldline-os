// ─── VISUAL CONTENT EDITOR ────────────────────────────────────────────────────
// "Edit the words, keep the formatting." Renders stored HTML (a blog article
// fragment OR a full newsletter email doc) as readable, formatted, contentEditable
// content so the owner edits text in place instead of reading raw HTML. Save keeps
// the exact layout: a full email doc's <!doctype>/<head>/<body> shell is split off
// and re-stitched around the edited body, so the wrapper is never lost. A one-tap
// toggle drops to raw HTML for power edits.
const splitDoc = (html) => {
  const m = /^([\s\S]*<body[^>]*>)([\s\S]*)(<\/body>[\s\S]*)$/i.exec(html||"");
  return m ? {prefix:m[1], inner:m[2], suffix:m[3]} : {prefix:"", inner:html||"", suffix:""};
};
function VisualEditor({html, onChange, itemKey, light, disabled}) {
  const [raw,setRaw]=useState(false);
  const ref=useRef(null);
  const parts=useRef(splitDoc(html));
  // Re-seed the editable area when the item changes or when toggling back from raw.
  useEffect(()=>{ parts.current=splitDoc(html); if(ref.current&&!raw) ref.current.innerHTML=parts.current.inner; },[itemKey]);
  useEffect(()=>{ if(!raw&&ref.current) ref.current.innerHTML=parts.current.inner; },[raw]);
  const emit=()=>{ if(ref.current) onChange(parts.current.prefix+ref.current.innerHTML+parts.current.suffix); };
  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
        <button type="button" onClick={()=>{ parts.current=splitDoc(html); setRaw(r=>!r); }}
          style={{background:"none",border:"none",color:C.gold,fontSize:10.5,fontWeight:700,cursor:"pointer",padding:0,borderBottom:`1px solid ${C.borderAccent}`}}>
          {raw?"◀ Visual editor":"Edit raw HTML ▶"}
        </button>
      </div>
      {raw?(
        <textarea value={html||""} onChange={e=>onChange(e.target.value)} disabled={disabled} rows={16} spellCheck={false}
          style={{width:"100%",padding:"10px",fontSize:11.5,lineHeight:1.55,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.text,fontFamily:"ui-monospace,Menlo,Consolas,monospace",resize:"vertical"}}/>
      ):(
        <div ref={ref} contentEditable={!disabled} suppressContentEditableWarning onInput={emit} onBlur={emit}
          style={{minHeight:240,maxHeight:"52dvh",overflowY:"auto",padding:light?"18px 20px":"14px 16px",borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:light?"#ffffff":"rgba(255,255,255,.04)",color:light?"#1F2937":C.text,lineHeight:1.7,fontSize:14.5,outline:"none",cursor:disabled?"default":"text"}}/>
      )}
    </div>
  );
}

// ─── BLOG MANAGEMENT ──────────────────────────────────────────────────────────
// Owner panel for the AI-written marketing blog: set the weekly cadence, write
// a post on demand, and regenerate/delete any post the AI gets wrong. All
// actions hit blog-admin.mjs under the owner's Supabase session (same auth
// gate as DocuSign/Google Ads above).
function BlogManagementCard() {
  const [posts,setPosts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [cadence,setCadence]=useState(null);
  const [cadenceInput,setCadenceInput]=useState("1");
  const [cadenceState,setCadenceState]=useState("idle"); // idle | saving | saved
  const [genState,setGenState]=useState("idle");         // idle | generating
  const [busyId,setBusyId]=useState(null);               // postId mid regenerate/delete
  const [confirmId,setConfirmId]=useState(null);         // postId armed for delete confirm
  const [bulkConfirm,setBulkConfirm]=useState(null);     // "rewrite" | "rebuild" armed for confirm
  const [bulkProgress,setBulkProgress]=useState(null);   // {type,phase,done,total} while a bulk op runs
  const [msg,setMsg]=useState("");

  const call=async(action,extra)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh the page and log in again.");
    const r=await fetch("/.netlify/functions/blog-admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"Request failed.");
    return d;
  };

  // AI generation takes longer than a normal function is allowed to run, so it
  // runs as a background job (returns 202 immediately) and we poll list() for
  // the result. callBg just starts it; pollList watches until it lands.
  const callBg=async(payload)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh the page and log in again.");
    const r=await fetch("/.netlify/functions/blog-write-background",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(payload)});
    if(!(r.status>=200&&r.status<300)){ let d={}; try{ d=await r.json(); }catch(e){} throw new Error(d.error||"Couldn't start the writer. Refresh and try again."); }
  };
  const pollList=async(detect,timeoutMs=150000)=>{
    const start=Date.now();
    while(Date.now()-start<timeoutMs){
      await new Promise(res=>setTimeout(res,4000));
      let fresh; try{ fresh=(await call("list")).posts||[]; }catch(e){ continue; }
      if(detect(fresh)){ setPosts(fresh); return true; }
    }
    return false;
  };

  const loadAll=async()=>{
    setLoading(true); setMsg("");
    try{
      const [listRes,settingsRes]=await Promise.all([call("list"),call("get-settings")]);
      setPosts(listRes.posts||[]);
      setCadence(settingsRes.postsPerWeek);
      setCadenceInput(String(settingsRes.postsPerWeek));
    }catch(e){ setMsg(e.message); }
    setLoading(false);
  };
  useEffect(()=>{ loadAll(); },[]);

  // ── Live refresh ── scheduled/autopublished posts (and edits from another tab)
  // appear on their own, no page reload. We pause while a foreground op is mid-
  // flight (generate / bulk / per-post busy) so a background reload never yanks
  // the list out from under a running action. `blog_posts` gives instant updates
  // once it's added to the supabase_realtime publication; otherwise the 30s poll
  // + tab-focus refetch keep it live. opBusyRef keeps silentReload identity
  // stable so the realtime channel isn't torn down on every keystroke of state.
  const opBusyRef=useRef(false);
  useEffect(()=>{ opBusyRef.current=(genState!=="idle"||!!busyId||!!bulkProgress); },[genState,busyId,bulkProgress]);
  const silentReload=useCallback(async()=>{
    if(opBusyRef.current) return;              // don't fight a running op
    try{ const listRes=await call("list"); setPosts(listRes.posts||[]); }
    catch(e){ /* background refresh — keep the last good list on error */ }
  },[]);
  useLiveData(silentReload, { table:"blog_posts", interval:30000 });

  const saveCadence=async()=>{
    const n=Math.round(Number(cadenceInput));
    if(!Number.isFinite(n)||n<1||n>14){ setMsg("Posts per week must be 1–14."); return; }
    setCadenceState("saving"); setMsg("");
    try{ await call("set-cadence",{postsPerWeek:n}); setCadence(n); setCadenceState("saved"); setTimeout(()=>setCadenceState("idle"),1500); }
    catch(e){ setCadenceState("idle"); setMsg(e.message); }
  };

  const generateNow=async()=>{
    setGenState("generating"); setMsg("Writing and publishing… this can take up to a minute.");
    const beforeIds=new Set(posts.map(p=>p.id));
    try{
      await callBg({action:"generate-now"});
      const ok=await pollList(fresh=>fresh.some(p=>!beforeIds.has(p.id)));
      setMsg(ok?"":"Still publishing — it'll appear here shortly, or hit refresh in a minute.");
    }catch(e){ setMsg(e.message); }
    setGenState("idle");
  };

  const regenerate=async(postId)=>{
    setBusyId(postId); setMsg("Rewriting… this can take up to a minute.");
    const before=posts.find(p=>p.id===postId);
    const beforeTitle=before?before.title:null;
    try{
      await callBg({action:"regenerate",postId});
      const ok=await pollList(fresh=>{ const n=fresh.find(p=>p.id===postId); return n&&n.title!==beforeTitle; });
      setMsg(ok?"":"Still rewriting — refresh in a minute to see it.");
    }catch(e){ setMsg(e.message); }
    setBusyId(null);
  };

  const doDelete=async(postId)=>{
    setBusyId(postId); setConfirmId(null); setMsg("");
    try{ await call("delete",{postId}); setPosts(p=>p.filter(x=>x.id!==postId)); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };

  // Manual editor: "get" fetches the full post (list rows omit body_html),
  // "update" saves owner edits in place — same slug/URL, changes live at once.
  const [editor,setEditor]=useState(null);        // full post being edited, or null
  const [editorSaving,setEditorSaving]=useState(false);
  const openEditor=async(postId)=>{
    setBusyId(postId); setMsg("");
    try{ const d=await call("get",{postId}); setEditor(d.post); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const setEd=(k,v)=>setEditor(p=>({...p,[k]:v}));
  const saveEditor=async()=>{
    setEditorSaving(true); setMsg("");
    try{
      const d=await call("update",{postId:editor.id,title:editor.title,category:editor.category,excerpt:editor.excerpt,meta_description:editor.meta_description,body_html:editor.body_html});
      setPosts(p=>p.map(x=>x.id===editor.id?d.post:x));
      setEditor(null);
    }catch(e){ setMsg(e.message); }
    setEditorSaving(false);
  };

  // Scheduled-pipeline controls: publish a draft early, move its go-live time,
  // or write the next post straight into the review queue.
  const [reschedId,setReschedId]=useState(null);
  const [reschedVal,setReschedVal]=useState("");
  const toLocalInput=(iso)=>{ const d=new Date(iso); const z=(n)=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes()); };
  const publishNow=async(postId)=>{
    setBusyId(postId); setMsg("");
    try{ const d=await call("publish-now",{postId}); setPosts(p=>p.map(x=>x.id===postId?d.post:x)); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const saveReschedule=async(postId)=>{
    const when=new Date(reschedVal);
    if(isNaN(when)||when.getTime()<=Date.now()){ setMsg("Pick a date and time in the future."); return; }
    setBusyId(postId); setMsg("");
    try{ const d=await call("reschedule",{postId,when:when.toISOString()}); setPosts(p=>p.map(x=>x.id===postId?d.post:x)); setReschedId(null); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const writeScheduled=async()=>{
    setGenState("generating"); setMsg("Writing the post… this can take up to a minute.");
    const beforeIds=new Set(posts.map(p=>p.id));
    try{
      await callBg({action:"generate-scheduled"});
      const ok=await pollList(fresh=>fresh.some(p=>!beforeIds.has(p.id)));
      setMsg(ok?"":"Still writing — it'll appear here shortly, or hit refresh in a minute.");
    }catch(e){ setMsg(e.message); }
    setGenState("idle");
  };
  // Enforce one-per-week on existing scheduled drafts: any that are stacked in
  // the same week get spread onto consecutive open Monday slots.
  const respaceSchedule=async()=>{
    setGenState("generating"); setMsg("Spacing scheduled posts to one per week…");
    try{
      const d=await call("respace-schedule");
      await loadAll();
      setMsg(d.moved?`Done — moved ${d.moved} post${d.moved!==1?"s":""} so there's exactly one per week.`:"Already one per week — nothing to move.");
    }catch(e){ setMsg(e.message); }
    setGenState("idle");
  };

  // Both bulk flows are sequential client-side loops: each post's AI write is
  // kicked off as a background job (callBg) and we poll list() until it lands,
  // so nothing hits the synchronous function timeout and progress shows per post.
  const rewriteAll=async()=>{
    const targets=posts.map(p=>({id:p.id,title:p.title}));
    setBulkConfirm(null); setMsg("");
    setBulkProgress({type:"rewrite",done:0,total:targets.length});
    let done=0;
    try{
      for(const t of targets){
        await callBg({action:"regenerate",postId:t.id});
        await pollList(fresh=>{ const n=fresh.find(x=>x.id===t.id); return n&&n.title!==t.title; });
        done++; setBulkProgress({type:"rewrite",done,total:targets.length});
      }
    }catch(e){
      setMsg(`Rewrite stopped after ${done} of ${targets.length} — ${e.message}. The rest are unchanged; retry individually or try Rewrite All again.`);
    }
    setBulkProgress(null);
  };

  const rebuildFromScratch=async()=>{
    const targetCount=posts.length||3;
    setBulkConfirm(null); setMsg("");
    setBulkProgress({type:"rebuild",phase:"deleting",done:0,total:targetCount});
    try{
      await call("delete-all");
      setPosts([]);
      const known=new Set();
      for(let i=0;i<targetCount;i++){
        setBulkProgress({type:"rebuild",phase:"writing",done:i,total:targetCount});
        await callBg({action:"generate-now"});
        await pollList(fresh=>{ const fresh2=fresh.filter(p=>!known.has(p.id)); if(fresh2.length){ fresh2.forEach(p=>known.add(p.id)); return true; } return false; });
        setBulkProgress({type:"rebuild",phase:"writing",done:i+1,total:targetCount});
      }
    }catch(e){
      setMsg(`Rebuild stopped partway — ${e.message}. Use "Write & Schedule" to keep adding posts, or try Rebuild again.`);
    }
    setBulkProgress(null);
  };

  const fmtDate=(iso)=>iso?new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
  const bulkBusy=!!bulkProgress;

  return (
    <div style={{backgroundColor:C.bg3,border:`1px solid ${C.borderAccent}`,borderRadius:11,padding:"12px 13px",marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:700,color:C.gold,marginBottom:5}}>📝 Blog — AI Auto-Publish</div>
      <div style={{fontSize:11,color:C.textMuted,marginBottom:10,lineHeight:1.6}}>One post a week, on autopilot. Every <strong style={{color:C.gold}}>Tuesday 8am Arizona time</strong> the AI writes next week's post and parks it under <strong style={{color:C.gold}}>Scheduled</strong>, set to publish the following <strong style={{color:C.gold}}>Monday 8am</strong> (you get an email when it's queued). You have until Monday to edit, AI-rewrite, reschedule, or delete it — do nothing and it publishes itself. There's always one waiting for review; the queue refills automatically.</div>

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:C.textDim,fontWeight:600,lineHeight:1.5}}>📅 One per week · publishes Mondays 8am · written Tuesdays 8am (Arizona)</span>
        {posts.filter(p=>p.status==="draft").length>=2&&(
          <button onClick={respaceSchedule} disabled={genState==="generating"||bulkBusy} title="Spreads stacked scheduled posts onto separate weeks — one per week" style={{marginLeft:"auto",padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.borderAccent}`,backgroundColor:"rgba(200,168,75,.08)",color:C.gold,cursor:"pointer",opacity:(genState==="generating"||bulkBusy)?.7:1,whiteSpace:"nowrap"}}>Space 1/week</button>
        )}
        <button onClick={writeScheduled} disabled={genState==="generating"||bulkBusy} title="Writes one now and schedules it for the next open Monday slot" style={{marginLeft:posts.filter(p=>p.status==="draft").length>=2?0:"auto",padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",opacity:(genState==="generating"||bulkBusy)?.7:1,whiteSpace:"nowrap"}}>{genState==="generating"?"Writing…":"Write & Schedule"}</button>
        <button onClick={generateNow} disabled={genState==="generating"||bulkBusy} title="Skips the review queue and goes live immediately" style={{padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:(genState==="generating"||bulkBusy)?.7:1,whiteSpace:"nowrap"}}>Write + Publish Now</button>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
        {bulkProgress?(
          <span style={{fontSize:11,color:C.textDim,fontWeight:600}}>
            {bulkProgress.type==="rewrite"
              ?`Rewriting post ${bulkProgress.done} of ${bulkProgress.total}…`
              :bulkProgress.phase==="deleting"?"Clearing old posts…":`Writing post ${bulkProgress.done} of ${bulkProgress.total}…`}
          </span>
        ):bulkConfirm==="rewrite"?(
          <>
            <span style={{fontSize:11,color:C.textDim}}>Rewrite all {posts.length} posts now — same URLs, fresh text, old text gone for good?</span>
            <button onClick={()=>setBulkConfirm(null)} style={{padding:"6px 10px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
            <button onClick={rewriteAll} style={{padding:"6px 10px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(248,113,113,0.15)",color:C.red,cursor:"pointer",whiteSpace:"nowrap"}}>Confirm Rewrite</button>
          </>
        ):bulkConfirm==="rebuild"?(
          <>
            <span style={{fontSize:11,color:C.textDim}}>Delete all {posts.length} posts and write {posts.length||3} brand-new ones?</span>
            <button onClick={()=>setBulkConfirm(null)} style={{padding:"6px 10px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
            <button onClick={rebuildFromScratch} style={{padding:"6px 10px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(248,113,113,0.15)",color:C.red,cursor:"pointer",whiteSpace:"nowrap"}}>Confirm Rebuild</button>
          </>
        ):(
          <>
            <button onClick={()=>setBulkConfirm("rewrite")} disabled={posts.length===0||!!busyId} style={{padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:(posts.length===0||busyId)?.5:1,whiteSpace:"nowrap"}}>Rewrite All Posts</button>
            <button onClick={()=>setBulkConfirm("rebuild")} disabled={!!busyId} style={{padding:"7px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:busyId?.5:1,whiteSpace:"nowrap"}}>Rebuild From Scratch</button>
          </>
        )}
      </div>

      {msg&&<div style={{fontSize:11,marginBottom:10,lineHeight:1.6,color:C.red}}>{msg}</div>}

      {loading?(
        <div style={{fontSize:12,color:C.textMuted,padding:"8px 0"}}>Loading posts…</div>
      ):posts.length===0?(
        <div style={{fontSize:12,color:C.textMuted,padding:"8px 0"}}>No posts yet — the pipeline writes and schedules the first one on its next 15-minute check, or click "Write & Schedule".</div>
      ):(()=>{
        const scheduled=posts.filter(p=>p.status==="draft").sort((a,b)=>a.published_at<b.published_at?-1:1);
        const posted=posts.filter(p=>p.status!=="draft").sort((a,b)=>a.published_at>b.published_at?-1:1);
        const fmtWhen=(iso)=>iso?new Date(iso).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
        const row=(p,isSched)=>(
          <div key={p.id} style={{padding:"9px 10px",borderRadius:9,backgroundColor:isSched?"rgba(200,168,75,.05)":"rgba(255,255,255,.03)",border:`1px solid ${isSched?C.borderAccent:C.border}`}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:170}}>
                <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.gold,marginBottom:3}}>{p.category}{p.source==="ai"?" · AI":""}</div>
                {isSched?(
                  <span style={{fontSize:12.5,fontWeight:600,color:C.text,lineHeight:1.4}}>{p.title}</span>
                ):(
                  <a href={"https://boldlinemedia.com/blog/"+p.slug+"/"} target="_blank" rel="noopener noreferrer" style={{fontSize:12.5,fontWeight:600,color:C.text,textDecoration:"none",lineHeight:1.4}}>{p.title}</a>
                )}
                <div style={{fontSize:10,color:isSched?C.gold:C.textMuted,marginTop:3,fontWeight:isSched?700:400}}>{isSched?"Publishes "+fmtWhen(p.published_at):fmtDate(p.published_at)+" · "+p.read_minutes+" min read"}</div>
              </div>
              {reschedId===p.id?(
                <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <input type="datetime-local" value={reschedVal} onChange={e=>setReschedVal(e.target.value)} style={{flex:"1 1 150px",minWidth:0,maxWidth:"100%",padding:"5px 7px",fontSize:11,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.05)",color:C.text,fontFamily:"inherit",colorScheme:"dark"}}/>
                  <button onClick={()=>saveReschedule(p.id)} disabled={busyId===p.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===p.id?"…":"Save"}</button>
                  <button onClick={()=>setReschedId(null)} style={{padding:"5px 9px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
                </div>
              ):(
                <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <button onClick={()=>openEditor(p.id)} disabled={busyId===p.id||bulkBusy} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.borderAccent}`,backgroundColor:"rgba(200,168,75,.08)",color:C.gold,cursor:"pointer",opacity:(busyId===p.id||bulkBusy)?.6:1,whiteSpace:"nowrap"}}>{isSched?"Review / Edit":"Edit"}</button>
                  <button onClick={()=>regenerate(p.id)} disabled={busyId===p.id||bulkBusy} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:(busyId===p.id||bulkBusy)?.6:1,whiteSpace:"nowrap"}}>{busyId===p.id?"…":"AI Rewrite"}</button>
                  {isSched&&<button onClick={()=>{setReschedId(p.id);setReschedVal(toLocalInput(p.published_at));}} disabled={busyId===p.id||bulkBusy} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:(busyId===p.id||bulkBusy)?.6:1,whiteSpace:"nowrap"}}>Reschedule</button>}
                  {isSched&&<button onClick={()=>publishNow(p.id)} disabled={busyId===p.id||bulkBusy} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(34,211,160,.14)",color:C.green,cursor:"pointer",opacity:(busyId===p.id||bulkBusy)?.6:1,whiteSpace:"nowrap"}}>Publish Now</button>}
                  {confirmId===p.id?(
                    <div style={{display:"flex",gap:5}}>
                      <button onClick={()=>setConfirmId(null)} style={{padding:"5px 9px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
                      <button onClick={()=>doDelete(p.id)} disabled={busyId===p.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(248,113,113,0.15)",color:C.red,cursor:"pointer",whiteSpace:"nowrap"}}>Confirm</button>
                    </div>
                  ):(
                    <button onClick={()=>setConfirmId(p.id)} disabled={busyId===p.id||bulkBusy} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",opacity:(busyId===p.id||bulkBusy)?.6:1,whiteSpace:"nowrap"}}>Delete</button>
                  )}
                </div>
              )}
            </div>
          </div>
        );
        return (
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:440,overflowY:"auto"}}>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.gold,margin:"2px 0 1px"}}>Scheduled — awaiting your review ({scheduled.length})</div>
            {scheduled.length===0?(
              <div style={{fontSize:11,color:C.textMuted,padding:"2px 0 4px"}}>Queue is empty — the pipeline writes the next post on its next 15-minute check.</div>
            ):scheduled.map(p=>row(p,true))}
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textDim,margin:"8px 0 1px"}}>Posted — live on the site ({posted.length})</div>
            {posted.length===0?(
              <div style={{fontSize:11,color:C.textMuted,padding:"2px 0 4px"}}>Nothing live yet.</div>
            ):posted.map(p=>row(p,false))}
          </div>
        );
      })()}

      {editor&&(
        <div onClick={e=>{ if(e.target===e.currentTarget&&!editorSaving) setEditor(null); }} style={{position:"fixed",inset:0,zIndex:400,backgroundColor:"rgba(4,6,10,.75)",display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
          <div style={{width:"100%",maxWidth:700,maxHeight:"88dvh",overflowY:"auto",backgroundColor:C.bg2,border:`1px solid ${C.borderAccent}`,borderRadius:14,padding:"16px 16px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,color:C.text}}>{editor.status==="draft"?"Review Scheduled Post":"Edit Post"}</div>
              {editor.status!=="draft"&&<a href={"https://boldlinemedia.com/blog/"+editor.slug+"/"} target="_blank" rel="noopener noreferrer" style={{fontSize:10.5,fontWeight:600,color:C.textDim,textDecoration:"none"}}>View live ↗</a>}
              <div style={{marginLeft:"auto",fontSize:10,color:C.textMuted}}>{editor.status==="draft"?"Saved changes go live at the scheduled time":"Saving publishes the changes immediately"}</div>
            </div>
            {[["title","Title",false],["category","Category",false],["excerpt","Excerpt (shown on the blog index)",true],["meta_description","Meta description (Google search snippet)",true]].map(([k,label,multi])=>(
              <div key={k} style={{marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textDim,marginBottom:4}}>{label}</div>
                {multi?(
                  <textarea value={editor[k]||""} onChange={e=>setEd(k,e.target.value)} rows={2} style={{width:"100%",padding:"8px 10px",fontSize:12.5,lineHeight:1.5,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.text,fontFamily:"inherit",resize:"vertical"}}/>
                ):(
                  <input value={editor[k]||""} onChange={e=>setEd(k,e.target.value)} style={{width:"100%",padding:"8px 10px",fontSize:12.5,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.text,fontFamily:"inherit"}}/>
                )}
              </div>
            ))}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textDim,marginBottom:4}}>Article — edit the words right here; the formatting is kept automatically</div>
              <VisualEditor html={editor.body_html||""} onChange={v=>setEd("body_html",v)} itemKey={editor.id}/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setEditor(null)} disabled={editorSaving} style={{padding:"8px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveEditor} disabled={editorSaving} style={{padding:"8px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",opacity:editorSaving?.7:1}}>{editorSaving?"Saving…":"Save & Publish"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── NEWSLETTER MANAGEMENT ────────────────────────────────────────────────────
// Owner panel for the weekly email list: review/edit/reschedule the AI-drafted
// companion email for each blog post, see subscribers + analytics. Mirrors the
// blog manager. Backend: newsletter-admin.mjs (+ newsletter-write-background for
// AI). Sending stays dormant until the domain is verified in Resend.
function NewsletterManagementCard() {
  const [emails,setEmails]=useState([]);
  const [subs,setSubs]=useState(null);
  const [loading,setLoading]=useState(true);
  const [sendingEnabled,setSendingEnabled]=useState(false);
  const [genState,setGenState]=useState("idle");   // idle | generating
  const [busyId,setBusyId]=useState(null);
  const [confirmId,setConfirmId]=useState(null);
  const [reschedId,setReschedId]=useState(null);
  const [reschedVal,setReschedVal]=useState("");
  const [editor,setEditor]=useState(null);
  const [editorSaving,setEditorSaving]=useState(false);
  const [showSubs,setShowSubs]=useState(false);
  const [showUnsub,setShowUnsub]=useState(false);
  const [msg,setMsg]=useState("");

  const toLocalInput=(iso)=>{ const d=new Date(iso); const z=(n)=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes()); };
  const fmtWhen=(iso)=>iso?new Date(iso).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";

  const call=async(action,extra)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh the page and log in again.");
    const r=await fetch("/.netlify/functions/newsletter-admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"Request failed.");
    return d;
  };
  const callBg=async(payload)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh the page and log in again.");
    const r=await fetch("/.netlify/functions/newsletter-write-background",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(payload)});
    if(!(r.status>=200&&r.status<300)){ let d={}; try{ d=await r.json(); }catch(e){} throw new Error(d.error||"Couldn't start the writer. Refresh and try again."); }
  };
  const pollList=async(detect,timeoutMs=150000)=>{
    const start=Date.now();
    while(Date.now()-start<timeoutMs){
      await new Promise(res=>setTimeout(res,4000));
      let fresh; try{ fresh=(await call("list")).emails||[]; }catch(e){ continue; }
      if(detect(fresh)){ setEmails(fresh); return true; }
    }
    return false;
  };

  const loadAll=async()=>{
    setLoading(true); setMsg("");
    try{
      const [listRes,subRes]=await Promise.all([call("list"),call("subscribers").catch(()=>null)]);
      setEmails(listRes.emails||[]);
      setSendingEnabled(!!listRes.sendingEnabled);
      if(subRes) setSubs(subRes);
    }catch(e){ setMsg(e.message); }
    setLoading(false);
  };
  useEffect(()=>{ loadAll(); },[]);

  const generateCompanion=async()=>{
    setGenState("generating"); setMsg("");
    const before=new Set(emails.map(e=>e.id));
    try{
      await callBg({action:"generate"});
      const ok=await pollList(list=>list.some(e=>!before.has(e.id)));
      setMsg(ok?"Companion email drafted — review it below.":"Still writing — refresh in a minute.");
    }catch(e){ setMsg(e.message); }
    setGenState("idle");
  };
  const regenerate=async(id)=>{
    setBusyId(id); setMsg("");
    try{
      const cur=emails.find(e=>e.id===id); const stamp=cur&&cur.created_at;
      await callBg({action:"regenerate",id});
      await pollList(list=>{ const n=list.find(e=>e.id===id); return n&&n.created_at!==stamp?false:true; }, 60000); // subject may change; just refresh
      setEmails((await call("list")).emails||[]);
      setMsg("Rewritten.");
    }catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const openEditor=async(id)=>{
    setBusyId(id); setMsg("");
    try{ const d=await call("get",{id}); setEditor(d.email); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const setEd=(k,v)=>setEditor(e=>({...e,[k]:v}));
  const saveEditor=async()=>{
    setEditorSaving(true);
    try{ await call("update",{id:editor.id,subject:editor.subject,preview:editor.preview,body_html:editor.body_html}); setEditor(null); await loadAll(); }
    catch(e){ setMsg(e.message); }
    setEditorSaving(false);
  };
  const saveReschedule=async(id)=>{
    setBusyId(id);
    try{ await call("reschedule",{id,when:new Date(reschedVal).toISOString()}); setReschedId(null); await loadAll(); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const sendNow=async(id)=>{
    setBusyId(id); setMsg("");
    try{ await call("send-now",{id}); await loadAll(); setMsg("Sent."); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };
  const doDelete=async(id)=>{
    setBusyId(id);
    try{ await call("delete",{id}); setConfirmId(null); await loadAll(); }
    catch(e){ setMsg(e.message); }
    setBusyId(null);
  };

  const stat=(label,val,accent)=>(
    <div style={{flex:"1 1 90px",backgroundColor:"rgba(255,255,255,.03)",border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px"}}>
      <div style={{fontSize:19,fontWeight:800,color:accent||C.text}}>{val}</div>
      <div style={{fontSize:9.5,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textMuted,marginTop:2}}>{label}</div>
    </div>
  );

  const scheduled=emails.filter(e=>e.status!=="sent").sort((a,b)=>(a.scheduled_for||"")<(b.scheduled_for||"")?-1:1);
  const sent=emails.filter(e=>e.status==="sent").sort((a,b)=>(a.sent_at||"")>(b.sent_at||"")?-1:1);

  const row=(e,isSched)=>(
    <div key={e.id} style={{padding:"9px 10px",borderRadius:9,backgroundColor:isSched?"rgba(200,168,75,.05)":"rgba(255,255,255,.03)",border:`1px solid ${isSched?C.borderAccent:C.border}`}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:170}}>
          <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.gold,marginBottom:3}}>{e.source==="ai"?"AI":"Edited"}{e.post_slug?" · promotes /blog/"+e.post_slug:""}</div>
          <span style={{fontSize:12.5,fontWeight:600,color:C.text,lineHeight:1.4}}>{e.subject}</span>
          <div style={{fontSize:10,color:isSched?C.gold:C.textMuted,marginTop:3,fontWeight:isSched?700:400}}>{isSched?("Sends "+fmtWhen(e.scheduled_for)):("Sent "+fmtWhen(e.sent_at)+(e.recipients?(" · "+e.recipients+" recipients"):""))}</div>
        </div>
        {reschedId===e.id?(
          <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
            <input type="datetime-local" value={reschedVal} onChange={ev=>setReschedVal(ev.target.value)} style={{flex:"1 1 150px",minWidth:0,maxWidth:"100%",padding:"5px 7px",fontSize:11,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.05)",color:C.text,fontFamily:"inherit",colorScheme:"dark"}}/>
            <button onClick={()=>saveReschedule(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===e.id?"…":"Save"}</button>
            <button onClick={()=>setReschedId(null)} style={{padding:"5px 9px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
          </div>
        ):(
          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={()=>openEditor(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.borderAccent}`,backgroundColor:"rgba(200,168,75,.08)",color:C.gold,cursor:"pointer",opacity:busyId===e.id?.6:1,whiteSpace:"nowrap"}}>{isSched?"Review / Edit":"View / Edit"}</button>
            {isSched&&<button onClick={()=>regenerate(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:busyId===e.id?.6:1,whiteSpace:"nowrap"}}>{busyId===e.id?"…":"AI Rewrite"}</button>}
            {isSched&&<button onClick={()=>{setReschedId(e.id);setReschedVal(toLocalInput(e.scheduled_for||new Date().toISOString()));}} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textDim,cursor:"pointer",opacity:busyId===e.id?.6:1,whiteSpace:"nowrap"}}>Reschedule</button>}
            {isSched&&sendingEnabled&&<button onClick={()=>sendNow(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(34,211,160,.14)",color:C.green,cursor:"pointer",opacity:busyId===e.id?.6:1,whiteSpace:"nowrap"}}>Send Now</button>}
            {isSched&&(confirmId===e.id?(
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>setConfirmId(null)} style={{padding:"5px 9px",fontSize:10,fontWeight:600,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>Cancel</button>
                <button onClick={()=>doDelete(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:"none",backgroundColor:"rgba(248,113,113,0.15)",color:C.red,cursor:"pointer",whiteSpace:"nowrap"}}>Confirm</button>
              </div>
            ):(
              <button onClick={()=>setConfirmId(e.id)} disabled={busyId===e.id} style={{padding:"5px 9px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer",opacity:busyId===e.id?.6:1,whiteSpace:"nowrap"}}>Delete</button>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  return (
    <div style={{marginTop:16,backgroundColor:C.bg2,border:`1px solid ${C.border}`,borderRadius:14,padding:"15px 15px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <div style={{fontSize:14,fontWeight:800,color:C.text}}>📧 Newsletter</div>
        <button onClick={generateCompanion} disabled={genState==="generating"} style={{marginLeft:"auto",padding:"6px 12px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",opacity:genState==="generating"?.7:1}}>{genState==="generating"?"Writing…":"Write companion email"}</button>
      </div>
      <div style={{fontSize:11,color:C.textMuted,marginBottom:12,lineHeight:1.6}}>One short "quick tip + read the full post" email per blog post, auto-drafted for your review and scheduled to send ~2h after the post goes live.</div>

      {!sendingEnabled&&(
        <div style={{fontSize:10.5,color:C.amber,backgroundColor:"rgba(217,119,6,.08)",border:`1px solid rgba(217,119,6,.28)`,borderRadius:9,padding:"8px 10px",marginBottom:12,lineHeight:1.55}}>Sending is <b>off</b> until boldlinemedia.com is verified in Resend. Emails still draft + queue on schedule — they'll send automatically once you verify the domain and set NEWSLETTER_SENDING_ENABLED=1.</div>
      )}

      {subs&&(
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {stat("Subscribers",subs.total,C.gold)}
            {stat("New this month","+"+subs.thisMonthAdded,C.green)}
            {stat("Unsubscribed",subs.unsubscribed==null?"—":subs.unsubscribed)}
          </div>
          {subs.months&&subs.months.length>0&&(()=>{ const max=Math.max(1,...subs.months.map(m=>m.added)); return (
            <div style={{display:"flex",gap:6,alignItems:"flex-end",marginTop:12,height:56}}>
              {subs.months.map(m=>(
                <div key={m.month} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <div style={{fontSize:9,color:C.textDim}}>{m.added}</div>
                  <div style={{width:"70%",height:Math.round((m.added/max)*32)+2,backgroundColor:C.gold,opacity:.55,borderRadius:3}}/>
                  <div style={{fontSize:8.5,color:C.textMuted}}>{m.label}</div>
                </div>
              ))}
            </div>
          ); })()}
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8}}>
            <button onClick={()=>{setShowSubs(s=>!s); if(!showSubs)setShowUnsub(false);}} style={{padding:0,fontSize:10.5,fontWeight:700,border:"none",background:"none",color:C.gold,cursor:"pointer",borderBottom:`1px solid ${C.borderAccent}`}}>{showSubs?"Hide subscribers":"See all subscribers"}</button>
            {(subs.unsubscribed>0||(subs.unsubscribedList&&subs.unsubscribedList.length>0))&&(
              <button onClick={()=>{setShowUnsub(u=>!u); if(!showUnsub)setShowSubs(false);}} style={{padding:0,fontSize:10.5,fontWeight:700,border:"none",background:"none",color:C.textMuted,cursor:"pointer",borderBottom:`1px solid ${C.border}`}}>{showUnsub?"Hide unsubscribed":`See who unsubscribed (${subs.unsubscribed==null?(subs.unsubscribedList||[]).length:subs.unsubscribed})`}</button>
            )}
          </div>
          {showSubs&&(
            <div style={{marginTop:8,maxHeight:180,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
              {subs.recent.length===0?(
                <div style={{fontSize:11,color:C.textMuted}}>No subscribers yet.</div>
              ):subs.recent.map((s,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,fontSize:11,color:s.unsubscribed?C.textMuted:C.textDim,padding:"4px 6px",borderRadius:6,backgroundColor:"rgba(255,255,255,.02)"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:s.unsubscribed?"line-through":"none"}}>{s.email}</span>
                  <span style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                    {s.unsubscribed&&<span style={{fontSize:8.5,fontWeight:800,textTransform:"uppercase",letterSpacing:".04em",color:C.amber,backgroundColor:"rgba(217,119,6,.1)",border:`1px solid rgba(217,119,6,.3)`,borderRadius:4,padding:"1px 4px"}}>unsub'd</span>}
                    <span style={{color:C.textMuted}}>{new Date(s.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
                  </span>
                </div>
              ))}
            </div>
          )}
          {showUnsub&&(
            <div style={{marginTop:8,maxHeight:180,overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
              {subs.unsubscribedList==null?(
                <div style={{fontSize:11,color:C.textMuted,lineHeight:1.5}}>The unsubscribe list comes from Resend and isn't reachable right now. It fills in once the domain is verified and emails start sending.</div>
              ):subs.unsubscribedList.length===0?(
                <div style={{fontSize:11,color:C.textMuted}}>Nobody has unsubscribed. 🎉</div>
              ):subs.unsubscribedList.map((s,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11,color:C.textMuted,padding:"4px 6px",borderRadius:6,backgroundColor:"rgba(217,119,6,.04)"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.email}</span>
                  {s.subscribed_at&&<span style={{flexShrink:0}}>joined {new Date(s.subscribed_at).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {msg&&<div style={{fontSize:11,color:C.textDim,marginBottom:8}}>{msg}</div>}

      {loading?(
        <div style={{fontSize:11,color:C.textMuted}}>Loading…</div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:440,overflowY:"auto"}}>
          <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.gold,margin:"2px 0 1px"}}>Scheduled — awaiting your review ({scheduled.length})</div>
          {scheduled.length===0?(
            <div style={{fontSize:11,color:C.textMuted,padding:"2px 0 4px"}}>None queued — the pipeline drafts one per blog post on its next hourly check, or use "Write companion email" above.</div>
          ):scheduled.map(e=>row(e,true))}
          <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:C.textDim,margin:"8px 0 1px"}}>Sent ({sent.length})</div>
          {sent.length===0?(
            <div style={{fontSize:11,color:C.textMuted,padding:"2px 0 4px"}}>Nothing sent yet.</div>
          ):sent.map(e=>row(e,false))}
        </div>
      )}

      {editor&&(
        <div onClick={ev=>{ if(ev.target===ev.currentTarget&&!editorSaving) setEditor(null); }} style={{position:"fixed",inset:0,zIndex:400,backgroundColor:"rgba(4,6,10,.75)",display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
          <div style={{width:"100%",maxWidth:700,maxHeight:"88dvh",overflowY:"auto",backgroundColor:C.bg2,border:`1px solid ${C.borderAccent}`,borderRadius:14,padding:"16px 16px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,color:C.text}}>{editor.status==="sent"?"View Sent Email":"Review Newsletter Email"}</div>
              {editor.post_slug&&<a href={"https://boldlinemedia.com/blog/"+editor.post_slug+"/"} target="_blank" rel="noopener noreferrer" style={{fontSize:10.5,fontWeight:600,color:C.textDim,textDecoration:"none"}}>View post ↗</a>}
              <div style={{marginLeft:"auto",fontSize:10,color:C.textMuted}}>{editor.status==="sent"?"Already sent — read-only":"Saved edits keep the schedule"}</div>
            </div>
            {[["subject","Subject line",false],["preview","Inbox preview line",false]].map(([k,label,multi])=>(
              <div key={k} style={{marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textDim,marginBottom:4}}>{label}</div>
                <input value={editor[k]||""} onChange={ev=>setEd(k,ev.target.value)} disabled={editor.status==="sent"} style={{width:"100%",padding:"8px 10px",fontSize:12.5,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.text,fontFamily:"inherit"}}/>
              </div>
            ))}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textDim,marginBottom:4}}>Email — edit the words right here; the formatting is kept automatically</div>
              <VisualEditor html={editor.body_html||""} onChange={v=>setEd("body_html",v)} itemKey={editor.id} light disabled={editor.status==="sent"}/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setEditor(null)} disabled={editorSaving} style={{padding:"8px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>{editor.status==="sent"?"Close":"Cancel"}</button>
              {editor.status!=="sent"&&<button onClick={saveEditor} disabled={editorSaving} style={{padding:"8px 14px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:C.gold,color:"#15110A",cursor:"pointer",opacity:editorSaving?.7:1}}>{editorSaving?"Saving…":"Save"}</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── WEBSITE SCREEN ───────────────────────────────────────────────────────────
// Everything for boldlinemedia.com in one place: quick links to the live pages
// and the full blog manager (cadence, write-now, edit, AI rewrite, delete).
// Reviews moderation (Website tab). Reviews submitted on boldlinemedia.com land
// as "pending"; approving one publishes it to the site's testimonials (reviews-list).
// Owner-JWT via reviews-admin. Built 2026-08-08 (Bryson: a place for reviews).
function ReviewsManagementCard() {
  const [reviews,setReviews]=useState([]);
  const [loading,setLoading]=useState(true);
  const [busyId,setBusyId]=useState(null);
  const [confirmId,setConfirmId]=useState(null);
  const [msg,setMsg]=useState("");

  const call=async(action,extra)=>{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token;
    if(!token) throw new Error("Session expired — refresh the page and log in again.");
    const r=await fetch("/.netlify/functions/reviews-admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"Request failed.");
    return d;
  };
  const load=async()=>{ setLoading(true); setMsg(""); try{ const d=await call("list"); setReviews(d.reviews||[]); }catch(e){ setMsg(e.message); } setLoading(false); };
  useEffect(()=>{ load(); },[]);

  const act=async(id,fn)=>{ setBusyId(id); setMsg(""); try{ await fn(); await load(); }catch(e){ setMsg(e.message); } setBusyId(null); setConfirmId(null); };
  const setStatus=(id,status)=>act(id,()=>call("set-status",{id,status}));
  const feature=(id,featured)=>act(id,()=>call("feature",{id,featured}));
  const del=(id)=>act(id,()=>call("delete",{id}));

  const starStr=(n)=> n?((new Array(n+1)).join("★")+(new Array(6-n)).join("☆")):"";
  const pending=reviews.filter(r=>r.status==="pending");
  const approved=reviews.filter(r=>r.status==="approved");
  const rejected=reviews.filter(r=>r.status==="rejected");
  const aBtn=(color)=>({padding:"4px 10px",fontSize:10,fontWeight:700,borderRadius:7,border:`1px solid ${color}44`,background:"transparent",color,cursor:"pointer",whiteSpace:"nowrap"});
  const secHead={fontSize:9,fontWeight:800,letterSpacing:".06em",textTransform:"uppercase",color:C.textMuted,margin:"12px 0 2px"};

  const renderRow=(r)=>(
    <div key={r.id} style={{padding:"11px 0",borderBottom:`1px solid ${C.border2}`,opacity:busyId===r.id?.5:1}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
        {r.rating?<span style={{color:C.gold,fontSize:12,letterSpacing:1}}>{starStr(r.rating)}</span>:null}
        <span style={{fontSize:12.5,fontWeight:700,color:C.text}}>{[r.name,r.business].filter(Boolean).join(" · ")||"Anonymous"}</span>
        {r.featured&&r.status==="approved"?<span style={{fontSize:9,fontWeight:800,color:C.gold,border:`1px solid ${C.borderAccent}`,borderRadius:5,padding:"1px 5px"}}>FEATURED</span>:null}
        <span style={{marginLeft:"auto",fontSize:10,color:C.textMuted}}>{r.created_at?new Date(r.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric"}):""}</span>
      </div>
      <div style={{fontSize:12.5,color:C.textDim,lineHeight:1.6,marginBottom:8}}>“{r.body}”</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        {r.status!=="approved"&&<button onClick={()=>setStatus(r.id,"approved")} disabled={busyId===r.id} style={aBtn(C.green)}>Approve</button>}
        {r.status==="approved"&&<button onClick={()=>feature(r.id,!r.featured)} disabled={busyId===r.id} style={aBtn(C.gold)}>{r.featured?"Unfeature":"Feature"}</button>}
        {r.status==="approved"&&<button onClick={()=>setStatus(r.id,"pending")} disabled={busyId===r.id} style={aBtn(C.textDim)}>Unpublish</button>}
        {r.status==="pending"&&<button onClick={()=>setStatus(r.id,"rejected")} disabled={busyId===r.id} style={aBtn(C.textMuted)}>Reject</button>}
        {r.status==="rejected"&&<button onClick={()=>setStatus(r.id,"pending")} disabled={busyId===r.id} style={aBtn(C.textDim)}>Restore</button>}
        {confirmId===r.id
          ? <span style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}><span style={{fontSize:10,color:C.textMuted}}>Delete?</span><button onClick={()=>del(r.id)} style={aBtn(C.red)}>Yes</button><button onClick={()=>setConfirmId(null)} style={aBtn(C.textMuted)}>No</button></span>
          : <button onClick={()=>setConfirmId(r.id)} disabled={busyId===r.id} style={{...aBtn(C.red),marginLeft:"auto"}}>Delete</button>}
      </div>
    </div>
  );

  return (
    <Card style={{marginTop:14}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <Label>Reviews</Label>
        {pending.length>0&&<span style={{fontSize:10,fontWeight:800,color:C.gold,background:C.goldDim,border:`1px solid ${C.borderAccent}`,borderRadius:20,padding:"1px 8px"}}>{pending.length} to review</span>}
        <button onClick={load} disabled={loading} style={{marginLeft:"auto",fontSize:10,fontWeight:700,color:C.textDim,background:"transparent",border:`1px solid ${C.border}`,borderRadius:7,padding:"4px 10px",cursor:"pointer"}}>Refresh</button>
      </div>
      <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,marginBottom:8}}>Reviews left on boldlinemedia.com. Approve one to publish it to the site's testimonials — nothing shows publicly until you do. Feature pins a review to the top.</div>
      {loading
        ? <div style={{fontSize:12,color:C.textMuted}}>Loading…</div>
        : reviews.length===0
          ? <div style={{fontSize:12,color:C.textMuted,lineHeight:1.6}}>No reviews yet. When someone leaves one on the site, it shows here for you to approve.</div>
          : <>
              {pending.length>0&&<><div style={secHead}>Pending — needs your review ({pending.length})</div>{pending.map(renderRow)}</>}
              {approved.length>0&&<><div style={secHead}>Published on the site ({approved.length})</div>{approved.map(renderRow)}</>}

            </>}

    </Card>
  );
}

// My Ads insights (internal-only, top of the Campaigns tab): a "start here"
// setup checklist, a budget-pacing gauge, and an acquisition-ROI funnel
// (spend -> leads -> calls booked -> clients won -> cost per client). Fetches the
// house account's live Google/Meta campaigns ONCE for spend + pacing + whether a
// campaign is live; the funnel + close rate come from the account's own leadsLog
// (ground truth for BoldLine's prospects). Built 2026-08-07 (Bryson: add all 3).
function MyAdsInsights({client,onUpdate}){
  const hasG=!!client.googleAdsCustomerId, hasM=!!client.metaAdAccountId;
  const [camps,setCamps]=useState(null); // null = loading; array = loaded
  const [loadErr,setLoadErr]=useState("");
  useEffect(()=>{
    let dead=false;
    (async()=>{
      if(!hasG&&!hasM){ setCamps([]); return; }
      setCamps(null); setLoadErr("");
      try{
        let all=[];
        if(hasG){ const d=await gadsCall({action:"campaigns",customerId:client.googleAdsCustomerId}); all=all.concat((d.campaigns||[]).map(c=>({...c,_plat:"google"}))); }
        if(hasM){ const d=await metaCall({action:"campaigns",adAccountId:client.metaAdAccountId}); all=all.concat((d.campaigns||[]).map(c=>({...c,_plat:"meta"}))); }
        if(!dead) setCamps(all);
      }catch(e){ if(!dead){ setLoadErr(e.message||"Couldn't load live ad data."); setCamps([]); } }
    })();
    return ()=>{ dead=true; };
  },[client.googleAdsCustomerId,client.metaAdAccountId]);

  const money=(n)=> "$"+Math.round(n).toLocaleString();
  const pct=(a,b)=> b>0?Math.round(a/b*100):0;
  const isOn=(c)=> c._plat==="google" ? String(c.status).toUpperCase()==="ENABLED" : String(c.status).toUpperCase()==="ACTIVE";
  const loaded=Array.isArray(camps);
  const spend30=loaded?camps.reduce((s,c)=>s+Number(c.cost||c.spend||0),0):0;
  const dailyLive=loaded?camps.filter(isOn).reduce((s,c)=>s+Number(c.dailyBudget||0),0):0;
  const projMonthly=Math.round(dailyLive*30.4);
  const anyLive=loaded&&camps.some(isOn);
  const monthlyBudget=Number(String(client.adBudget||"").replace(/[^0-9.]/g,""))||0;

  const leads=client.leadsLog||[];
  const nLeads=leads.length;
  const nBooked=leads.filter(l=>["meeting","won"].includes(l.status||"new")).length;
  const nWon=leads.filter(l=>(l.status||"new")==="won").length;
  const now=Date.now();
  const leads30=leads.filter(l=>l.receivedAt&&(now-new Date(l.receivedAt).getTime())<=30*864e5).length;
  const costPerLead=(leads30>0&&spend30>0)?spend30/leads30:null;
  const closeRate=nLeads>0?nWon/nLeads:0;
  const projCAC=(costPerLead!=null&&closeRate>0)?costPerLead/closeRate:null;

  const cardAdded=!!(client.myAdsSetup&&client.myAdsSetup.cardAdded);
  const steps=[
    {k:"budget",  label:"Set your monthly budget",                  done:monthlyBudget>0},
    {k:"card",    label:"Add your payment card to Google / Meta",   done:cardAdded, manual:true},
    {k:"connect", label:"Connect your ad accounts (paste the IDs)", done:hasG||hasM},
    {k:"page",    label:"Build a landing page for your ads",        done:!!(client.landingPage&&client.landingPage.published)},
    {k:"live",    label:"Launch a campaign",                        done:anyLive},
  ];
  const doneCount=steps.filter(s=>s.done).length;
  const toggleCard=()=> onUpdate({...client, myAdsSetup:{...(client.myAdsSetup||{}), cardAdded:!cardAdded}});

  const pacePct=monthlyBudget>0?Math.min(100,Math.round(projMonthly/monthlyBudget*100)):0;
  const overBudget=loaded&&monthlyBudget>0&&dailyLive>0&&projMonthly>monthlyBudget;
  const paceColor=overBudget?C.red:(monthlyBudget>0&&projMonthly>monthlyBudget*0.85?C.amber:C.green);

  const tile=(label,value,sub,color)=>(
    <div style={{flex:"1 1 92px",minWidth:0,background:C.bg3,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 11px"}}>
      <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textMuted,marginBottom:3}}>{label}</div>
      <div style={{fontSize:18,fontWeight:800,color:color||C.text,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:9.5,color:C.textMuted,marginTop:3,lineHeight:1.35}}>{sub}</div>}
    </div>
  );

  return (<>
    {overBudget&&(
      <Card style={{borderColor:`${C.red}55`,background:`${C.red}12`}}>
        <div style={{fontSize:12.5,fontWeight:800,color:C.red,marginBottom:3}}>⚠ Over budget</div>
        <div style={{fontSize:11.5,color:C.textDim,lineHeight:1.6}}>Your live campaigns are pacing to about {money(projMonthly)}/mo — over your {money(monthlyBudget)} budget. Lower a daily budget on a campaign below, or raise your budget.</div>
      </Card>
    )}

    {/* Start-here checklist */}
    <Card>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:9}}>
        <Label>Start Here — Setup</Label>
        <span style={{fontSize:11,fontWeight:800,color:doneCount===steps.length?C.green:C.gold,flexShrink:0}}>{doneCount}/{steps.length} done</span>
      </div>
      <div style={{height:6,borderRadius:4,background:C.bg3,overflow:"hidden",marginBottom:12}}>
        <div style={{height:"100%",width:`${pct(doneCount,steps.length)}%`,background:doneCount===steps.length?C.green:C.gold,borderRadius:4,transition:"width .3s"}}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {steps.map(s=>(
          <div key={s.k} style={{display:"flex",alignItems:"center",gap:9}}>
            <span onClick={s.manual?toggleCard:undefined} style={{width:19,height:19,borderRadius:6,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${s.done?C.green:C.border}`,background:s.done?`${C.green}22`:"transparent",color:C.green,fontSize:12,fontWeight:900,cursor:s.manual?"pointer":"default"}}>{s.done?"✓":""}</span>
            <span style={{fontSize:12.5,color:s.done?C.textDim:C.text,flex:1,minWidth:0,lineHeight:1.4,textDecoration:s.done?"line-through":"none"}}>{s.label}</span>
            {s.manual&&<span onClick={toggleCard} style={{fontSize:10,fontWeight:700,color:C.textMuted,cursor:"pointer",flexShrink:0}}>{s.done?"undo":"mark done"}</span>}
          </div>
        ))}
      </div>
    </Card>

    {/* Budget pacing */}
    <Card>
      <Label>Budget Pacing</Label>
      {!loaded ? <div style={{fontSize:11.5,color:C.textMuted,marginTop:6}}>Loading live spend…</div>
       : (!hasG&&!hasM) ? <div style={{fontSize:11.5,color:C.textMuted,marginTop:6,lineHeight:1.6}}>Connect your ad accounts below to track spend against your budget.</div>
       : <div style={{marginTop:6}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:monthlyBudget>0&&dailyLive>0?11:0}}>
            {tile("Monthly budget",monthlyBudget>0?money(monthlyBudget):"—")}
            {tile("Live daily",dailyLive>0?money(dailyLive)+"/day":"—",dailyLive>0?`≈ ${money(projMonthly)}/mo projected`:null)}
            {tile("Spent (30d)",money(spend30))}
          </div>
          {monthlyBudget>0&&dailyLive>0&&<>
            <div style={{height:7,borderRadius:4,background:C.bg3,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pacePct}%`,background:paceColor,borderRadius:4,transition:"width .3s"}}/>
            </div>
            <div style={{fontSize:11,color:overBudget?C.red:C.textMuted,marginTop:7,lineHeight:1.6}}>
              {overBudget?`Pacing to ~${money(projMonthly)}/mo — over your ${money(monthlyBudget)} budget.`:`Pacing to ~${money(projMonthly)}/mo of your ${money(monthlyBudget)} budget.`}
            </div>
          </>}
          {monthlyBudget===0&&<div style={{fontSize:11,color:C.textMuted,marginTop:8,lineHeight:1.6}}>Set a monthly budget below and this tracks your live campaigns against it.</div>}
          {loadErr&&<div style={{fontSize:11,color:C.textMuted,marginTop:8}}>{loadErr}</div>}
         </div>}
    </Card>

    {/* Acquisition ROI funnel */}
    <Card>
      <Label>Acquisition ROI</Label>
      {nLeads===0
        ? <div style={{fontSize:11.5,color:C.textMuted,marginTop:6,lineHeight:1.6}}>Once your ads bring in leads, your funnel shows up here — leads, calls booked, clients won, and what each new client costs you.</div>
        : <div style={{marginTop:6}}>
            <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",color:C.textMuted,marginBottom:6}}>Funnel (all time)</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:13}}>
              {tile("Leads",nLeads)}
              {tile("Calls booked",nBooked,nLeads>0?`${pct(nBooked,nLeads)}% of leads`:null,C.purple)}
              {tile("Clients won",nWon,nBooked>0?`${pct(nWon,nBooked)}% of calls`:null,C.green)}

  </>);
}

// via onUpdate (same fields the Edit sheet uses). Internal-only (Bryson's eyes).
function MyAdsSetupCards({client,onUpdate}){
  const parseNum = (s)=> Number(String(s||"").replace(/[^0-9.]/g,""))||0;
  const [budget,setBudget] = useState(()=>{ const n=parseNum(client.adBudget); return n?String(n):""; });
  const [ids,setIds] = useState({googleAdsCustomerId:client.googleAdsCustomerId||"",metaAdAccountId:client.metaAdAccountId||"",metaPageId:client.metaPageId||""});
  const [openPay,setOpenPay] = useState(false);
  const [openConnect,setOpenConnect] = useState(false);
  const [savedB,setSavedB] = useState(false);
  const [savedI,setSavedI] = useState(false);
  const setId = (k,v)=> setIds(p=>({...p,[k]:v}));
  const monthly = parseNum(budget);
  // The monthly figure is the TOTAL. Show what each platform actually gets, or
  // the launch cards get told to spend the whole budget twice over.
  const platsHere = adPlatformsOf(client, null);
  const platShare = Math.max(1, platsHere.count);
  const daily = dailyFromMonthly(monthly, 1);
  const dailyEach = dailyFromMonthly(monthly, platShare);
  const saveBudget = ()=>{ onUpdate({...client, adBudget: monthly? "$"+monthly.toLocaleString()+"/mo" : ""}); setSavedB(true); setTimeout(()=>setSavedB(false),1500); };
  const saveIds = ()=>{ onUpdate({...client, googleAdsCustomerId:(ids.googleAdsCustomerId||"").trim(), metaAdAccountId:(ids.metaAdAccountId||"").trim(), metaPageId:(ids.metaPageId||"").trim()}); setSavedI(true); setTimeout(()=>setSavedI(false),1500); };

  const subHead = {fontSize:10.5,fontWeight:800,letterSpacing:".03em",color:C.gold,marginTop:9,textTransform:"uppercase"};

  return (<>
    <Card>
      <Label>Monthly Ad Budget</Label>
      <div style={{fontSize:11.5,color:C.textMuted,lineHeight:1.6,margin:"3px 0 10px"}}>What you plan to spend across <b style={{color:C.textDim}}>all</b> your ads each month. You pay Google / Meta directly for this — BoldLine never holds it. The launch cards below fill their own daily budget from this figure, splitting it evenly across the platforms you run — you don't need to do the maths.</div>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
        <div style={{position:"relative",flex:1,minWidth:0}}>

        <div style={{fontSize:12,color:C.textMuted,whiteSpace:"nowrap",flexShrink:0}}>/mo{daily>0&&<> &nbsp;·&nbsp; ≈ <b style={{color:C.gold}}>${daily}/day</b> total</>}</div>
      </div>
      {daily>0&&platShare>1&&(
        <div style={{fontSize:11,color:C.textMuted,lineHeight:1.6,margin:"-4px 0 10px"}}>Running <b style={{color:C.textDim}}>Google + Meta</b>, so that splits to about <b style={{color:C.gold}}>${dailyEach}/day each</b>. Each launch card fills in its own half — don't put the ${daily} total into both, or you'll spend the month's budget in half a month.</div>

        <div style={subHead}>Meta Ad Account ID + Page ID</div>
        <ol style={stepOl}>
          <li><b>business.facebook.com</b> → <b>Settings</b> (gear icon).</li>

              const current = eff.status;
              const nextStatus = { waiting:"active", active:"done", done:"needs_input", needs_input:"waiting" };
              // Overriding pins BOTH the value and the fact that it was set by hand,
              // or the derivation would immediately overwrite it on the next render.
              const cycle = () => setForm(p=>({...p,
                botStatuses:{...p.botStatuses,[bot.id]:nextStatus[current]},
                botStatusManual:{...(p.botStatusManual||{}),[bot.id]:true},
              }));
              const clearOverride = () => setForm(p=>{ const m={...(p.botStatusManual||{})}; delete m[bot.id]; return {...p, botStatusManual:m}; });
              const dot = statusDot[current]||"#374151";
              const pulse = current==="active"||current==="needs_input";
              return (
                <div key={bot.id} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0",borderBottom:`1px solid ${C.border2}`}}>
                  <span style={{fontSize:10,fontFamily:"monospace",color:C.textMuted,width:16,flexShrink:0}}>{String(bot.step).padStart(2,"0")}</span>
                  <span style={{fontSize:14,flexShrink:0}}>{bot.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,color:C.textDim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{bot.name}</div>
                    {/* The REASON the step is where it is. Without this an auto status
                        is just a colour, and an unexplained colour is not trustworthy. */}
                    <div style={{fontSize:9.5,color:C.textMuted,lineHeight:1.4,marginTop:1}}>{eff.why}</div>
                  </div>
                  {eff.manual && !MANUAL_BOTS.includes(bot.id) && (
                    <button onClick={clearOverride} title="Hand this step back to automatic" style={{fontSize:9,fontWeight:700,padding:"3px 7px",borderRadius:20,border:`1px solid ${C.border}`,background:"transparent",color:C.textMuted,cursor:"pointer",flexShrink:0}}>auto</button>
                  )}
                  <button onClick={cycle} style={{
                    display:"flex",alignItems:"center",gap:5,padding:"4px 9px",
                    borderRadius:20,border:`1px solid ${dot}44`,
                    backgroundColor:dot+"12",cursor:"pointer",flexShrink:0
                  }}>
                    <span style={{width:6,height:6,borderRadius:"50%",backgroundColor:dot,display:"inline-block",boxShadow:pulse?`0 0 5px ${dot}`:"none"}}/>
                    <span style={{fontSize:10,fontWeight:700,color:dot}}>{statusLabel[current]}</span>
                  </button>
                </div>
              );
            })}
            {/* Batch actions */}
            <div style={{marginTop:14}}>
              {resetConfirm?(
                <div style={{padding:"10px 12px",borderRadius:9,backgroundColor:"rgba(248,113,113,0.06)",border:`1px solid ${C.red}33`}}>
                  <div style={{fontSize:11,color:C.textDim,marginBottom:7}}>Reset all bots to Waiting? Clears all current statuses.</div>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setResetConfirm(false)} style={{flex:1,padding:"6px",fontSize:11,fontWeight:600,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>Cancel</button>
                    <button onClick={()=>{ setForm(p=>({...p,botStatuses:Object.fromEntries(bots.map(b=>[b.id,"waiting"])),botStatusManual:{}})); setResetConfirm(false); }} style={{flex:1,padding:"6px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:"rgba(248,113,113,0.15)",color:C.red,cursor:"pointer"}}>Yes, Reset All</button>
                  </div>
                </div>
              ):doneConfirm?(
                <div style={{padding:"10px 12px",borderRadius:9,backgroundColor:"rgba(34,211,160,0.06)",border:"1px solid rgba(34,211,160,0.25)"}}>
                  <div style={{fontSize:11,color:C.textDim,marginBottom:7}}>Mark all bots Complete? Use when full campaign is live.</div>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setDoneConfirm(false)} style={{flex:1,padding:"6px",fontSize:11,fontWeight:600,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>Cancel</button>
                    <button onClick={()=>{ setForm(p=>({...p,botStatuses:Object.fromEntries(bots.map(b=>[b.id,"done"])),botStatusManual:Object.fromEntries(bots.map(b=>[b.id,true]))})); setDoneConfirm(false); }} style={{flex:1,padding:"6px",fontSize:11,fontWeight:700,borderRadius:8,border:"none",backgroundColor:"rgba(34,211,160,0.15)",color:C.green,cursor:"pointer"}}>Yes, Mark All Done</button>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",gap:7}}>
                  <button onClick={()=>setResetConfirm(true)} style={{flex:1,padding:"7px",fontSize:11,fontWeight:600,borderRadius:8,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.03)",color:C.textMuted,cursor:"pointer"}}>Reset All</button>
                  <button onClick={()=>setDoneConfirm(true)} style={{flex:1,padding:"7px",fontSize:11,fontWeight:600,borderRadius:8,border:"1px solid rgba(34,211,160,.3)",backgroundColor:"rgba(34,211,160,.06)",color:C.green,cursor:"pointer"}}>Mark All Done</button>
                </div>
              )}
            </div>
          </Card>
        )}

        {/* ── NOTES ── */}
        {section==="notes"&&(
          <Card>
            <Label>Internal Notes (not visible to client)</Label>
            <textarea value={form.notes||""} onChange={e=>set("notes",e.target.value)} rows={5} placeholder="Context, special requests, communication preferences…" style={{...inp,resize:"vertical",lineHeight:1.7}}/>
            <div style={{marginTop:8,fontSize:10,color:C.textMuted}}>Internal only — appears in Overview tab.</div>
          </Card>
        )}
      </div>

      {/* Save button */}
      <div className="os-sheet-actions" style={{padding:"11px 14px 16px",borderTop:`1px solid ${C.border}`,flexShrink:0,display:"flex",gap:8,backgroundColor:C.bg2,boxShadow:"0 -8px 20px -12px rgba(0,0,0,.9)"}}>
        <button onClick={onClose} style={{flex:1,padding:11,fontSize:13,fontWeight:600,borderRadius:10,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>Cancel</button>
        <button onClick={handleSave} style={{
          flex:2,padding:11,fontSize:13,fontWeight:700,borderRadius:10,border:"none",
          backgroundColor:saved?"rgba(34,211,160,0.15)":C.gold,
          color:saved?C.green:"#0a0800",cursor:"pointer",transition:"all .2s",
          border:saved?`1px solid ${C.green}33`:"none"
        }}>
          {saved?"✓ Saved":"Save Changes"}
        </button>
      </div>
    </Sheet>
  );
}

// row and do not care that the numbers are invented: without this flag the Monday
// weekly-report job would email a performance report built from fake data, and
// lead-followup would text and email the sample leads below. Both now skip on it
// (report-shared.mjs, lead-followup.mjs). Anything outbound added later must too.
//
// The email and phone are also unroutable on purpose: example.com is reserved by

function AddClientSheet({onSave,onClose}) {

  const [termMonths,setTermM] = useState(3);
  const [form,setForm]     = useState({name:"",contactName:"",email:"",businessAddress:"",businessPhone:"",niche:"",packageId:"",stage:"onboarding",platforms:[],adBudget:"",notes:"",contractStart:fmt(today),contractEnd:fmt(addMonths(today,3)),contractTermMonths:3});
  const [pkgCat,setPkgCat] = useState("google");
  const [saved,setSaved]   = useState(false);
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const togglePlat=(p)=>setForm(prev=>({...prev,platforms:prev.platforms.includes(p)?prev.platforms.filter(x=>x!==p):[...prev.platforms,p]}));
  const selPkg=findPkg(form.packageId);
  const canSave=form.name&&form.email&&form.packageId;

  // Smart date helpers
  const setStartDate = (val) => {
    set("contractStart", val);
    try { const s=new Date(val); if(!isNaN(s)) set("contractEnd", fmt(addMonths(s, termMonths))); } catch(e){}
  };
  const setTerm = (m) => {
    setTermM(m);
    set("contractTermMonths", m);
    try { const s=new Date(form.contractStart||today); if(!isNaN(s)) set("contractEnd", fmt(addMonths(s, m))); } catch(e){}
  };
  const startDate  = new Date(form.contractStart||today);
  const endDate    = new Date(form.contractEnd||addMonths(today,3));
  const termDays   = !isNaN(startDate)&&!isNaN(endDate) ? Math.round((endDate-startDate)/(864e5)) : 0;
  const validDates = termDays >= 28;
  const handleSave=()=>{
    if(!canSave)return;
    const pkg=findPkg(form.packageId);const bots=buildBots(pkg);
    const botStatuses=Object.fromEntries(bots.map(b=>[b.id,"waiting"]));botStatuses["intake"]="active";
    onSave({...form,id:uid(),portalToken:crypto.randomUUID(),leadToken:crypto.randomUUID(),intakeComplete:false,contractSigned:false,contractStatus:"pending",healthScore:null,leads:0,cpl:0,alerts:[],commLog:[],leadsLog:[],upgradeRequest:null,botStatuses,campaignSetup:{serviceArea:"",mainOffer:"",avgTicket:"",targetLocations:"",excludedKeywords:"",leadDestination:"",crmSystem:""},brandVoice:{tone:"",competitors:"",differentiator:""},businessPhone:form.businessPhone||"",callTrackingNumber:"",callTrackingNumberSid:"",mediaLibrary:[],landingSlug:makeSlug(form.name),landingPage:{headline:"",subheadline:"",bullets:[],ctaText:"",published:false,generatedAt:null}});
    setSaved(true);setTimeout(()=>{ setSaved(false);onClose(); },1200);

      <div style={{padding:"13px 14px 11px",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>

          <CloseBtn onClick={onClose}/>
        </div>
        <div style={{height:3,backgroundColor:"rgba(255,255,255,.06)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",backgroundColor:"#1D4ED8",width:step===1?"50%":"100%",transition:"width .3s",borderRadius:2}}/></div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"13px 14px",display:"flex",flexDirection:"column",gap:12}}>
        {step===1&&<>
          <Card>
            <Label>Client Information</Label>
            {[{k:"name",l:"Business Name *",t:"text",ph:"e.g. Apex Roofing LLC"},{k:"contactName",l:"Contact Name",t:"text",ph:"First and last name"},{k:"email",l:"Email Address * (portal login)",t:"email",ph:"owner@business.com"},{k:"businessPhone",l:"Business Phone (for call forwarding)",t:"text",ph:"(555) 123-4567"},{k:"businessAddress",l:"Business Address",t:"text",ph:"123 Main St, City, State ZIP"}].map(({k,l,t,ph})=>(
              <div key={k} style={{marginBottom:11}}><div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",color:C.textMuted,marginBottom:4}}>{l}</div><input type={t} value={form[k]||""} onChange={e=>set(k,e.target.value)} placeholder={ph} style={inp}/></div>
            ))}

            <NicheSelect value={form.niche} onChange={v=>set("niche",v)}/>

                  <div style={{textAlign:"right",flexShrink:0}}><span style={{fontSize:14,fontWeight:800,color:C.gold}}>${pkg.price}</span><span style={{fontSize:10,color:C.textMuted}}>/mo min</span></div>

        </>}
        {step===2&&<>
