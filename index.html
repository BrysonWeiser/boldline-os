// ─── ALL POSSIBLE FEATURES (master list for comparison view) ─────────────────
// ─── useLiveData ── keeps any view fresh with NO full-page refresh ───────────
// One primitive behind every live surface in the OS. It re-runs `load` on three
// independent triggers so a change anywhere shows up on its own:
//   1. Supabase realtime  — instant, when `table` is in the supabase_realtime
//      publication (Database → Replication). Omit `table` for function-backed
//      data (e.g. blog posts) that the browser can't read directly.
//   2. Interval poll       — the guaranteed fallback if realtime is off/lagging.
//   3. Tab focus + visibility — an immediate catch-up when you return to the tab.
// `active` gates the whole thing (e.g. wait until auth/data is ready).
function useLiveData(load, { table, interval = 15000, active = true, channel } = {}) {
  useEffect(() => {
    if (!active) return;
    let ch = null;
    if (table) {
      ch = supabaseClient.channel(channel || (table + "-live"))
        .on("postgres_changes", { event: "*", schema: "public", table }, () => load())
        .subscribe();
    }
    const poll = setInterval(load, interval);
    const onVisible = () => { if (document.visibilityState === "visible") load(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", load);
    return () => {
      if (ch) supabaseClient.removeChannel(ch);
      clearInterval(poll);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", load);
    };
  }, [load, table, interval, active, channel]);
}

// ─── adGenBackground ── fire the long job, then poll for its result ──────────
// The Google campaign action returned a 504 as a synchronous call: Netlify gives a
// sync function ~10 seconds and this writes 3-5 full responsive search ads. The
// background function answers immediately and stores its result on the client
// record (no new Supabase table, so there is no migration to forget), and this
// polls `ad-generator` action:"poll" until it lands.
async function adGenBackground(payload, { intervalMs = 3000, timeoutMs = 240000 } = {}) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session && session.access_token;
  if (!token) throw new Error("Session expired — refresh the page and log in again.");
  const headers = { "Content-Type": "application/json", Authorization: "Bearer " + token };

  const kick = await fetch("/.netlify/functions/ad-generator-background", {
    method: "POST", headers, body: JSON.stringify(payload),
  });
  // A background function answers 202 before it has finished. Anything that is not
  // 2xx is a real refusal (bad session, missing key) and should surface now.
  if (!kick.ok && kick.status !== 202) {
    const d = await kick.json().catch(() => ({}));
    throw new Error(d.error || `Could not start the generator (${kick.status})`);
  }

  const started = Date.now();
  for(;;){
    await new Promise(r => setTimeout(r, intervalMs));
    const r = await fetch("/.netlify/functions/ad-generator", {
      method: "POST", headers, body: JSON.stringify({ action:"poll", clientId: payload.clientId }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok && d.job) {
      if (d.job.status === "done" && d.job.result) return d.job.result;
      if (d.job.status === "error") throw new Error(d.job.error || "Generation failed.");
    }
    if (Date.now() - started > timeoutMs) {
      throw new Error("The generator is taking longer than four minutes. It may still finish — press Generate again in a moment to pick up the result.");
    }
  }
}

// ─── adGenCall ── owner-authed call to the AI ad generator ────────────────────
// Replaces the string-template "Fill copy": real ad-group structure, intent-tiered
// keywords, the full 15 headlines Google allows, and niche-specific negatives.
async function adGenCall(payload) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session && session.access_token;
  if (!token) throw new Error("Session expired — refresh the page and log in again.");
  const r = await fetch("/.netlify/functions/ad-generator", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify(payload),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw new Error(d.error || `Generator failed (${r.status})`);
  return d;
}

// ─── gadsCall ── owner-authed call to the google-ads function ─────────────────
// Shared by ARIA's live-campaign reads and the approve→execute path. Throws with
// the function's stage-tagged message on any failure.
async function gadsCall(payload) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session && session.access_token;
  if (!token) throw new Error("Session expired — refresh the page and log in again.");
  const r = await fetch("/.netlify/functions/google-ads", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify(payload),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw new Error((d.stage ? d.stage + " — " : "") + (d.error || "Google Ads request failed"));
  return d;
}

// ─── metaCall ── owner-authed call to the meta-ads function (Meta counterpart) ─
async function metaCall(payload) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session && session.access_token;
  if (!token) throw new Error("Session expired — refresh the page and log in again.");
  const r = await fetch("/.netlify/functions/meta-ads", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify(payload),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw new Error((d.stage ? d.stage + " — " : "") + (d.error || "Meta Ads request failed"));
  return d;
}

// ─── THE ONE BILLING CALCULATION ─────────────────────────────────────────────
// "Whichever is more" — the floor or what the month actually earned. Every surface
// that quotes a number (deal prep, the billing card, the contract, the portal, the
// marketing site) runs this, so none of them can disagree with the invoice.
const calcMonthlyBill = (pkg, { qualifiedLeads = 0, perLeadFee = 0, adSpend = 0 } = {}) => {
  if (!pkg) return { floor:0, earned:0, billed:0, atFloor:false, model:"none", basis:"" };
  // A one-time build has no monthly side at all. Returning a zero floor rather than
  // falling through matters: `atFloor` false stops the billing card telling the owner a
  // hand-off client is "under the minimum" every month forever.
  if (pkg.pricingModel === "one_time")
    return { floor:0, earned:0, billed:0, atFloor:false, model:"one_time",
             basis:`one-time build, $${Number(pkg.setup||0).toLocaleString()}` };
  const floor = Number(pkg.price) || 0;
  const pctModel = pkg.pricingModel === "ad_spend_pct";
  const pct = Number(pkg.adSpendPct) || 0;
  const spend = Number(adSpend) || 0;
  const leads = Number(qualifiedLeads) || 0;
  const fee = Number(perLeadFee) || 0;
  const earned = pctModel ? Math.round((spend * pct) / 100) : Math.round(leads * fee);
  return {
    floor, earned, billed: Math.max(floor, earned), atFloor: earned < floor,
    model: pctModel ? "ad_spend_pct" : "per_lead",
    basis: pctModel ? `${pct}% of $${spend.toLocaleString()} ad spend`
                    : `${leads} qualified lead${leads === 1 ? "" : "s"} × $${fee}`,
  };
};
// How heavy the bill is against what they spend on ads — the number Stencil ran and
// BoldLine did not. Shown wherever a deal is priced so a lopsided one is visible.
const feeAsPctOfSpend = (billed, adSpend) => {
  const s = Number(adSpend) || 0;
  return s > 0 ? Math.round((Number(billed) || 0) / s * 100) : null;
};

// LABEL HELPERS. Every "$400/mo" in this file used to be a fixed retainer and is now a
// floor, so a bare price is a misquote. `min` reads as a minimum; `perf` names the half
// that varies. Used on every card, sheet, portal page and email that quotes a package.
const pkgMinLabel = (pkg) => `$${Number((pkg && pkg.price) || 0).toLocaleString()}`;
const pkgPerfLabel = (pkg, perLeadFee) => {
  if (!pkg) return "";
  if (pkg.pricingModel === "one_time") return "no monthly fee";
  if (pkg.pricingModel === "ad_spend_pct") return `${pkg.adSpendPct}% of ad spend`;
  return perLeadFee ? `$${perLeadFee} per qualified lead` : "per qualified lead";
};
const isOneTime = (pkg) => !!pkg && pkg.pricingModel === "one_time";
// One line a client can read without a diagram: "from $400/mo — whichever is higher".
const pkgPriceSummary = (pkg, perLeadFee) =>
  !pkg ? "—"
  : isOneTime(pkg) ? `$${Number(pkg.setup||0).toLocaleString()} once, then it's yours`
  : `from ${pkgMinLabel(pkg)}/mo, or ${pkgPerfLabel(pkg, perLeadFee)} — whichever is higher`;

// ─── HOUSE ACCOUNT PACKAGE ────────────────────────────────────────────────────
// Standing expectation (Bryson, 2026-08-14): "I also expect I will always receive
// the full services the company offers." So the internal My Ads account is not on
// a sellable tier — it gets a package of its own carrying EVERY feature and every
// capability flag. Built as the UNION of every tier's feature list rather than a
// hand-written one, so adding a feature to any package anywhere automatically
// grants it to the house account too, with nothing to remember.
// Deliberately NOT in PACKAGES_DB: it must never appear in a package picker, on
// the marketing site, or in an upgrade list. findPkg resolves it separately.
const HOUSE_PKG_ID = "bl-house";
PKG_FEATURES[HOUSE_PKG_ID] = [...new Set(Object.values(PKG_FEATURES).flat())];
const HOUSE_PKG = {
  id: HOUSE_PKG_ID, name: "Full System (House Account)", platform: "Google + Meta",
  price: 0, setup: 0, leadFee: false, tag: "Internal", adSpend: "",
  pricingModel: "none", tier: "acquisition", minBudget: 0, maxBudget: null,
  optimizationFreq: "weekly", callTracking: true, weeklyOptimization: true,
  customLandingPage: true, retargeting: true, splitTesting: true,
  crmIntegration: true, multiCampaign: true,
};
const findPkg  = (id) => (id === HOUSE_PKG_ID ? HOUSE_PKG : ALL_PKGS.find(p => p.id === id));
const pkgHasFeature = (pkgId, featureId) => (PKG_FEATURES[pkgId]||[]).includes(featureId);

// Upgrade ladders are FAMILY-SCOPED. The old string-matching on `platform` leaked
// across product lines because "Meta + Google" contains "Google": a lead-gen client
// on c-growth was shown exactly one upgrade, "Store Domination" — an e-commerce
// package — and every g-* client was offered Store Growth too. Two rules now:
//   1. E-commerce and lead generation never cross-sell. Different product entirely.
//   2. A combined client is never offered a single-platform package, which would
//      drop a channel they are already paying for. Broadening up (g-* or m-* into
//      c-*) is a real upgrade; narrowing never is.
const PKG_FAMILY = (id) => String(id || "").split("-")[0];
// `h` (the one-time hand-off) can move onto any managed lead-gen plan. Nothing ever
// upgrades INTO a hand-off: dropping a paying client onto a one-time build is a
// cancellation, not an upgrade, so no family lists `h` as a target.
const UPGRADE_FAMILIES = { g: ["g","c"], m: ["m","c"], c: ["c"], e: ["e"], h: ["g","m","c"] };

// AN UPGRADE MUST NEVER TAKE SOMETHING AWAY (Bryson, 2026-08-17: "each time a client
// upgrades they keep what they paid for before and they gain each time they upgrade").
// Enforced here rather than trusted to the catalog, because four paths violated it:
// g-growth and m-growth were both offered c-launch, which strips the custom landing
// page, weekly optimization and more; and both Acquisition tiers were offered c-growth,
// which drops the scaling roadmap and priority communication.
//
// A literal superset test is too blunt: it would reject the most basic upgrade in the
// business, g-launch -> g-growth, because two features are REPLACED BY A BETTER VERSION
// rather than lost. Those two pairs are the only real ones in the catalog (measured, not
// assumed — every other loss on every price-increasing path is a genuine loss).
const FEATURE_SUPERSEDES = {
  custom_landing: ["std_landing"],   // a custom page replaces the standard one
  weekly_opt:     ["monthly_opt"],   // weekly optimization replaces monthly
};
const coversFeature = (targetFeats, feat) =>
  targetFeats.indexOf(feat) >= 0 ||
  targetFeats.some(t => (FEATURE_SUPERSEDES[t] || []).indexOf(feat) >= 0);
// True when `toId` carries everything `fromId` had, counting a supersession as kept.
const keepsEverything = (fromId, toId) => {
  const to = PKG_FEATURES[toId] || [];
  return (PKG_FEATURES[fromId] || []).every(f => coversFeature(to, f));
};

const getUpgradeOptions = (currentPkgId) => {
  // The house account is already on everything, and there is nobody to sell to.
  if (currentPkgId === HOUSE_PKG_ID) return [];
  const cur = findPkg(currentPkgId);
  if (!cur) return [];
  const allowed = UPGRADE_FAMILIES[PKG_FAMILY(currentPkgId)] || [];
  const curFeats = PKG_FEATURES[currentPkgId] || [];
  // 🔴 THE HAND-OFF IS EXEMPT FROM "KEEPS EVERYTHING", AND THAT IS NOT A LOOPHOLE.
  // Everything in a hand-off is a ONE-TIME DELIVERABLE the client already owns: the
  // landing page stays up, the tracking stays wired, the playbook is in their inbox.
  // Moving onto a managed plan cannot take any of it away. Applying the ongoing-
  // entitlement rule here would offer them NOTHING — a hand-off includes a custom page
  // and call tracking, which Launch-tier management does not, so every managed plan
  // would look like a downgrade on paper while obviously being an upgrade in reality.
  const oneTimeSource = isOneTime(cur);
  // Ranked by TIER, not by price. Under the 2026-08-18 model a single platform and
  // the combined system carry the SAME monthly minimum at the same tier, so the old
  // `p.price > cur.price` test hid the most valuable upsell in the catalog: Google
  // Growth -> Full System Growth costs the same monthly and adds an entire channel.
  // Gaining a feature while keeping everything is what makes it an upgrade now.
  return ALL_PKGS.filter(p =>
    p.id !== currentPkgId &&
    (oneTimeSource || (TIER_RANK[p.tier] || 0) >= (TIER_RANK[cur.tier] || 0)) &&
    allowed.includes(PKG_FAMILY(p.id)) &&
    (oneTimeSource || keepsEverything(currentPkgId, p.id)) &&
    (PKG_FEATURES[p.id] || []).some(f => curFeats.indexOf(f) < 0)
  ).sort((a,b) => (TIER_RANK[a.tier]||0) - (TIER_RANK[b.tier]||0) || a.price - b.price || a.setup - b.setup);
};

// ─── DYNAMIC BOT WORK LOGS ───────────────────────────────────────────────────
const getBotLogs = (client, pkg) => {
  if (!client || !pkg) return {};

// ── Junk / spam lead flagger ──────────────────────────────────────────────────
// Heuristic quality check used in the per-lead billing review. It NEVER excludes
// a lead automatically — it only flags likely junk and says WHY, so Bryson makes
// the call before a client is billed. `level`: "junk" (strong signal, likely not
// billable) | "suspicious" (one soft signal, worth a look) | null (looks fine).
const DISPOSABLE_EMAIL_DOMAINS = ["mailinator.com","guerrillamail.com","10minutemail.com","tempmail.com","temp-mail.org","trashmail.com","yopmail.com","sharklasers.com","getnada.com","throwawaymail.com","maildrop.cc","fakeinbox.com","dispostable.com","mohmal.com","emailondeck.com"];
const LEAD_PLACEHOLDER_WORDS = ["test","asdf","qwerty","qwer","zxcv","abc","abcd","xyz","aaa","fake","spam","demo","sample","dummy","lorem","none","null","undefined"];
const LEAD_PLACEHOLDER_NAMES = ["john doe","jane doe","n/a","na","none","test test"];
const flagLead = (lead, all) => {
  const reasons = [];
  const name  = String(lead.name||"").trim();
  const email = String(lead.email||"").trim().toLowerCase();
  const phone = String(lead.phone||"").replace(/\D/g,"");
  const msg   = String(lead.message||"").trim();
  const src   = String(lead.source||"").trim().toLowerCase();
  const strongFlags = []; // reasons that on their own mean "junk"

  if (!lead.email && !lead.phone) { reasons.push("No phone or email"); strongFlags.push(1); }
  if (email) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { reasons.push("Email looks invalid"); strongFlags.push(1); }
    else { const dom=email.split("@")[1]||""; if (DISPOSABLE_EMAIL_DOMAINS.some(d=>dom===d||dom.endsWith("."+d))) { reasons.push("Disposable email address"); strongFlags.push(1); } }
  }
  if (phone) {
    if (phone.length<10) { reasons.push("Phone number too short"); strongFlags.push(1); }
    else { const last10=phone.slice(-10); if (/^(\d)\1{9}$/.test(last10) || ["1234567890","0123456789","1111111111","0000000000"].includes(last10)) { reasons.push("Fake-looking phone number"); strongFlags.push(1); } }
  }
  const nlow = name.toLowerCase();
  if (!name) { reasons.push("No name given"); }
  else {
    // Word-boundary match so real names ("Dana", "Samuel") aren't caught by a
    // placeholder substring ("na", "sam"); full-name match for two-word ones.
    const nameWords = nlow.split(/[^a-z0-9]+/).filter(Boolean);
    if (LEAD_PLACEHOLDER_NAMES.includes(nlow) || nameWords.some(w=>LEAD_PLACEHOLDER_WORDS.includes(w))) { reasons.push("Test/placeholder name"); strongFlags.push(1); }
    else {
      const letters = nlow.replace(/[^a-z]/g,"");
      // 'y' counts as a vowel here so names like "Lynn"/"Flynn" aren't gibberish.
      if (letters.length>=4 && !/[aeiouy]/.test(letters)) { reasons.push("Name looks like gibberish"); strongFlags.push(1); }
      else if (/(.)\1{3,}/.test(nlow)) { reasons.push("Name looks like gibberish"); strongFlags.push(1); }
    }
  }
  if (msg) {
    const mlow = msg.toLowerCase();
    if (/(https?:\/\/|www\.)/.test(mlow)) { reasons.push("Message contains a link"); strongFlags.push(1); }
    if (/(seo|rank (your|you) |first page of google|back ?link|crypto|bitcoin|forex|casino|viagra|make money fast|loan offer|guest post|link building)/.test(mlow)) { reasons.push("Message reads like spam"); strongFlags.push(1); }
  }
  if (!src || src==="unknown") reasons.push("Unknown lead source");
  if (all && (lead.email||lead.phone)) {
    const dupe = all.some(o=>o!==lead && ((email&&String(o.email||"").trim().toLowerCase()===email) || (phone.length>=10&&String(o.phone||"").replace(/\D/g,"").slice(-10)===phone.slice(-10))));
    if (dupe) { reasons.push("Duplicate of another lead"); strongFlags.push(1); }
  }
  if (!reasons.length) return { level:null, reasons:[] };
  const level = (strongFlags.length>0 || reasons.length>=2) ? "junk" : "suspicious";
  return { level, reasons };
};

// Add exactly N calendar months — preserves the day-of-month correctly.
// e.g. Jan 31 + 1 month = Feb 28/29 (not Mar 2/3 like *30 days gives)
const addMonths = (date, n) => {
  const d = new Date(date);
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  // If day overflowed (e.g. Jan 31 + 1 month → Mar 3), roll back to last day of intended month
  if (d.getDate() !== day) d.setDate(0);
  return d;
};

// TERM-BASED RENEWAL PRICING — Bryson's dials. Edit ONLY the two lines below.
// ───────────────────────────────────────────────────────────────────────────────
// New clients always start on a 3-month term at the standard package rate. At
// RENEWAL the client picks a length: month-to-month carries a small flexibility
// premium, longer commitments earn a discount. Rates are a fraction applied to
// the package's standard monthly (the 3-month rate is the anchor = 0%).
// Charges the management fee only — never ad spend (see business constraint).
//
//  • TERM_PRICING_ENABLED = false  → turns the whole thing OFF: every renewal
//    length bills the plain standard rate (no premium, no discount). This is the
//    "put the rates back to normal" switch — flip it and redeploy, nothing else
//    changes and no future feature is affected.
//  • TERM_RATE  → the percentages, as decimals (0.10 = +10%, -0.10 = -10%). Change
//    any of them any time. Keys are the term lengths in months.
const TERM_PRICING_ENABLED = true;
const TERM_RATE = { 1:0.10, 3:0, 6:-0.05, 12:-0.10 };
// ═══════════════════════════════════════════════════════════════════════════════
const termRate    = (months) => (TERM_PRICING_ENABLED ? (TERM_RATE[months] || 0) : 0);
const termMonthly = (base, months) => Math.round((Number(base)||0) * (1 + termRate(months)));
// e.g. "+10%", "−10%", or "Standard rate"
const termRateLabel = (months) => {
  const r = termRate(months);
  if (r > 0) return `+${Math.round(r*100)}%`;
  if (r < 0) return `−${Math.round(-r*100)}%`;
  return "Standard rate";
};

  if (!cl) return {};
  const cs   = cl.campaignSetup || {};
  const lp   = cl.landingPage || {};
  // ads-sync writes COUNTS, not a campaign array: {google,meta}.{campaigns,live,...}
  // plus a rolled-up `totals` and a `budget` block. Reading a `campaigns` array here
  // silently never matched, which left every campaign-driven step stuck forever.
  const perf   = cl.adPerf || {};                    // written by the scheduled ads-sync job
  const totals = perf.totals || {};
  const g = perf.google || {}, m = perf.meta || {};
  const campaignCount = Number(g.campaigns || 0) + Number(m.campaigns || 0);
  const liveCount     = Number(totals.liveCampaigns != null ? totals.liveCampaigns : (Number(g.live || 0) + Number(m.live || 0)));
  const anyCampaign   = campaignCount > 0 || liveCount > 0;
  const anyLive       = liveCount > 0;
  const spend         = Number(totals.spend30d || 0);
  const convs         = Number(totals.conversions || 0);
  const linked      = !!(cl.googleAdsCustomerId || cl.metaAdAccountId);
  const leads       = Number(cl.leads || 0);
  const s = (status, why) => ({ status, why });

  const out = {
    intake:    cl.intakeComplete ? s("done", "Intake marked complete")
               : (cs.mainOffer || cs.serviceArea || cs.targetLocations) ? s("active", "Campaign details partly filled in")
               : s("waiting", "No intake details yet"),
    ceo:       cl.intakeComplete ? s("done", "Brief is complete, so the plan is set")
               : s("waiting", "Waiting on a complete intake"),
    offer:     cs.mainOffer ? s("done", `Main offer set: ${cs.mainOffer}`)
               : s("waiting", "No main offer set"),
    architect: lp.headline ? s("done", "Landing page structure exists")
               : s("waiting", "No landing page started"),
    copy:      (lp.subheadline && (lp.bullets || []).length) ? s("done", "Landing page copy written")
               : lp.headline ? s("active", "Headline written, rest of the copy pending")
               : s("waiting", "No copy yet"),
    builder:   lp.published ? s("done", "Landing page is published")
               : lp.headline ? s("active", "Page drafted, not published")
               : s("waiting", "Nothing to build yet"),
    keywords:  anyCampaign ? s("done", "Keywords shipped with the built campaign")
               : s("waiting", "No campaign built yet"),
    ads:       anyLive ? s("done", "Campaign is live")
               : anyCampaign ? s("active", "Campaign built, awaiting launch")
               : s("waiting", "No campaign built yet"),
    tracking:  convs > 0 ? s("done", "Conversions are being recorded")
               : linked ? s("active", "Ad account linked, no conversion recorded yet")
               : s("waiting", "No ad account linked"),
    automation: cl.leadToken ? s("done", "Lead capture and auto-reply are live")
               : s("waiting", "No lead pipeline yet"),
    qc:        anyLive ? s("done", "Signed off and live")
               : anyCampaign ? s("active", "Built and paused, awaiting sign-off")
               : s("waiting", "Nothing to check yet"),
    budget:    (anyLive && monthlyBudgetNum(cl) > 0) ? s("active", "Watching spend against the monthly budget")
               : monthlyBudgetNum(cl) > 0 ? s("waiting", "Budget set, nothing running yet")
               : s("waiting", "No monthly budget set"),
    terms:     spend > 0 ? s("active", "Reviewing search terms as clicks come in")
               : s("waiting", "No spend to review yet"),
    leads:     leads > 0 ? s("active", `Scoring ${leads} lead${leads === 1 ? "" : "s"}`)
               : s("waiting", "No leads yet"),
    perf:      spend > 0 ? s("active", "Reporting on live campaign data")
               : s("waiting", "No campaign data yet"),
  };
  for (const id of MANUAL_BOTS) delete out[id];
  return out;
};

// Manual always wins. Cycling a bot by hand records it in `botStatusManual` so the
// derivation stops fighting him on that one, and only that one.
const BOT_IDS = [
  "intake", "ceo", "research", "avatar", "offer", "funnel", "architect", "copy",
  "builder", "keywords", "ads", "tracking", "automation", "qc", "budget", "terms",
  "leads", "perf", "scaling", "success",
];

const BOT_NAMES = {
  intake: "Client Intake", ceo: "CEO Director", research: "Market Research",
  avatar: "Customer Avatar", offer: "Offer Creation", funnel: "Funnel Director",
  architect: "Page Architect", copy: "Copy Chief", builder: "Page Builder",
  keywords: "Keyword Research", ads: "Ads Builder", tracking: "Tracking Engineer",
  automation: "Automation Engineer", qc: "Quality Control", budget: "Budget Manager",
  terms: "Search Term Analyst", leads: "Lead Quality Analyst", perf: "Performance Analyst",
  scaling: "Scaling Specialist", success: "Client Success",
};

const effectiveBotStatus = (cl, botId, derived) => {
  const manual = (cl && cl.botStatusManual) || {};
  const stored = (cl && cl.botStatuses) || {};
  if (manual[botId]) return { status: stored[botId] || "waiting", why: "Set by hand", manual: true };
  const d = (derived || {})[botId];
  if (d) return { status: d.status, why: d.why, auto: true };
  return { status: stored[botId] || "waiting", why: "Tracked by hand (no automatic signal for this step)", manual: true };
};

function pipelineProgress(client) {
  const derived = deriveBotStatuses(client);
  const steps = BOT_IDS.map((id) => {
    const e = effectiveBotStatus(client, id, derived);
    return { id, name: BOT_NAMES[id] || id, status: e.status, why: e.why, auto: !!e.auto };
  });
  const done = steps.filter((s) => s.status === "done");
  return {
    steps,
    done: done.length,
    total: steps.length,
    active: steps.filter((s) => s.status === "active").length,
    pending: steps.filter((s) => s.status !== "done").map((s) => s.name),
    fraction: steps.length ? done.length / steps.length : 0,
  };
}

// ─── THE HAND-OFF LIFECYCLE ──────────────────────────────────────────────────
// Bryson, 2026-08-18: "if and when someone buys the one time setup how will that work
// for me? how will I build it and give it to them and then track if they come back as
// a recurring client within 6 months?"
//
// A hand-off has THREE dates, all derived from one stored field so they cannot drift:
//   1. paid            — the day they bought it. Stamped by the Stripe webhook.
//   2. settle-in ends  — paid + 30 days. Until then BoldLine is still working: two
//                        optimization passes, then the handover. AFTER it, every
//                        recurring job must leave this client alone, or a business that
//                        was promised nothing further keeps getting agency emails.
//   3. credit expires  — paid + 6 months. Inside this window, moving onto a managed
//                        plan WAIVES the setup fee, because they already paid for the
//                        build. Charging a second setup for the same campaign would be
//                        indefensible, and the waiver is the whole reason a hand-off is
//                        a lead rather than a dead end.
const HANDOFF_SETTLE_IN_DAYS = 30;
const HANDOFF_CREDIT_MONTHS  = 6;
const handoffDates = (cl) => {
  const paidAt = cl && cl.handoffPaidAt;
  if (!paidAt) return null;
  const paid = new Date(paidAt);
  if (isNaN(paid)) return null;
  const settleEnds = new Date(paid); settleEnds.setDate(settleEnds.getDate() + HANDOFF_SETTLE_IN_DAYS);
  const creditEnds = new Date(paid); creditEnds.setMonth(creditEnds.getMonth() + HANDOFF_CREDIT_MONTHS);
  const now = Date.now();
  return {
    paid, settleEnds, creditEnds,
    inSettleIn: now < settleEnds.getTime(),
    daysLeftInSettleIn: Math.ceil((settleEnds.getTime() - now) / 864e5),
    creditLive: now < creditEnds.getTime(),
    daysLeftOnCredit: Math.ceil((creditEnds.getTime() - now) / 864e5),
  };
};

const getAlerts = (cl) => {
  const a = [...(cl.alerts||[])];
  if (!cl.intakeComplete) a.push({type:"intake",msg:"Intake form not yet complete.",severity:"yellow"});
  if (cl.upgradeRequest)  a.push({type:"upgrade",msg:`Upgrade requested: ${cl.upgradeRequest}`,severity:"blue"});
  if (cl.contractEnd) {
    const d = daysUntil(cl.contractEnd);
    if (d<=7&&d>=0)       a.push({type:"contract_7", msg:`Contract expires in ${d} day${d!==1?"s":""}. Urgent renewal needed.`,severity:"red"});
    else if (d<=30&&d>=0) a.push({type:"contract_30",msg:`Contract expires in ${d} days. Start renewal conversation.`,severity:"yellow"});
  }
  // ── Billing enforcement (Agreement §3.4) — fed by Stripe webhook + the daily billing-watch job
  if (cl.billingStatus==="past_due") {
    const late = cl.billingLate||{};
    const days = late.days||0;
    const amt  = late.amountDue ? ` ($${Number(late.amountDue).toLocaleString()} due)` : "";
    if (late.interest>0) a.push({type:"billing_interest",msg:`Payment ${days} days late${amt} — $${Number(late.interest).toLocaleString()} late interest accruing at 1.5%/mo, auto-added to their next invoice.`,severity:"red"});
    else if (days>0)     a.push({type:"billing_late",msg:`Payment failed — ${days} day${days!==1?"s":""} late${amt}. Stripe is retrying. Interest starts after day 10; services may be suspended per §3.4.`,severity:"red"});
    else                 a.push({type:"billing_late",msg:`Payment failed${amt}. Stripe is retrying automatically.`,severity:"red"});
  }
  if (cl.billingStatus==="awaiting_payment" && cl.billingCheckoutUrl) a.push({type:"billing_await",msg:"Billing set up but the client has not paid the checkout link yet.",severity:"yellow"});

  // ── Hand-off milestones. Without these a one-time client is invisible: nothing
  // expires, nothing renews, and the 6-month conversion window closes unnoticed.
  {
    const h = handoffDates(cl);
    if (h) {
      if (h.inSettleIn) {
        if (!cl.handoffPackSent)
          a.push({type:"handoff_pack",msg:`Settle-in ends in ${h.daysLeftInSettleIn} day${h.daysLeftInSettleIn!==1?"s":""} — send the handover pack and book the training call before it does.`,severity:h.daysLeftInSettleIn<=7?"red":"yellow"});
        else if (h.daysLeftInSettleIn<=7)
          a.push({type:"handoff_last_pass",msg:`Settle-in ends in ${h.daysLeftInSettleIn} day${h.daysLeftInSettleIn!==1?"s":""}. Do the final optimization pass, then you are done.`,severity:"yellow"});
      } else if (!cl.handoffPackSent) {
        // Worse than a missed deadline: they paid for a handover and did not get one.
        a.push({type:"handoff_pack_overdue",msg:"Settle-in is over and the handover pack was never sent. They paid for it — send it today.",severity:"red"});
      }
      if (h.creditLive && !h.inSettleIn) {
        const m = Math.ceil(h.daysLeftOnCredit/30);
        a.push({type:"handoff_credit",msg:`Setup-fee waiver runs out in ${h.daysLeftOnCredit} days (about ${m} month${m!==1?"s":""}). If they move onto a managed plan before then, their setup is free — worth a call.`,severity:h.daysLeftOnCredit<=45?"yellow":"blue"});
      }
      if (!h.creditLive)
        a.push({type:"handoff_credit_gone",msg:"The 6-month setup-fee waiver has expired. A managed plan now costs them the full setup fee.",severity:"blue"});
    }
  }
  if (cl.etf && !cl.etf.settled) a.push({type:"etf_due",msg:`Early termination recorded — $${Number(cl.etf.total).toLocaleString()} owed (${cl.etf.billed?"billed via Stripe, awaiting payment":"not yet billed"}).`,severity:cl.etf.billed?"yellow":"red"});
  // Review window before the monthly invoice auto-charges: undecided leads (not yet
  // billed and not excluded) still need a call so they ride this month's bill.
  if (cl.billingStatus==="active" && cl.billingNextCharge) {
    const d = daysUntil(cl.billingNextCharge);
    const undecided = (cl.leadsLog||[]).filter(l=>!l.billed && !l.notBillable).length;
    if (d>=0 && d<=7 && undecided>0) a.push({type:"invoice_review",msg:`Invoice auto-charges in ${d} day${d!==1?"s":""} — review ${undecided} lead${undecided!==1?"s":""} so the good ones bill on it.`,severity:"yellow"});
  }
  // ── Major-issue watch (mirrors the alerts-watch push job; SMS+email fire once
  //    per transition there, these show live in-app). Active clients only.
  if (!cl.internal && cl.contractStatus==="active" && ["active","optimizing","scaling"].includes(cl.stage)) {
    const health = calcHealth(cl);
    const target = PER_LEAD[cl.niche]||50;
    const leads = cl.leads||0;
    const liveDays = cl.contractStart ? Math.floor((Date.now()-new Date(cl.contractStart).getTime())/864e5) : null;
    if (health<5) a.push({type:"perf_crash",msg:`Performance crash — health score is ${health.toFixed(1)}/10. Needs attention.`,severity:"red"});
    if (cl.adBudget && leads===0 && liveDays!=null && liveDays>=14) a.push({type:"no_leads",msg:`Campaign live ${liveDays} days with a budget set but ZERO leads — check targeting/tracking.`,severity:"red"});
    if (leads>0 && cl.cpl>0 && cl.cpl>=2*target) a.push({type:"cpl_blowout",msg:`Cost per lead is $${cl.cpl} — 2×+ the $${target} target. Spend is inefficient.`,severity:"red"});
  }
  // ── Client-email reminders (hybrid automation, Bryson 2026-07-30): the
  //    relationship emails are one-tap approve, so nudge here at each milestone
  //    and auto-clear once sent. Sends are logged to commLog as
  //    `Sent "<label>" email to …` (EmailCenterTab), which is what eSent checks.
  //    `email:` names the template so the reminder can deep-link to the Emails tab.
  if (!cl.internal) {
    const eSent = (label) => (cl.commLog||[]).some(e => (e.note||"").includes(`Sent "${label}"`));
    const dEnd  = cl.contractEnd ? daysUntil(cl.contractEnd) : null;
    if (cl.contractSigned && !eSent("Welcome + Portal"))
      a.push({type:"email_welcome",msg:"📧 New client — send the Welcome + Portal email.",severity:"blue",email:"welcome"});
    else if (cl.contractSigned && !eSent("Ad Account Access"))
      a.push({type:"email_access",msg:"📧 Send the Ad-Account Access email so they can grant access.",severity:"blue",email:"onboarding_access"});
    if (cl.billingStatus==="awaiting_payment" && !eSent("Invoice"))
      a.push({type:"email_invoice",msg:"📧 Billing is set up — send the Invoice email.",severity:"blue",email:"invoice"});
    if (dEnd!=null && dEnd<=30 && dEnd>=0 && cl.contractStatus==="active" && !eSent("Renewal Reminder"))
      a.push({type:"email_renewal",msg:"📧 Renewal window — send the Renewal email.",severity:"blue",email:"renewal"});
    if ((cl.contractStatus==="expired" || (dEnd!=null && dEnd<0)) && !eSent("Thank-You / Offboarding"))
      a.push({type:"email_thankyou",msg:"📧 Contract ended — send the Thank-You / Offboarding email.",severity:"blue",email:"thank_you"});
    // Client-approval decisions (portal): changes-requested is actionable (yellow);
    // still-awaiting is informational (blue). Approved ones just clear.
    (cl.approvals||[]).forEach(ap=>{
      if (ap && ap.status==="changes") a.push({type:"approval_changes_"+ap.id,msg:`Client requested changes on "${ap.title}"${ap.note?": "+ap.note:""}.`,severity:"yellow"});
    });
    const pendingAps=(cl.approvals||[]).filter(a2=>a2&&a2.status==="pending");
    pendingAps.forEach(ap=>{ const d=ap.createdAt?Math.floor((Date.now()-new Date(ap.createdAt).getTime())/864e5):0; if(d>=3) a.push({type:"approval_stale_"+ap.id,msg:`Client hasn't approved "${ap.title}" in ${d} days — follow up.`,severity:"yellow"}); });
    const freshAwaiting=pendingAps.filter(ap=>{ const d=ap.createdAt?Math.floor((Date.now()-new Date(ap.createdAt).getTime())/864e5):0; return d<3; }).length;
    if (freshAwaiting) a.push({type:"approval_awaiting",msg:`${freshAwaiting} item${freshAwaiting===1?"":"s"} awaiting the client's approval.`,severity:"blue"});
  }
  return a;
};

// ─── AUTO-APPROVAL HELPERS ──────────────────────────────────────────────────
// Anything a client needs to personally approve — landing page, campaign + ad
// budget, or anything else — is auto-sent to their portal, emails them, and
// pings the owner, all through one path. A caller adds the item to
// client.approvals in its OWN onUpdate (composing with any other change it's
// making), then calls notifyClientApproval(updatedClient, item).
const hasPendingApproval = (client, kind) => (client.approvals||[]).some(a=>a&&a.kind===kind&&a.status==="pending");
const makeApproval = ({kind,title,body,previewUrl}) => ({id:"ap-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind,title,body:body||"",previewUrl:previewUrl||"",status:"pending",createdAt:new Date().toISOString(),source:"auto"});
const notifyClientApproval = async (client, item) => {
  try{
    const { data:{ session } }=await supabaseClient.auth.getSession();
    const token=session&&session.access_token; if(!token) return;
    const post=(b)=>fetch("/.netlify/functions/client-email",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(b)});
    if(client.email){
      const rr=await post({action:"render",type:"approval_request",ctx:{businessName:client.name,contactName:client.contactName,approvalTitle:item.title,portalUrl:client.portalToken?`${window.location.origin}/portal?token=${client.portalToken}`:""}});
      const d=await rr.json().catch(()=>({}));
      if(d&&d.ok) await post({action:"send",to:client.email,subject:d.subject,html:d.html});
    }
    await post({action:"owner-alert",title:`📋 Sent to ${client.name} for approval: ${item.title}`,body:`${client.name} was just sent "${item.title}" to approve in their portal. You'll be notified the instant they respond — reach out to nudge them if needed.`});
  }catch(e){ /* fire-and-forget */ }
};

const healthColor = (s) => s>=8?C.green:s>=6?C.amber:C.red;
const stageInfo   = (id) => STAGES.find(s=>s.id===id)||STAGES[0];

// ─── AUTO HEALTH SCORE ────────────────────────────────────────────────────────
// ─── HOUSE-ACCOUNT HEALTH ─────────────────────────────────────────────────────
// The client formula scores a RELATIONSHIP: contract signed, contract status,
// runway to contract end, intake returned. None of that exists on BoldLine's own
// account, so it scored the house account on things that can never be true —
// `contractStatus` is "internal" (not "active") and `contractEnd` is empty, so it
// forfeited 2 points permanently and was hard-capped at 6.6/10 with perfect ads.
// Two of the points it DID earn were free (contractSigned/intakeComplete are
// hardcoded true on the record), so the number moved for no real reason.
//
// This scores the only question that matters for his own ads: is the machine
// running and producing? Seven observable factors summing to exactly 10, each
// carrying the reason it scored what it did — same visible-factor approach as
// Lead Scout, so a number is never unexplained. Client scoring is UNTOUCHED.
const houseHealthFactors = (cl) => {
  const perf   = (cl && cl.adPerf) || {};
  const totals = perf.totals || {};
  const budget = perf.budget || {};
  const g = perf.google || {}, m = perf.meta || {};
  const plats = adPlatformsOf(cl, null);
  const lp = (cl && cl.landingPage) || {};
  const leads = Number((cl && cl.leads) || 0);
  const monthly = monthlyBudgetNum(cl);
  const liveCount = Number(totals.liveCampaigns != null ? totals.liveCampaigns : (Number(g.live || 0) + Number(m.live || 0)));
  const campaignCount = Number(g.campaigns || 0) + Number(m.campaigns || 0);
  const convs = Number(totals.conversions || 0);

  // Linked: every platform being run needs its account attached, so running both
  // and linking one is genuinely half done rather than finished.
  const wantG = plats.google, wantM = plats.meta;
  const haveG = !!(cl && cl.googleAdsCustomerId), haveM = !!(cl && cl.metaAdAccountId);
  const wanted = (wantG ? 1 : 0) + (wantM ? 1 : 0);
  const have = (wantG && haveG ? 1 : 0) + (wantM && haveM ? 1 : 0);
  const linkPts = wanted === 0 ? 0 : (have / wanted) * 1;

  const f = (label, pts, max, why) => ({ label, pts: Math.round(pts * 100) / 100, max, why });
  return [
    f("Ad accounts linked", linkPts, 1,
      wanted === 0 ? "No platforms selected on this account"
      : have === wanted ? "Every platform you run is linked"
      : `${have} of ${wanted} platforms linked`),
    f("Conversion tracking proven", convs > 0 ? 1.5 : (haveG || haveM) ? 0.5 : 0, 1.5,
      convs > 0 ? `${convs} conversion${convs === 1 ? "" : "s"} recorded`
      : (haveG || haveM) ? "Account linked, but nothing has converted yet"
      : "No ad account linked yet"),
    f("Campaign live", liveCount > 0 ? 2 : campaignCount > 0 ? 1 : 0, 2,
      liveCount > 0 ? `${liveCount} campaign${liveCount === 1 ? "" : "s"} running`
      : campaignCount > 0 ? "Built, but still paused"
      : "No campaign built yet"),
    f("Monthly budget set", monthly > 0 ? 1 : 0, 1,
      monthly > 0 ? `$${monthly.toLocaleString()}/mo` : "No monthly budget set"),
    f("Spending within budget",
      monthly <= 0 ? 0 : budget.state === "over" ? 0 : budget.state === "warn" ? 0.75 : liveCount > 0 ? 1.5 : 0.75, 1.5,
      monthly <= 0 ? "No budget to measure against"
      : budget.pct != null ? `Pacing at ${budget.pct}% of budget`
      : "Set, but nothing has spent yet"),
    f("Leads arriving", leads > 15 ? 2 : leads > 5 ? 1.5 : leads > 0 ? 1 : 0, 2,
      leads > 0 ? `${leads} lead${leads === 1 ? "" : "s"} so far` : "No leads yet"),
    f("Landing page published", lp.published ? 1 : lp.headline ? 0.5 : 0, 1,
      lp.published ? "Published and taking traffic" : lp.headline ? "Drafted, not published" : "No landing page yet"),
  ];
};

const calcHouseHealth = (cl) => {
  const total = houseHealthFactors(cl).reduce((n, x) => n + x.pts, 0);
  return Math.max(1, Math.min(10, Math.round(total * 10) / 10));
};

const calcHealth = (cl) => {
  // BoldLine's own account is scored on whether the ADS work, not on a contract
  // it will never have. Client scoring below is deliberately unchanged.
  if (cl && cl.internal) return calcHouseHealth(cl);
  let score = 0;
  const days = daysUntil(cl.contractEnd);

  // ── Foundation (max 2 pts) ─────────────────────────────────────────────────
  if (cl.contractSigned)  score += 1;   // signed = relationship is real
  if (cl.intakeComplete)  score += 1;   // intake = we can actually do the work

  // ── Campaign stage (max 2 pts) ─────────────────────────────────────────────
  const stageScore = {
    onboarding:0, research:0.5, building:1, review:1.5,
    active:2, optimizing:2, scaling:2, paused:0.5,
  };
  score += stageScore[cl.stage]||0;

  // ── Lead performance (max 2 pts) ──────────────────────────────────────────
  if (cl.leads>0)  score += 0.5;   // at least something coming in
  if (cl.leads>10) score += 0.5;   // meaningful volume
  if (cl.leads>30) score += 0.5;   // strong volume
  if (cl.leads>0 && cl.cpl>0) {
    const niche = cl.niche;
    const target = PER_LEAD[niche]||50; // use per-lead fee as CPL benchmark
    if (cl.cpl <= target * 0.75) score += 0.5;       // beating target by 25%+
    else if (cl.cpl <= target)   score += 0.25;      // at or near target
  }

  // ── Contract health (max 2 pts) ───────────────────────────────────────────
  if (cl.contractStatus==="active") score += 1;
  if (days>30)  score += 1;         // plenty of runway
  else if (days>7) score += 0.5;    // getting close

  // ── Bot pipeline progress (max 1 pt) ──────────────────────────────────────
  // Effective statuses via the same helper the server uses, so the health score
  // in the app and the one in an emailed report can never disagree.
  score += pipelineProgress(cl).fraction * 1;

  // ── Deductions ────────────────────────────────────────────────────────────
  if (cl.upgradeRequest) score -= 0;  // upgrade request is positive signal, no penalty
  if (!cl.intakeComplete && cl.stage!=="onboarding") score -= 0.5; // overdue intake
  if (cl.contractStatus==="expired") score -= 1;

  return Math.max(1, Math.min(10, Math.round(score * 10) / 10));
};

// Seeded ONLY when the clients table is completely empty, which in practice means a
// brand-new install. These are sample data, so they carry `demo: true` for the same
// reason makeDemoClient() does: the weekly-report job and lead-followup read every
// client row and would happily email invented numbers to whatever address they hold.
// Their emails were plausible real domains (apexroofing.com, luxemedspa.com,
// detailkingatl.com) with active contracts; now example.com, reserved by RFC 2606 and

// ─── AI HOOK ─────────────────────────────────────────────────────────────────
function useAI(system, opts) {
  const enableTools = !!(opts && opts.enableTools);
  const [messages,setMessages]         = useState([]);
  const [loading,setLoading]           = useState(false);
  const [pendingAction,setPendingAction] = useState(null); // {id,name,input}
  const historyRef = useRef([]);

  const extractText = (blocks) => blocks.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();

  const call = async (override) => {
    setLoading(true);
    try {
      const r = await fetch("/.netlify/functions/aria",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:override||system,messages:historyRef.current,enableTools})});
      const d = await r.json();
      if (!d.content) { setMessages(m=>[...m,{role:"assistant",content:"No response."}]); setLoading(false); return; }
      historyRef.current = [...historyRef.current,{role:"assistant",content:d.content}];
      const toolUse = d.content.find(b=>b.type==="tool_use");
      const text = extractText(d.content);
      setMessages(m=>[...m,{role:"assistant",content:text||(toolUse?`I'd like to ${toolUse.name.replace(/_/g," ")}: ${JSON.stringify(toolUse.input)}. Confirm below.`:"No response.")}]);
      setPendingAction(toolUse?{id:toolUse.id,name:toolUse.name,input:toolUse.input}:null);
    } catch { setMessages(m=>[...m,{role:"assistant",content:"Connection error — try again."}]); }
    setLoading(false);
  };

  const send = (text, override) => {
    historyRef.current = [...historyRef.current, {role:"user",content:text}];
    setMessages(m=>[...m,{role:"user",content:text}]);
    call(override);
  };

  const confirmAction = (resultText, override) => {
    if (!pendingAction) return;
    historyRef.current = [...historyRef.current, {role:"user",content:[{type:"tool_result",tool_use_id:pendingAction.id,content:resultText}]}];
    setPendingAction(null);
    call(override);
  };

  const cancelAction = (override) => confirmAction("The user declined this action. Do not repeat it.", override);

  const reset = (intro) => { historyRef.current=[]; setPendingAction(null); setMessages(intro?[{role:"assistant",content:intro}]:[]); };

  return {messages,loading,send,reset,pendingAction,confirmAction,cancelAction};
}

function Card({children,style}) {

function AlertBadge({alerts}) {

function Bubble({msg}) {
  const isUser=msg.role==="user";

    <div style={{display:"flex",justifyContent:isUser?"flex-end":"flex-start",marginBottom:10}}>

  );

                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {newFeatures.slice(0,4).map(f=>(
                        <span key={f.id} style={{fontSize:9,padding:"2px 8px",borderRadius:20,
                          backgroundColor:"rgba(34,211,160,0.08)",border:"1px solid rgba(34,211,160,0.2)",
                          color:C.green}}>+ {f.label}</span>
                      ))}
                      {newFeatures.length>4&&<span style={{fontSize:9,color:C.textMuted,padding:"2px 4px"}}>+{newFeatures.length-4} more</span>}
                    </div>
                  )}
                </button>
              );
            })}
          </>
        )}
      </div>
      {options.length>0&&(
        <div style={{padding:"12px 16px 24px",borderTop:`1px solid ${C.border}`,flexShrink:0}}>
          <button onClick={()=>{ if(selected) setStep("confirm"); }}
            disabled={!selected}
            style={{width:"100%",padding:"13px",fontSize:13,fontWeight:700,borderRadius:10,border:"none",
              backgroundColor:selected?"#C8A84B":"rgba(255,255,255,0.05)",
              color:selected?"#0a0800":C.textMuted,cursor:selected?"pointer":"not-allowed"}}>
            Review My Selection →
          </button>
          <div style={{fontSize:11,color:C.textMuted,textAlign:"center",marginTop:8}}>
            No changes until your account manager confirms.
          </div>
        </div>
      )}
    </Sheet>
  );
}

            <div style={{fontSize:19,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>{(pkg && pkg.name)}</div>
            <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>{(pkg && pkg.platform)} · {(pkg && pkg.adSpend)}</div>
            {(pkg && pkg.savings)&&<div style={{fontSize:11,color:C.green,fontWeight:600,marginTop:3}}>{pkg.savings}</div>}

      {/* Upgrade request pending — agency alert */}
      {client.upgradeRequest&&(

          </div>

        {featureGroups.map(group=>{

                borderBottom:`1px solid ${C.border2}`}}>{group.label}</div>

                      backgroundColor:"rgba(34,211,160,0.1)",
                      border:"1px solid rgba(34,211,160,0.25)",
                      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <IconCheck size={10} color={C.green}/>
                    </span>
                    <span style={{fontSize:12,color:C.textDim,flex:1,lineHeight:1.4}}>{feat.label}</span>

        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>

              style={{padding:"10px 12px",borderRadius:10,
                border:`1px solid ${selectedManualPkg===p.id?C.purple:C.border}`,
                backgroundColor:selectedManualPkg===p.id?`${C.purple}12`:"rgba(255,255,255,0.02)",
                cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:C.text}}>{p.name}</div>
                <div style={{fontSize:10,color:C.textMuted,marginTop:1}}>{p.platform}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.gold}}>from ${p.price}/mo</div>
                <div style={{fontSize:9,color:C.textMuted}}>${p.setup.toLocaleString()} setup</div>
              </div>

          ))}

        {applyConfirm?(
          <div style={{padding:"12px",borderRadius:10,backgroundColor:`${C.purple}08`,border:`1px solid ${C.purple}33`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:4}}>Confirm Package Change</div>
            <div style={{fontSize:11,color:C.textDim,marginBottom:4}}>
              {client.name}: <span style={{color:C.textMuted}}>{(pkg && pkg.name)}</span> → <span style={{color:C.gold,fontWeight:700}}>{(findPkg(selectedManualPkg) && findPkg(selectedManualPkg).name)}</span>
            </div>
            <div style={{fontSize:10,color:C.textMuted,marginBottom:10}}>New monthly minimum: ${(findPkg(selectedManualPkg) && findPkg(selectedManualPkg).price)}/mo · ${(findPkg(selectedManualPkg) && findPkg(selectedManualPkg).setup)} setup. Send updated invoice separately.</div>
            <div style={{display:"flex",gap:7}}>
              <button onClick={()=>setApplyConfirm(false)} style={{flex:1,padding:"8px",fontSize:11,fontWeight:600,borderRadius:9,border:`1px solid ${C.border}`,backgroundColor:"rgba(255,255,255,.04)",color:C.textMuted,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{ applyManualUpgrade(); setApplyConfirm(false); }} style={{flex:2,padding:"8px",fontSize:12,fontWeight:700,borderRadius:9,border:"none",backgroundColor:C.purple,color:"#fff",cursor:"pointer"}}>Confirm Change</button>
            </div>
          </div>
        ):(
          <button onClick={()=>{ if(selectedManualPkg) setApplyConfirm(true); }}
            disabled={!selectedManualPkg}
            style={{width:"100%",padding:"11px",fontSize:12,fontWeight:700,borderRadius:10,
              backgroundColor:upgradeApplied?"rgba(34,211,160,0.15)":selectedManualPkg?C.purple:"rgba(255,255,255,0.04)",
              color:upgradeApplied?C.green:selectedManualPkg?"#fff":C.textMuted,
              cursor:selectedManualPkg?"pointer":"not-allowed",transition:"all 0.2s",
              border:upgradeApplied?`1px solid ${C.green}33`:"none"}}>
            {upgradeApplied?"✓ Package Changed — Send Invoice":"Apply Package Change"}

    </div>
  );

// ─── CONTRACT HTML ────────────────────────────────────────────────────────────
// ─── SERVICE AGREEMENT (per-package, data-driven) ─────────────────────────────
// Full advertising-services agreement. Every commercial number (fees, term,
// per-lead fee, ROAS bonus, features) comes from the client + package data, so
// one template serves every package. AZ-governed, works for out-of-state and
// international clients. DRAFT FOR ATTORNEY REVIEW — have an Arizona lawyer
// approve before the first real signature. Keep the /BL_SIGN_HERE/ anchor:
// docusign-send places the signature field on it.
const makeContractHTML=(cl,pkg)=>{
  const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const money=(n)=>"$"+Number(n||0).toLocaleString();
  const pl=PER_LEAD[cl.niche];
  const feats=(PKG_FEATURES[cl.packageId]||[]).map(fid=>{const f=ALL_FEATURES.find(x=>x.id===fid);return f?'<li>'+f.label+'</li>':''}).join('');
  // Effective monthly = the agreed rate (term-priced at renewal) when set, else the standard package rate.
  const effMonthly = cl.billingMonthly || (pkg&&pkg.price) || 0;
  const stdMonthly = (pkg&&pkg.price) || effMonthly;      // the Standard (3-month) Rate
  // Setup fee honors a manual adjustment (billingSetup), including an explicit $0 waiver.
  const setupFee   = (cl.billingSetup!=null?cl.billingSetup:(pkg&&pkg.setup))||0;
  const termMo     = cl.contractTermMonths || 3;
  const clientName = esc(cl.name), signerName = esc(cl.contactName||"Authorized Signatory");
  const agreementNo= esc(String(cl.id||"").slice(-8).toUpperCase() || "—");
  // Section numbering: 1 Services, 2 Term, 3 Fees are fixed; Per-Lead (if any) and
  // Performance Bonus (if any) slot in after 3; everything later shifts accordingly.
  // 2026-08-18 pricing model: there is no management fee. The Monthly Minimum is a
  // FLOOR and the Performance Fee counts toward it — whichever is higher is the whole
  // fee for that month, never both. Lead gen bills per qualified lead; e-commerce bills
  // a percentage of ad spend, because a store has no lead to count.
  const pctFee   = (pkg && pkg.pricingModel === "ad_spend_pct") ? Number(pkg.adSpendPct)||0 : 0;
  const perLeadFee = (pkg && pkg.pricingModel === "per_lead") ? (pl||0) : 0;
  const hasPerf  = pctFee > 0 || perLeadFee > 0;
  // A one-time build (Launch & Hand Off) has no monthly fee, no performance fee and no
  // committed term. Sections 2, 3 and 4 swap WHOLESALE rather than being patched with
  // conditionals — a half-adapted agreement reads worse than either version and is the
  // kind of document a dispute turns on.
  const oneTime  = !!(pkg && pkg.pricingModel === "one_time");
  const nBase = 3 + (hasPerf?1:0) + (oneTime?1:0);
  const nAd=nBase+1, nResp=nBase+2, nNoG=nBase+3, nTerm=nBase+4, nIP=nBase+5, nConf=nBase+6,
        nData=nBase+7, nLiab=nBase+8, nInd=nBase+9, nRel=nBase+10, nLaw=nBase+11, nGen=nBase+12;

  const metaItem=(l,v)=>'<div class="meta-item"><div class="meta-label">'+l+'</div><div class="meta-value">'+v+'</div></div>';
  const meta =
    metaItem("Service Package",(pkg&&pkg.name)||"—")
   +metaItem("Advertising Platform",(pkg&&pkg.platform)||"—")
   +(oneTime
      ? metaItem("Total Fee",money(setupFee)+" one time")+metaItem("Ongoing Fees","None")
      : metaItem("Monthly Minimum",money(effMonthly)+"/mo")
        +metaItem("One-Time Setup Fee",setupFee>0?money(setupFee):"Waived"))
   +metaItem("Committed Term",oneTime?"None (one-time project)":monthsLabel(termMo))
   +metaItem("Start Date",esc(cl.contractStart)||"—")
   +metaItem("End Date",esc(cl.contractEnd)||"—")
   +metaItem("Optimization Cadence",oneTime?"Two passes during the 30-day settle-in, then none"
       :((pkg&&pkg.optimizationFreq)==="weekly"?"Weekly":"Monthly"))
   +(perLeadFee?metaItem("Performance Fee",money(perLeadFee)+" per qualified lead"):"")
   +(pctFee?metaItem("Performance Fee",pctFee+"% of monthly ad spend"):"")
   +(hasPerf?metaItem("How the two combine","Whichever is higher, never both"):"")
   +(cl.adBudget?metaItem("Client Ad Budget (paid to platforms)",esc(cl.adBudget)):(pkg&&pkg.adSpend?metaItem("Recommended Ad Budget (paid to platforms)",esc(pkg.adSpend)):""));

  // ONE section covers both billing models, because the RULE is the same in both:
  // the minimum is a floor, the performance fee counts against it, and the client pays
  // whichever is higher. Spelling that out is the point — the previous model billed a
  // retainer AND a per-lead fee, which is what a prospect turned down in writing.
  // 🔴 THE CLAUSE THAT MAKES A HAND-OFF HONEST. Without it the client has a signed
  // agreement for "advertising management services" and nothing in writing saying when
  // they stop, which is exactly the dispute a one-time product invites. It says what
  // they get, when the work ends, and that nothing recurring exists.
  const handoffSection = oneTime ? (
    '<h2>4. One-Time Build, Settle-In, and Handover</h2>'
   +'<p>4.1 <strong>This is a one-time project, not a retainer.</strong> Agency will build the Campaigns and the landing page described above inside Client&rsquo;s own advertising account, configure conversion and call tracking, and deliver the items listed in Section 1. <span class="caps">THERE IS NO MONTHLY FEE, NO PER-LEAD FEE, AND NO RECURRING CHARGE OF ANY KIND UNDER THIS AGREEMENT.</span></p>'
   +'<p>4.2 <strong>Settle-in period.</strong> For thirty (30) days after the Campaigns go live, Agency will perform two (2) optimization passes and remain available for questions about the build. This is included in the Total Fee.</p>'
   +'<p>4.3 <strong>Handover, and the end of Agency&rsquo;s obligations.</strong> At or before the end of the settle-in period Agency will deliver a written handover playbook covering the ongoing routine, the settings that must not be changed, and the warning signs to watch for, together with one (1) training call. <span class="caps">ON COMPLETION OF HANDOVER, AGENCY&rsquo;S OBLIGATIONS UNDER THIS AGREEMENT ARE FULLY DISCHARGED.</span> Agency will relinquish access to Client&rsquo;s advertising account and will not monitor, manage, optimize, or report on the Campaigns thereafter. Client is solely responsible for operating, funding, and maintaining the Campaigns from that point onward.</p>'
   +'<p>4.4 <strong>Credit toward managed services.</strong> If Client engages Agency on a managed monthly plan within six (6) months of the Effective Date, Agency will <strong>waive that plan&rsquo;s setup fee in full</strong>, in recognition that Client has already paid for the build. The credit is not redeemable for cash, does not reduce any monthly minimum or performance fee, and expires at the end of that six-month period.</p>'
  ) : '';
  const perfSection = hasPerf ? (
    '<h2>4. Monthly Minimum and Performance Fee</h2>'
   +'<p>4.1 <strong>How the monthly fee is calculated.</strong> For each calendar month, Agency&rsquo;s fee is the <strong>greater of</strong> (a) the Monthly Minimum stated in the Key Commercial Terms, or (b) the Performance Fee for that month. <span class="caps">THE TWO ARE NEVER CHARGED TOGETHER.</span> If the Performance Fee is less than the Monthly Minimum, Client pays the Monthly Minimum and nothing further. If the Performance Fee is greater, Client pays the Performance Fee and the Monthly Minimum is absorbed into it.</p>'
   +(perLeadFee ? (
      '<p>4.2 <strong>Performance Fee (per qualified lead).</strong> The Performance Fee for a month is the Per-Qualified-Lead Fee stated above multiplied by the number of Qualified Leads generated by the Campaigns in that month. A <strong>&ldquo;Qualified Lead&rdquo;</strong> means a prospective customer who, as a result of the Campaigns, (a) submits a lead form, (b) places a tracked telephone call lasting thirty (30) seconds or longer, or (c) initiates a text or chat conversation. Duplicate submissions from the same person within thirty (30) days, spam, bot traffic, and solicitation inquiries are not Qualified Leads.</p>'
    ) : (
      '<p>4.2 <strong>Performance Fee (percentage of ad spend).</strong> The Performance Fee for a month is the percentage stated above of Client&rsquo;s total advertising spend across the Campaigns for that month, as reported by the advertising platforms. Advertising spend is paid by Client directly to the platforms and is never held or advanced by Agency; the percentage is a measure of Agency&rsquo;s fee, not a charge for or markup on ad spend.</p>'
    ))
   +'<p>4.3 <strong>Billing mechanics.</strong> The Monthly Minimum is billed in advance at the start of each billing period. After the month closes, Agency calculates the Performance Fee; if it exceeds the Monthly Minimum already billed, <strong>only the difference</strong> is added to the next invoice. Client will never be invoiced both amounts in full for the same month.</p>'
   +(perLeadFee
      ? '<p>4.4 Lead counts are calculated from campaign tracking data. If Client believes a lead was incorrectly counted, Client must notify Agency in writing within ten (10) days of the invoice date; Agency will review in good faith and credit any lead it reasonably determines was not a Qualified Lead. Invoices not disputed within that period are deemed accepted. <strong>Performance Fees compensate lead generation only; Agency does not warrant that any lead will become a paying customer, and no fee is refundable because a lead did not convert.</strong></p>'
      : '<p>4.4 Ad-spend figures are taken from the advertising platforms&rsquo; own reporting, which is the definitive measurement for this purpose. If Client believes a month&rsquo;s figure is wrong, Client must notify Agency in writing within ten (10) days of the invoice date and Agency will review in good faith. Invoices not disputed within that period are deemed accepted. <strong>Performance Fees compensate campaign management only; Agency does not warrant any particular level of sales, revenue, or return on ad spend.</strong></p>')
  ) : '';
  // Section numbers after the conditional ones stay fixed by rendering both slots
  // (empty string when absent) and numbering the rest from 6 onward.
  const css='body{font-family:Georgia,"Times New Roman",serif;font-size:12.5px;line-height:1.75;color:#191919;background:#fff;padding:34px 38px;max-width:100%;word-break:break-word}'
   +'.hd{display:flex;align-items:center;gap:14px;border-bottom:3px solid #C8A84B;padding-bottom:14px;margin-bottom:6px}'
   +'.hd img{width:52px;height:52px;object-fit:contain}'
   +'.hd .co{font-size:21px;font-weight:700;letter-spacing:.04em;color:#111}.hd .co span{color:#8B6914}'
   +'.hd .tag{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#8B6914;margin-top:2px}'
   +'.docmeta{display:flex;justify-content:space-between;font-size:10px;color:#666;margin:8px 0 18px}'
   +'h1{font-size:17px;text-align:center;margin:6px 0 2px;letter-spacing:.02em}'
   +'.sub{text-align:center;font-size:11px;color:#666;margin-bottom:16px}'
   +'h2{font-size:12.5px;margin:20px 0 6px;color:#8B6914;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e5e0d0;padding-bottom:4px;page-break-after:avoid}'
   +'.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;padding:12px;background:#f9f8f4;border:1px solid #e5e0d0;border-radius:4px}'
   +'.pl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8B6914;margin-bottom:4px}'
   +'.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}'
   +'.meta-item{padding:8px 10px;background:#f9f8f4;border:1px solid #e5e0d0;border-radius:4px}'
   +'.meta-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8B6914}'
   +'.meta-value{font-size:12.5px;font-weight:700;color:#1a1a1a}'
   +'ul{padding-left:18px;margin:6px 0;columns:2;column-gap:24px}li{margin-bottom:4px;font-size:11.5px;break-inside:avoid}'
   +'p{margin-bottom:9px;font-size:11.5px;text-align:justify}'
   +'.caps{font-weight:700}'
   +'.callout{padding:10px 12px;background:#faf6ea;border:1px solid #d9c98f;border-radius:4px;margin:8px 0;font-size:11.5px}'
   +'.sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;page-break-inside:avoid}'
   +'.sig-box{padding:12px;border:1px solid #e5e0d0;border-radius:4px}'
   +'.sig-line{border-bottom:1px solid #1a1a1a;margin:26px 0 4px}'
   +'.ft{margin-top:22px;padding-top:10px;border-top:1px solid #e5e0d0;font-size:9px;color:#999;text-align:center}'
   +'@media print{body{padding:18px 22px}}';

  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'+css+'</style></head><body>'
   +'<div class="hd"><img src="'+LOGO+'" alt="BoldLine Media"><div><div class="co">BOLDLINE <span>MEDIA</span></div><div class="tag">Paid Advertising Management</div></div></div>'
   +'<div class="docmeta"><span>Agreement No. BLM-'+agreementNo+'</span><span>Effective Date: '+(esc(cl.contractStart)||'the date of last signature')+'</span></div>'
   +'<h1>Advertising Services Agreement</h1>'
   +'<p class="sub">This Advertising Services Agreement (the &ldquo;Agreement&rdquo;) is entered into between the parties below and governs the services described herein.</p>'

   +'<h2>Parties</h2><div class="parties">'
   +'<div><div class="pl">Agency</div><strong>BoldLine Media LLC</strong><br>an Arizona limited liability company<br>Bryson Weiser, Owner<br>brysonaweiser@gmail.com<br>(&ldquo;Agency&rdquo;)</div>'
   +'<div><div class="pl">Client</div><strong>'+clientName+'</strong><br>'+signerName+'<br>'+esc(cl.email)+'<br>'+esc(cl.businessAddress)+'<br>(&ldquo;Client&rdquo;)</div></div>'

   +'<h2>Key Commercial Terms</h2><div class="meta">'+meta+'</div>'

   +'<h2>1. Services and Scope</h2>'

   +'<h2>'+nConf+'. Confidentiality</h2>'
